memastikan bahwa:</p>\n<ul><li>seluruh hutang tercatat;</li><li>dokumen lengkap;</li><li>pembayaran sesuai jadwal;</li><li>bukti pembayaran tersedia;</li><li>tidak ada pembayaran yang tidak sah atau ganda.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>ketepatan waktu pembayaran;</li><li>umur hutang;</li><li>hubungan dengan pemasok;</li><li>hasil audit;</li><li>kondisi arus kas.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan efisiensi pembayaran, memperkuat pengendalian keuangan, dan menjaga kepercayaan pemasok.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN HUTANG L21</div>\n<ul><li>Tidak ada hutang tanpa dokumen.</li><li>Tidak ada hutang tanpa tanggal jatuh tempo.</li><li>Tidak ada pembayaran tanpa verifikasi.</li><li>Tidak ada pembayaran tanpa bukti.</li><li>Tidak ada pembayaran ganda.</li><li>Seluruh hutang dipantau hingga lunas.</li><li>Prioritas pembayaran mengikuti kebijakan perusahaan.</li><li>Perubahan jadwal pembayaran harus disetujui sesuai kewenangan.</li><li>Hubungan baik dengan pemasok dijaga melalui komunikasi yang profesional.</li><li>Setiap kewajiban harus diselesaikan secara bertanggung jawab.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen hutang merupakan bagian penting dari pengelolaan keuangan Lorongsatu21.</p>\n<p>Melalui pencatatan yang akurat, pemantauan yang disiplin, pembayaran yang tepat waktu, dan pengendalian yang kuat, Lorongsatu21 memastikan seluruh kewajiban perusahaan dipenuhi secara profesional sehingga mendukung arus kas yang sehat, hubungan yang baik dengan pemasok, dan pertumbuhan usaha yang berkelanjutan.</p>", "order": 73, "no_formal_header": false}]}, {"code": "SL21-605", "official_title": "Standar Manajemen Anggaran", "status": "ok", "note": "", "versions": [{"title": "MANAJEMEN ANGGARAN", "meta": {"Kode Dokumen": "SL21-605", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar manajemen anggaran agar seluruh perencanaan dan penggunaan dana Lorongsatu21 dilakukan secara terarah, efisien, terukur, terdokumentasi, dan dapat dipertanggungjawabkan.</p>\n<p>Standar ini bertujuan memastikan sumber daya keuangan digunakan sesuai prioritas perusahaan, mendukung pencapaian target, serta menjaga kesehatan keuangan dalam jangka pendek maupun jangka panjang.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Anggaran adalah rencana kerja yang dinyatakan dalam nilai keuangan.</li><li>Setiap pengeluaran harus memiliki tujuan yang jelas.</li><li>Disiplin terhadap anggaran mencerminkan disiplin perusahaan.</li><li>Anggaran harus menjadi alat pengambilan keputusan, bukan sekadar dokumen administrasi.</li></ul>\n<p>Moto:</p>\n<p><strong>Rencanakan • Alokasikan • Kendalikan • Evaluasi</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh manajemen anggaran harus memenuhi prinsip:</p>\n<ul><li>selaras dengan visi dan target perusahaan;</li><li>realistis dan terukur;</li><li>disusun berdasarkan data;</li><li>disetujui sesuai kewenangan;</li><li>dipantau secara berkala;</li><li>dievaluasi dan diperbaiki bila diperlukan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh anggaran perusahaan, meliputi:</p>\n<ul><li>anggaran operasional;</li><li>anggaran pembelian barang;</li><li>anggaran produksi;</li><li>anggaran pemasaran;</li><li>anggaran pemeliharaan aset dan peralatan;</li><li>anggaran pengembangan usaha;</li><li>anggaran teknologi dan sistem informasi;</li><li>anggaran pelatihan dan pengembangan SDM;</li><li>anggaran investasi;</li><li>anggaran cadangan dan keadaan darurat.</li></ul>\n<h3 class=\"sec-head\">5. JENIS ANGGARAN</h3>\n<h3 class=\"sec-head\">A. Anggaran Operasional</h3>\n<p>Untuk kegiatan rutin sehari-hari.</p>\n<h3 class=\"sec-head\">B. Anggaran Pengembangan</h3>\n<p>Untuk ekspansi, inovasi, dan peningkatan kapasitas usaha.</p>\n<h3 class=\"sec-head\">C. Anggaran Investasi</h3>\n<p>Untuk pembelian aset dan investasi jangka panjang.</p>\n<h3 class=\"sec-head\">D. Anggaran Cadangan</h3>\n<p>Untuk kebutuhan yang bersifat tidak terduga namun tetap dalam koridor kebijakan perusahaan.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN ANGGARAN L21</h3>\n<h3 class=\"sec-head\">A. Perencanaan Berbasis Data</h3>\n<p>Anggaran disusun berdasarkan:</p>\n<ul><li>data historis;</li><li>target penjualan;</li><li>proyeksi kebutuhan;</li><li>kondisi usaha;</li><li>prioritas strategis.</li></ul>\n<h3 class=\"sec-head\">B. Persetujuan Sesuai Kewenangan</h3>\n<p>Setiap anggaran harus memperoleh persetujuan sesuai batas kewenangan yang ditetapkan perusahaan.</p>\n<h3 class=\"sec-head\">C. Pelaksanaan Sesuai Anggaran</h3>\n<p>Realisasi pengeluaran mengikuti anggaran yang telah disetujui. Penyimpangan memerlukan penjelasan dan persetujuan sesuai prosedur.</p>\n<h3 class=\"sec-head\">D. Pemantauan Berkala</h3>\n<p>Realisasi dibandingkan dengan anggaran secara berkala untuk mengetahui selisih (variance) dan penyebabnya.</p>\n<h3 class=\"sec-head\">E. Evaluasi dan Perbaikan</h3>\n<p>Hasil evaluasi digunakan untuk memperbaiki penyusunan anggaran pada periode berikutnya.</p>\n<h3 class=\"sec-head\">7. SIKLUS MANAJEMEN ANGGARAN</h3>\n<ul><li>Menetapkan sasaran perusahaan.</li><li>Menyusun rencana anggaran.</li><li>Melakukan pembahasan.</li><li>Memperoleh persetujuan.</li><li>Melaksanakan anggaran.</li><li>Memantau realisasi.</li><li>Menganalisis selisih.</li><li>Melakukan evaluasi.</li><li>Menyusun perbaikan untuk periode berikutnya.</li></ul>\n<h3 class=\"sec-head\">8. PENGENDALIAN ANGGARAN</h3>\n<p>Pengendalian dilakukan melalui:</p>\n<ul><li>batas anggaran per kategori;</li><li>persetujuan pengeluaran;</li><li>pemantauan realisasi;</li><li>analisis selisih anggaran;</li><li>revisi anggaran apabila terdapat perubahan signifikan yang telah disetujui.</li></ul>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN ANGGARAN</h3>\n<ul><li>Mengidentifikasi kebutuhan.</li><li>Menyusun usulan anggaran.</li><li>Meninjau dan membahas usulan.</li><li>Menyetujui anggaran.</li><li>Melaksanakan kegiatan.</li><li>Mencatat realisasi.</li><li>Membandingkan realisasi dengan anggaran.</li><li>Mengevaluasi hasil.</li><li>Mengarsipkan dokumen.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Manajemen anggaran dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh anggaran terdokumentasi;</li><li>realisasi dapat dibandingkan dengan anggaran;</li><li>penyimpangan dijelaskan;</li><li>penggunaan dana sesuai prioritas;</li><li>evaluasi dilakukan secara berkala.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mengusulkan kebutuhan anggaran sesuai tugas;</li><li>menggunakan anggaran secara efisien;</li><li>memberikan data realisasi.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyusun dan mengoordinasikan anggaran;</li><li>memverifikasi usulan;</li><li>memantau realisasi;</li><li>mengevaluasi penyimpangan;</li><li>melaporkan hasil kepada Pemilik.</li></ul>\n<p><strong>Pemilik</strong></p>\n<ul><li>menetapkan arah dan prioritas anggaran;</li><li>menyetujui anggaran strategis;</li><li>mengevaluasi kinerja keuangan perusahaan.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan manajemen anggaran diukur melalui:</p>\n<ul><li>100% anggaran terdokumentasi.</li><li>Realisasi anggaran dipantau secara berkala.</li><li>Seluruh penyimpangan memiliki penjelasan.</li><li>Tidak ada pengeluaran besar tanpa persetujuan.</li><li>Anggaran mendukung pencapaian target perusahaan.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-508 Standar Pengelolaan Aset Perusahaan;</li><li>SL21-509 Standar Pemeliharaan Peralatan;</li><li>SL21-601 Standar Manajemen Kas;</li><li>SL21-602 Standar Manajemen Rekening Bank;</li><li>SL21-603 Standar Manajemen Piutang;</li><li>SL21-604 Standar Manajemen Hutang;</li><li>SL21-606 Standar Laporan Keuangan.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>periode anggaran;</li><li>kategori anggaran;</li><li>nilai anggaran;</li><li>realisasi;</li><li>selisih;</li><li>persentase realisasi;</li><li>penanggung jawab;</li><li>status persetujuan;</li><li>catatan evaluasi.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>anggaran disusun sesuai prosedur;</li><li>persetujuan terdokumentasi;</li><li>realisasi sesuai pencatatan;</li><li>penyimpangan dianalisis;</li><li>revisi anggaran memperoleh persetujuan.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>pencapaian target;</li><li>analisis selisih anggaran;</li><li>kondisi arus kas;</li><li>hasil audit;</li><li>perubahan kebutuhan operasional dan strategi perusahaan.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan kualitas perencanaan, efisiensi penggunaan dana, dan ketepatan pengambilan keputusan.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN ANGGARAN L21</div>\n<ul><li>Tidak ada anggaran tanpa tujuan yang jelas.</li><li>Tidak ada pengeluaran besar tanpa anggaran atau persetujuan yang sah.</li><li>Anggaran disusun berdasarkan data, bukan perkiraan semata.</li><li>Realisasi selalu dibandingkan dengan anggaran.</li><li>Setiap penyimpangan dianalisis penyebabnya.</li><li>Revisi anggaran harus melalui prosedur yang berlaku.</li><li>Dana cadangan hanya digunakan sesuai kebijakan perusahaan.</li><li>Seluruh dokumen anggaran diarsipkan dengan baik.</li><li>Anggaran menjadi dasar pengambilan keputusan keuangan.</li><li>Setiap rupiah yang dianggarkan harus memberikan nilai bagi perusahaan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen anggaran merupakan jembatan antara strategi perusahaan dan pelaksanaan operasional.</p>\n<p>Melalui perencanaan yang matang, pelaksanaan yang disiplin, pengendalian yang konsisten, dan evaluasi yang berkelanjutan, Lorongsatu21 memastikan setiap sumber daya keuangan digunakan secara efektif untuk mencapai tujuan perusahaan, meningkatkan daya saing, dan mendukung pertumbuhan usaha yang berkelanjutan.</p>", "order": 74, "no_formal_header": false}]}, {"code": "SL21-606", "official_title": "(di luar Daftar Standar Resmi) Manajemen Laporan Keuangan", "status": "ok", "note": "Dokumen ini ada isinya tapi tidak tercatat di Daftar Standar Resmi (SL21-000).", "versions": [{"title": "MANAJEMEN LAPORAN KEUANGAN", "meta": {"Kode Dokumen": "SL21-606", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar penyusunan dan pengelolaan laporan keuangan agar seluruh informasi keuangan Lorongsatu21 disajikan secara akurat, lengkap, tepat waktu, mudah dipahami, dan dapat digunakan sebagai dasar pengambilan keputusan.</p>\n<p>Standar ini bertujuan mendukung pengendalian perusahaan, perencanaan usaha, evaluasi kinerja, serta pertumbuhan bisnis yang berkelanjutan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Laporan keuangan adalah cermin kondisi perusahaan.</li><li>Keputusan yang baik hanya dapat diambil dari data yang baik.</li><li>Laporan keuangan bukan sekadar kewajiban administrasi, tetapi alat manajemen.</li><li>Transparansi keuangan membangun kepercayaan.</li></ul>\n<p>Moto:</p>\n<p><strong>Catat • Susun • Analisis • Putuskan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh laporan keuangan harus memenuhi prinsip:</p>\n<ul><li>akurat;</li><li>lengkap;</li><li>tepat waktu;</li><li>konsisten;</li><li>dapat ditelusuri;</li><li>mudah dipahami;</li><li>relevan untuk pengambilan keputusan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh laporan keuangan Lorongsatu21.</p>\n<p>Meliputi:</p>\n<ul><li>laporan kas;</li><li>laporan bank;</li><li>laporan penjualan;</li><li>laporan pembelian;</li><li>laporan piutang;</li><li>laporan hutang;</li><li>laporan persediaan;</li><li>laporan aset;</li><li>laporan laba rugi;</li><li>laporan arus kas;</li><li>neraca;</li><li>laporan perubahan modal;</li><li>laporan anggaran dan realisasi;</li><li>laporan pendukung lainnya.</li></ul>\n<h3 class=\"sec-head\">5. JENIS LAPORAN</h3>\n<h3 class=\"sec-head\">A. Laporan Operasional Harian</h3>\n<p>Berisi aktivitas operasional harian.</p>\n<h3 class=\"sec-head\">B. Laporan Bulanan</h3>\n<p>Menyajikan ringkasan kinerja keuangan bulanan.</p>\n<h3 class=\"sec-head\">C. Laporan Triwulanan</h3>\n<p>Digunakan untuk evaluasi perkembangan usaha.</p>\n<h3 class=\"sec-head\">D. Laporan Tahunan</h3>\n<p>Digunakan sebagai evaluasi menyeluruh dan dasar penyusunan rencana tahun berikutnya.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN LAPORAN KEUANGAN L21</h3>\n<h3 class=\"sec-head\">A. Data Lengkap</h3>\n<p>Laporan disusun berdasarkan data yang telah diverifikasi.</p>\n<h3 class=\"sec-head\">B. Tepat Waktu</h3>\n<p>Laporan diterbitkan sesuai jadwal yang ditetapkan perusahaan.</p>\n<h3 class=\"sec-head\">C. Konsisten</h3>\n<p>Format dan metode penyusunan laporan dijaga konsisten agar dapat dibandingkan antarperiode.</p>\n<h3 class=\"sec-head\">D. Analitis</h3>\n<p>Setiap laporan memuat analisis singkat mengenai pencapaian, penyimpangan, dan hal-hal yang memerlukan perhatian.</p>\n<h3 class=\"sec-head\">E. Bermanfaat</h3>\n<p>Laporan harus mendukung pengambilan keputusan operasional maupun strategis.</p>\n<h3 class=\"sec-head\">7. KOMPONEN LAPORAN KEUANGAN</h3>\n<p>Minimal meliputi:</p>\n<ul><li>Ringkasan Eksekutif.</li><li>Laporan Laba Rugi.</li><li>Neraca.</li><li>Laporan Arus Kas.</li><li>Laporan Perubahan Modal.</li><li>Laporan Anggaran dan Realisasi.</li><li>Catatan atas Laporan Keuangan (bila diperlukan).</li></ul>\n<h3 class=\"sec-head\">8. PROSES PENYUSUNAN</h3>\n<ul><li>Mengumpulkan data transaksi.</li><li>Memverifikasi kelengkapan.</li><li>Menyusun laporan.</li><li>Memeriksa kesesuaian data.</li><li>Melakukan analisis.</li><li>Memperoleh persetujuan.</li><li>Mendistribusikan laporan kepada pihak yang berwenang.</li><li>Mengarsipkan laporan.</li></ul>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN LAPORAN KEUANGAN</h3>\n<ul><li>Transaksi dicatat.</li><li>Data dikumpulkan.</li><li>Data diverifikasi.</li><li>Laporan disusun.</li><li>Laporan dianalisis.</li><li>Laporan disahkan.</li><li>Keputusan diambil.</li><li>Evaluasi dilakukan.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Laporan keuangan dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh transaksi telah tercatat;</li><li>laporan selesai sesuai jadwal;</li><li>angka dapat ditelusuri ke dokumen pendukung;</li><li>tidak terdapat kesalahan material yang diketahui;</li><li>laporan dapat digunakan sebagai dasar pengambilan keputusan.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyerahkan data sesuai tugas;</li><li>menjaga ketelitian pencatatan;</li><li>melaporkan kesalahan apabila ditemukan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kelengkapan data;</li><li>meninjau laporan;</li><li>melakukan analisis awal;</li><li>menyampaikan laporan kepada Pemilik.</li></ul>\n<p><strong>Pemilik</strong></p>\n<ul><li>mengevaluasi hasil laporan;</li><li>menetapkan keputusan strategis;</li><li>menyetujui tindak lanjut yang diperlukan.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan manajemen laporan keuangan diukur melalui:</p>\n<ul><li>100% laporan selesai sesuai jadwal.</li><li>100% laporan memiliki dokumen pendukung.</li><li>Tidak terdapat kesalahan material yang diketahui.</li><li>Seluruh laporan terdokumentasi dengan baik.</li><li>Hasil laporan digunakan dalam rapat evaluasi dan pengambilan keputusan.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-601 Standar Manajemen Kas;</li><li>SL21-602 Standar Manajemen Rekening Bank;</li><li>SL21-603 Standar Manajemen Piutang;</li><li>SL21-604 Standar Manajemen Hutang;</li><li>SL21-605 Standar Manajemen Anggaran;</li><li>Seluruh standar operasional Lorongsatu21 yang menghasilkan data keuangan.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dikelola meliputi:</p>\n<ul><li>periode laporan;</li><li>jenis laporan;</li><li>pendapatan;</li><li>beban;</li><li>aset;</li><li>kewajiban;</li><li>modal;</li><li>arus kas;</li><li>realisasi anggaran;</li><li>indikator kinerja keuangan.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh laporan didukung data yang sah;</li><li>angka dapat ditelusuri;</li><li>laporan diterbitkan sesuai jadwal;</li><li>perubahan atau koreksi terdokumentasi;</li><li>laporan digunakan sebagai dasar evaluasi perusahaan.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>hasil audit;</li><li>kualitas laporan;</li><li>ketepatan waktu penyusunan;</li><li>kebutuhan informasi manajemen;</li><li>perkembangan perusahaan.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan kualitas pelaporan, efisiensi proses penyusunan, dan kemampuan analisis keuangan.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN LAPORAN KEUANGAN L21</div>\n<ul><li>Tidak ada laporan tanpa data yang sah.</li><li>Tidak ada angka tanpa dokumen pendukung.</li><li>Laporan harus selesai sesuai jadwal.</li><li>Kesalahan yang ditemukan segera dikoreksi dan didokumentasikan.</li><li>Format laporan dijaga konsisten.</li><li>Laporan harus mudah dipahami oleh penggunanya.</li><li>Analisis menjadi bagian dari setiap laporan.</li><li>Seluruh laporan diarsipkan dengan aman.</li><li>Laporan digunakan sebagai dasar pengambilan keputusan.</li><li>Keberhasilan perusahaan diukur berdasarkan data, bukan perkiraan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen laporan keuangan merupakan tahap akhir dari siklus pengelolaan keuangan Lorongsatu21.</p>\n<p>Melalui penyusunan laporan yang akurat, tepat waktu, konsisten, dan berorientasi pada pengambilan keputusan, Lorongsatu21 memastikan setiap informasi keuangan menjadi dasar yang kuat untuk meningkatkan kinerja, menjaga kesehatan usaha, dan mewujudkan pertumbuhan perusahaan yang berkelanjutan.</p>", "order": 75, "no_formal_header": false}]}]}, {"key": "G", "name": "PEMASARAN", "items": [{"code": "SL21-701", "official_title": "Standar Branding", "status": "ok", "note": "", "versions": [{"title": "STANDAR BRANDING", "meta": {"Kode Dokumen": "SL21-701", "Nama Dokumen": "Standar Branding", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan prinsip identitas visual Lorongsatu21 agar seluruh unit — Fotokopi, ATK, Percetakan, Foto, dan Pakaian — tampil sebagai satu perusahaan yang konsisten dan mudah dikenali, meskipun terdiri dari beberapa layanan yang berbeda.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Identitas visual yang konsisten membangun kepercayaan lebih cepat daripada identitas yang berubah-ubah.</li><li>Branding bukan sekadar logo, tetapi keseluruhan kesan yang diterima pelanggan setiap kali melihat atau berinteraksi dengan Lorongsatu21.</li></ul>\n<p>Moto:</p>\n<p><strong>Satu Identitas. Banyak Layanan. Tetap Terpercaya.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP IDENTITAS VISUAL</h3>\n<ul><li>konsisten di seluruh unit dan media;</li><li>sederhana dan mudah dikenali;</li><li>mencerminkan nilai Berkarakter, Belajar, Bertumbuh, Bermanfaat;</li><li>dapat diterapkan pada skala kecil (label harga) maupun besar (papan nama toko).</li></ul>\n<h3 class=\"sec-head\">4. ELEMEN IDENTITAS</h3>\n<p>Identitas visual Lorongsatu21 terdiri dari:</p>\n<ul><li>Logo dan wordmark resmi perusahaan.</li><li>Palet warna resmi sebagaimana ditetapkan dalam Panduan Identitas Visual Lorongsatu21.</li><li>Tipografi resmi untuk materi cetak dan digital.</li><li>Gaya fotografi dan visual (pencahayaan, sudut pengambilan, suasana) yang digunakan pada konten promosi.</li></ul>\n<p>Rincian teknis (kode warna, jenis huruf, ukuran logo minimum) diatur dalam Panduan Identitas Visual Lorongsatu21 sebagai dokumen pendamping standar ini.</p>\n<h3 class=\"sec-head\">5. STANDAR PENGGUNAAN LOGO DAN WARNA</h3>\n<ul><li>Logo digunakan sesuai versi resmi, tidak diubah bentuk, warna, atau proporsinya tanpa persetujuan.</li><li>Warna resmi digunakan secara konsisten pada signage, label harga, kemasan, dan materi promosi.</li><li>Setiap unit dapat memiliki elemen visual pendukung (misalnya warna aksen) selama tetap konsisten dengan identitas utama Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR SIGNAGE UNIT</h3>\n<ul><li>Papan nama dan penanda setiap unit mengikuti sistem identitas yang sama agar pelanggan mengenali bahwa seluruh unit adalah bagian dari Lorongsatu21.</li><li>Signage dirancang agar mudah terbaca dari luar dan mencerminkan layanan yang tersedia di dalam.</li></ul>\n<h3 class=\"sec-head\">7. KONSISTENSI ANTAR UNIT</h3>\n<p>Karena Lorongsatu21 memiliki beberapa unit dalam satu lokasi, konsistensi identitas menjadi penting agar pelanggan merasa berada dalam satu perusahaan yang sama, bukan beberapa toko yang terpisah.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim yang Ditugaskan</strong></p>\n<ul><li>menerapkan identitas visual sesuai panduan;</li><li>melaporkan kebutuhan materi branding baru kepada Penanggung Jawab Cabang.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>menyetujui perubahan atau penambahan elemen visual;</li><li>menjaga konsistensi identitas di seluruh unit.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Seluruh unit menggunakan identitas visual yang konsisten.</li><li>Pelanggan mengenali seluruh unit sebagai bagian dari Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-702 Standar Konten Media Sosial.</li><li>SL21-703 Standar Promosi.</li><li>SL21-305 Standar Layanan Google Business Profile.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: riwayat materi branding yang telah dibuat dan disetujui.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa identitas visual yang digunakan di seluruh unit sesuai dengan Panduan Identitas Visual Lorongsatu21.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Panduan Identitas Visual ditinjau secara berkala mengikuti perkembangan unit usaha dan masukan pelanggan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Identitas visual yang konsisten membuat Lorongsatu21 mudah dikenali dan dipercaya, di mana pun dan pada layanan apa pun pelanggan berinteraksi.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-702", "official_title": "Standar Konten Media Sosial", "status": "ok", "note": "", "versions": [{"title": "STANDAR KONTEN MEDIA SOSIAL", "meta": {"Kode Dokumen": "SL21-702", "Nama Dokumen": "Standar Konten Media Sosial", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 membuat dan mempublikasikan konten media sosial agar informatif, konsisten, dan mendukung pelayanan serta penjualan seluruh unit.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Konten media sosial adalah etalase digital Lorongsatu21.</li><li>Konten yang bermanfaat lebih berharga daripada konten yang sekadar ramai.</li></ul>\n<p>Moto:</p>\n<p><strong>Bermanfaat • Konsisten • Menarik • Jujur</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP KONTEN</h3>\n<ul><li>sesuai fakta, tidak menyesatkan;</li><li>relevan dengan kebutuhan pelanggan;</li><li>mengikuti identitas visual resmi (SL21-701);</li><li>dipublikasikan secara rutin, bukan sesekali.</li></ul>\n<h3 class=\"sec-head\">4. JENIS KONTEN</h3>\n<ul><li>Konten edukasi — tips seputar cetak, desain, atau perawatan pakaian.</li><li>Konten promosi — informasi produk, layanan, dan penawaran.</li><li>Konten hasil kerja — contoh hasil cetak, foto, atau produk yang telah selesai dikerjakan.</li><li>Konten testimoni — ulasan atau pengalaman pelanggan (dengan izin).</li><li>Konten seputar perusahaan — kegiatan tim, informasi operasional.</li></ul>\n<h3 class=\"sec-head\">5. KALENDER DAN FREKUENSI PUBLIKASI</h3>\n<p>Publikasi konten dilakukan secara terjadwal menggunakan kalender konten agar setiap unit mendapat porsi promosi yang seimbang. Frekuensi dan jadwal rinci ditetapkan sesuai kebijakan pemasaran perusahaan.</p>\n<h3 class=\"sec-head\">6. STANDAR KUALITAS KONTEN</h3>\n<ul><li>Foto dan video jelas, tidak buram, dengan pencahayaan yang baik.</li><li>Caption menggunakan bahasa yang sopan, jelas, dan mudah dipahami.</li><li>Informasi harga dan spesifikasi pada konten promosi harus akurat sesuai kondisi terkini.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR PERSETUJUAN KONTEN</h3>\n<p>Konten yang memuat harga, promosi, atau klaim tertentu diperiksa terlebih dahulu oleh Penanggung Jawab Cabang sebelum dipublikasikan, untuk memastikan keakuratannya.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim yang Ditugaskan</strong></p>\n<ul><li>membuat dan menjadwalkan konten sesuai kalender;</li><li>memastikan kualitas foto/video dan caption sesuai standar.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyetujui konten yang memuat harga atau promosi;</li><li>memantau performa konten secara berkala.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Konten dipublikasikan sesuai kalender yang ditetapkan.</li><li>Tidak ada komplain pelanggan akibat informasi konten yang tidak akurat.</li><li>Interaksi (like, komentar, share, atau pesan masuk) menunjukkan tren yang membaik.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-701 Standar Branding.</li><li>SL21-703 Standar Promosi.</li><li>SL21-305 Standar Layanan Google Business Profile.</li><li>SL21-304 Standar Komunikasi WhatsApp.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: kalender konten, jumlah publikasi, dan performa dasar tiap konten.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan konten dipublikasikan sesuai jadwal dan standar kualitas, serta seluruh informasi yang dipublikasikan akurat.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Performa konten dan masukan pelanggan digunakan untuk menyempurnakan jenis dan gaya konten ke depan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Konten media sosial yang konsisten dan jujur membantu pelanggan menemukan dan mempercayai Lorongsatu21 bahkan sebelum mereka datang ke toko.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-703", "official_title": "Standar Promosi", "status": "ok", "note": "", "versions": [{"title": "STANDAR PROMOSI", "meta": {"Kode Dokumen": "SL21-703", "Nama Dokumen": "Standar Promosi", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara merancang, menyetujui, dan menyampaikan promosi Lorongsatu21 agar jujur, jelas, dan memberikan manfaat nyata bagi pelanggan maupun perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Promosi yang baik menarik pelanggan tanpa menyesatkan mereka.</li><li>Promosi adalah investasi, bukan sekadar potongan harga.</li></ul>\n<p>Moto:</p>\n<p><strong>Jujur Menawarkan. Jelas Menjelaskan. Menguntungkan Bersama.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PROMOSI</h3>\n<ul><li>syarat dan ketentuan disampaikan secara jelas sejak awal;</li><li>tidak menyesatkan pelanggan dengan klaim yang berlebihan;</li><li>mempertimbangkan kemampuan keuangan perusahaan sebelum ditetapkan.</li></ul>\n<h3 class=\"sec-head\">4. JENIS PROMOSI</h3>\n<ul><li>Diskon langsung untuk produk atau layanan tertentu.</li><li>Bundling — penggabungan beberapa produk/layanan dengan harga khusus.</li><li>Promosi musiman — menyesuaikan momen seperti tahun ajaran baru atau hari besar.</li><li>Program pelanggan tetap, sesuai ketentuan lebih lanjut dalam SL21-704 Standar Hubungan Pelanggan.</li></ul>\n<h3 class=\"sec-head\">5. STANDAR PENETAPAN DAN PERSETUJUAN PROMOSI</h3>\n<ul><li>Setiap promosi diusulkan dengan memperhitungkan dampaknya terhadap margin dan arus kas.</li><li>Promosi yang memengaruhi harga jual wajib disetujui oleh Penanggung Jawab Cabang atau Pemilik sebelum dipublikasikan.</li><li>Periode berlaku promosi ditetapkan dengan jelas.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR KOMUNIKASI PROMOSI</h3>\n<ul><li>Syarat dan ketentuan (periode, produk yang berlaku, batasan jumlah) disampaikan secara lengkap pada setiap materi promosi.</li><li>Anggota Tim yang melayani pelanggan memahami detail promosi yang sedang berjalan agar dapat menjelaskan dengan benar.</li></ul>\n<h3 class=\"sec-head\">7. EVALUASI EFEKTIVITAS PROMOSI</h3>\n<p>Setiap promosi dievaluasi setelah berakhir untuk melihat dampaknya terhadap penjualan dan mempertimbangkan kelanjutannya di masa mendatang.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memahami dan menyampaikan detail promosi dengan benar kepada pelanggan.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>menyetujui dan mengevaluasi promosi;</li><li>memastikan promosi tidak membebani keuangan perusahaan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Tidak ada keluhan pelanggan akibat syarat promosi yang tidak jelas.</li><li>Promosi memberikan dampak positif terhadap penjualan tanpa mengganggu margin secara signifikan.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-702 Standar Konten Media Sosial.</li><li>SL21-704 Standar Hubungan Pelanggan.</li><li>Standar Keuangan (Kelompok F).</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar promosi yang pernah berjalan, periode, dan hasil evaluasinya.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan promosi yang berjalan telah disetujui, sesuai syarat yang dipublikasikan, dan tercatat hasilnya.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Hasil evaluasi promosi menjadi dasar perancangan promosi berikutnya agar semakin efektif dan efisien.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Promosi yang jujur dan terencana membantu Lorongsatu21 tumbuh tanpa mengorbankan kepercayaan pelanggan.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-704", "official_title": "Standar Hubungan Pelanggan", "status": "ok", "note": "", "versions": [{"title": "STANDAR HUBUNGAN PELANGGAN", "meta": {"Kode Dokumen": "SL21-704", "Nama Dokumen": "Standar Hubungan Pelanggan", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 menjaga hubungan jangka panjang dengan pelanggan, melampaui satu kali transaksi, sehingga pelanggan terus kembali dan merekomendasikan Lorongsatu21 kepada orang lain.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Pelanggan yang kembali lebih berharga daripada pelanggan baru yang datang sekali.</li><li>Hubungan yang baik dibangun dari perhatian setelah transaksi selesai, bukan hanya saat transaksi berlangsung.</li></ul>\n<p>Moto:</p>\n<p><strong>Diingat • Diperhatikan • Dipercaya Kembali</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>setiap pelanggan berharga, baik yang membeli besar maupun kecil;</li><li>perhatian diberikan secara wajar, tidak berlebihan atau mengganggu privasi pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. DATA DAN DATABASE PELANGGAN</h3>\n<p>Sesuai kebutuhan dan sepanjang pelanggan berkenan, Lorongsatu21 dapat mencatat data dasar pelanggan (nama, kontak, riwayat layanan) untuk mendukung pelayanan lanjutan, dengan tetap menjaga kerahasiaannya sesuai SL21-805 Standar Keamanan Data.</p>\n<h3 class=\"sec-head\">5. PROGRAM PELANGGAN TETAP</h3>\n<p>Lorongsatu21 dapat mengembangkan program bagi pelanggan tetap atau pelanggan dengan volume transaksi besar (misalnya sekolah atau kantor yang rutin memesan ATK atau cetak), dengan ketentuan lebih lanjut diatur dalam kebijakan pemasaran perusahaan.</p>\n<h3 class=\"sec-head\">6. FOLLOW-UP PASCA PELAYANAN</h3>\n<ul><li>Untuk pesanan bernilai besar atau pelanggan tetap, Anggota Tim dapat menindaklanjuti setelah pesanan diterima untuk memastikan pelanggan puas.</li><li>Tindak lanjut dilakukan secara wajar dan tidak berkesan memaksa.</li></ul>\n<h3 class=\"sec-head\">7. PENANGANAN PELANGGAN LAMA DAN BARU</h3>\n<ul><li>Pelanggan baru mendapat perkenalan yang jelas mengenai layanan Lorongsatu21.</li><li>Pelanggan lama diperlakukan dengan mengenali riwayat kebutuhan mereka apabila memungkinkan, agar pelayanan terasa lebih personal.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mencatat data pelanggan sesuai kebutuhan pelayanan;</li><li>melakukan follow-up wajar untuk pesanan besar.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>mengembangkan program hubungan pelanggan;</li><li>memastikan data pelanggan dikelola dengan aman.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Jumlah pelanggan yang kembali menggunakan layanan meningkat.</li><li>Pelanggan merekomendasikan Lorongsatu21 kepada orang lain.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan.</li><li>SL21-302 Standar Penanganan Keluhan.</li><li>SL21-703 Standar Promosi.</li><li>SL21-805 Standar Keamanan Data.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: data dasar pelanggan tetap, riwayat layanan, dan catatan follow-up.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan data pelanggan dikelola dengan aman dan follow-up dilakukan secara wajar sesuai standar.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan tetap dan hasil evaluasi hubungan pelanggan digunakan untuk menyempurnakan program dan cara pendekatan ke depan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Hubungan yang terjaga dengan baik mengubah pelanggan menjadi mitra jangka panjang bagi pertumbuhan Lorongsatu21.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-705", "official_title": "Standar Kemitraan", "status": "ok", "note": "", "versions": [{"title": "STANDAR KEMITRAAN", "meta": {"Kode Dokumen": "SL21-705", "Nama Dokumen": "Standar Kemitraan", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 membangun dan menjaga kerja sama dengan mitra usaha — pemasok, institusi (sekolah, kantor), maupun mitra pemasaran — agar saling menguntungkan dan berkelanjutan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Kemitraan yang baik dibangun di atas kepercayaan dan kejelasan, sejalan dengan prinsip muamalah yang menekankan keterbukaan dan keadilan antar pihak yang bekerja sama.</li><li>Hubungan jangka panjang lebih bernilai daripada keuntungan sesaat.</li></ul>\n<p>Moto:</p>\n<p><strong>Transparan • Adil • Saling Menguntungkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP KEMITRAAN</h3>\n<ul><li>kejelasan hak dan kewajiban sejak awal;</li><li>keterbukaan mengenai kemampuan dan keterbatasan masing-masing pihak;</li><li>evaluasi berkala agar kerja sama tetap saling menguntungkan.</li></ul>\n<h3 class=\"sec-head\">4. JENIS MITRA</h3>\n<ul><li>Mitra pemasok — sesuai ketentuan SL21-501 Standar Pembelian.</li><li>Mitra institusi — sekolah, kantor, atau organisasi yang rutin menggunakan layanan Lorongsatu21.</li><li>Mitra pemasaran — pihak yang membantu memperluas jangkauan promosi Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">5. STANDAR MEMILIH MITRA</h3>\n<ul><li>Mitra dipilih berdasarkan rekam jejak, kualitas, dan kesesuaian dengan nilai Lorongsatu21.</li><li>Mitra baru dapat dievaluasi dalam skala kecil terlebih dahulu sebelum kerja sama diperluas.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR PERJANJIAN KERJA SAMA</h3>\n<ul><li>Kerja sama yang bersifat rutin atau bernilai besar dituangkan secara tertulis, sederhana, dan jelas mengenai hak serta kewajiban kedua pihak.</li><li>Perjanjian menghindari ketidakjelasan (gharar) mengenai harga, volume, atau jangka waktu kerja sama.</li></ul>\n<h3 class=\"sec-head\">7. EVALUASI MITRA BERKALA</h3>\n<p>Kerja sama dengan mitra dievaluasi secara berkala untuk memastikan kualitas, ketepatan waktu, dan manfaat kerja sama tetap terjaga.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menjalin dan memelihara hubungan dengan mitra;</li><li>melaporkan kerja sama penting kepada Pemilik.</li></ul>\n<p><strong>Pemilik</strong></p>\n<ul><li>menyetujui kerja sama bernilai besar atau jangka panjang.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Kerja sama dengan mitra berjalan lancar dan saling menguntungkan.</li><li>Tidak ada perselisihan akibat kesepakatan yang tidak jelas.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-501 Standar Pembelian.</li><li>SL21-104 Standar Etika.</li><li>SL21-703 Standar Promosi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar mitra aktif, ringkasan perjanjian, dan hasil evaluasi berkala.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan kerja sama mitra terdokumentasi dan dijalankan sesuai kesepakatan.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Hasil evaluasi mitra digunakan untuk menyempurnakan kriteria pemilihan dan pengelolaan kemitraan berikutnya.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Kemitraan yang sehat memperluas kemampuan Lorongsatu21 melayani lebih banyak pelanggan tanpa harus menanggung semuanya sendiri.</p>", "order": 9999, "no_formal_header": false}]}]}, {"key": "H", "name": "PENGETAHUAN & TEKNOLOGI", "items": [{"code": "SL21-801", "official_title": "Standar Perpustakaan L21", "status": "ok", "note": "", "versions": [{"title": "STANDAR PERPUSTAKAAN L21", "meta": {"Kode Dokumen": "SL21-801", "Nama Dokumen": "Standar Perpustakaan L21", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 menyimpan dan mengorganisasi seluruh dokumen resmi perusahaan — Standar L21, SOP, Instruksi Kerja, Formulir, dan Daftar Periksa — dalam satu sistem yang disebut Perpustakaan L21, agar mudah ditemukan dan digunakan kapan pun dibutuhkan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Dokumen yang baik tidak berguna apabila tidak dapat ditemukan saat dibutuhkan.</li><li>Perpustakaan L21 adalah ingatan resmi perusahaan yang tidak bergantung pada satu orang saja.</li></ul>\n<p>Moto:</p>\n<p><strong>Tersimpan Rapi. Mudah Ditemukan. Selalu Terbaru.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>terorganisasi berdasarkan kategori yang konsisten;</li><li>satu dokumen memiliki satu lokasi resmi, tidak tersebar di banyak tempat berbeda;</li><li>dapat diakses oleh pihak yang berkepentingan sesuai kewenangannya.</li></ul>\n<h3 class=\"sec-head\">4. ISI PERPUSTAKAAN L21</h3>\n<p>Perpustakaan L21 memuat seluruh dokumen resmi Lorongsatu21 sesuai hierarki yang ditetapkan dalam SL21-000 dan SL21-001, meliputi:</p>\n<ul><li>Piagam, Anggaran Dasar, dan Kebijakan Perusahaan;</li><li>seluruh Standar L21 (SL21-101 hingga SL21-905);</li><li>SOP, Instruksi Kerja, Formulir, dan Daftar Periksa terkait;</li><li>materi Akademi L21.</li></ul>\n<h3 class=\"sec-head\">5. STRUKTUR PENYIMPANAN</h3>\n<p>Dokumen disimpan mengikuti struktur kategori yang konsisten (baik dalam bentuk fisik maupun digital), sehingga setiap dokumen dapat ditelusuri berdasarkan kelompok dan kodenya.</p>\n<h3 class=\"sec-head\">6. AKSES DAN HAK BACA</h3>\n<ul><li>Seluruh Anggota Tim berhak mengakses Standar L21 dan SOP yang relevan dengan pekerjaannya.</li><li>Dokumen yang bersifat rahasia (misalnya terkait keuangan atau data pribadi Anggota Tim) hanya diakses oleh pihak yang berwenang.</li></ul>\n<h3 class=\"sec-head\">7. PEMBARUAN DOKUMEN</h3>\n<ul><li>Setiap perubahan dokumen dicatat sebagai versi baru, tidak menimpa versi lama tanpa jejak.</li><li>Riwayat revisi disimpan agar perkembangan setiap Standar dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim yang Ditugaskan</strong></p>\n<ul><li>menyimpan dokumen baru sesuai struktur yang berlaku;</li><li>memperbarui dokumen yang telah direvisi.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>menyetujui perubahan dokumen resmi;</li><li>memastikan Perpustakaan L21 selalu mutakhir.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Dokumen yang dibutuhkan dapat ditemukan dengan cepat.</li><li>Tidak ada dua versi dokumen yang saling bertentangan beredar bersamaan.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-000 Daftar Standar Resmi.</li><li>SL21-001 Master Standar.</li><li>SL21-802 Standar Pusat Pengetahuan L21.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar dokumen aktif, versi terkini, dan riwayat revisi.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan seluruh dokumen resmi tersimpan sesuai struktur dan versi yang digunakan adalah versi terbaru.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Struktur penyimpanan disempurnakan secara berkala seiring bertambahnya jumlah dan jenis dokumen Lorongsatu21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Perpustakaan L21 yang tertata membuat seluruh sistem Lorongsatu21 dapat terus dijalankan dengan konsisten, bahkan ketika terjadi pergantian Anggota Tim.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-802", "official_title": "Standar Pusat Pengetahuan L21", "status": "ok", "note": "", "versions": [{"title": "STANDAR PUSAT PENGETAHUAN L21", "meta": {"Kode Dokumen": "SL21-802", "Nama Dokumen": "Standar Pusat Pengetahuan L21", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan pengelolaan Pusat Pengetahuan L21 — kumpulan materi pembelajaran yang melengkapi setiap Standar L21 — agar pengetahuan dan pengalaman kerja di Lorongsatu21 dapat dipelajari kembali dan diwariskan kepada Anggota Tim berikutnya.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Pengetahuan yang hanya tersimpan di kepala satu orang mudah hilang saat orang itu pergi.</li><li>Setiap pengalaman kerja adalah bahan pembelajaran bagi Anggota Tim lain.</li></ul>\n<p>Moto:</p>\n<p><strong>Dipelajari Sekali. Bermanfaat Berkali-kali.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>setiap Standar L21 idealnya dilengkapi materi yang membantu memahaminya;</li><li>materi disusun sederhana dan mudah dipelajari mandiri;</li><li>materi diperbarui mengikuti perubahan Standar L21.</li></ul>\n<h3 class=\"sec-head\">4. KOMPONEN PUSAT PENGETAHUAN</h3>\n<p>Sebagaimana ditetapkan dalam Master Standar (SL21-001), setiap Standar dapat dilengkapi dengan:</p>\n<ul><li>SOP dan Instruksi Kerja terkait;</li><li>Video demonstrasi;</li><li>Modul pembelajaran Akademi L21;</li><li>FAQ (pertanyaan yang sering muncul);</li><li>Studi Kasus dari pengalaman nyata di lapangan;</li><li>AI Prompt — kumpulan perintah AI yang membantu pekerjaan tertentu;</li><li>Riwayat Revisi.</li></ul>\n<h3 class=\"sec-head\">5. STANDAR PENYUSUNAN MODUL DAN VIDEO</h3>\n<ul><li>Materi disusun menggunakan bahasa yang sederhana dan langkah yang jelas.</li><li>Video dan modul mencerminkan praktik kerja yang benar-benar sesuai SOP terkait.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR PEMBARUAN DAN KURASI KONTEN</h3>\n<ul><li>Materi yang sudah tidak sesuai dengan Standar terbaru diperbarui atau ditandai tidak berlaku.</li><li>Studi kasus baru ditambahkan dari kejadian nyata yang bernilai pembelajaran, termasuk dari hasil audit dan penanganan keluhan.</li></ul>\n<h3 class=\"sec-head\">7. KETERKAITAN DENGAN AKADEMI L21</h3>\n<p>Pusat Pengetahuan L21 menjadi sumber utama materi pembelajaran Akademi L21 (SL21-203), mendukung Anggota Tim naik Level Kompetensi.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim yang Ditugaskan</strong></p>\n<ul><li>menyusun dan memperbarui materi sesuai kebutuhan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan materi tersedia untuk Standar-standar yang paling sering digunakan;</li><li>menyetujui studi kasus dan materi baru.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Anggota Tim dapat mempelajari suatu Standar secara mandiri menggunakan materi yang tersedia.</li><li>Materi selalu sesuai dengan versi Standar yang berlaku.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-001 Master Standar.</li><li>SL21-203 Standar Akademi L21.</li><li>SL21-801 Standar Perpustakaan L21.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar materi per Standar, tanggal pembaruan terakhir, dan status ketersediaannya.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan materi yang tersedia sesuai dengan versi Standar terbaru dan mencakup Standar-standar prioritas.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Pengalaman kerja, hasil audit, dan masukan Anggota Tim menjadi sumber studi kasus dan materi baru secara berkelanjutan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pusat Pengetahuan L21 memastikan setiap pengalaman berharga di Lorongsatu21 tidak hilang, tetapi terus diwariskan dan dikembangkan.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-803", "official_title": "Standar Pusat Data L21", "status": "ok", "note": "", "versions": [{"title": "STANDAR PUSAT DATA L21", "meta": {"Kode Dokumen": "SL21-803", "Nama Dokumen": "Standar Pusat Data L21", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan prinsip pengelolaan data di seluruh Lorongsatu21, menjadi acuan bagi setiap bagian &quot;Pusat Data L21&quot; yang tercantum pada masing-masing Standar L21, agar data yang dikumpulkan konsisten, akurat, dan benar-benar digunakan untuk pengambilan keputusan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Sebagaimana ditetapkan dalam Master Standar (SL21-001), data yang tidak digunakan untuk pengambilan keputusan sebaiknya tidak dikumpulkan.</p>\n<ul><li>Data yang baik mendukung keputusan yang lebih tepat, bukan sekadar arsip.</li><li>Setiap data harus dapat ditelusuri asal dan kebenarannya.</li></ul>\n<p>Moto:</p>\n<p><strong>Akurat • Tertelusur • Bermanfaat untuk Keputusan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PENGELOLAAN DATA</h3>\n<ul><li>akurat — mencerminkan kondisi yang sebenarnya;</li><li>real-time — dicatat sesegera mungkin setelah kejadian;</li><li>tertelusur — memiliki tanggal, petugas, dan sumber yang jelas;</li><li>digunakan — mendukung keputusan operasional, evaluasi, audit, atau pengembangan.</li></ul>\n<h3 class=\"sec-head\">4. JENIS DATA YANG DIKELOLA</h3>\n<ul><li>Data operasional — pesanan, produksi, layanan pelanggan.</li><li>Data keuangan — kas, piutang, hutang, laporan keuangan.</li><li>Data pelanggan — sesuai SL21-704 dan SL21-805.</li><li>Data Anggota Tim — kompetensi, evaluasi, kompensasi.</li><li>Data pemasaran — performa konten dan promosi.</li></ul>\n<h3 class=\"sec-head\">5. STANDAR PENCATATAN DATA</h3>\n<ul><li>Data dicatat oleh Anggota Tim yang bertanggung jawab langsung atas transaksi atau kejadian terkait.</li><li>Setiap pencatatan mengikuti format yang telah ditetapkan pada Standar atau formulir terkait.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR PENYIMPANAN DAN BACKUP</h3>\n<ul><li>Data operasional dan keuangan disimpan pada sistem yang dapat diakses kembali kapan pun dibutuhkan.</li><li>Data penting dicadangkan (backup) secara berkala untuk mencegah kehilangan data akibat kerusakan perangkat.</li></ul>\n<h3 class=\"sec-head\">7. HAK AKSES DATA</h3>\n<p>Hak akses data mengikuti ketentuan pada SL21-805 Standar Keamanan Data — data sensitif hanya dapat diakses oleh pihak yang berwenang.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mencatat data secara akurat dan tepat waktu sesuai tanggung jawabnya.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memantau kelengkapan data operasional unit;</li><li>memastikan backup data dilakukan secara berkala.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Data yang dibutuhkan untuk keputusan selalu tersedia dan akurat.</li><li>Tidak terjadi kehilangan data penting akibat tidak adanya backup.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-001 Master Standar.</li><li>SL21-805 Standar Keamanan Data.</li><li>Seluruh Standar Operasional dan Keuangan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat mengenai pengelolaan data itu sendiri: jadwal backup, insiden kehilangan data (bila ada), dan tindak lanjutnya.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan data pada setiap unit tercatat lengkap, akurat, dan backup dilakukan sesuai jadwal.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Kebutuhan data baru dari setiap unit dievaluasi secara berkala agar Pusat Data L21 terus relevan dengan perkembangan perusahaan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Data yang dikelola dengan baik menjadi dasar setiap keputusan penting di Lorongsatu21, dari operasional harian hingga rencana pengembangan jangka panjang.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-804", "official_title": "Standar AI L21", "status": "ok", "note": "", "versions": [{"title": "STANDAR AI L21", "meta": {"Kode Dokumen": "SL21-804", "Nama Dokumen": "Standar AI L21", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 menggunakan kecerdasan buatan (AI) secara bermanfaat dan bertanggung jawab dalam mendukung pekerjaan, tanpa menggantikan tanggung jawab dan penilaian manusia.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>AI adalah alat bantu untuk mempercepat pekerjaan, bukan pengganti tanggung jawab Anggota Tim.</li><li>Hasil AI tetap harus diperiksa oleh manusia sebelum digunakan, terutama yang berhubungan langsung dengan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Dibantu AI, Ditentukan Manusia.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PENGGUNAAN AI</h3>\n<ul><li>digunakan untuk mempercepat pekerjaan yang berulang atau memakan waktu;</li><li>hasil AI tidak digunakan mentah-mentah tanpa pemeriksaan;</li><li>tidak memasukkan data rahasia perusahaan atau pelanggan ke layanan AI publik tanpa izin.</li></ul>\n<h3 class=\"sec-head\">4. PENGGUNAAN AI YANG DIPERBOLEHKAN</h3>\n<ul><li>Membantu menyusun draf konten promosi, caption, atau materi pemasaran.</li><li>Membantu analisis data operasional dan keuangan sederhana.</li><li>Membantu menyusun dokumentasi, SOP, atau materi Pusat Pengetahuan L21.</li><li>Membantu ide desain awal sebelum disempurnakan oleh Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">5. BATASAN PENGGUNAAN AI</h3>\n<ul><li>Data pribadi pelanggan (nama, kontak, dokumen pribadi) tidak dimasukkan ke layanan AI publik tanpa keperluan dan izin yang jelas.</li><li>Data keuangan rahasia perusahaan tidak dibagikan ke layanan AI di luar yang telah disetujui perusahaan.</li><li>Keputusan penting (harga, kebijakan, evaluasi Anggota Tim) tetap diputuskan oleh manusia, AI hanya membantu menyiapkan bahan pertimbangan.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR VERIFIKASI HASIL AI</h3>\n<ul><li>Konten atau informasi hasil AI yang akan digunakan ke pelanggan wajib diperiksa kebenarannya terlebih dahulu.</li><li>Anggota Tim yang menggunakan hasil AI bertanggung jawab penuh atas kebenaran dan kepatutan hasil tersebut, sama seperti pekerjaan yang dilakukan sendiri.</li></ul>\n<h3 class=\"sec-head\">7. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menggunakan AI sesuai batasan yang ditetapkan;</li><li>memeriksa dan bertanggung jawab atas hasil AI yang digunakan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan penggunaan AI tidak melanggar batasan data rahasia;</li><li>menyetujui penggunaan AI untuk keperluan baru yang lebih luas.</li></ul>\n<h3 class=\"sec-head\">8. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Penggunaan AI mempercepat pekerjaan tanpa menimbulkan kesalahan yang sampai ke pelanggan.</li><li>Tidak terjadi kebocoran data rahasia melalui penggunaan AI.</li></ul>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-802 Standar Pusat Pengetahuan L21.</li><li>SL21-805 Standar Keamanan Data.</li><li>SL21-702 Standar Konten Media Sosial.</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar penggunaan AI untuk pekerjaan rutin dan AI Prompt yang terbukti bermanfaat (disimpan pada Pusat Pengetahuan L21).</p>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan penggunaan AI tidak melanggar batasan data rahasia dan hasil AI yang dipublikasikan telah diperiksa manusia.</p>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Cara penggunaan AI yang terbukti efektif didokumentasikan sebagai AI Prompt pada Pusat Pengetahuan L21 agar dapat digunakan kembali oleh Anggota Tim lain.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>AI membantu Lorongsatu21 bekerja lebih cepat dan efisien, selama tetap digunakan dengan tanggung jawab penuh dari setiap Anggota Tim yang menggunakannya.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-805", "official_title": "Standar Keamanan Data", "status": "ok", "note": "", "versions": [{"title": "STANDAR KEAMANAN DATA", "meta": {"Kode Dokumen": "SL21-805", "Nama Dokumen": "Standar Keamanan Data", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 melindungi data perusahaan, data pelanggan, dan data Anggota Tim dari kehilangan, kebocoran, atau penyalahgunaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Kepercayaan pelanggan mencakup kepercayaan bahwa dokumen dan data mereka aman di tangan Lorongsatu21.</li><li>Keamanan data adalah bagian dari amanah yang dipegang perusahaan.</li></ul>\n<p>Moto:</p>\n<p><strong>Dijaga Kerahasiaannya. Diamankan Aksesnya. Dipulihkan Bila Diperlukan.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP KEAMANAN DATA</h3>\n<ul><li>data rahasia hanya diakses oleh pihak yang berwenang;</li><li>data pelanggan tidak disebarluaskan tanpa keperluan dan izin;</li><li>sistem dan data memiliki cadangan (backup) untuk mencegah kehilangan total.</li></ul>\n<h3 class=\"sec-head\">4. KLASIFIKASI DATA</h3>\n<ul><li>Data Rahasia — dokumen pribadi pelanggan (fotokopi, print, foto), data keuangan perusahaan, data pribadi Anggota Tim.</li><li>Data Umum — informasi produk, harga publik, konten pemasaran.</li></ul>\n<h3 class=\"sec-head\">5. STANDAR PERLINDUNGAN DATA PELANGGAN</h3>\n<ul><li>Dokumen pelanggan yang dicetak, difotokopi, atau di-scan bersifat rahasia sebagaimana ditetapkan dalam SL21-301 Standar Pelayanan Pelanggan.</li><li>File digital pelanggan dihapus dari perangkat kerja setelah pesanan selesai, kecuali disepakati lain dengan pelanggan.</li><li>Dokumen fisik pelanggan yang tertinggal disimpan aman dan tidak dipajang atau ditinggalkan di area yang dapat dilihat pelanggan lain.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR KATA SANDI DAN AKSES SISTEM</h3>\n<ul><li>Sistem kasir, keuangan, dan data penting lainnya dilindungi kata sandi yang tidak dibagikan sembarangan.</li><li>Akses ke data keuangan dan data Anggota Tim dibatasi hanya untuk pihak yang berwenang.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR BACKUP DAN PEMULIHAN</h3>\n<ul><li>Data penting dicadangkan secara berkala mengikuti ketentuan SL21-803 Standar Pusat Data L21.</li><li>Terdapat rencana pemulihan sederhana apabila terjadi kehilangan data (misalnya perangkat rusak).</li></ul>\n<h3 class=\"sec-head\">8. PENANGANAN INSIDEN KEAMANAN DATA</h3>\n<p>Apabila terjadi kebocoran atau kehilangan data, Anggota Tim wajib segera melaporkannya kepada Penanggung Jawab Cabang untuk ditindaklanjuti, termasuk pemberitahuan kepada pelanggan bila diperlukan.</p>\n<h3 class=\"sec-head\">9. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menjaga kerahasiaan dokumen dan data pelanggan;</li><li>melaporkan insiden keamanan data segera setelah diketahui.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan akses data dibatasi sesuai kewenangan;</li><li>menindaklanjuti insiden keamanan data.</li></ul>\n<h3 class=\"sec-head\">10. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Tidak ada insiden kebocoran data pelanggan atau perusahaan.</li><li>Data penting dapat dipulihkan apabila terjadi kehilangan perangkat.</li></ul>\n<h3 class=\"sec-head\">11. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan.</li><li>SL21-803 Standar Pusat Data L21.</li><li>SL21-804 Standar AI L21.</li></ul>\n<h3 class=\"sec-head\">12. PUSAT DATA L21</h3>\n<p>Data yang dicatat: insiden keamanan data (bila ada) dan tindak lanjutnya, jadwal backup sistem penting.</p>\n<h3 class=\"sec-head\">13. AUDIT</h3>\n<p>Audit memastikan dokumen dan data pelanggan dikelola sesuai standar kerahasiaan dan akses data dibatasi sesuai kewenangan.</p>\n<h3 class=\"sec-head\">14. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap insiden atau potensi risiko keamanan data menjadi bahan evaluasi untuk memperkuat standar dan kebiasaan kerja terkait data.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Menjaga keamanan data adalah bagian dari menjaga kepercayaan pelanggan — salah satu aset paling berharga yang dimiliki Lorongsatu21.</p>", "order": 9999, "no_formal_header": false}]}]}, {"key": "I", "name": "PENGEMBANGAN PERUSAHAAN", "items": [{"code": "SL21-901", "official_title": "Standar Pembukaan Cabang", "status": "ok", "note": "", "versions": [{"title": "STANDAR PEMBUKAAN CABANG", "meta": {"Kode Dokumen": "SL21-901", "Nama Dokumen": "Standar Pembukaan Cabang", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan kriteria dan tahapan yang harus dipenuhi sebelum Lorongsatu21 membuka unit, cabang, atau titik layanan baru, agar ekspansi berjalan terencana dan tidak mengorbankan kualitas yang sudah dibangun.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Ekspansi yang baik mengikuti kesiapan, bukan sekadar keinginan untuk tumbuh cepat.</li><li>Cabang baru harus mewarisi sistem dan budaya yang sama dengan lokasi awal, bukan memulai dari nol.</li></ul>\n<p>Moto:</p>\n<p><strong>Siap Sistemnya. Siap Orangnya. Baru Dibuka Cabangnya.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP EKSPANSI</h3>\n<ul><li>ekspansi didahului kesiapan sistem, SDM, dan keuangan;</li><li>cabang baru mengikuti Standar L21 yang sama dengan lokasi utama;</li><li>ekspansi dievaluasi bertahap, tidak sekaligus dalam skala besar.</li></ul>\n<h3 class=\"sec-head\">4. KRITERIA KESIAPAN PEMBUKAAN</h3>\n<p>Sebelum membuka unit atau cabang baru, Lorongsatu21 memastikan:</p>\n<ul><li>kondisi keuangan perusahaan sehat dan memiliki cadangan yang memadai;</li><li>tersedia calon Penanggung Jawab Cabang yang telah melalui Standar Pengembangan Pemimpin (SL21-210);</li><li>sistem kasir, keuangan, dan operasional yang digunakan lokasi utama siap direplikasi;</li><li>lokasi baru telah melalui kajian kelayakan dasar (permintaan pasar, lokasi, biaya sewa).</li></ul>\n<h3 class=\"sec-head\">5. TAHAPAN PEMBUKAAN CABANG</h3>\n<p><strong>Tahap Persiapan</strong></p>\n<p>Kajian kelayakan lokasi, penyiapan anggaran, dan penunjukan calon Penanggung Jawab Cabang.</p>\n<p><strong>Tahap Replikasi Sistem</strong></p>\n<p>Penyalinan SOP, sistem kasir, dan Standar L21 ke lokasi baru, disesuaikan seperlunya dengan kondisi setempat.</p>\n<p><strong>Tahap Pelatihan Tim Awal</strong></p>\n<p>Anggota Tim baru menjalani orientasi (SL21-202) dan pelatihan dasar Akademi L21 sebelum cabang beroperasi.</p>\n<p><strong>Tahap Pembukaan</strong></p>\n<p>Cabang mulai beroperasi dengan pendampingan intensif dari Pemilik atau Penanggung Jawab Cabang berpengalaman pada periode awal.</p>\n<h3 class=\"sec-head\">6. STANDAR REPLIKASI SISTEM DAN BUDAYA</h3>\n<ul><li>Cabang baru menjalankan Piagam, nilai inti, dan Standar L21 yang sama dengan lokasi utama.</li><li>Identitas visual mengikuti SL21-701 Standar Branding agar tetap satu identitas dengan lokasi utama.</li></ul>\n<h3 class=\"sec-head\">7. EVALUASI PASCA-PEMBUKAAN</h3>\n<p>Pada periode awal operasional, cabang baru dievaluasi secara berkala untuk memastikan sistem berjalan sesuai standar dan menyesuaikan hal-hal yang perlu diperbaiki.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Pemilik</strong></p>\n<ul><li>memutuskan kelayakan dan waktu pembukaan cabang baru;</li><li>memastikan kesiapan keuangan sebelum ekspansi.</li></ul>\n<p><strong>Penanggung Jawab Cabang (Baru)</strong></p>\n<ul><li>menjalankan sistem dan budaya sesuai Standar L21;</li><li>melaporkan perkembangan cabang secara berkala pada masa awal.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Cabang baru beroperasi sesuai Standar L21 sejak awal dibuka.</li><li>Cabang baru mencapai stabilitas operasional dalam periode evaluasi awal yang ditetapkan.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-210 Standar Pengembangan Pemimpin.</li><li>SL21-202 Standar Orientasi.</li><li>SL21-701 Standar Branding.</li><li>Standar Keuangan (Kelompok F).</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: kajian kelayakan, anggaran pembukaan, dan hasil evaluasi pasca-pembukaan.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan cabang baru dibuka sesuai kriteria kesiapan dan menjalankan Standar L21 secara konsisten.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Pembelajaran dari setiap pembukaan cabang digunakan untuk menyempurnakan proses ekspansi berikutnya.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Ekspansi yang terencana memastikan setiap cabang baru Lorongsatu21 membawa kualitas dan kepercayaan yang sama dengan lokasi pertamanya.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-902", "official_title": "Standar Audit Internal", "status": "ok", "note": "", "versions": [{"title": "STANDAR AUDIT INTERNAL", "meta": {"Kode Dokumen": "SL21-902", "Nama Dokumen": "Standar Audit Internal", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara pelaksanaan audit internal di Lorongsatu21 sebagai payung bagi bagian &quot;Audit&quot; yang tercantum pada setiap Standar L21, agar penerapan standar dan kepatuhan operasional dapat dipastikan secara berkala.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Audit bukan untuk mencari kesalahan seseorang, tetapi untuk memastikan sistem berjalan sesuai standar.</li><li>Temuan audit adalah bahan perbaikan, bukan bahan hukuman.</li></ul>\n<p>Moto:</p>\n<p><strong>Memeriksa untuk Memperbaiki, Bukan untuk Menyalahkan.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP AUDIT</h3>\n<ul><li>objektif — berdasarkan fakta dan data, bukan asumsi;</li><li>berkala — dilakukan secara terjadwal, bukan hanya saat terjadi masalah;</li><li>membangun — hasil audit ditindaklanjuti sebagai perbaikan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP AUDIT</h3>\n<ul><li>Kepatuhan operasional terhadap SOP dan Standar L21 di setiap unit.</li><li>Pengelolaan keuangan — kas, piutang, hutang, dan laporan keuangan.</li><li>Pengelolaan persediaan dan aset perusahaan.</li><li>Penerapan Standar Etika dan Karakter dalam pekerjaan sehari-hari.</li></ul>\n<h3 class=\"sec-head\">5. JADWAL DAN FREKUENSI AUDIT</h3>\n<p>Audit internal dilakukan secara berkala sesuai jadwal yang ditetapkan Penanggung Jawab Cabang atau Pemilik, dengan frekuensi lebih sering untuk area berisiko tinggi seperti kas dan persediaan.</p>\n<h3 class=\"sec-head\">6. TAHAPAN AUDIT</h3>\n<p><strong>Persiapan</strong></p>\n<p>Menentukan area yang akan diaudit dan menyiapkan daftar periksa (checklist) yang relevan.</p>\n<p><strong>Pelaksanaan</strong></p>\n<p>Memeriksa kesesuaian praktik kerja dengan SOP dan Standar L21 yang berlaku, mengumpulkan bukti pendukung.</p>\n<p><strong>Temuan</strong></p>\n<p>Mendokumentasikan hal-hal yang telah sesuai maupun yang belum sesuai standar.</p>\n<p><strong>Tindak Lanjut</strong></p>\n<p>Menyusun rencana perbaikan atas temuan, dengan penanggung jawab dan target waktu yang jelas.</p>\n<h3 class=\"sec-head\">7. PENANGGUNG JAWAB AUDIT</h3>\n<p>Audit dilaksanakan oleh Penanggung Jawab Cabang atau pihak yang ditugaskan oleh Pemilik, dan sedapat mungkin tidak diaudit oleh pihak yang bertanggung jawab langsung atas area yang sama, untuk menjaga objektivitas.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyediakan data dan mendukung proses audit dengan jujur;</li><li>menjalankan rencana perbaikan hasil audit.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>melaksanakan atau menugaskan audit sesuai jadwal;</li><li>memastikan temuan audit ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Audit dilaksanakan sesuai jadwal yang ditetapkan.</li><li>Temuan audit ditindaklanjuti dalam waktu yang wajar.</li><li>Jumlah temuan berulang menurun dari periode ke periode.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>Seluruh Standar L21 (setiap Standar memiliki bagian Audit tersendiri).</li><li>SL21-903 Standar Continuous Improvement.</li><li>SL21-905 Standar Evaluasi Tahunan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: jadwal audit, temuan, rencana tindak lanjut, dan status penyelesaiannya.</p>\n<h3 class=\"sec-head\">12. AUDIT (META)</h3>\n<p>Pelaksanaan audit internal itu sendiri ditinjau secara berkala agar tetap objektif, konsisten, dan benar-benar dijalankan sesuai jadwal.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Pola temuan dari audit menjadi masukan utama bagi SL21-903 Standar Continuous Improvement dalam menyempurnakan SOP dan Standar L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Audit internal yang konsisten menjaga agar seluruh sistem Lorongsatu21 benar-benar dijalankan sesuai standar, bukan hanya tertulis di atas kertas.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-903", "official_title": "Standar Continuous Improvement", "status": "ok", "note": "", "versions": [{"title": "STANDAR CONTINUOUS IMPROVEMENT", "meta": {"Kode Dokumen": "SL21-903", "Nama Dokumen": "Standar Perbaikan Berkelanjutan (Continuous Improvement)", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 mengelola perbaikan berkelanjutan secara menyeluruh, menjadi payung bagi bagian &quot;Perbaikan Berkelanjutan&quot; yang tercantum pada setiap Standar L21, agar setiap masukan benar-benar ditindaklanjuti menjadi perbaikan nyata.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Tidak ada sistem yang sempurna sejak awal — yang penting adalah terus diperbaiki.</li><li>Perbaikan kecil yang konsisten lebih berkelanjutan daripada perubahan besar yang jarang dilakukan.</li></ul>\n<p>Moto:</p>\n<p><strong>Sedikit demi Sedikit, Terus Menjadi Lebih Baik.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PERBAIKAN BERKELANJUTAN</h3>\n<ul><li>setiap Anggota Tim berhak mengusulkan perbaikan;</li><li>perbaikan didasarkan pada data dan pengalaman nyata, bukan sekadar opini;</li><li>perbaikan yang terbukti efektif distandarkan agar konsisten dijalankan.</li></ul>\n<h3 class=\"sec-head\">4. SUMBER PERBAIKAN</h3>\n<ul><li>Keluhan dan masukan pelanggan.</li><li>Hasil audit internal (SL21-902).</li><li>Hasil evaluasi kinerja Anggota Tim (SL21-208).</li><li>Ide dan usulan dari Anggota Tim di lapangan.</li><li>Hasil Evaluasi Tahunan (SL21-905).</li></ul>\n<h3 class=\"sec-head\">5. MEKANISME USUL PERBAIKAN</h3>\n<ul><li>Setiap Anggota Tim dapat menyampaikan usulan perbaikan kepada Penanggung Jawab Cabang, baik lisan maupun tertulis.</li><li>Usulan dicatat dan diberi tanggapan, meskipun tidak semua usulan langsung diterapkan.</li></ul>\n<h3 class=\"sec-head\">6. SIKLUS PERBAIKAN</h3>\n<p><strong>Identifikasi</strong></p>\n<p>Menemukan masalah atau peluang perbaikan dari sumber-sumber di atas.</p>\n<p><strong>Uji Coba</strong></p>\n<p>Mencoba solusi dalam skala kecil sebelum diterapkan secara luas.</p>\n<p><strong>Evaluasi</strong></p>\n<p>Menilai apakah solusi tersebut benar-benar memperbaiki masalah.</p>\n<p><strong>Standarkan</strong></p>\n<p>Solusi yang terbukti efektif dituangkan menjadi pembaruan SOP atau Standar L21 agar dijalankan secara konsisten oleh semua Anggota Tim.</p>\n<h3 class=\"sec-head\">7. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyampaikan usulan perbaikan berdasarkan pengalaman kerja;</li><li>menjalankan uji coba perbaikan sesuai arahan.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>menampung dan menindaklanjuti usulan perbaikan;</li><li>menyetujui pembaruan Standar L21 atau SOP hasil perbaikan.</li></ul>\n<h3 class=\"sec-head\">8. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Usulan perbaikan dari Anggota Tim mendapat tanggapan.</li><li>Standar L21 dan SOP diperbarui secara berkala berdasarkan pembelajaran nyata.</li><li>Masalah yang sama tidak terus berulang tanpa perbaikan.</li></ul>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-902 Standar Audit Internal.</li><li>SL21-905 Standar Evaluasi Tahunan.</li><li>Seluruh Standar L21 (setiap Standar memiliki bagian Perbaikan Berkelanjutan tersendiri).</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar usulan perbaikan, status tindak lanjut, dan perubahan Standar/SOP yang dihasilkan.</p>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan usulan perbaikan yang masuk ditindaklanjuti dan perubahan Standar/SOP terdokumentasi dengan baik.</p>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN (META)</h3>\n<p>Mekanisme perbaikan berkelanjutan ini sendiri dievaluasi secara berkala agar tetap mudah digunakan oleh seluruh Anggota Tim.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 tumbuh bukan karena sistemnya sempurna sejak awal, tetapi karena terus diperbaiki setiap kali ada kesempatan untuk menjadi lebih baik.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-904", "official_title": "Standar Manajemen Risiko", "status": "ok", "note": "", "versions": [{"title": "STANDAR MANAJEMEN RISIKO", "meta": {"Kode Dokumen": "SL21-904", "Nama Dokumen": "Standar Manajemen Risiko", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 mengenali, menilai, dan mengurangi risiko yang dapat mengganggu operasional, keuangan, atau reputasi perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Risiko tidak dapat dihilangkan sepenuhnya, tetapi dapat dikenali dan dikurangi dampaknya.</li><li>Mempersiapkan diri lebih baik daripada menyesal setelah masalah terjadi.</li></ul>\n<p>Moto:</p>\n<p><strong>Dikenali Lebih Awal. Dikurangi Dampaknya. Dihadapi dengan Siap.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>risiko diidentifikasi secara proaktif, tidak menunggu terjadi;</li><li>mitigasi disesuaikan dengan kemampuan perusahaan;</li><li>risiko besar dilaporkan segera kepada Pemilik.</li></ul>\n<h3 class=\"sec-head\">4. JENIS RISIKO</h3>\n<ul><li>Risiko operasional — kerusakan mesin utama, gangguan pasokan bahan baku.</li><li>Risiko keuangan — arus kas terganggu, piutang macet.</li><li>Risiko SDM — kehilangan Anggota Tim kunci, kekurangan tenaga kerja mendadak.</li><li>Risiko reputasi — keluhan pelanggan yang tidak tertangani, ulasan negatif.</li><li>Risiko bencana — kebakaran, bencana alam, gangguan keamanan.</li></ul>\n<h3 class=\"sec-head\">5. IDENTIFIKASI DAN PENILAIAN RISIKO</h3>\n<p>Risiko dinilai berdasarkan dua hal: seberapa besar kemungkinan terjadi, dan seberapa besar dampaknya terhadap Lorongsatu21 apabila terjadi. Risiko dengan kemungkinan dan dampak tinggi menjadi prioritas mitigasi utama.</p>\n<h3 class=\"sec-head\">6. MITIGASI RISIKO</h3>\n<ul><li>Risiko operasional — pemeliharaan rutin peralatan (SL21-509), diversifikasi pemasok penting.</li><li>Risiko keuangan — menjaga cadangan kas sesuai SL21-601 dan disiplin penagihan piutang (SL21-603).</li><li>Risiko SDM — pengembangan Level Kompetensi merata (SL21-204) agar tidak bergantung pada satu orang saja.</li><li>Risiko reputasi — penanganan keluhan yang cepat dan adil (SL21-302).</li></ul>\n<h3 class=\"sec-head\">7. PENANGANAN KRISIS / DARURAT</h3>\n<p>Untuk risiko besar seperti kebakaran, kerusakan total, atau bencana:</p>\n<ul><li>Keselamatan Anggota Tim dan pelanggan menjadi prioritas utama.</li><li>Kejadian dilaporkan segera kepada Penanggung Jawab Cabang dan Pemilik.</li><li>Langkah pemulihan dilakukan secepat mungkin agar operasional dapat berjalan kembali.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melaporkan potensi risiko yang terlihat di lapangan;</li><li>mengikuti prosedur darurat apabila terjadi kondisi krisis.</li></ul>\n<p><strong>Penanggung Jawab Cabang / Pemilik</strong></p>\n<ul><li>menilai dan memutuskan langkah mitigasi risiko;</li><li>memimpin penanganan saat kondisi darurat terjadi.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Risiko utama telah dikenali dan memiliki langkah mitigasi.</li><li>Dampak gangguan (bila terjadi) dapat ditangani tanpa menghentikan operasional dalam waktu lama.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-509 Standar Pemeliharaan Peralatan.</li><li>SL21-601 Standar Manajemen Kas.</li><li>SL21-603 Standar Manajemen Piutang.</li><li>SL21-302 Standar Penanganan Keluhan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: daftar risiko yang teridentifikasi, tingkat prioritas, langkah mitigasi, dan kejadian darurat (bila ada).</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan risiko utama telah dinilai dan langkah mitigasi benar-benar dijalankan, bukan hanya tercatat.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap kejadian risiko yang benar-benar terjadi menjadi bahan evaluasi untuk memperkuat langkah mitigasi berikutnya.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 yang siap menghadapi risiko adalah Lorongsatu21 yang mampu terus melayani pelanggan, bahkan saat menghadapi situasi yang tidak terduga.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-905", "official_title": "Standar Evaluasi Tahunan", "status": "ok", "note": "", "versions": [{"title": "STANDAR EVALUASI TAHUNAN", "meta": {"Kode Dokumen": "SL21-905", "Nama Dokumen": "Standar Evaluasi Tahunan", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara Lorongsatu21 melakukan evaluasi menyeluruh setiap tahun terhadap kinerja perusahaan, tim, dan penerapan Standar L21, sebagai dasar perencanaan tahun berikutnya.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Perusahaan yang bertumbuh meluangkan waktu untuk berhenti sejenak dan menilai perjalanannya.</li><li>Evaluasi tahunan menjadi titik refleksi sekaligus titik awal perencanaan berikutnya.</li></ul>\n<p>Moto:</p>\n<p><strong>Menutup Tahun dengan Refleksi. Membuka Tahun dengan Arah yang Jelas.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>evaluasi berdasarkan data sepanjang tahun, bukan kesan sesaat;</li><li>melibatkan sudut pandang Anggota Tim, tidak hanya Pemilik;</li><li>hasil evaluasi menjadi dasar nyata bagi rencana tahun berikutnya.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP EVALUASI TAHUNAN</h3>\n<ul><li>Capaian keuangan — omzet, laba, dan realisasi anggaran sepanjang tahun.</li><li>Kinerja tim — hasil evaluasi kinerja individu dan perkembangan Level Kompetensi.</li><li>Capaian KPI setiap unit dan setiap Standar L21 yang relevan.</li><li>Temuan audit internal sepanjang tahun dan status tindak lanjutnya.</li><li>Kemajuan rencana pengembangan perusahaan (Master Action Plan atau rencana strategis lain yang berlaku).</li></ul>\n<h3 class=\"sec-head\">5. TAHAPAN EVALUASI TAHUNAN</h3>\n<p><strong>Pengumpulan Data</strong></p>\n<p>Mengumpulkan laporan keuangan, hasil KPI, dan hasil audit sepanjang tahun.</p>\n<p><strong>Analisis</strong></p>\n<p>Membandingkan capaian dengan target yang ditetapkan di awal tahun.</p>\n<p><strong>Refleksi Bersama</strong></p>\n<p>Melibatkan Penanggung Jawab Cabang dan, sesuai kebutuhan, Anggota Tim untuk memberikan sudut pandang dari lapangan.</p>\n<p><strong>Perencanaan Tahun Berikutnya</strong></p>\n<p>Menetapkan target dan prioritas baru berdasarkan hasil evaluasi.</p>\n<h3 class=\"sec-head\">6. DOKUMEN HASIL EVALUASI</h3>\n<p>Hasil evaluasi tahunan dirangkum dalam laporan tahunan yang memuat capaian, kendala utama, dan rencana perbaikan tahun berikutnya.</p>\n<h3 class=\"sec-head\">7. TINDAK LANJUT HASIL EVALUASI</h3>\n<ul><li>Standar L21 atau SOP yang perlu diperbarui diajukan melalui SL21-903 Standar Continuous Improvement.</li><li>Target dan anggaran tahun berikutnya disesuaikan berdasarkan hasil evaluasi.</li><li>Rencana pengembangan perusahaan ditinjau dan disesuaikan sesuai capaian aktual.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyiapkan data dan laporan evaluasi unit masing-masing.</li></ul>\n<p><strong>Pemilik</strong></p>\n<ul><li>memimpin proses evaluasi tahunan;</li><li>menetapkan target dan prioritas tahun berikutnya.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Evaluasi tahunan dilaksanakan tepat waktu setiap tahun.</li><li>Hasil evaluasi menghasilkan target dan rencana yang jelas untuk tahun berikutnya.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-606 Standar Manajemen Laporan Keuangan.</li><li>SL21-208 Standar Evaluasi Kinerja.</li><li>SL21-902 Standar Audit Internal.</li><li>SL21-903 Standar Continuous Improvement.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat: laporan evaluasi tahunan, target tahun berjalan, dan realisasinya.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan evaluasi tahunan dilaksanakan sesuai jadwal dan hasilnya benar-benar ditindaklanjuti dalam perencanaan berikutnya.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Proses evaluasi tahunan itu sendiri disempurnakan setiap tahun agar semakin mudah dilakukan dan semakin bermanfaat bagi arah perusahaan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Evaluasi tahunan memastikan Lorongsatu21 tidak hanya sibuk bekerja, tetapi juga terus belajar dari perjalanan setiap tahunnya untuk bertumbuh lebih baik.</p>", "order": 9999, "no_formal_header": false}]}]}], "formulir": {"SL21-401": [{"code": "L-401.01", "title": "Lampiran SL21-401 — CHECKLIST PEMERIKSAAN HASIL FOTOKOPI L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap hasil fotokopi telah memenuhi Standar L21 sebelum diserahkan kepada pelanggan.</p>\n<p>Checklist dilakukan oleh Anggota Tim yang mengerjakan pesanan, dan dapat diperiksa ulang oleh Penanggung Jawab Cabang untuk pesanan tertentu sesuai kebutuhan.</p>\n<h3 class=\"sec
