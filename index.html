    html += `<div class="section-title">Masih Perlu Diselesaikan — Kode Duplikat</div><div class="gap-list">`;
    dups.forEach(gp=>{
      html += `<div class="gap-row" data-nav-code="${gp.code}"><span class="code">${esc(gp.code)}</span><span class="grp">${esc(gp.grp)}</span><span class="ttl">${esc(gp.ttl)} — 2 versi ditemukan, perlu dipilih salah satu</span></div>`;
    });
    html += `</div>`;
  } else if(!gaps.length){
    html += `<div class="note-box info" style="margin-top:-8px;">Tidak ada lagi kode duplikat — setiap Standar L21 kini punya satu versi resmi yang aktif.</div>`;
  }

  $content.innerHTML = html;

  $content.querySelectorAll('.kelompok-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      navigateTo('grp:'+c.dataset.gotoSec);
    });
  });
  $content.querySelectorAll('.gap-row').forEach(r=>{
    r.addEventListener('click', ()=>{
      navigateTo('kel:'+r.dataset.navCode);
    });
  });

  const bookBtn = document.getElementById('print-book-btn');
  if(bookBtn) bookBtn.addEventListener('click', buildAndPrintBook);
}

/* ---------------- Buku Arsip (print/PDF seluruh L21OS) ---------------- */
let bookBuilt = false;

function bookAnchorId(code){
  return 'sec-' + String(code).replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function bookSectionHtml(codeLabel, title, metaPairs, bodyHtml){
  let metaRow = (metaPairs||[]).map(([k,v])=>`<span class="pill">${esc(k)}: ${esc(v)}</span>`).join('');
  return `<div class="book-section" id="${bookAnchorId(codeLabel)}">
    <div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(codeLabel)}</div>
    <h1 class="doc-title">${esc(title)}</h1></div></div>
    <div class="doc-meta-row">${metaRow}</div>
    <div class="doc-body">${bodyHtml}</div>
  </div>`;
}

function buildBookHtml(){
  const today = new Date().toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric' });
  let html = `<div class="book-cover">
    <div class="bc-frame">
      <div class="bc-emblem">L21<span class="bc-os">OS</span></div>
      <div class="bc-rule"></div>
      <div class="bc-kicker">Lorongsatu21 Operating System</div>
      <div class="bc-title">Buku Arsip<br>Standar &amp; SOP</div>
      <div class="bc-motto">BERKARAKTER · BELAJAR · BERTUMBUH · BERMANFAAT</div>
      <div class="bc-rule small"></div>
      <div class="bc-meta">
        <div>${DATA.stats.ok} dari ${DATA.stats.total_official} Standar L21 Resmi</div>
        <div>Dicetak ${esc(today)}</div>
      </div>
    </div>
  </div>`;

  html += `<div class="book-toc"><div class="section-title">Daftar Isi</div>`;
  html += `<div class="toc-kelompok">Fondasi &amp; Tata Kelola</div>`;
  DATA.foundational.forEach(f=>{
    const v = f.versions[0];
    if(v) html += `<a class="toc-item" href="#${bookAnchorId(f.code)}">${esc(f.code)} — ${esc(v.title.split(' — ')[0])}</a>`;
  });
  DATA.meta.forEach(m=>{
    const codeLabel = m.code.split(' ')[0];
    html += `<a class="toc-item" href="#${bookAnchorId(codeLabel)}">${esc(codeLabel)} — ${esc(m.label.replace(/^SL21-\d+\s*—\s*/,''))}</a>`;
  });
  DATA.kelompok.forEach(g=>{
    html += `<div class="toc-kelompok">Kelompok ${g.key} — ${esc(g.name)}</div>`;
    g.items.forEach(it=>{
      if(it.status==='missing') return;
      html += `<a class="toc-item" href="#${bookAnchorId(it.code)}">${esc(it.code)} — ${esc(it.official_title)}</a>`;
    });
  });
  html += `</div>`;

  DATA.foundational.forEach(f=>{
    const v = f.versions[0];
    if(!v) return;
    html += bookSectionHtml(f.code, v.title, Object.entries(v.meta||{}).filter(([k])=>k!=='Kode Dokumen'), v.html);
  });
  DATA.meta.forEach(m=>{
    const v = m.versions[0];
    html += bookSectionHtml(v.meta['Kode Dokumen']||m.code, v.title, Object.entries(v.meta||{}).filter(([k])=>k!=='Kode Dokumen'), v.html);
  });
  DATA.kelompok.forEach(g=>{
    g.items.forEach(it=>{
      if(it.status==='missing') return;
      const v = it.versions[0];
      html += bookSectionHtml(it.code, v.title, Object.entries(v.meta||{}).filter(([k])=>k!=='Kode Dokumen'), v.html);
      const forms = DATA.formulir[it.code];
      if(forms && forms.length){
        forms.forEach(fm=>{
          html += bookSectionHtml(fm.meta['Kode Dokumen']||fm.code, fm.title, Object.entries(fm.meta||{}).filter(([k])=>k!=='Kode Dokumen'), fm.html);
        });
      }
    });
  });

  return html;
}

function buildAndPrintBook(){
  if(!bookBuilt){
    document.getElementById('book-container').innerHTML = buildBookHtml();
    bookBuilt = true;
  }
  document.body.classList.add('printing-book');
  window.print();
}

window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('printing-book');
});

/* ---------------- Router ---------------- */
function navigateTo(id){
  if(id==='cover'){
    setActiveNav('cover');
    location.hash = '#/cover';
    window.scrollTo(0,0);
    renderCover();
    return;
  }
  if(id==='home'){
    setActiveNav('home');
    location.hash = '';
    window.scrollTo(0,0);
    renderHome();
    return;
  }
  const entry = registry[id];
  if(!entry){ renderHome(); setActiveNav('home'); location.hash=''; return; }
  setActiveNav(id);
  location.hash = '#/'+encodeURIComponent(id);
  window.scrollTo(0,0);
  if(entry.type==='foundational') renderFoundational(entry.data);
  else if(entry.type==='meta') renderMeta(entry.data);
  else if(entry.type==='kelompok-item') renderKelompokItem(entry.data, entry.group);
  else if(entry.type==='kelompok-group') renderKelompokLanding(entry.data);
  else if(entry.type==='orphan') renderOrphan(entry.data);
  else if(entry.type==='formulir') renderFormulir(entry.data, entry.parent);
}

$content.addEventListener('click', (e)=>{
  const homeLink = e.target.closest('[data-home]');
  if(homeLink){ e.preventDefault(); renderHome(); setActiveNav('home'); location.hash=''; window.scrollTo(0,0); }
  const printBtn = e.target.closest('[data-print]');
  if(printBtn){ window.print(); }
  const navIdBtn = e.target.closest('[data-nav-id]');
  if(navIdBtn){ navigateTo(navIdBtn.dataset.navId); }
});

window.addEventListener('hashchange', ()=>{
  const h = location.hash;
  if(!h || h==='#'){ renderHome(); setActiveNav('home'); return; }
  const id = decodeURIComponent(h.replace('#/',''));
  navigateTo(id);
});

/* ---------------- Search ---------------- */
function stripTags(html){ return html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }

function buildSearchCorpus(){
  const items = [];
  DATA.foundational.forEach(f=>{
    f.versions.forEach(v=>items.push({id:'fnd:'+f.code, code:f.code, title:v.title, text: stripTags(v.html)}));
  });
  DATA.meta.forEach(m=>{
    m.versions.forEach(v=>items.push({id:'meta:'+m.code, code:m.code.split(' ')[0], title:v.title, text: stripTags(v.html)}));
  });
  DATA.kelompok.forEach(g=>{
    g.items.forEach(it=>{
      it.versions.forEach(v=>items.push({id:'kel:'+it.code, code:it.code, title:v.title, text: stripTags(v.html)}));
      if(it.status==='missing') items.push({id:'kel:'+it.code, code:it.code, title:it.official_title, text:'belum tersedia belum ditulis'});
    });
  });
  DATA.orphans.forEach(o=>{
    o.versions.forEach(v=>items.push({id:'orp:'+o.code, code:o.code, title:v.title, text: stripTags(v.html)}));
  });
  Object.keys(DATA.formulir).forEach(parent=>{
    DATA.formulir[parent].forEach(fm=>{
      items.push({id:'form:'+fm.code, code:fm.code, title:fm.title, text: stripTags(fm.html)});
    });
  });
  return items;
}
const searchCorpus = buildSearchCorpus();

function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ renderHome(); setActiveNav('home'); return; }
  const qWords = q.split(/\s+/);
  const scored = [];
  searchCorpus.forEach(item=>{
    const hay = (item.code+' '+item.title+' '+item.text).toLowerCase();
    let score = 0;
    qWords.forEach(w=>{
      if(item.code.toLowerCase().includes(w)) score += 8;
      if(item.title.toLowerCase().includes(w)) score += 5;
      if(item.text.toLowerCase().includes(w)) score += 1;
    });
    if(score>0) scored.push({item, score});
  });
  scored.sort((a,b)=>b.score-a.score);
  const top = scored.slice(0,30);

  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / Pencarian</div>
    <div class="hero"><h1 style="font-size:26px;">Hasil pencarian: "${esc(q)}"</h1></div>`;
  if(!top.length){
    html += `<div class="sr-empty">Tidak ditemukan hasil untuk "${esc(q)}".</div>`;
  } else {
    html += `<div class="search-results">`;
    top.forEach(({item})=>{
      const idx = item.text.toLowerCase().indexOf(qWords[0]);
      const snippet = idx>=0 ? '…'+item.text.substring(Math.max(0,idx-50), idx+90)+'…' : item.text.substring(0,120);
      html += `<div class="sr-item" data-nav="${item.id}">
        <div class="code">${esc(item.code)}</div>
        <div class="title">${esc(item.title)}</div>
        <div class="snippet">${esc(snippet)}</div>
      </div>`;
    });
    html += `</div>`;
  }
  $content.innerHTML = html;
  $content.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> navigateTo(el.dataset.nav));
  });
  $content.querySelectorAll('[data-home]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); $search.value=''; renderHome(); setActiveNav('home'); location.hash=''; });
  });
}

let searchDebounce;
$search.addEventListener('input', ()=>{
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>doSearch($search.value), 180);
});
