 akhir.</p>\n<p>↓</p>\n<p>Tahap 6</p>\n<p>Masa orientasi.</p>\n<p>↓</p>\n<p>Tahap 7</p>\n<p>Masa percobaan.</p>\n<p>↓</p>\n<p>Tahap 8</p>\n<p>Pengangkatan sebagai Anggota Tim.</p>\n<h3 class=\"sec-head\">6. MASA ORIENTASI</h3>\n<p>Pada hari pertama, calon Anggota Tim memperoleh:</p>\n<ul><li>Piagam Lorongsatu21.</li><li>Pengenalan budaya perusahaan.</li><li>Penjelasan nilai perusahaan.</li><li>Pengenalan L21OS.</li><li>Pengenalan Akademi L21.</li><li>Pengenalan Perpustakaan L21.</li><li>Penjelasan aturan dasar keselamatan dan pelayanan.</li></ul>\n<h3 class=\"sec-head\">7. MASA PERCOBAAN</h3>\n<p>Masa percobaan bertujuan menilai:</p>\n<ul><li>karakter;</li><li>kedisiplinan;</li><li>kemampuan belajar;</li><li>kemampuan bekerja sama;</li><li>kemampuan mengikuti standar perusahaan.</li></ul>\n<p>Kompetensi teknis belum menjadi penilaian utama pada tahap ini.</p>\n<h3 class=\"sec-head\">8. HASIL EVALUASI</h3>\n<p>Pada akhir masa percobaan, keputusan dapat berupa:</p>\n<ul><li>Diangkat menjadi Anggota Tim.</li><li>Masa percobaan diperpanjang dengan alasan yang jelas.</li><li>Tidak dilanjutkan apabila belum memenuhi standar karakter atau potensi belajar.</li></ul>\n<h3 class=\"sec-head\">9. PRINSIP PENGANGKATAN</h3>\n<p>Pengangkatan dilakukan berdasarkan hasil evaluasi yang objektif dan terdokumentasi.</p>\n<p>Tidak diperkenankan mengangkat Anggota Tim hanya berdasarkan hubungan keluarga, kedekatan pribadi, atau pertimbangan lain yang bertentangan dengan nilai Lorongsatu21.</p>\n<h3 class=\"sec-head\">10. DOKUMEN TERKAIT</h3>\n<ul><li>Formulir Lamaran.</li><li>Formulir Wawancara.</li><li>Formulir Penilaian Karakter.</li><li>Formulir Tes Dasar.</li><li>Formulir Masa Percobaan.</li><li>Formulir Pengangkatan.</li><li>Daftar Periksa Orientasi.</li></ul>\n<h3 class=\"sec-head\">11. INDIKATOR KEBERHASILAN</h3>\n<p>Rekrutmen dinilai berhasil apabila Anggota Tim baru:</p>\n<ul><li>memahami budaya Lorongsatu21;</li><li>menunjukkan karakter yang baik;</li><li>aktif belajar;</li><li>mampu bekerja sama;</li><li>menunjukkan perkembangan selama masa percobaan.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Rekrutmen merupakan gerbang utama budaya Lorongsatu21.</p>\n<p>Perusahaan lebih memilih seseorang yang berkarakter baik dan mau belajar daripada seseorang yang sangat terampil tetapi tidak sesuai dengan nilai-nilai perusahaan.</p>\n<p>Karena kami percaya:</p>\n<p><strong>Karakter membangun kepercayaan.</strong></p>\n<p><strong>Pembelajaran membangun kompetensi.</strong></p>\n<p><strong>Kontribusi membangun masa depan perusahaan.</strong></p>", "order": 5, "no_formal_header": false}]}, {"code": "SL21-202", "official_title": "Standar Orientasi", "status": "ok", "note": "", "versions": [{"title": "STANDAR ORIENTASI", "meta": {"Kode Dokumen": "SL21-202", "Nama Dokumen": "Standar Orientasi Anggota Tim Baru", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan proses orientasi bagi Anggota Tim baru dan peserta magang agar mereka memahami nilai, budaya, dan cara kerja Lorongsatu21 sejak hari pertama, sebelum memasuki Akademi L21 dan proses penilaian Level Kompetensi.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Kesan pertama menentukan seberapa cepat Anggota Tim baru merasa menjadi bagian dari Lorongsatu21.</li><li>Orientasi yang baik mengurangi kebingungan dan mempercepat kesiapan bekerja.</li><li>Anggota Tim baru berhak mendapat bimbingan, bukan dibiarkan belajar sendiri tanpa arah.</li></ul>\n<p>Moto:</p>\n<p><strong>Dikenalkan dengan Jelas. Dibimbing dengan Sabar. Disiapkan dengan Standar.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>Orientasi dilakukan terstruktur, tidak asal-asalan.</li><li>Setiap Anggota Tim baru memiliki pendamping yang jelas selama masa orientasi.</li><li>Orientasi mencakup nilai perusahaan, bukan hanya keterampilan teknis.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku bagi seluruh Anggota Tim baru yang telah dinyatakan lulus proses rekrutmen (SL21-201), termasuk peserta magang.</p>\n<h3 class=\"sec-head\">5. TAHAPAN ORIENTASI</h3>\n<p><strong>Hari Pertama</strong></p>\n<ul><li>Perkenalan dengan Pemilik, Penanggung Jawab Cabang, dan sesama Anggota Tim.</li><li>Pengenalan Piagam Lorongsatu21, nilai inti, dan Golden Rule.</li><li>Tur seluruh unit — Fotokopi, ATK, Percetakan, Foto, dan Pakaian — agar Anggota Tim baru memahami gambaran usaha secara utuh.</li><li>Penjelasan jam operasional, tata tertib dasar, dan kontak penting.</li></ul>\n<p><strong>Minggu Pertama</strong></p>\n<ul><li>Pendampingan langsung oleh mentor orientasi pada unit penempatan.</li><li>Pengenalan SOP dasar unit terkait dan penggunaan peralatan utama.</li><li>Pengenalan Akademi L21 sebagai jalur pembelajaran selanjutnya.</li></ul>\n<p><strong>Evaluasi Masa Orientasi</strong></p>\n<p>Pada akhir masa orientasi (paling lambat 30 hari sejak hari pertama, atau sesuai kebijakan perusahaan), Penanggung Jawab Cabang melakukan evaluasi awal kesiapan Anggota Tim untuk memasuki penilaian Level Kompetensi.</p>\n<h3 class=\"sec-head\">6. CHECKLIST ORIENTASI</h3>\n<p>Sebelum masa orientasi dinyatakan selesai, pastikan Anggota Tim baru telah:</p>\n<ul><li>memahami Piagam, nilai inti, dan Golden Rule Lorongsatu21;</li><li>mengenal seluruh unit dan rekan kerja utama;</li><li>memahami SOP dasar unit penempatan;</li><li>mengetahui cara melapor dan meminta bantuan bila menemui kendala;</li><li>terdaftar sebagai peserta Akademi L21.</li></ul>\n<h3 class=\"sec-head\">7. MENTOR ORIENTASI</h3>\n<p>Setiap Anggota Tim baru didampingi oleh mentor — Anggota Tim berpengalaman atau Penanggung Jawab Cabang — yang bertugas:</p>\n<ul><li>menjawab pertanyaan sehari-hari;</li><li>memberi umpan balik awal;</li><li>melaporkan perkembangan Anggota Tim baru kepada Penanggung Jawab Cabang.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim Baru</strong></p>\n<ul><li>aktif bertanya dan mempelajari SOP unit penempatan;</li><li>mengikuti seluruh tahapan orientasi.</li></ul>\n<p><strong>Mentor / Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan seluruh tahapan orientasi dijalankan;</li><li>memberikan bimbingan yang sabar dan jelas.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Anggota Tim baru memahami nilai dan cara kerja dasar Lorongsatu21 pada akhir masa orientasi.</li><li>Checklist orientasi terpenuhi seluruhnya.</li><li>Anggota Tim baru siap memasuki Akademi L21 dan penilaian Level Kompetensi.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-201 Standar Rekrutmen.</li><li>SL21-203 Standar Akademi L21.</li><li>SL21-001 Standar Karakter.</li><li>SL21-204 Standar Level Kompetensi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>tanggal mulai dan selesai orientasi;</li><li>nama mentor;</li><li>hasil checklist orientasi;</li><li>catatan evaluasi awal.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa setiap Anggota Tim baru menjalani proses orientasi sesuai standar sebelum ditempatkan bekerja secara mandiri.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan dari Anggota Tim baru dan mentor digunakan untuk menyempurnakan proses orientasi dan materi awal Akademi L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Orientasi yang baik adalah investasi awal Lorongsatu21 terhadap setiap Anggota Tim baru, agar mereka cepat berkontribusi dan merasa menjadi bagian dari perusahaan.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-203", "official_title": "Standar Akademi L21", "status": "ok", "note": "", "versions": [{"title": "AKADEMI L21", "meta": {"Kode Dokumen": "SL21-203", "Nama Dokumen": "Standar Akademi L21", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Akademi L21 adalah sistem pembelajaran internal Lorongsatu21 yang bertujuan untuk membentuk Anggota Tim yang:</p>\n<ul><li>Berkarakter.</li><li>Kompeten.</li><li>Mampu bekerja sesuai standar.</li><li>Mampu membimbing orang lain.</li><li>Siap menerima tanggung jawab yang lebih besar.</li><li>Memberikan manfaat bagi pelanggan, tim, dan perusahaan.</li></ul>\n<p>Akademi L21 merupakan satu-satunya jalur resmi pengembangan Anggota Tim di Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI AKADEMI L21</h3>\n<p>Kami percaya bahwa:</p>\n<ul><li>Semua orang dapat belajar.</li><li>Semua orang dapat berkembang.</li><li>Semua orang dapat mengajar.</li><li>Pembelajaran tidak pernah berhenti.</li></ul>\n<p>Moto Akademi L21:</p>\n<p><strong>Datang untuk Belajar. Bertumbuh dengan Berbagi. Pulang Membawa Manfaat.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PEMBELAJARAN</h3>\n<p>Akademi L21 menerapkan prinsip:</p>\n<ul><li>Belajar sambil bekerja.</li><li>Belajar dari praktik nyata.</li><li>Belajar dari mentor.</li><li>Belajar dari pelanggan.</li><li>Belajar dari kesalahan yang diperbaiki.</li><li>Belajar sepanjang waktu.</li></ul>\n<h3 class=\"sec-head\">4. KURIKULUM</h3>\n<p>Akademi L21 terdiri dari enam kelompok pembelajaran.</p>\n<h3 class=\"sec-head\">A. Karakter</h3>\n<ul><li>Integritas.</li><li>Disiplin.</li><li>Tanggung jawab.</li><li>Kerja sama.</li><li>Etika.</li></ul>\n<h3 class=\"sec-head\">B. Pelayanan</h3>\n<ul><li>Komunikasi.</li><li>Pelayanan pelanggan.</li><li>Penanganan keluhan.</li><li>Keramahan.</li><li>Penampilan.</li></ul>\n<h3 class=\"sec-head\">C. Kompetensi Teknis</h3>\n<ul><li>Fotokopi.</li><li>Print.</li><li>Percetakan.</li><li>Foto.</li><li>Desain.</li><li>Kasir.</li><li>Administrasi.</li><li>Komputer.</li><li>AI.</li></ul>\n<h3 class=\"sec-head\">D. Operasional</h3>\n<ul><li>SOP.</li><li>Keselamatan kerja.</li><li>Kebersihan.</li><li>Quality Control.</li><li>Efisiensi kerja.</li></ul>\n<h3 class=\"sec-head\">E. Kepemimpinan</h3>\n<ul><li>Membimbing.</li><li>Memberi umpan balik.</li><li>Menyelesaikan masalah.</li><li>Mengambil keputusan.</li><li>Mengembangkan tim.</li></ul>\n<h3 class=\"sec-head\">F. Pengembangan Diri</h3>\n<ul><li>Manajemen waktu.</li><li>Komunikasi.</li><li>Problem solving.</li><li>Berpikir sistem.</li><li>Continuous Improvement.</li></ul>\n<h3 class=\"sec-head\">5. METODE PEMBELAJARAN</h3>\n<p>Pembelajaran menggunakan model:</p>\n<p><strong>70% Praktik Langsung</strong></p>\n<p>Belajar melalui pekerjaan sehari-hari.</p>\n<p><strong>20% Mentoring</strong></p>\n<p>Belajar dari mentor atau Penanggung Jawab Cabang.</p>\n<p><strong>10% Pembelajaran Terstruktur</strong></p>\n<p>Belajar dari Akademi L21, Perpustakaan L21, video, modul, dan diskusi.</p>\n<h3 class=\"sec-head\">6. LEVEL PEMBELAJARAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Level</strong></th><th><strong>Fokus</strong></th></tr></thead><tbody><tr><td>L0</td><td>Peserta Akademi</td></tr><tr><td>L1</td><td>Pelaksana</td></tr><tr><td>L2</td><td>Pelaksana Mandiri</td></tr><tr><td>L3</td><td>Pembimbing</td></tr><tr><td>L4</td><td>Koordinator</td></tr><tr><td>L5</td><td>Pemimpin Operasional</td></tr></tbody></table></div>\n<p>Setiap level memiliki kurikulum, target kompetensi, dan evaluasi yang berbeda.</p>\n<h3 class=\"sec-head\">7. MENTOR</h3>\n<p>Setiap Peserta Akademi wajib memiliki mentor.</p>\n<p>Mentor bertugas:</p>\n<ul><li>memberi contoh;</li><li>membimbing praktik;</li><li>mengevaluasi perkembangan;</li><li>memberikan umpan balik;</li><li>membantu penyelesaian masalah.</li></ul>\n<p>Mentor dinilai dari perkembangan Anggota Tim yang dibimbing, bukan hanya dari hasil kerjanya sendiri.</p>\n<h3 class=\"sec-head\">8. EVALUASI</h3>\n<p>Evaluasi dilakukan secara berkala melalui:</p>\n<ul><li>observasi;</li><li>praktik;</li><li>diskusi;</li><li>studi kasus;</li><li>penilaian karakter;</li><li>penilaian kompetensi.</li></ul>\n<p>Penilaian menggunakan kategori:</p>\n<p>🟢 Lulus Kompetensi</p>\n<p>🟡 Perlu Pendampingan</p>\n<p>🔴 Belum Lulus Kompetensi</p>\n<h3 class=\"sec-head\">9. SERTIFIKASI</h3>\n<p>Setiap Anggota Tim yang memenuhi seluruh persyaratan level akan memperoleh Sertifikat Kompetensi Internal Lorongsatu21.</p>\n<p>Sertifikasi menjadi syarat untuk naik ke level berikutnya.</p>\n<h3 class=\"sec-head\">10. PUSAT PENGETAHUAN</h3>\n<p>Seluruh materi Akademi disimpan di Pusat Pengetahuan L21 dan dapat diakses melalui Perpustakaan L21.</p>\n<p>Materi meliputi:</p>\n<ul><li>Standar L21.</li><li>SOP.</li><li>Modul.</li><li>Video.</li><li>Template.</li><li>Studi kasus.</li><li>AI Prompt.</li><li>Hasil inovasi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>Level saat ini.</li><li>Kompetensi yang telah dikuasai.</li><li>Sertifikasi.</li><li>Mentor.</li><li>Riwayat pelatihan.</li><li>Riwayat evaluasi.</li><li>Riwayat penugasan.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit Akademi dilakukan dengan memastikan:</p>\n<ul><li>Kurikulum tersedia.</li><li>Mentor aktif.</li><li>Evaluasi terdokumentasi.</li><li>Sertifikasi sesuai standar.</li><li>Data pembelajaran lengkap.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Akademi L21 dievaluasi secara berkala.</p>\n<p>Materi, metode, dan kurikulum diperbarui berdasarkan:</p>\n<ul><li>kebutuhan pelanggan;</li><li>perkembangan teknologi;</li><li>hasil evaluasi;</li><li>pengalaman operasional;</li><li>masukan Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Akademi L21 merupakan pusat pembelajaran Lorongsatu21.</p>\n<p>Melalui Akademi L21, setiap Anggota Tim diharapkan tidak hanya menjadi lebih terampil dalam bekerja, tetapi juga bertumbuh sebagai pribadi yang berkarakter, mampu berbagi pengetahuan, dan siap mengembangkan Lorongsatu21 di masa depan.</p>\n<h3 class=\"sec-head\">STANDAR L21</h3>", "order": 6, "no_formal_header": false}]}, {"code": "SL21-204", "official_title": "Standar Level Kompetensi", "status": "ok", "note": "", "versions": [{"title": "LEVEL KOMPETENSI ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-204", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan sistem Level Kompetensi sebagai dasar pengembangan Anggota Tim Lorongsatu21.</p>\n<p>Level Kompetensi digunakan untuk mengukur perkembangan Anggota Tim berdasarkan karakter, kompetensi, kemampuan berbagi pengetahuan, dan kontribusi terhadap perusahaan.</p>\n<p>Level Kompetensi bukan merupakan jabatan, melainkan ukuran perkembangan seseorang.</p>\n<h3 class=\"sec-head\">2. PRINSIP</h3>\n<p>Lorongsatu21 menerapkan prinsip berikut:</p>\n<ul><li>Karakter lebih utama daripada kompetensi.</li><li>Kompetensi diperoleh melalui pembelajaran dan praktik.</li><li>Level menunjukkan perkembangan, bukan kedudukan.</li><li>Penugasan merupakan amanah yang diberikan sesuai kebutuhan perusahaan.</li><li>Setiap Anggota Tim memiliki kesempatan yang sama untuk berkembang.</li></ul>\n<h3 class=\"sec-head\">3. STRUKTUR LEVEL</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Level</strong></th><th><strong>Fokus Utama</strong></th></tr></thead><tbody><tr><td>L0</td><td>Peserta Akademi</td><td>Belajar budaya dan kompetensi dasar</td></tr><tr><td>L1</td><td>Pelaksana</td><td>Mampu menjalankan pekerjaan sesuai standar</td></tr><tr><td>L2</td><td>Pelaksana Mandiri</td><td>Mampu bekerja mandiri dan menjaga kualitas</td></tr><tr><td>L3</td><td>Pembimbing</td><td>Mampu membimbing Anggota Tim lain</td></tr><tr><td>L4</td><td>Koordinator</td><td>Mampu mengoordinasikan pekerjaan dan tim</td></tr><tr><td>L5</td><td>Pemimpin Operasional</td><td>Mampu memimpin operasional dan mengembangkan sistem</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">4. EMPAT PILAR PENILAIAN</h3>\n<p>Kenaikan Level ditentukan oleh empat pilar.</p>\n<h3 class=\"sec-head\">A. Karakter</h3>\n<p>Contoh indikator:</p>\n<ul><li>Integritas.</li><li>Disiplin.</li><li>Tanggung jawab.</li><li>Kerja sama.</li><li>Kepedulian.</li><li>Kemauan belajar.</li></ul>\n<p>Karakter merupakan syarat wajib pada setiap level.</p>\n<h3 class=\"sec-head\">B. Kompetensi</h3>\n<p>Kompetensi dinilai berdasarkan kelompok berikut:</p>\n<ul><li>Pelayanan.</li><li>Administrasi.</li><li>Produksi.</li><li>Desain &amp; Kreativitas.</li><li>Bisnis.</li><li>Kepemimpinan.</li><li>Teknologi.</li></ul>\n<p>Setiap kompetensi memiliki tingkat penguasaan:</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Nilai</strong></th><th><strong>Tingkat</strong></th></tr></thead><tbody><tr><td>0</td><td>Belum Belajar</td></tr><tr><td>1</td><td>Sedang Belajar</td></tr><tr><td>2</td><td>Mampu dengan Bimbingan</td></tr><tr><td>3</td><td>Mandiri</td></tr><tr><td>4</td><td>Mampu Mengajar</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. Kontribusi</h3>\n<p>Kontribusi diukur dari:</p>\n<ul><li>kualitas pekerjaan;</li><li>produktivitas;</li><li>penyelesaian tugas;</li><li>kepatuhan terhadap Standar L21;</li><li>perbaikan yang diusulkan;</li><li>kontribusi terhadap keberhasilan tim.</li></ul>\n<h3 class=\"sec-head\">D. Berbagi Pengetahuan</h3>\n<p>Anggota Tim didorong untuk:</p>\n<ul><li>membimbing rekan kerja;</li><li>membuat dokumentasi;</li><li>berbagi pengalaman;</li><li>membantu pembelajaran di Akademi L21.</li></ul>\n<p>Semakin tinggi level, semakin besar tanggung jawab berbagi pengetahuan.</p>\n<h3 class=\"sec-head\">5. PERSYARATAN KENAIKAN LEVEL</h3>\n<p>Kenaikan Level dilakukan apabila Anggota Tim:</p>\n<ul><li>memenuhi standar karakter;</li><li>memenuhi kompetensi inti pada level tersebut;</li><li>mencapai target poin kompetensi;</li><li>menunjukkan kontribusi yang konsisten;</li><li>lulus evaluasi Akademi L21.</li></ul>\n<p>Tidak ada kenaikan Level berdasarkan masa kerja semata.</p>\n<h3 class=\"sec-head\">6. PORTOFOLIO KOMPETENSI L21</h3>\n<p>Setiap Anggota Tim memiliki Portofolio Kompetensi yang berisi:</p>\n<ul><li>daftar kompetensi;</li><li>tingkat penguasaan;</li><li>sertifikasi;</li><li>mentor;</li><li>riwayat pembelajaran;</li><li>riwayat penugasan;</li><li>kontribusi sebagai mentor.</li></ul>\n<p>Portofolio Kompetensi menjadi dasar evaluasi dan pengembangan.</p>\n<h3 class=\"sec-head\">7. PENUGASAN</h3>\n<p>Level Kompetensi tidak menentukan penugasan secara otomatis.</p>\n<p>Penugasan diberikan berdasarkan:</p>\n<ul><li>Level Kompetensi;</li><li>kebutuhan operasional;</li><li>kesiapan individu;</li><li>hasil evaluasi.</li></ul>\n<p>Contoh:</p>\n<ul><li>Anggota Tim Level L4 dapat ditugaskan sebagai Penanggung Jawab Cabang.</li><li>Anggota Tim Level L3 dapat ditugaskan sebagai Pembimbing Akademi.</li></ul>\n<h3 class=\"sec-head\">8. HUBUNGAN DENGAN KOMPENSASI</h3>\n<p>Level Kompetensi menjadi dasar:</p>\n<ul><li>Gaji Dasar.</li><li>Tunjangan Kompetensi.</li></ul>\n<p>Penugasan menjadi dasar:</p>\n<ul><li>Tunjangan Penugasan.</li></ul>\n<p>Kontribusi menjadi dasar:</p>\n<ul><li>Bonus Kinerja.</li></ul>\n<p>Dengan demikian, kompensasi diberikan secara adil berdasarkan kemampuan, tanggung jawab, dan kontribusi.</p>\n<h3 class=\"sec-head\">9. EVALUASI</h3>\n<p>Evaluasi Level dilakukan secara berkala berdasarkan:</p>\n<ul><li>observasi;</li><li>praktik kerja;</li><li>hasil pembelajaran;</li><li>penilaian mentor;</li><li>penilaian Penanggung Jawab Cabang;</li><li>data dari Pusat Data L21.</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>Level saat ini;</li><li>riwayat level;</li><li>kompetensi yang dikuasai;</li><li>poin kompetensi;</li><li>sertifikasi;</li><li>penugasan;</li><li>evaluasi;</li><li>mentor.</li></ul>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>kenaikan level dilakukan sesuai standar;</li><li>seluruh bukti kompetensi terdokumentasi;</li><li>evaluasi dilakukan secara objektif;</li><li>Portofolio Kompetensi selalu diperbarui.</li></ul>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Standar ini dievaluasi secara berkala berdasarkan perkembangan bisnis, teknologi, dan kebutuhan pelanggan.</p>\n<p>Perubahan hanya dilakukan apabila membuat sistem menjadi lebih sederhana, lebih mudah diterapkan, dan lebih bermanfaat.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 percaya bahwa setiap Anggota Tim dapat berkembang melalui pembelajaran, praktik, dan kemauan untuk berbagi.</p>\n<p>Level Kompetensi bukan tujuan akhir, melainkan penanda perjalanan untuk terus belajar, bertumbuh, dan memberikan manfaat.</p>", "order": 11, "no_formal_header": false}]}, {"code": "SL21-205", "official_title": "Standar Penugasan", "status": "ok", "note": "", "versions": [{"title": "PENUGASAN ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-205", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan sistem penugasan Anggota Tim Lorongsatu21 agar setiap pekerjaan dijalankan oleh orang yang memiliki kompetensi, karakter, dan kesiapan yang sesuai.</p>\n<p>Penugasan merupakan amanah operasional yang dapat berubah sesuai kebutuhan perusahaan tanpa mengubah Level Kompetensi Anggota Tim.</p>\n<h3 class=\"sec-head\">2. PRINSIP</h3>\n<p>Lorongsatu21 menerapkan prinsip:</p>\n<ul><li>Penugasan adalah amanah, bukan status.</li><li>Level Kompetensi menunjukkan kemampuan, bukan jabatan.</li><li>Penugasan diberikan berdasarkan kebutuhan operasional.</li><li>Penugasan dapat berubah sewaktu-waktu dengan komunikasi yang baik.</li><li>Setiap penugasan menjadi kesempatan belajar dan bertumbuh.</li></ul>\n<h3 class=\"sec-head\">3. HUBUNGAN LEVEL DAN PENUGASAN</h3>\n<p>Level Kompetensi menjadi syarat minimum untuk menerima penugasan tertentu, namun tidak secara otomatis menentukan penugasan.</p>\n<p>Contoh:</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Level</strong></th><th><strong>Dapat Ditugaskan Sebagai</strong></th></tr></thead><tbody><tr><td>L0</td><td>Peserta Akademi</td></tr><tr><td>L1</td><td>Pelaksana Layanan</td></tr><tr><td>L2</td><td>Pelaksana Mandiri</td></tr><tr><td>L3</td><td>Pembimbing</td></tr><tr><td>L4</td><td>Koordinator Operasional</td></tr><tr><td>L5</td><td>Pemimpin Operasional / Penanggung Jawab Cabang</td></tr></tbody></table></div>\n<p>Perusahaan dapat menyesuaikan penugasan berdasarkan kebutuhan dan kesiapan individu.</p>\n<h3 class=\"sec-head\">4. JENIS PENUGASAN</h3>\n<h3 class=\"sec-head\">A. Penugasan Operasional</h3>\n<p>Contoh:</p>\n<ul><li>Pelayanan Pelanggan</li><li>Kasir</li><li>Fotokopi</li><li>Print</li><li>Produksi</li><li>Desain</li><li>Foto</li><li>Finishing</li><li>Gudang</li><li>Pengiriman</li></ul>\n<h3 class=\"sec-head\">B. Penugasan Pembelajaran</h3>\n<p>Contoh:</p>\n<ul><li>Mentor Akademi</li><li>Pembimbing Praktik</li><li>Penyusun Modul</li><li>Penguji Kompetensi</li></ul>\n<h3 class=\"sec-head\">C. Penugasan Manajerial</h3>\n<p>Contoh:</p>\n<ul><li>Koordinator Operasional</li><li>Penanggung Jawab Cabang</li><li>Koordinator Persediaan</li><li>Koordinator Keuangan</li><li>Koordinator Pelayanan</li></ul>\n<h3 class=\"sec-head\">D. Penugasan Pengembangan</h3>\n<p>Contoh:</p>\n<ul><li>Pengembang Standar L21</li><li>Pengembang SOP</li><li>Pengembang Pusat Pengetahuan</li><li>Pengembang AI L21</li><li>Tim Audit Internal</li></ul>\n<h3 class=\"sec-head\">5. PERSYARATAN PENUGASAN</h3>\n<p>Sebelum menerima penugasan, Anggota Tim harus memenuhi:</p>\n<ul><li>karakter sesuai Standar L21;</li><li>kompetensi minimum yang dipersyaratkan;</li><li>hasil evaluasi yang baik;</li><li>kesiapan menjalankan tanggung jawab.</li></ul>\n<h3 class=\"sec-head\">6. MASA PENUGASAN</h3>\n<p>Penugasan dapat bersifat:</p>\n<ul><li>Harian.</li><li>Mingguan.</li><li>Bulanan.</li><li>Proyek tertentu.</li><li>Jangka panjang.</li></ul>\n<p>Setiap penugasan memiliki awal, ruang lingkup, dan evaluasi yang jelas.</p>\n<h3 class=\"sec-head\">7. TANGGUNG JAWAB</h3>\n<p>Setiap penugasan wajib memiliki:</p>\n<ul><li>tujuan;</li><li>ruang lingkup;</li><li>wewenang;</li><li>tanggung jawab;</li><li>indikator keberhasilan.</li></ul>\n<p>Anggota Tim bertanggung jawab menyelesaikan penugasan sesuai Standar L21.</p>\n<h3 class=\"sec-head\">8. EVALUASI PENUGASAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>kualitas hasil kerja;</li><li>ketepatan waktu;</li><li>kepatuhan terhadap Standar L21;</li><li>kemampuan bekerja sama;</li><li>kemampuan menyelesaikan masalah;</li><li>umpan balik pelanggan dan tim.</li></ul>\n<p>Hasil evaluasi digunakan sebagai dasar pembinaan dan penugasan berikutnya.</p>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN KOMPENSASI</h3>\n<p>Penugasan dapat memberikan:</p>\n<ul><li>Tunjangan Penugasan (apabila ditetapkan perusahaan).</li><li>Tambahan bobot kontribusi dalam perhitungan bonus.</li></ul>\n<p>Berakhirnya penugasan tidak mengurangi Level Kompetensi Anggota Tim.</p>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>jenis penugasan;</li><li>tanggal mulai;</li><li>tanggal selesai;</li><li>penanggung jawab;</li><li>indikator keberhasilan;</li><li>hasil evaluasi.</li></ul>\n<p>Riwayat penugasan menjadi bagian dari Portofolio Kompetensi L21.</p>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>penugasan diberikan sesuai kompetensi;</li><li>tidak terjadi tumpang tindih tanggung jawab;</li><li>evaluasi dilakukan secara berkala;</li><li>seluruh penugasan terdokumentasi.</li></ul>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Perusahaan secara berkala meninjau efektivitas penugasan agar tetap sesuai dengan perkembangan bisnis, jumlah Anggota Tim, dan kebutuhan pelanggan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Penugasan di Lorongsatu21 merupakan bentuk kepercayaan yang diberikan kepada Anggota Tim berdasarkan karakter, kompetensi, dan kesiapan untuk memberikan kontribusi.</p>\n<p>Keberhasilan penugasan diukur dari manfaat yang diberikan kepada pelanggan, tim, dan perusahaan, bukan dari status atau jabatan semata.</p>", "order": 12, "no_formal_header": false}]}, {"code": "SL21-206", "official_title": "Standar Gaji", "status": "ok", "note": "", "versions": [{"title": "SISTEM GAJI ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-206", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem penggajian yang adil, sederhana, transparan, dan berkelanjutan berdasarkan kompetensi serta tanggung jawab Anggota Tim.</p>\n<p>Sistem gaji dirancang untuk mendukung pertumbuhan Anggota Tim sekaligus menjaga keberlanjutan perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 meyakini bahwa:</p>\n<ul><li>Gaji adalah penghargaan atas kompetensi dan tanggung jawab.</li><li>Bonus adalah penghargaan atas kontribusi.</li><li>Masa kerja tidak secara otomatis menentukan kenaikan gaji.</li><li>Kenaikan gaji diperoleh melalui peningkatan kompetensi dan kesiapan menerima tanggung jawab yang lebih besar.</li></ul>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Sistem gaji harus:</p>\n<ul><li>adil;</li><li>objektif;</li><li>mudah dipahami;</li><li>mudah dihitung;</li><li>mudah diaudit;</li><li>mampu mendorong pembelajaran.</li></ul>\n<h3 class=\"sec-head\">4. STRUKTUR GAJI</h3>\n<p>Gaji terdiri dari lima komponen.</p>\n<h3 class=\"sec-head\">A. Gaji Dasar</h3>\n<p>Ditetapkan berdasarkan Level Kompetensi.</p>\n<h3 class=\"sec-head\">B. Tunjangan Kompetensi</h3>\n<p>Diberikan berdasarkan kompetensi khusus yang telah lulus sertifikasi internal.</p>\n<p>Contoh:</p>\n<ul><li>Desain Grafis</li><li>AI</li><li>Operator Mesin Tertentu</li><li>Fotografi</li><li>Administrasi Keuangan</li></ul>\n<p>Besaran tunjangan ditetapkan dalam Kebijakan Kompensasi Perusahaan dan dapat ditinjau secara berkala.</p>\n<h3 class=\"sec-head\">C. Tunjangan Penugasan</h3>\n<p>Diberikan kepada Anggota Tim yang menerima penugasan tertentu.</p>\n<p>Contoh:</p>\n<ul><li>Penanggung Jawab Cabang</li><li>Koordinator Operasional</li><li>Mentor Akademi</li><li>Tim Audit</li></ul>\n<p>Tunjangan berakhir apabila penugasan berakhir.</p>\n<h3 class=\"sec-head\">D. Insentif</h3>\n<p>Diberikan untuk pekerjaan tertentu yang memiliki target operasional atau produktivitas sesuai kebijakan perusahaan.</p>\n<h3 class=\"sec-head\">E. Bonus</h3>\n<p>Diatur dalam Standar L21-207.</p>\n<p>Bonus bukan bagian dari gaji tetap.</p>\n<h3 class=\"sec-head\">5. LEVEL DAN GAJI DASAR</h3>\n<p>Perusahaan menetapkan rentang gaji untuk setiap Level Kompetensi.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Level</strong></th><th><strong>Gaji Dasar</strong></th></tr></thead><tbody><tr><td>L0</td><td>Mengacu pada kebijakan peserta Akademi</td></tr><tr><td>L1</td><td>Rentang Level 1</td></tr><tr><td>L2</td><td>Rentang Level 2</td></tr><tr><td>L3</td><td>Rentang Level 3</td></tr><tr><td>L4</td><td>Rentang Level 4</td></tr><tr><td>L5</td><td>Rentang Level 5</td></tr></tbody></table></div>\n<p>Besaran nominal ditetapkan dalam Kebijakan Kompensasi dan dapat disesuaikan berdasarkan kemampuan perusahaan.</p>\n<h3 class=\"sec-head\">6. KENAIKAN GAJI</h3>\n<p>Kenaikan gaji dapat dilakukan apabila:</p>\n<ul><li>naik Level Kompetensi;</li><li>memperoleh kompetensi baru yang ditetapkan memiliki tunjangan;</li><li>menerima penugasan baru;</li><li>terdapat penyesuaian kebijakan perusahaan.</li></ul>\n<p>Kenaikan gaji tidak diberikan hanya karena bertambahnya masa kerja.</p>\n<h3 class=\"sec-head\">7. PENYESUAIAN GAJI</h3>\n<p>Perusahaan dapat melakukan penyesuaian berdasarkan:</p>\n<ul><li>kemampuan keuangan perusahaan;</li><li>perubahan peraturan;</li><li>perubahan kondisi ekonomi;</li><li>evaluasi struktur gaji.</li></ul>\n<p>Penyesuaian dilakukan secara adil dan terdokumentasi.</p>\n<h3 class=\"sec-head\">8. TRANSPARANSI</h3>\n<p>Setiap Anggota Tim berhak mengetahui:</p>\n<ul><li>Level Kompetensinya;</li><li>komponen gajinya;</li><li>alasan kenaikan atau penyesuaian gaji.</li></ul>\n<p>Perusahaan tidak mewajibkan keterbukaan nominal gaji antar Anggota Tim.</p>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini terhubung dengan:</p>\n<ul><li>SL21-204 Level Kompetensi.</li><li>SL21-205 Penugasan.</li><li>SL21-207 Bonus.</li><li>SL21-208 Evaluasi.</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>Level Kompetensi;</li><li>komponen gaji;</li><li>tunjangan kompetensi;</li><li>tunjangan penugasan;</li><li>riwayat perubahan gaji;</li><li>tanggal berlaku.</li></ul>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh komponen gaji sesuai standar;</li><li>tidak ada pembayaran di luar ketentuan yang disetujui;</li><li>perubahan gaji terdokumentasi;</li><li>data gaji sesuai dengan Pusat Data L21.</li></ul>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Sistem gaji ditinjau secara berkala agar tetap:</p>\n<ul><li>adil;</li><li>kompetitif;</li><li>sesuai kemampuan perusahaan;</li><li>mendukung pengembangan Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 memberikan penghargaan kepada Anggota Tim berdasarkan kompetensi, tanggung jawab, dan pengembangan diri.</p>\n<p>Sistem gaji dirancang untuk mendorong pembelajaran sepanjang hayat, bukan sekadar mempertahankan masa kerja.</p>", "order": 13, "no_formal_header": false}]}, {"code": "SL21-207", "official_title": "Standar Bonus", "status": "ok", "note": "", "versions": [{"title": "SISTEM BONUS ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-207", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem bonus yang adil, transparan, dan berkelanjutan sebagai penghargaan atas kontribusi Anggota Tim terhadap keberhasilan Lorongsatu21.</p>\n<p>Bonus bertujuan mendorong kerja sama tim, peningkatan kinerja, dan pertumbuhan perusahaan secara berkelanjutan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 meyakini bahwa:</p>\n<ul><li>Bonus adalah penghargaan atas kontribusi.</li><li>Bonus bukan hak tetap.</li><li>Bonus dibayarkan apabila perusahaan mencapai hasil yang telah ditetapkan.</li><li>Semakin besar kontribusi, semakin besar bonus yang diterima.</li><li>Keberhasilan perusahaan adalah hasil kerja seluruh Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Sistem bonus harus:</p>\n<ul><li>adil;</li><li>objektif;</li><li>transparan;</li><li>mudah dihitung;</li><li>mudah diaudit;</li><li>mendukung kerja sama tim;</li><li>sesuai kemampuan keuangan perusahaan.</li></ul>\n<h3 class=\"sec-head\">4. SUMBER BONUS</h3>\n<p>Bonus berasal dari Bonus Perusahaan yang ditetapkan berdasarkan kebijakan perusahaan.</p>\n<p>Bonus Perusahaan dihitung dari laba, omzet, atau indikator lain yang telah ditetapkan dalam Kebijakan Bonus.</p>\n<p>Besaran Bonus Perusahaan tidak ditentukan dalam Standar ini, tetapi dalam Kebijakan Bonus Perusahaan.</p>\n<h3 class=\"sec-head\">5. STRUKTUR BONUS</h3>\n<p>Bonus dibagi menjadi tiga tingkat.</p>\n<h3 class=\"sec-head\">A. Bonus Perusahaan</h3>\n<p>Diberikan apabila target perusahaan tercapai.</p>\n<p>Seluruh Anggota Tim yang memenuhi syarat berhak mengikuti pembagian Bonus Perusahaan.</p>\n<h3 class=\"sec-head\">B. Bonus Cabang</h3>\n<p>Diberikan berdasarkan pencapaian cabang.</p>\n<p>Apabila perusahaan memiliki lebih dari satu cabang, Bonus Cabang dihitung sesuai kebijakan perusahaan.</p>\n<h3 class=\"sec-head\">C. Bonus Khusus</h3>\n<p>Dapat diberikan atas:</p>\n<ul><li>proyek tertentu;</li><li>inovasi;</li><li>efisiensi;</li><li>pencapaian luar biasa;</li><li>penghargaan khusus.</li></ul>\n<p>Bonus Khusus bersifat tidak tetap.</p>\n<h3 class=\"sec-head\">6. DASAR PERHITUNGAN BONUS</h3>\n<p>Besarnya bonus setiap Anggota Tim dihitung berdasarkan Bobot Bonus.</p>\n<p>Bobot Bonus terdiri dari:</p>\n<ul><li>Level Kompetensi.</li><li>Kontribusi Kinerja.</li><li>Penugasan.</li><li>Kehadiran dan Disiplin.</li></ul>\n<p>Perusahaan dapat menambahkan indikator lain sesuai kebutuhan.</p>\n<h3 class=\"sec-head\">7. BOBOT BONUS</h3>\n<p>Contoh komponen bobot:</p>\n<ul><li>Bobot Level Kompetensi.</li><li>Bobot Penugasan.</li><li>Bobot KPI.</li><li>Bobot Kontribusi Tim.</li><li>Bobot Karakter.</li></ul>\n<p>Besaran masing-masing bobot ditetapkan dalam Kebijakan Bonus.</p>\n<p>Standar ini tidak menetapkan angka agar tetap fleksibel.</p>\n<h3 class=\"sec-head\">8. PERSYARATAN MENERIMA BONUS</h3>\n<p>Anggota Tim berhak mengikuti pembagian bonus apabila:</p>\n<ul><li>berstatus aktif;</li><li>memenuhi standar karakter;</li><li>tidak sedang menjalani sanksi disiplin berat;</li><li>memenuhi syarat minimum evaluasi kinerja.</li></ul>\n<h3 class=\"sec-head\">9. PEMBAGIAN BONUS</h3>\n<p>Bonus dibagikan secara proporsional berdasarkan Bobot Bonus masing-masing Anggota Tim.</p>\n<p>Rumus perhitungan bonus ditetapkan dalam Kebijakan Bonus dan digunakan secara konsisten.</p>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini terhubung dengan:</p>\n<ul><li>SL21-204 Level Kompetensi.</li><li>SL21-205 Penugasan.</li><li>SL21-206 Sistem Gaji.</li><li>SL21-208 Evaluasi Kinerja.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>Bonus Perusahaan.</li><li>Bonus Cabang.</li><li>Bobot Bonus.</li><li>Nilai Bonus.</li><li>Tanggal Pembayaran.</li><li>Riwayat Bonus.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Bonus dihitung sesuai kebijakan.</li><li>Data pendukung lengkap.</li><li>Perhitungan dapat ditelusuri.</li><li>Pembayaran sesuai hasil perhitungan.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Sistem bonus ditinjau secara berkala agar tetap:</p>\n<ul><li>adil;</li><li>memotivasi;</li><li>sesuai kemampuan perusahaan;</li><li>mendukung tujuan jangka panjang Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 percaya bahwa bonus bukan sekadar penghargaan finansial, tetapi bentuk apresiasi atas kontribusi nyata terhadap keberhasilan bersama.</p>\n<p>Melalui sistem bonus yang objektif dan transparan, perusahaan mendorong setiap Anggota Tim untuk terus belajar, bertumbuh, bekerja sama, dan memberikan manfaat yang lebih besar bagi pelanggan, tim, dan perusahaan.</p>", "order": 14, "no_formal_header": false}]}, {"code": "SL21-208", "official_title": "Standar Evaluasi Kinerja", "status": "ok", "note": "", "versions": [{"title": "EVALUASI KINERJA ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-208", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem evaluasi kinerja yang objektif, adil, transparan, dan berorientasi pada pengembangan Anggota Tim.</p>\n<p>Evaluasi bertujuan untuk:</p>\n<ul><li>mengukur pencapaian kinerja;</li><li>memberikan umpan balik;</li><li>menentukan kebutuhan pembelajaran;</li><li>mendukung penugasan, kenaikan level, gaji, dan bonus.</li></ul>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa evaluasi bukan untuk mencari kesalahan, tetapi untuk menemukan peluang perbaikan.</p>\n<p>Setiap hasil evaluasi harus menghasilkan tindakan yang membantu Anggota Tim berkembang.</p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Evaluasi harus:</p>\n<ul><li>objektif;</li><li>berdasarkan data;</li><li>konsisten;</li><li>terdokumentasi;</li><li>dapat dijelaskan;</li><li>berorientasi pada solusi.</li></ul>\n<h3 class=\"sec-head\">4. WAKTU EVALUASI</h3>\n<p>Evaluasi dilakukan secara:</p>\n<ul><li>Harian (umpan balik singkat).</li><li>Bulanan (kinerja operasional).</li><li>Triwulanan (perkembangan kompetensi).</li><li>Tahunan (pengembangan dan perencanaan berikutnya).</li></ul>\n<h3 class=\"sec-head\">5. LIMA PILAR EVALUASI</h3>\n<h3 class=\"sec-head\">A. Karakter (30%)</h3>\n<p>Menilai:</p>\n<ul><li>integritas;</li><li>disiplin;</li><li>tanggung jawab;</li><li>kerja sama;</li><li>kepedulian;</li><li>kemauan belajar.</li></ul>\n<p>Karakter merupakan syarat utama dalam setiap evaluasi.</p>\n<h3 class=\"sec-head\">B. Kompetensi (25%)</h3>\n<p>Menilai:</p>\n<ul><li>penguasaan kompetensi;</li><li>kualitas pekerjaan;</li><li>kemampuan menerapkan Standar L21;</li><li>perkembangan kompetensi baru.</li></ul>\n<h3 class=\"sec-head\">C. Kontribusi (20%)</h3>\n<p>Menilai:</p>\n<ul><li>produktivitas;</li><li>penyelesaian pekerjaan;</li><li>kualitas hasil;</li><li>ide perbaikan;</li><li>kontribusi terhadap tim.</li></ul>\n<h3 class=\"sec-head\">D. Penugasan (15%)</h3>\n<p>Menilai:</p>\n<ul><li>pelaksanaan tanggung jawab;</li><li>kemampuan mengelola pekerjaan;</li><li>kemampuan menyelesaikan masalah;</li><li>kepatuhan terhadap target.</li></ul>\n<h3 class=\"sec-head\">E. Berbagi Pengetahuan (10%)</h3>\n<p>Menilai:</p>\n<ul><li>membimbing Anggota Tim lain;</li><li>berbagi pengalaman;</li><li>menyusun dokumentasi;</li><li>mendukung Akademi L21.</li></ul>\n<h3 class=\"sec-head\">6. HASIL EVALUASI</h3>\n<p>Hasil evaluasi dikelompokkan menjadi:</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kategori</strong></th><th><strong>Tindak Lanjut</strong></th></tr></thead><tbody><tr><td>Sangat Baik</td><td>Apresiasi dan pengembangan</td></tr><tr><td>Baik</td><td>Dipertahankan dan ditingkatkan</td></tr><tr><td>Cukup</td><td>Pembinaan terarah</td></tr><tr><td>Perlu Perbaikan</td><td>Program pembelajaran khusus</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">7. TINDAK LANJUT</h3>\n<p>Hasil evaluasi dapat menjadi dasar untuk:</p>\n<ul><li>penyusunan rencana pembelajaran;</li><li>kenaikan Level Kompetensi;</li><li>penugasan baru;</li><li>penyesuaian gaji;</li><li>perhitungan bonus;</li><li>penunjukan mentor;</li><li>pembinaan.</li></ul>\n<p>Evaluasi tidak digunakan sebagai satu-satunya dasar pengambilan keputusan.</p>\n<h3 class=\"sec-head\">8. UMPAN BALIK</h3>\n<p>Setiap Anggota Tim berhak memperoleh:</p>\n<ul><li>penjelasan hasil evaluasi;</li><li>contoh perilaku atau hasil kerja yang dinilai;</li><li>rencana pengembangan yang jelas.</li></ul>\n<p>Evaluasi dilakukan melalui dialog dua arah.</p>\n<h3 class=\"sec-head\">9. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>periode evaluasi;</li><li>nilai setiap pilar;</li><li>catatan evaluator;</li><li>rencana pengembangan;</li><li>tindak lanjut;</li><li>tanggal evaluasi.</li></ul>\n<p>Riwayat evaluasi menjadi bagian dari Portofolio Kompetensi L21.</p>\n<h3 class=\"sec-head\">10. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>evaluasi dilakukan tepat waktu;</li><li>penilaian memiliki bukti pendukung;</li><li>tindak lanjut benar-benar dilaksanakan;</li><li>hasil evaluasi terdokumentasi dengan baik.</li></ul>\n<h3 class=\"sec-head\">11. PERBAIKAN BERKELANJUTAN</h3>\n<p>Metode evaluasi ditinjau secara berkala berdasarkan:</p>\n<ul><li>perkembangan perusahaan;</li><li>kebutuhan pelanggan;</li><li>perkembangan kompetensi;</li><li>efektivitas sistem.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Evaluasi Kinerja di Lorongsatu21 merupakan sarana pembelajaran yang membantu setiap Anggota Tim bertumbuh melalui umpan balik, pembinaan, dan pengembangan yang berkelanjutan.</p>\n<p>Keberhasilan evaluasi tidak diukur dari banyaknya nilai yang diberikan, tetapi dari banyaknya perbaikan yang berhasil diwujudkan.</p>", "order": 15, "no_formal_header": false}]}, {"code": "SL21-209", "official_title": "Standar Sertifikasi", "status": "ok", "note": "", "versions": [{"title": "SERTIFIKASI KOMPETENSI ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-209", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem sertifikasi internal Lorongsatu21 sebagai pengakuan resmi atas kompetensi Anggota Tim.</p>\n<p>Sertifikasi memastikan bahwa setiap kompetensi yang diakui perusahaan telah dibuktikan melalui praktik kerja sesuai Standar L21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Sertifikat adalah bukti kompetensi, bukan bukti kehadiran.</li><li>Kompetensi harus dapat diterapkan secara nyata.</li><li>Sertifikasi menjadi bagian dari budaya belajar sepanjang hayat.</li></ul>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Sertifikasi harus:</p>\n<ul><li>objektif;</li><li>berdasarkan bukti;</li><li>transparan;</li><li>terdokumentasi;</li><li>dapat diaudit;</li><li>berlaku sama bagi seluruh Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">4. JENIS SERTIFIKASI</h3>\n<h3 class=\"sec-head\">A. Sertifikasi Kompetensi Dasar</h3>\n<p>Contoh:</p>\n<ul><li>Pelayanan Pelanggan</li><li>Kasir</li><li>Fotokopi</li><li>Print</li><li>Administrasi</li></ul>\n<h3 class=\"sec-head\">B. Sertifikasi Kompetensi Teknis</h3>\n<p>Contoh:</p>\n<ul><li>Desain Grafis</li><li>Percetakan</li><li>Fotografi</li><li>Pengoperasian Mesin</li><li>AI</li></ul>\n<h3 class=\"sec-head\">C. Sertifikasi Kepemimpinan</h3>\n<p>Contoh:</p>\n<ul><li>Mentor Akademi</li><li>Pembimbing</li><li>Koordinator</li><li>Penanggung Jawab Cabang</li></ul>\n<h3 class=\"sec-head\">D. Sertifikasi Pengembangan Sistem</h3>\n<p>Contoh:</p>\n<ul><li>Penyusun Standar L21</li><li>Penyusun SOP</li><li>Auditor Internal</li><li>Pengembang Pusat Pengetahuan</li></ul>\n<h3 class=\"sec-head\">5. PERSYARATAN SERTIFIKASI</h3>\n<p>Sebelum mengikuti sertifikasi, Anggota Tim harus:</p>\n<ul><li>memenuhi syarat karakter;</li><li>menyelesaikan pembelajaran yang dipersyaratkan;</li><li>memiliki bukti praktik;</li><li>memperoleh rekomendasi mentor (bila dipersyaratkan).</li></ul>\n<h3 class=\"sec-head\">6. METODE PENILAIAN</h3>\n<p>Sertifikasi dilakukan melalui kombinasi:</p>\n<ul><li>observasi praktik;</li><li>simulasi;</li><li>studi kasus;</li><li>wawancara;</li><li>pemeriksaan hasil kerja;</li><li>peninjauan Portofolio Kompetensi.</li></ul>\n<p>Tes teori dapat digunakan sebagai pendukung, tetapi bukan satu-satunya dasar kelulusan.</p>\n<h3 class=\"sec-head\">7. HASIL SERTIFIKASI</h3>\n<p>Hasil sertifikasi terdiri atas:</p>\n<ul><li><strong>Lulus</strong> → Kompetensi diakui.</li><li><strong>Belum Lulus</strong> → Diberikan umpan balik dan rencana pembelajaran sebelum mengikuti sertifikasi ulang.</li></ul>\n<p>Tidak digunakan istilah &quot;gagal&quot;. Fokus utama adalah pembelajaran.</p>\n<h3 class=\"sec-head\">8. MASA BERLAKU</h3>\n<p>Sebagian sertifikasi dapat berlaku tanpa batas selama kompetensi tetap digunakan dan dipertahankan.</p>\n<p>Sertifikasi tertentu dapat ditinjau ulang apabila:</p>\n<ul><li>teknologi berubah;</li><li>standar berubah;</li><li>kompetensi jarang digunakan;</li><li>perusahaan menetapkan evaluasi ulang.</li></ul>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN LEVEL KOMPETENSI</h3>\n<p>Sertifikasi menjadi salah satu syarat:</p>\n<ul><li>kenaikan Level Kompetensi;</li><li>penugasan tertentu;</li><li>tunjangan kompetensi;</li><li>pembimbingan Anggota Tim lain.</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>jenis sertifikasi;</li><li>tanggal sertifikasi;</li><li>asesor/penilai;</li><li>hasil;</li><li>masa berlaku (jika ada);</li><li>bukti pendukung.</li></ul>\n<p>Seluruh data menjadi bagian dari Portofolio Kompetensi L21.</p>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh sertifikasi memiliki bukti penilaian;</li><li>proses sertifikasi mengikuti Standar L21;</li><li>hasil terdokumentasi dengan baik;</li><li>tidak ada sertifikasi yang diberikan tanpa evaluasi kompetensi.</li></ul>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Program sertifikasi ditinjau secara berkala mengikuti:</p>\n<ul><li>perkembangan teknologi;</li><li>kebutuhan pelanggan;</li><li>perubahan Standar L21;</li><li>hasil evaluasi implementasi.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Sertifikasi Kompetensi merupakan bentuk pengakuan atas kemampuan nyata Anggota Tim dalam menerapkan Standar L21.</p>\n<p>Melalui sistem sertifikasi yang objektif dan konsisten, Lorongsatu21 membangun budaya belajar, berbagi, dan bertumbuh secara berkelanjutan.</p>", "order": 16, "no_formal_header": false}]}, {"code": "SL21-210", "official_title": "Standar Pengembangan Pemimpin", "status": "ok", "note": "", "versions": [{"title": "PENGEMBANGAN PEMIMPIN", "meta": {"Kode Dokumen": "SL21-210", "Versi": "1.1 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem pengembangan pemimpin di Lorongsatu21 agar perusahaan memiliki pemimpin yang berkarakter, kompeten, mampu mengembangkan orang lain, dan mampu menjaga keberlanjutan perusahaan.</p>\n<p>Pengembangan pemimpin merupakan proses berkelanjutan yang dimulai sejak Anggota Tim menunjukkan potensi kepemimpinan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Pemimpin adalah pelayan bagi tim dan pelanggan.</li><li>Pemimpin memberi teladan sebelum memberi arahan.</li><li>Pemimpin membangun sistem, bukan ketergantungan.</li><li>Pemimpin mengembangkan manusia sebelum mengembangkan bisnis.</li><li>Keberhasilan pemimpin diukur dari keberhasilan tim yang dipimpinnya.</li><li>Keberhasilan seorang pemimpin tidak diukur dari banyaknya bawahan, tetapi dari banyaknya pemimpin baru yang berhasil dikembangkannya.</li></ul>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap pemimpin harus:</p>\n<ul><li>menjaga karakter;</li><li>menguasai kompetensi yang dipersyaratkan;</li><li>membimbing Anggota Tim;</li><li>mengambil keputusan berdasarkan data;</li><li>menjaga budaya Lorongsatu21;</li><li>terus belajar dan berbagi;</li><li>mempersiapkan penerusnya.</li></ul>\n<h3 class=\"sec-head\">4. JALUR PENGEMBANGAN PEMIMPIN</h3>\n<p>Pengembangan dilakukan secara bertahap.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Tahap</strong></th><th><strong>Fokus</strong></th></tr></thead><tbody><tr><td>Calon Pembimbing</td><td>Membantu rekan kerja dan memberi contoh</td></tr><tr><td>Pembimbing</td><td>Melatih dan mengevaluasi Anggota Tim</td></tr><tr><td>Koordinator</td><td>Mengoordinasikan pekerjaan dan tim</td></tr><tr><td>Penanggung Jawab Cabang</td><td>Memimpin operasional cabang</td></tr><tr><td>Pengembang Sistem</td><td>Mengembangkan Standar L21, SOP, Akademi L21, dan Pusat Pengetahuan</td></tr></tbody></table></div>\n<p>Jalur ini merupakan pengembangan kompetensi, bukan jenjang jabatan yang bersifat tetap.</p>\n<h3 class=\"sec-head\">5. KOMPETENSI PEMIMPIN</h3>\n<p>Pemimpin Lorongsatu21 harus menguasai kompetensi berikut:</p>\n<h3 class=\"sec-head\">A. Karakter</h3>\n<ul><li>Integritas</li><li>Disiplin</li><li>Tanggung jawab</li><li>Keteladanan</li><li>Kepedulian</li></ul>\n<h3 class=\"sec-head\">B. Kepemimpinan</h3>\n<ul><li>Coaching</li><li>Mentoring</li><li>Delegasi</li><li>Motivasi</li><li>Pengambilan keputusan</li></ul>\n<h3 class=\"sec-head\">C. Manajemen Operasional</h3>\n<ul><li>Perencanaan kerja</li><li>Pengendalian mutu</li><li>Penyelesaian masalah</li><li>Pengelolaan risiko</li><li>Evaluasi operasional</li></ul>\n<h3 class=\"sec-head\">D. Pengembangan Sistem</h3>\n<ul><li>Standar L21</li><li>SOP</li><li>Continuous Improvement</li><li>Dokumentasi</li><li>Pusat Pengetahuan L21</li></ul>\n<h3 class=\"sec-head\">E. Pengembangan Manusia</h3>\n<ul><li>Mengembangkan kompetensi Anggota Tim</li><li>Memberikan umpan balik</li><li>Menyusun rencana pengembangan</li><li>Menyiapkan calon pemimpin baru</li></ul>\n<h3 class=\"sec-head\">6. TIGA TANGGUNG JAWAB UTAMA PEMIMPIN</h3>\n<p>Setiap pemimpin di Lorongsatu21 memiliki tiga tanggung jawab utama.</p>\n<h3 class=\"sec-head\">A. Mengembangkan Manusia</h3>\n<p>Pemimpin bertanggung jawab untuk:</p>\n<ul><li>membimbing Anggota Tim;</li><li>membantu peningkatan kompetensi;</li><li>menjadi teladan karakter;</li><li>membangun budaya belajar.</li></ul>\n<p>Keberhasilan diukur dari perkembangan Anggota Tim yang dibimbing.</p>\n<h3 class=\"sec-head\">B. Menjaga Sistem</h3>\n<p>Pemimpin bertanggung jawab untuk:</p>\n<ul><li>memastikan Standar L21 diterapkan;</li><li>memastikan SOP dijalankan;</li><li>menjaga kualitas pelayanan;</li><li>memperbaiki sistem apabila ditemukan peluang perbaikan.</li></ul>\n<p>Keberhasilan diukur dari konsistensi penerapan sistem.</p>\n<h3 class=\"sec-head\">C. Mengembangkan Perusahaan</h3>\n<p>Pemimpin bertanggung jawab untuk:</p>\n<ul><li>memberikan ide perbaikan;</li><li>mengembangkan layanan;</li><li>meningkatkan efisiensi;</li><li>menyiapkan calon pemimpin berikutnya.</li></ul>\n<p>Keberhasilan diukur dari manfaat yang dihasilkan bagi perusahaan.</p>\n<h3 class=\"sec-head\">7. PERSYARATAN MENJADI PEMIMPIN</h3>\n<p>Calon pemimpin harus:</p>\n<ul><li>memenuhi standar karakter;</li><li>memiliki Level Kompetensi yang dipersyaratkan;</li><li>lulus Sertifikasi Kepemimpinan;</li><li>memiliki rekam jejak pembimbingan yang baik;</li><li>menunjukkan kemampuan bekerja sama;</li><li>memperoleh hasil evaluasi yang memenuhi standar.</li></ul>\n<h3 class=\"sec-head\">8. METODE PENGEMBANGAN</h3>\n<p>Pengembangan dilakukan melalui:</p>\n<ul><li>praktik memimpin;</li><li>mentoring;</li><li>coaching;</li><li>rotasi penugasan;</li><li>proyek pengembangan;</li><li>pembelajaran di Akademi L21;</li><li>diskusi studi kasus;</li><li>evaluasi berkala.</li></ul>\n<p>Model pembelajaran mengikuti prinsip 70% praktik, 20% mentoring, dan 10% pembelajaran terstruktur.</p>\n<h3 class=\"sec-head\">9. EVALUASI PEMIMPIN</h3>\n<p>Pemimpin dievaluasi berdasarkan:</p>\n<ul><li>perkembangan Anggota Tim;</li><li>kualitas operasional;</li><li>kepuasan pelanggan;</li><li>kepatuhan terhadap Standar L21;</li><li>kemampuan menyelesaikan masalah;</li><li>kemampuan mengembangkan sistem;</li><li>keberhasilan menyiapkan calon pemimpin.</li></ul>\n<p>Evaluasi dilakukan secara berkala sebagai dasar pembinaan dan pengembangan.</p>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-203 Akademi L21;</li><li>SL21-204 Level Kompetensi;</li><li>SL21-205 Penugasan;</li><li>SL21-208 Evaluasi Kinerja;</li><li>SL21-209 Sertifikasi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>jalur pengembangan pemimpin;</li><li>riwayat pembimbingan;</li><li>proyek yang dipimpin;</li><li>hasil evaluasi;</li><li>sertifikasi kepemimpinan;</li><li>riwayat penugasan;</li><li>calon pemimpin yang berhasil dikembangkan.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>proses pengembangan pemimpin berjalan sesuai Standar L21;</li><li>calon pemimpin memenuhi persyaratan;</li><li>pembimbingan berjalan aktif;</li><li>evaluasi terdokumentasi;</li><li>suksesi kepemimpinan dipersiapkan secara berkelanjutan.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Program pengembangan pemimpin dievaluasi secara berkala berdasarkan:</p>\n<ul><li>kebutuhan perusahaan;</li><li>perkembangan bisnis;</li><li>hasil implementasi;</li><li>masukan Anggota Tim;</li><li>perkembangan ilmu kepemimpinan.</li></ul>\n<p>Perubahan dilakukan apabila mampu membuat sistem menjadi lebih sederhana, lebih mudah diterapkan, lebih mudah diukur, lebih mudah dikembangkan, dan lebih bermanfaat.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 membangun pemimpin yang berkarakter, kompeten, dan mampu mengembangkan manusia, menjaga sistem, serta mengembangkan perusahaan.</p>\n<p>Keberhasilan seorang pemimpin diukur dari kemampuan menciptakan manfaat yang berkelanjutan bagi pelanggan, Anggota Tim, perusahaan, dan masyarakat melalui lahirnya generasi pemimpin berikutnya.</p>", "order": 17, "no_formal_header": false}]}]}, {"key": "C", "name": "PELAYANAN", "items": [{"code": "SL21-301", "official_title": "Standar Pelayanan Pelanggan", "status": "ok", "note": "Sebelumnya ada 2 versi dengan kode yang sama (draf v1.0 dan versi Final). Draf v1.0 telah diarsipkan — lihat \"Dokumen di Luar Daftar Resmi\".", "versions": [{"title": "PELAYANAN PELANGGAN", "meta": {"Kode Dokumen": "SL21-301", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pelayanan pelanggan yang memberikan pengalaman terbaik melalui pelayanan yang ramah, cepat, tepat, profesional, dan dapat dipercaya.</p>\n<p>Pelayanan bertujuan membangun hubungan jangka panjang sehingga pelanggan merasa terbantu, puas, dan kembali menggunakan layanan Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Pelanggan adalah mitra yang mempercayakan kebutuhannya kepada kami.</li><li>Pelayanan dimulai dengan memahami kebutuhan pelanggan.</li><li>Solusi yang tepat lebih penting daripada sekadar menjual.</li><li>Kepercayaan pelanggan dibangun melalui kualitas yang konsisten.</li><li>Setiap pelayanan harus memberikan manfaat.</li></ul>\n<p>Moto Pelayanan:</p>\n<p><strong>Memahami Kebutuhan • Memberikan Solusi • Menghasilkan Kualitas • Membangun Kepercayaan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP PELAYANAN</h3>\n<p>Seluruh Anggota Tim wajib menerapkan lima prinsip berikut.</p>\n<p><strong>Ramah</strong></p>\n<p>Menyambut setiap pelanggan dengan sikap sopan, santun, dan penuh perhatian.</p>\n<p><strong>Cepat</strong></p>\n<p>Memberikan respons dan pelayanan tanpa penundaan yang tidak perlu.</p>\n<p><strong>Tepat</strong></p>\n<p>Memahami kebutuhan pelanggan dan menghasilkan pekerjaan sesuai pesanan.</p>\n<p><strong>Profesional</strong></p>\n<p>Bekerja sesuai Standar L21, menjaga kerahasiaan dokumen pelanggan, serta memberikan informasi yang jujur.</p>\n<p><strong>Bertanggung Jawab</strong></p>\n<p>Menyelesaikan pekerjaan hingga tuntas dan memberikan solusi apabila terjadi kesalahan.</p>\n<h3 class=\"sec-head\">4. SIKLUS PELAYANAN L21</h3>\n<p>Seluruh layanan mengikuti tujuh langkah berikut.</p>\n<h3 class=\"sec-head\">1. Sambut</h3>\n<p>Menyapa pelanggan dengan sopan dan penuh perhatian.</p>\n<h3 class=\"sec-head\">2. Pahami</h3>\n<p>Mendengarkan kebutuhan pelanggan dan melakukan konfirmasi.</p>\n<h3 class=\"sec-head\">3. Sarankan</h3>\n<p>Memberikan pilihan solusi terbaik sesuai kebutuhan, kualitas, waktu, dan anggaran pelanggan.</p>\n<h3 class=\"sec-head\">4. Kerjakan</h3>\n<p>Melaksanakan pekerjaan sesuai Standar L21 dan SOP layanan terkait.</p>\n<h3 class=\"sec-head\">5. Periksa</h3>\n<p>Memastikan hasil pekerjaan memenuhi standar kualitas sebelum diserahkan.</p>\n<h3 class=\"sec-head\">6. Serahkan</h3>\n<p>Menjelaskan hasil pekerjaan, biaya, dan memastikan pesanan diterima dengan benar.</p>\n<h3 class=\"sec-head\">7. Tindak Lanjut</h3>\n<p>Menangani pertanyaan, revisi, atau keluhan serta mengucapkan terima kasih kepada pelanggan.</p>\n<h3 class=\"sec-head\">5. STANDAR KOMUNIKASI</h3>\n<p>Dalam setiap pelayanan, Anggota Tim wajib:</p>\n<ul><li>menggunakan bahasa yang sopan;</li><li>mendengarkan tanpa memotong pembicaraan;</li><li>memberikan penjelasan yang jelas;</li><li>tidak berdebat dengan pelanggan;</li><li>menjaga kerahasiaan informasi pelanggan.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR PENAMPILAN</h3>\n<p>Anggota Tim wajib:</p>\n<ul><li>berpakaian bersih dan rapi;</li><li>menjaga kebersihan diri;</li><li>menjaga area pelayanan tetap bersih dan nyaman;</li><li>menunjukkan sikap profesional selama bekerja.</li></ul>\n<h3 class=\"sec-head\">7. PENANGANAN KELUHAN</h3>\n<p>Setiap keluhan ditangani dengan langkah berikut:</p>\n<ul><li>Dengarkan.</li><li>Pahami.</li><li>Minta maaf atas ketidaknyamanan.</li><li>Jelaskan solusi.</li><li>Selesaikan atau eskalasikan kepada Penanggung Jawab Cabang bila diperlukan.</li><li>Catat sebagai bahan perbaikan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memberikan pelayanan sesuai standar;</li><li>menjaga kualitas komunikasi;</li><li>menjaga nama baik Lorongsatu21.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>membimbing Anggota Tim;</li><li>memastikan standar diterapkan;</li><li>menyelesaikan kendala pelayanan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Pelayanan dinilai berhasil apabila:</p>\n<ul><li>pelanggan dilayani sesuai standar;</li><li>pesanan selesai sesuai kesepakatan;</li><li>keluhan terselesaikan;</li><li>pelanggan kembali menggunakan layanan;</li><li>pelanggan merekomendasikan Lorongsatu21 kepada orang lain.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-203 Akademi L21;</li><li>SL21-204 Level Kompetensi;</li><li>SL21-205 Penugasan;</li><li>SL21-302 Alur Pelayanan dan Proses Kerja;</li><li>seluruh Standar Operasional Produksi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>jumlah pelanggan;</li><li>jenis layanan;</li><li>waktu pelayanan;</li><li>keluhan;</li><li>penyelesaian keluhan;</li><li>umpan balik pelanggan.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh tahapan pelayanan dijalankan;</li><li>komunikasi sesuai standar;</li><li>area pelayanan bersih dan nyaman;</li><li>keluhan ditangani dengan baik;</li><li>data pelayanan tercatat.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap masukan pelanggan, hasil evaluasi, dan temuan audit menjadi dasar penyempurnaan pelayanan, SOP, Akademi L21, dan Pusat Pengetahuan L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pelayanan pelanggan di Lorongsatu21 bukan sekadar menyelesaikan transaksi, tetapi membangun hubungan jangka panjang melalui karakter, kompetensi, kualitas, dan kepercayaan.</p>\n<p>Setiap pelanggan yang datang harus pulang dengan membawa solusi, pengalaman yang baik, dan keyakinan untuk kembali menggunakan layanan Lorongsatu21.</p>", "order": 18, "no_formal_header": false}]}, {"code": "SL21-302", "official_title": "Standar Penanganan Keluhan", "status": "ok", "note": "", "versions": [{"title": "PENANGANAN KELUHAN PELANGGAN", "meta": {"Kode Dokumen": "SL21-302", "Versi": "1.1 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan sistem penanganan keluhan pelanggan yang cepat, adil, profesional, dan berorientasi pada solusi.</p>\n<p>Setiap keluhan dipandang sebagai kesempatan untuk memperbaiki pelayanan, meningkatkan kualitas, dan memperkuat kepercayaan pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Keluhan adalah masukan yang membantu perusahaan berkembang.</li><li>Pelanggan berhak didengar dan dihormati.</li><li>Setiap masalah harus diselesaikan dengan solusi, bukan dengan mencari siapa yang salah.</li><li>Setiap keluhan harus menghasilkan pembelajaran bagi perusahaan.</li></ul>\n<p>Moto Penanganan Keluhan:</p>\n<p><strong>Dengarkan • Pahami • Selesaikan • Pelajari • Perbaiki</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap penanganan keluhan harus:</p>\n<ul><li>cepat;</li><li>sopan;</li><li>objektif;</li><li>adil;</li><li>terdokumentasi;</li><li>menghasilkan perbaikan.</li></ul>\n<h3 class=\"sec-head\">4. JENIS KELUHAN</h3>\n<p>Keluhan dapat berkaitan dengan:</p>\n<ul><li>kualitas hasil pekerjaan;</li><li>kesalahan produksi;</li><li>keterlambatan penyelesaian;</li><li>pelayanan Anggota Tim;</li><li>harga atau tagihan;</li><li>kerusakan dokumen atau barang;</li><li>komunikasi;</li><li>fasilitas;</li><li>layanan lainnya.</li></ul>\n<h3 class=\"sec-head\">5. KATEGORI DAMPAK KELUHAN</h3>\n<p>Setiap keluhan wajib diklasifikasikan berdasarkan tingkat dampaknya.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kategori</strong></th><th><strong>Kriteria</strong></th><th><strong>Penanggung Jawab</strong></th><th><strong>Target Penyelesaian</strong></th></tr></thead><tbody><tr><td><strong>K1 – Ringan</strong></td><td>Kesalahan kecil yang dapat diperbaiki segera tanpa dampak berarti</td><td>Anggota Tim</td><td>Sesegera mungkin pada hari yang sama</td></tr><tr><td><strong>K2 – Sedang</strong></td><td>Memerlukan koordinasi, pengerjaan ulang, atau persetujuan tertentu</td><td>Anggota Tim bersama Penanggung Jawab Cabang</td><td>Sesuai estimasi yang disepakati dengan pelanggan</td></tr><tr><td><strong>K3 – Berat</strong></td><td>Berdampak besar terhadap pelanggan, kerugian, atau reputasi perusahaan</td><td>Penanggung Jawab Cabang</td><td>Ditangani dengan prioritas tertinggi dan dipantau hingga selesai</td></tr></tbody></table></div>\n<p>Kategori dampak digunakan untuk menentukan prioritas penanganan, eskalasi, dan evaluasi.</p>\n<h3 class=\"sec-head\">6. ALUR PENANGANAN KELUHAN</h3>\n<p>Seluruh keluhan ditangani melalui tujuh langkah berikut.</p>\n<p><strong>Langkah 1 – Terima</strong></p>\n<ul><li>Dengarkan tanpa menyela.</li><li>Bersikap tenang dan sopan.</li><li>Catat pokok permasalahan.</li></ul>\n<p><strong>Langkah 2 – Pahami</strong></p>\n<ul><li>Klarifikasi fakta.</li><li>Periksa data pesanan.</li><li>Tentukan kategori dampak (K1, K2, atau K3).</li><li>Pastikan akar masalah dipahami.</li></ul>\n<p><strong>Langkah 3 – Tunjukkan Empati</strong></p>\n<ul><li>Ucapkan terima kasih atas masukan pelanggan.</li><li>Sampaikan permohonan maaf atas ketidaknyamanan yang dialami pelanggan.</li><li>Hindari perdebatan.</li><li>Fokus pada penyelesaian.</li></ul>\n<p><strong>Langkah 4 – Berikan Solusi</strong></p>\n<p>Solusi dapat berupa:</p>\n<ul><li>perbaikan pekerjaan;</li><li>pengerjaan ulang sesuai ketentuan;</li><li>penyesuaian lain sesuai kebijakan perusahaan;</li><li>solusi lain yang disetujui Penanggung Jawab Cabang.</li></ul>\n<p><strong>Langkah 5 – Konfirmasi</strong></p>\n<p>Pastikan pelanggan memahami:</p>\n<ul><li>solusi yang diberikan;</li><li>waktu penyelesaian;</li><li>langkah berikutnya apabila diperlukan.</li></ul>\n<p><strong>Langkah 6 – Dokumentasikan</strong></p>\n<p>Catat:</p>\n<ul><li>nomor keluhan;</li><li>kategori dampak;</li><li>jenis keluhan;</li><li>penyebab;</li><li>tindakan penyelesaian;</li><li>penanggung jawab;</li><li>hasil akhir.</li></ul>\n<p><strong>Langkah 7 – Evaluasi</strong></p>\n<p>Gunakan setiap keluhan sebagai bahan:</p>\n<ul><li>perbaikan SOP;</li><li>pembelajaran Akademi L21;</li><li>pembaruan Pusat Pengetahuan L21;</li><li>peningkatan kualitas pelayanan.</li></ul>\n<h3 class=\"sec-head\">7. WEWENANG PENYELESAIAN</h3>\n<p><strong>Anggota Tim</strong></p>\n<p>Berwenang menangani keluhan kategori K1 sesuai SOP.</p>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<p>Menangani:</p>\n<ul><li>seluruh keluhan kategori K3;</li><li>keluhan K2 yang memerlukan keputusan;</li><li>keluhan yang berdampak pada reputasi perusahaan;</li><li>keluhan yang tidak dapat diselesaikan oleh Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menerima keluhan dengan baik;</li><li>mencatat informasi yang diperlukan;</li><li>mengklasifikasikan kategori dampak;</li><li>menjalankan solusi sesuai kewenangan;</li><li>melaporkan apabila diperlukan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan penyelesaian berjalan adil;</li><li>mengambil keputusan sesuai kebijakan;</li><li>mengevaluasi akar penyebab;</li><li>memastikan pembelajaran diterapkan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Penanganan keluhan dinilai berhasil apabila:</p>\n<ul><li>pelanggan memperoleh respons dengan cepat;</li><li>solusi dijalankan sesuai kesepakatan;</li><li>pelanggan memahami hasil penyelesaian;</li><li>penyebab terdokumentasi;</li><li>tindakan pencegahan diterapkan;</li><li>jumlah keluhan berulang menurun dari waktu ke waktu.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>Standar Alur Pelayanan dan Proses Kerja;</li><li>seluruh Standar Operasional Produksi;</li><li>SL21-208 Standar Evaluasi Kinerja.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor keluhan;</li><li>tanggal;</li><li>pelanggan;</li><li>jenis layanan;</li><li>kategori dampak;</li><li>penyebab;</li><li>tindakan penyelesaian;</li><li>penanggung jawab;</li><li>status penyelesaian;</li><li>tanggal selesai.</li></ul>\n<p>Data ini digunakan untuk analisis tren, evaluasi kualitas, dan perbaikan sistem.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh keluhan terdokumentasi;</li><li>kategori dampak ditetapkan dengan benar;</li><li>penyelesaian sesuai standar;</li><li>akar penyebab dianalisis;</li><li>tindakan pencegahan diterapkan;</li><li>tidak terjadi pengulangan tanpa tindak lanjut.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap keluhan menjadi bahan evaluasi bulanan.</p>\n<p>Keluhan yang berulang wajib dianalisis akar penyebabnya dan menghasilkan tindakan perbaikan terhadap Standar L21, SOP, pelatihan, atau proses kerja.</p>\n<p>Hasil analisis menjadi masukan bagi Akademi L21, Pusat Pengetahuan L21, dan penyempurnaan Pusat Data L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Lorongsatu21 memandang setiap keluhan sebagai kesempatan untuk memperbaiki kualitas pelayanan dan memperkuat kepercayaan pelanggan.</p>\n<p>Keberhasilan penanganan keluhan tidak hanya diukur dari selesainya masalah, tetapi juga dari kemampuan perusahaan mencegah masalah yang sama terjadi kembali melalui pembelajaran dan perbaikan yang berkelanjutan.</p>", "order": 19, "no_formal_header": false}]}, {"code": "SL21-303", "official_title": "Standar Melayani Pelanggan", "status": "ok", "note": "", "versions": [{"title": "MELAYANI PELANGGAN", "meta": {"Kode Dokumen": "SL21-303", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar dalam melayani pelanggan agar setiap kebutuhan pelanggan dipahami dengan benar, setiap pesanan diterima secara lengkap, dan setiap pelanggan memperoleh pengalaman pelayanan yang mudah, cepat, tepat, dan menyenangkan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap pelanggan datang membawa kebutuhan.</li><li>Tugas Anggota Tim adalah memahami kebutuhan tersebut.</li><li>Pelayanan yang baik dimulai dengan mendengarkan.</li><li>Solusi yang tepat membangun kepercayaan.</li><li>Pelayanan yang konsisten menghasilkan pelanggan yang kembali.</li></ul>\n<p>Moto:</p>\n<p><strong>Pahami • Bantu • Kerjakan • Serahkan • Bangun Kepercayaan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap Anggota Tim wajib:</p>\n<ul><li>mendengarkan sebelum menjelaskan;</li><li>membantu sebelum menawarkan;</li><li>memastikan sebelum mengerjakan;</li><li>bertanggung jawab sampai pekerjaan selesai;</li><li>menjaga kepercayaan pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh layanan Lorongsatu21, antara lain:</p>\n<ul><li>Fotokopi</li><li>Print</li><li>Percetakan</li><li>Desain</li><li>Foto</li><li>Laminasi</li><li>Jilid</li><li>Penjualan ATK</li><li>Produk dan jasa lainnya.</li></ul>\n<h3 class=\"sec-head\">5. ALUR MELAYANI PELANGGAN</h3>\n<p>Seluruh pelayanan mengikuti tujuh langkah berikut.</p>\n<p><strong>Langkah 1 – Sambut</strong></p>\n<ul><li>Menyapa pelanggan dengan sopan.</li><li>Memberikan perhatian penuh.</li><li>Menciptakan suasana yang ramah.</li></ul>\n<p><strong>Langkah 2 – Dengarkan</strong></p>\n<ul><li>Mendengarkan kebutuhan pelanggan tanpa menyela.</li><li>Memberikan kesempatan pelanggan menjelaskan kebutuhannya.</li></ul>\n<p><strong>Langkah 3 – Pahami</strong></p>\n<ul><li>Mengajukan pertanyaan bila diperlukan.</li><li>Mengonfirmasi spesifikasi pesanan.</li><li>Memastikan tidak ada informasi yang terlewat.</li></ul>\n<p><strong>Langkah 4 – Bantu</strong></p>\n<p>Memberikan bantuan berupa:</p>\n<ul><li>pilihan bahan;</li><li>ukuran;</li><li>finishing;</li><li>desain;</li><li>alternatif layanan;</li><li>estimasi waktu;</li><li>informasi biaya.</li></ul>\n<p>Rekomendasi diberikan sesuai kebutuhan pelanggan, bukan semata-mata untuk meningkatkan nilai transaksi.</p>\n<p><strong>Langkah 5 – Konfirmasi</strong></p>\n<p>Pastikan pelanggan menyetujui:</p>\n<ul><li>jenis layanan;</li><li>spesifikasi;</li><li>jumlah;</li><li>harga;</li><li>waktu penyelesaian.</li></ul>\n<p><strong>Langkah 6 – Catat</strong></p>\n<p>Pesanan dicatat secara lengkap sesuai prosedur agar dapat diproses dengan benar.</p>\n<p><strong>Langkah 7 – Serahkan ke Proses Produksi</strong></p>\n<p>Pesanan diteruskan kepada bagian atau Anggota Tim yang bertanggung jawab sesuai Standar Operasional yang berlaku.</p>\n<h3 class=\"sec-head\">6. STANDAR KOMUNIKASI</h3>\n<p>Selama melayani pelanggan, Anggota Tim wajib:</p>\n<ul><li>berbicara dengan sopan;</li><li>menggunakan bahasa yang mudah dipahami;</li><li>memberikan informasi yang benar;</li><li>tidak memberikan janji di luar kemampuan perusahaan;</li><li>menjaga kerahasiaan dokumen pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melayani pelanggan sesuai Standar L21;</li><li>memastikan data pesanan benar;</li><li>menyerahkan pesanan kepada proses berikutnya.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>membimbing Anggota Tim;</li><li>menangani pelayanan yang memerlukan keputusan khusus;</li><li>memastikan standar diterapkan secara konsisten.</li></ul>\n<h3 class=\"sec-head\">8. INDIKATOR KEBERHASILAN</h3>\n<p>Pelayanan dinilai berhasil apabila:</p>\n<ul><li>kebutuhan pelanggan dipahami dengan benar;</li><li>pesanan tercatat lengkap;</li><li>tidak terjadi kesalahan akibat informasi yang kurang;</li><li>pelanggan memahami harga dan waktu penyelesaian;</li><li>pelanggan merasa terbantu.</li></ul>\n<h3 class=\"sec-head\">9. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-302 Standar Penanganan Keluhan;</li><li>seluruh Standar Operasional Produksi;</li><li>Standar Evaluasi Kinerja.</li></ul>\n<h3 class=\"sec-head\">10. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>nama pelanggan;</li><li>jenis layanan;</li><li>spesifikasi pesanan;</li><li>estimasi selesai;</li><li>nama Anggota Tim yang melayani;</li><li>catatan khusus.</li></ul>\n<h3 class=\"sec-head\">11. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh tahapan pelayanan dijalankan;</li><li>data pesanan lengkap;</li><li>komunikasi sesuai standar;</li><li>tidak terjadi kesalahan akibat proses penerimaan pesanan.</li></ul>\n<h3 class=\"sec-head\">12. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan evaluasi operasional digunakan untuk memperbaiki cara melayani pelanggan, SOP, Akademi L21, dan Pusat Pengetahuan L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Melayani pelanggan di Lorongsatu21 berarti memahami kebutuhan, memberikan bantuan yang tepat, mencatat pesanan dengan benar, dan memastikan pelanggan memperoleh pengalaman pelayanan yang membangun kepercayaan.</p>\n<p>Setiap pelayanan merupakan kesempatan untuk menciptakan hubungan jangka panjang melalui karakter, kompetensi, dan kualitas kerja.</p>", "order": 20, "no_formal_header": false}]}, {"code": "SL21-304", "official_title": "Standar Komunikasi WhatsApp", "status": "ok", "note": "", "versions": [{"title": "KOMUNIKASI WHATSAPP", "meta": {"Kode Dokumen": "SL21-304", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar komunikasi melalui WhatsApp agar pelayanan kepada pelanggan berlangsung cepat, jelas, sopan, profesional, dan terdokumentasi dengan baik.</p>\n<p>Komunikasi WhatsApp menjadi bagian dari pelayanan pelanggan dan harus mencerminkan budaya Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap pesan pelanggan adalah bentuk kepercayaan.</li><li>Kecepatan harus diimbangi dengan ketepatan.</li><li>Bahasa yang sopan mencerminkan karakter perusahaan.</li><li>Informasi yang jelas mengurangi kesalahan.</li><li>Setiap komunikasi harus memberikan manfaat.</li></ul>\n<p>Moto:</p>\n<p><strong>Cepat Merespons • Jelas Menjelaskan • Tepat Memberikan Solusi</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Komunikasi melalui WhatsApp harus:</p>\n<ul><li>sopan;</li><li>jelas;</li><li>singkat;</li><li>akurat;</li><li>profesional;</li><li>menjaga kerahasiaan pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh komunikasi WhatsApp yang berkaitan dengan:</p>\n<ul><li>pertanyaan pelanggan;</li><li>konsultasi layanan;</li><li>permintaan penawaran;</li><li>pemesanan;</li><li>konfirmasi pesanan;</li><li>pemberitahuan progres;</li><li>pemberitahuan pesanan selesai;</li><li>penanganan keluhan;</li><li>tindak lanjut pelayanan.</li></ul>\n<h3 class=\"sec-head\">5. ALUR KOMUNIKASI</h3>\n<p><strong>Langkah 1 – Terima Pesan</strong></p>\n<ul><li>Membaca seluruh isi pesan.</li><li>Memahami kebutuhan pelanggan.</li></ul>\n<p><strong>Langkah 2 – Berikan Respons Awal</strong></p>\n<ul><li>Menyapa pelanggan dengan sopan.</li><li>Mengucapkan terima kasih atas pesan yang dikirim.</li><li>Memberikan informasi awal atau estimasi waktu apabila memerlukan pengecekan lebih lanjut.</li></ul>\n<p><strong>Langkah 3 – Pahami Kebutuhan</strong></p>\n<ul><li>Mengajukan pertanyaan apabila informasi belum lengkap.</li><li>Mengonfirmasi detail pesanan atau permintaan.</li></ul>\n<p><strong>Langkah 4 – Berikan Informasi</strong></p>\n<p>Sampaikan informasi mengenai:</p>\n<ul><li>layanan;</li><li>harga;</li><li>estimasi waktu;</li><li>spesifikasi;</li><li>syarat dan ketentuan bila diperlukan.</li></ul>\n<p><strong>Langkah 5 – Konfirmasi</strong></p>\n<p>Pastikan pelanggan memahami dan menyetujui informasi yang telah diberikan sebelum pesanan diproses.</p>\n<p><strong>Langkah 6 – Dokumentasikan</strong></p>\n<p>Apabila menjadi pesanan, data dicatat sesuai Standar Melayani Pelanggan.</p>\n<p><strong>Langkah 7 – Tindak Lanjut</strong></p>\n<p>Memberikan informasi apabila:</p>\n<ul><li>pesanan diproses;</li><li>pesanan selesai;</li><li>diperlukan konfirmasi tambahan;</li><li>terdapat kendala.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR PENULISAN</h3>\n<p>Setiap pesan harus:</p>\n<ul><li>menggunakan bahasa Indonesia yang baik dan mudah dipahami;</li><li>menggunakan sapaan yang sopan;</li><li>menghindari singkatan yang membingungkan;</li><li>menghindari penggunaan huruf kapital seluruhnya;</li><li>memeriksa kembali sebelum dikirim.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR WAKTU RESPONS</h3>\n<p>Target pelayanan:</p>\n<ul><li>pesan baru ditanggapi sesegera mungkin pada jam operasional;</li><li>apabila jawaban memerlukan pengecekan, pelanggan diberi informasi bahwa permintaan sedang diproses.</li></ul>\n<p>Perusahaan dapat menetapkan target waktu respons dalam Kebijakan Pelayanan.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>membalas pesan sesuai standar;</li><li>memberikan informasi yang benar;</li><li>menjaga etika komunikasi.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menangani komunikasi yang memerlukan keputusan;</li><li>memastikan kualitas pelayanan digital.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Komunikasi dinilai berhasil apabila:</p>\n<ul><li>pelanggan memperoleh respons;</li><li>informasi mudah dipahami;</li><li>tidak terjadi kesalahan akibat komunikasi;</li><li>pelanggan merasa terbantu;</li><li>komunikasi terdokumentasi dengan baik.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-302 Standar Penanganan Keluhan;</li><li>SL21-303 Standar Melayani Pelanggan;</li><li>Standar Operasional Produksi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pelanggan;</li><li>tanggal komunikasi;</li><li>jenis permintaan;</li><li>status komunikasi;</li><li>hasil komunikasi;</li><li>tindak lanjut.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>komunikasi dilakukan sesuai standar;</li><li>informasi yang diberikan benar;</li><li>pesan penting terdokumentasi;</li><li>tindak lanjut dilakukan.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan evaluasi komunikasi digunakan untuk meningkatkan kualitas pelayanan digital, materi Akademi L21, dan Pusat Pengetahuan L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Komunikasi WhatsApp merupakan bagian dari pelayanan pelanggan yang harus mencerminkan karakter, profesionalisme, dan kualitas Lorongsatu21.</p>\n<p>Setiap pesan yang diterima dan dikirim merupakan kesempatan untuk membangun kepercayaan, memberikan solusi, dan memperkuat hubungan jangka panjang dengan pelanggan.</p>\n<p><strong>Lampiran SL21-304</strong></p>\n<p><strong>Contoh Penerapan Lima Standar Pesan L21</strong></p>\n<h3 class=\"sec-head\">A. Salam</h3>\n<p>Tujuan: Membuka percakapan dengan ramah dan profesional.</p>\n<p><strong>Contoh:</strong></p>\n<ul><li>Selamat pagi, Bapak/Ibu. Terima kasih telah menghubungi Lorongsatu21. Ada yang bisa kami bantu?</li><li>Halo, Kak. Terima kasih sudah menghubungi Lorongsatu21. Silakan sampaikan kebutuhan Anda.</li><li>Selamat siang. Terima kasih atas pesannya. Kami siap membantu.</li></ul>\n<h3 class=\"sec-head\">B. Jelas</h3>\n<p>Tujuan: Menyampaikan informasi dengan bahasa yang sederhana dan mudah dipahami.</p>\n<p><strong>Contoh:</strong></p>\n<ul><li>Untuk banner ukuran 80 × 200 cm, tersedia bahan flexi standar dan premium.</li><li>Estimasi pengerjaan sekitar 2 jam setelah desain disetujui.</li><li>Dokumen dapat dikirim dalam format PDF agar hasil cetaknya lebih optimal.</li></ul>\n<p><strong>Hindari:</strong></p>\n<ul><li>Singkatan yang tidak dipahami pelanggan.</li><li>Penjelasan yang bertele-tele.</li><li>Istilah teknis tanpa penjelasan.</li></ul>\n<h3 class=\"sec-head\">C. Lengkap</h3>\n<p>Tujuan: Memberikan seluruh informasi penting agar pelanggan dapat mengambil keputusan dengan tepat.</p>\n<p><strong>Contoh:</strong></p>\n<p>Untuk cetak 100 lembar brosur A4 art paper 150 gsm full color satu sisi, biayanya Rp250.000. Estimasi selesai besok pukul 15.00. File mohon dikirim dalam format PDF agar hasil cetak lebih maksimal.</p>\n<p>Informasi minimal yang disampaikan:</p>\n<ul><li>Jenis layanan.</li><li>Spesifikasi.</li><li>Harga.</li><li>Estimasi waktu.</li><li>Persyaratan bila ada.</li></ul>\n<h3 class=\"sec-head\">D. Konfirmasi</h3>\n<p>Tujuan: Memastikan tidak terjadi kesalahan sebelum pesanan dipro
