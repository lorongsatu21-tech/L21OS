ses.</p>\n<p><strong>Contoh:</strong></p>\n<p>Baik, kami konfirmasi kembali:</p>\n<ul><li>Cetak banner ukuran 80 × 200 cm.</li><li>Bahan flexi premium.</li><li>Jumlah 2 buah.</li><li>Estimasi selesai besok pukul 10.00.</li><li>Total biaya Rp180.000.</li></ul>\n<p>Apakah data tersebut sudah benar dan dapat kami proses?</p>\n<p>Atau untuk layanan sederhana:</p>\n<p>Baik, Kak. Jadi yang dicetak 20 lembar hitam putih ukuran A4, benar ya?</p>\n<h3 class=\"sec-head\">E. Penutup</h3>\n<p>Tujuan: Mengakhiri percakapan dengan sopan serta membuka kesempatan untuk komunikasi lanjutan.</p>\n<p><strong>Contoh:</strong></p>\n<ul><li>Terima kasih telah mempercayakan kebutuhan cetak Anda kepada Lorongsatu21. Jika ada pertanyaan lain, silakan hubungi kami kapan saja pada jam operasional.</li><li>Terima kasih, pesanan Anda segera kami proses.</li><li>Terima kasih atas kepercayaannya. Semoga hasilnya sesuai harapan. Kami siap membantu kembali jika diperlukan.</li></ul>\n<p><strong>Contoh Percakapan Lengkap</strong></p>\n<p><strong>Pelanggan:</strong></p>\n<p>Halo, saya mau cetak banner.</p>\n<p><strong>Anggota Tim:</strong></p>\n<p>Selamat pagi, Bapak/Ibu. Terima kasih telah menghubungi Lorongsatu21. Ada yang bisa kami bantu?</p>\n<p><strong>Pelanggan:</strong></p>\n<p>Saya ingin cetak banner ukuran 80 × 200 cm.</p>\n<p><strong>Anggota Tim:</strong></p>\n<p>Baik. Apakah desainnya sudah tersedia? Untuk ukuran tersebut tersedia bahan flexi standar dan premium. Boleh kami bantu memilih yang paling sesuai dengan kebutuhan Anda?</p>\n<p><strong>Pelanggan:</strong></p>\n<p>Desain sudah ada. Saya pilih bahan premium.</p>\n<p><strong>Anggota Tim:</strong></p>\n<p>Baik. Untuk banner ukuran 80 × 200 cm dengan bahan flexi premium, biayanya Rp90.000 per buah. Estimasi selesai hari ini sekitar pukul 16.00.</p>\n<p>Kami konfirmasi kembali:</p>\n<ul><li>Banner 80 × 200 cm.</li><li>Flexi premium.</li><li>Jumlah 1 buah.</li><li>Total Rp90.000.</li><li>Estimasi selesai pukul 16.00 hari ini.</li></ul>\n<p>Apakah sudah sesuai dan dapat kami proses?</p>\n<p><strong>Pelanggan:</strong></p>\n<p>Ya, sudah benar.</p>\n<p><strong>Anggota Tim:</strong></p>\n<p>Terima kasih atas konfirmasinya. Pesanan segera kami proses. Kami akan menghubungi Bapak/Ibu apabila sudah selesai. Terima kasih telah mempercayakan kebutuhan percetakan kepada Lorongsatu21.</p>", "order": 21, "no_formal_header": false}]}, {"code": "SL21-305", "official_title": "Standar Layanan Google Business Profile", "status": "ok", "note": "", "versions": [{"title": "LAYANAN GOOGLE BUSINESS PROFILE", "meta": {"Kode Dokumen": "SL21-305", "Versi": "1.1 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan Google Business Profile (GBP) agar informasi Lorongsatu21 selalu akurat, lengkap, aktif, dan memberikan pelayanan terbaik kepada pelanggan yang mencari informasi melalui Google.</p>\n<p>Google Business Profile merupakan bagian dari pelayanan pelanggan dan citra perusahaan di dunia digital.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Google Business Profile adalah pintu masuk digital perusahaan.</li><li>Informasi yang benar membangun kepercayaan.</li><li>Respons yang cepat meningkatkan kepuasan pelanggan.</li><li>Ulasan pelanggan merupakan sumber pembelajaran dan perbaikan.</li></ul>\n<p>Moto:</p>\n<p><strong>Akurat • Aktif • Responsif • Terpercaya</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Pengelolaan Google Business Profile harus:</p>\n<ul><li>akurat;</li><li>lengkap;</li><li>mutakhir;</li><li>responsif;</li><li>profesional;</li><li>sesuai dengan identitas Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini meliputi:</p>\n<ul><li>informasi profil usaha;</li><li>jam operasional;</li><li>nomor telepon dan WhatsApp;</li><li>alamat dan lokasi;</li><li>foto dan video;</li><li>produk dan layanan;</li><li>posting informasi;</li><li>tanya jawab (Q&amp;A);</li><li>ulasan pelanggan;</li><li>pesan melalui Google (apabila fitur tersedia).</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PENGELOLAAN GBP L21</h3>\n<p>Seluruh Anggota Tim yang bertanggung jawab mengelola Google Business Profile wajib menerapkan lima standar berikut.</p>\n<h3 class=\"sec-head\">A. Profil Lengkap</h3>\n<p>Pastikan informasi berikut selalu benar dan terbaru:</p>\n<ul><li>nama usaha;</li><li>kategori usaha;</li><li>alamat;</li><li>titik lokasi;</li><li>jam operasional;</li><li>nomor telepon;</li><li>WhatsApp;</li><li>situs web (jika ada);</li><li>deskripsi usaha.</li></ul>\n<p><strong>Contoh Checklist:</strong></p>\n<div class=\"mark-list\"><p class=\"mark-line mark-ok\">✓ Nama usaha sesuai identitas Lorongsatu21.</p><p class=\"mark-line mark-ok\">✓ Jam operasional sudah diperbarui.</p><p class=\"mark-line mark-ok\">✓ Nomor WhatsApp aktif.</p><p class=\"mark-line mark-ok\">✓ Lokasi Google Maps sesuai.</p></div>\n<h3 class=\"sec-head\">B. Visual Berkualitas</h3>\n<p>Foto dan video harus:</p>\n<ul><li>menampilkan kondisi sebenarnya;</li><li>memiliki pencahayaan yang baik;</li><li>tidak buram;</li><li>mencerminkan pelayanan dan kualitas Lorongsatu21.</li></ul>\n<p>Jenis foto yang disarankan:</p>\n<ul><li>tampak depan toko;</li><li>area pelayanan;</li><li>area produksi;</li><li>mesin dan peralatan;</li><li>hasil cetak;</li><li>produk ATK;</li><li>aktivitas pelayanan;</li><li>tim Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">C. Respons Aktif</h3>\n<p>Seluruh pertanyaan, pesan, dan ulasan harus ditanggapi dengan:</p>\n<ul><li>sopan;</li><li>jelas;</li><li>membantu;</li><li>profesional.</li></ul>\n<p><strong>Contoh Balasan Ulasan Positif</strong></p>\n<p>Terima kasih atas ulasan dan kepercayaan Bapak/Ibu kepada Lorongsatu21. Kami senang dapat membantu. Semoga dapat melayani kembali di kesempatan berikutnya.</p>\n<p><strong>Contoh Balasan Ulasan yang Berisi Kritik</strong></p>\n<p>Terima kasih atas masukan yang diberikan. Mohon maaf atas ketidaknyamanan yang dialami. Masukan ini akan kami tindak lanjuti sebagai bahan perbaikan. Apabila berkenan, silakan menghubungi kami agar kami dapat membantu menyelesaikan permasalahan tersebut.</p>\n<h3 class=\"sec-head\">D. Konten Rutin</h3>\n<p>Google Business Profile diperbarui secara berkala dengan konten yang bermanfaat, antara lain:</p>\n<ul><li>produk baru;</li><li>layanan baru;</li><li>hasil pekerjaan;</li><li>edukasi pelanggan;</li><li>informasi jam operasional;</li><li>promo;</li><li>kegiatan perusahaan.</li></ul>\n<p>Konten harus:</p>\n<ul><li>sesuai fakta;</li><li>berkualitas baik;</li><li>bermanfaat bagi pelanggan;</li><li>mencerminkan identitas Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">E. Evaluasi Berkala</h3>\n<p>Secara berkala dilakukan evaluasi terhadap:</p>\n<ul><li>kelengkapan profil;</li><li>kualitas foto;</li><li>jumlah ulasan;</li><li>nilai rata-rata ulasan;</li><li>jumlah pertanyaan;</li><li>waktu respons;</li><li>performa posting.</li></ul>\n<p>Hasil evaluasi digunakan sebagai dasar peningkatan kualitas pelayanan digital.</p>\n<h3 class=\"sec-head\">6. STANDAR INFORMASI</h3>\n<p>Informasi yang ditampilkan wajib:</p>\n<ul><li>sesuai kondisi sebenarnya;</li><li>diperbarui apabila terjadi perubahan;</li><li>menggunakan nama usaha yang konsisten;</li><li>menggunakan deskripsi usaha yang jelas;</li><li>menampilkan kategori usaha yang tepat.</li></ul>\n<p>Tidak diperkenankan menampilkan informasi yang menyesatkan.</p>\n<h3 class=\"sec-head\">7. STANDAR FOTO DAN VIDEO</h3>\n<p>Foto dan video yang diunggah harus:</p>\n<ul><li>menampilkan kondisi sebenarnya;</li><li>berkualitas baik;</li><li>terang dan jelas;</li><li>mencerminkan layanan Lorongsatu21;</li><li>diperbarui secara berkala.</li></ul>\n<h3 class=\"sec-head\">8. STANDAR RESPONS</h3>\n<p>Seluruh pertanyaan, ulasan, atau pesan pelanggan harus:</p>\n<ul><li>dibaca secara berkala;</li><li>dijawab dengan sopan;</li><li>menggunakan bahasa yang jelas;</li><li>memberikan solusi apabila diperlukan.</li></ul>\n<p>Apabila membutuhkan pengecekan lebih lanjut, pelanggan diberi informasi bahwa permintaannya sedang diproses.</p>\n<h3 class=\"sec-head\">9. STANDAR ULASAN PELANGGAN</h3>\n<p>Lorongsatu21 mendorong pelanggan memberikan ulasan secara sukarela.</p>\n<p>Dalam menanggapi ulasan:</p>\n<ul><li>ucapkan terima kasih;</li><li>gunakan bahasa yang sopan;</li><li>jangan berdebat;</li><li>tanggapi kritik dengan solusi;</li><li>jadikan ulasan sebagai bahan evaluasi.</li></ul>\n<p>Perusahaan tidak diperkenankan membuat ulasan palsu atau meminta ulasan yang tidak sesuai dengan pengalaman pelanggan.</p>\n<h3 class=\"sec-head\">10. STANDAR POSTING</h3>\n<p>Informasi yang dipublikasikan harus:</p>\n<ul><li>benar;</li><li>relevan;</li><li>bermanfaat;</li><li>sesuai identitas perusahaan.</li></ul>\n<p>Jenis posting meliputi:</p>\n<ul><li>layanan baru;</li><li>produk unggulan;</li><li>promo;</li><li>edukasi;</li><li>kegiatan perusahaan;</li><li>informasi operasional.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim yang Ditugaskan</strong></p>\n<ul><li>memperbarui informasi;</li><li>mengunggah konten;</li><li>memantau ulasan dan pertanyaan;</li><li>memberikan respons sesuai standar;</li><li>melaporkan temuan penting.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan profil selalu akurat;</li><li>menyetujui perubahan penting;</li><li>mengevaluasi kualitas pengelolaan;</li><li>memastikan Lima Standar Pengelolaan GBP L21 diterapkan.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN</h3>\n<p>Pengelolaan Google Business Profile dinilai berhasil apabila:</p>\n<ul><li>profil selalu lengkap dan akurat;</li><li>foto serta video diperbarui secara berkala;</li><li>pertanyaan dan ulasan memperoleh respons;</li><li>pelanggan mudah menemukan informasi yang dibutuhkan;</li><li>jumlah ulasan positif dan kepuasan pelanggan meningkat.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-302 Standar Penanganan Keluhan;</li><li>SL21-304 Standar Komunikasi WhatsApp;</li><li>Standar Pemasaran dan Promosi.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>jumlah ulasan;</li><li>nilai rata-rata ulasan;</li><li>jumlah pertanyaan;</li><li>waktu respons;</li><li>jumlah posting;</li><li>pembaruan profil;</li><li>hasil evaluasi berkala.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Pengelolaan GBP L21 diterapkan;</li><li>informasi profil akurat;</li><li>foto dan video sesuai kondisi sebenarnya;</li><li>ulasan ditanggapi sesuai standar;</li><li>posting mengikuti identitas perusahaan;</li><li>tidak ada informasi yang kedaluwarsa.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan secara berkala berdasarkan:</p>\n<ul><li>masukan pelanggan;</li><li>hasil audit;</li><li>perkembangan fitur Google Business Profile;</li><li>kebutuhan pelanggan.</li></ul>\n<p>Setiap temuan menjadi dasar penyempurnaan pelayanan digital, materi Akademi L21, dan Pusat Pengetahuan L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Google Business Profile merupakan bagian dari pelayanan pelanggan yang memperkenalkan Lorongsatu21 kepada masyarakat.</p>\n<p>Melalui penerapan <strong>Lima Standar Pengelolaan GBP L21</strong>, Lorongsatu21 berkomitmen menjaga informasi yang akurat, komunikasi yang responsif, konten yang bermanfaat, dan pelayanan digital yang mampu membangun kepercayaan pelanggan sejak mereka menemukan Lorongsatu21 di Google hingga menjadi pelanggan setia.</p>", "order": 22, "no_formal_header": false}]}]}, {"key": "D", "name": "OPERASIONAL", "items": [{"code": "SL21-401", "official_title": "Standar Fotokopi", "status": "ok", "note": "", "versions": [{"title": "LAYANAN FOTOKOPI", "meta": {"Kode Dokumen": "SL21-401", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan fotokopi agar setiap dokumen pelanggan diproses dengan cepat, akurat, rapi, aman, dan sesuai permintaan pelanggan.</p>\n<p>Layanan fotokopi merupakan salah satu layanan utama Lorongsatu21 yang harus memberikan hasil berkualitas serta menjaga kepercayaan pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap dokumen pelanggan harus diperlakukan dengan hati-hati.</li><li>Ketelitian lebih penting daripada kecepatan.</li><li>Hasil yang rapi mencerminkan profesionalisme.</li><li>Ketepatan waktu membangun kepercayaan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Teliti • Cepat • Rapi • Tepat</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap layanan fotokopi harus:</p>\n<ul><li>sesuai permintaan pelanggan;</li><li>menjaga keamanan dokumen;</li><li>menghasilkan salinan yang jelas;</li><li>selesai sesuai estimasi waktu;</li><li>menjaga kebersihan dan kerapian hasil.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk:</p>\n<ul><li>fotokopi hitam putih;</li><li>fotokopi berwarna;</li><li>pembesaran;</li><li>pengecilan;</li><li>satu sisi;</li><li>dua sisi;</li><li>penggandaan dokumen;</li><li>layanan pendukung yang berkaitan.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN FOTOKOPI L21</h3>\n<p>Seluruh Anggota Tim wajib menerapkan lima standar berikut.</p>\n<h3 class=\"sec-head\">A. Dokumen Benar</h3>\n<p>Pastikan:</p>\n<ul><li>dokumen yang diterima sesuai dengan yang diminta pelanggan;</li><li>jumlah halaman lengkap;</li><li>tidak tertukar dengan dokumen pelanggan lain.</li></ul>\n<h3 class=\"sec-head\">B. Hasil Jelas</h3>\n<p>Pastikan hasil fotokopi:</p>\n<ul><li>tidak buram;</li><li>tidak terlalu gelap atau terlalu terang;</li><li>teks mudah dibaca;</li><li>gambar terlihat jelas.</li></ul>\n<h3 class=\"sec-head\">C. Hasil Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>posisi cetak lurus;</li><li>kertas tidak kusut;</li><li>tidak terdapat noda toner;</li><li>hasil tersusun rapi.</li></ul>\n<h3 class=\"sec-head\">D. Tepat Waktu</h3>\n<p>Pekerjaan diselesaikan sesuai estimasi yang telah disampaikan kepada pelanggan.</p>\n<p>Apabila terjadi kendala, pelanggan diberi informasi secepatnya.</p>\n<h3 class=\"sec-head\">E. Dokumen Aman</h3>\n<p>Seluruh dokumen pelanggan wajib:</p>\n<ul><li>dijaga kerahasiaannya;</li><li>tidak difotokopi untuk kepentingan lain;</li><li>tidak ditinggalkan tanpa pengawasan;</li><li>dikembalikan dalam kondisi baik.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN FOTOKOPI</h3>\n<p><strong>Langkah 1 – Terima Dokumen</strong></p>\n<ul><li>Periksa jumlah halaman.</li><li>Konfirmasi kebutuhan pelanggan.</li><li>Periksa kondisi dokumen.</li></ul>\n<p><strong>Langkah 2 – Siapkan Mesin</strong></p>\n<ul><li>Pastikan mesin siap digunakan.</li><li>Periksa kertas.</li><li>Periksa toner.</li><li>Periksa pengaturan ukuran.</li></ul>\n<p><strong>Langkah 3 – Lakukan Fotokopi</strong></p>\n<ul><li>Gunakan pengaturan sesuai permintaan.</li><li>Awasi proses.</li><li>Hentikan apabila terjadi kesalahan.</li></ul>\n<p><strong>Langkah 4 – Pemeriksaan Hasil</strong></p>\n<p>Periksa:</p>\n<ul><li>jumlah;</li><li>kualitas;</li><li>urutan halaman;</li><li>posisi cetak;</li><li>kebersihan hasil.</li></ul>\n<p><strong>Langkah 5 – Serahkan</strong></p>\n<ul><li>Susun hasil dengan rapi.</li><li>Kembalikan dokumen asli.</li><li>Pastikan pelanggan menerima hasil sesuai pesanan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Hasil fotokopi harus memenuhi kriteria berikut:</p>\n<ul><li>isi terbaca dengan jelas;</li><li>ukuran sesuai;</li><li>tidak terpotong;</li><li>tidak miring;</li><li>tidak terdapat bayangan yang mengganggu;</li><li>jumlah sesuai pesanan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memproses fotokopi sesuai standar;</li><li>menjaga mesin tetap bersih;</li><li>menjaga dokumen pelanggan;</li><li>melaporkan kendala mesin.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kualitas layanan;</li><li>memastikan mesin dalam kondisi baik;</li><li>melakukan evaluasi berkala.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan dinilai berhasil apabila:</p>\n<ul><li>hasil sesuai pesanan;</li><li>kesalahan fotokopi sangat rendah;</li><li>dokumen pelanggan tetap aman;</li><li>pekerjaan selesai tepat waktu;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-303 Standar Melayani Pelanggan;</li><li>Standar Quality Control;</li><li>Standar Pemeliharaan Mesin.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis layanan;</li><li>jumlah lembar;</li><li>operator;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>kendala (jika ada).</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Fotokopi L21 diterapkan;</li><li>hasil memenuhi standar kualitas;</li><li>mesin dirawat sesuai jadwal;</li><li>dokumen pelanggan aman;</li><li>kesalahan dianalisis dan ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan data operasional digunakan untuk meningkatkan kualitas layanan, efisiensi proses, kompetensi Anggota Tim, dan keandalan peralatan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan fotokopi di Lorongsatu21 merupakan bentuk kepercayaan yang diberikan pelanggan kepada perusahaan.</p>\n<p>Setiap dokumen diproses dengan ketelitian, tanggung jawab, dan profesionalisme agar menghasilkan salinan yang jelas, rapi, tepat waktu, serta menjaga keamanan dokumen pelanggan.</p>", "order": 23, "no_formal_header": false}]}, {"code": "SL21-402", "official_title": "Standar Print", "status": "ok", "note": "", "versions": [{"title": "LAYANAN PRINT", "meta": {"Kode Dokumen": "SL21-402", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan print agar setiap file pelanggan dicetak dengan benar, sesuai spesifikasi, berkualitas, tepat waktu, serta menjaga keamanan data pelanggan.</p>\n<p>Layanan print merupakan bagian dari layanan utama Lorongsatu21 yang menghubungkan dokumen digital menjadi hasil cetak yang siap digunakan pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>File pelanggan adalah amanah yang harus dijaga.</li><li>Ketelitian lebih penting daripada kecepatan.</li><li>Hasil cetak harus sesuai dengan file yang disetujui pelanggan.</li><li>Kualitas yang konsisten membangun kepercayaan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Benar • Jelas • Rapi • Tepat</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap layanan print harus:</p>\n<ul><li>sesuai file pelanggan;</li><li>sesuai spesifikasi pesanan;</li><li>menggunakan media yang tepat;</li><li>menghasilkan cetakan berkualitas;</li><li>menjaga keamanan file pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk:</p>\n<ul><li>print hitam putih;</li><li>print berwarna;</li><li>print satu sisi;</li><li>print dua sisi;</li><li>dokumen;</li><li>presentasi;</li><li>formulir;</li><li>brosur sederhana;</li><li>file PDF;</li><li>file Microsoft Office;</li><li>file gambar;</li><li>layanan print lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN PRINT L21</h3>\n<p>Seluruh Anggota Tim wajib menerapkan lima standar berikut.</p>\n<h3 class=\"sec-head\">A. File Benar</h3>\n<p>Pastikan:</p>\n<ul><li>file yang dicetak adalah file yang benar;</li><li>versi file sesuai persetujuan pelanggan;</li><li>file dapat dibuka dengan baik;</li><li>tidak ada halaman yang rusak atau hilang.</li></ul>\n<h3 class=\"sec-head\">B. Pengaturan Benar</h3>\n<p>Pastikan pengaturan sesuai pesanan:</p>\n<ul><li>ukuran kertas;</li><li>orientasi;</li><li>warna atau hitam putih;</li><li>satu sisi atau dua sisi;</li><li>jumlah salinan;</li><li>skala cetak.</li></ul>\n<h3 class=\"sec-head\">C. Hasil Berkualitas</h3>\n<p>Pastikan hasil cetak:</p>\n<ul><li>teks tajam dan mudah dibaca;</li><li>gambar jelas;</li><li>warna sesuai kemampuan media dan printer;</li><li>tidak buram;</li><li>tidak terdapat garis atau noda.</li></ul>\n<h3 class=\"sec-head\">D. Hasil Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>halaman lengkap;</li><li>urutan benar;</li><li>tidak kusut;</li><li>tidak terlipat;</li><li>tersusun rapi.</li></ul>\n<h3 class=\"sec-head\">E. File Aman</h3>\n<p>Seluruh file pelanggan wajib:</p>\n<ul><li>dijaga kerahasiaannya;</li><li>tidak disalin tanpa izin;</li><li>tidak dibagikan kepada pihak lain;</li><li>dihapus dari komputer penyimpanan sementara setelah pekerjaan selesai apabila tidak ada kesepakatan lain dengan pelanggan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN PRINT</h3>\n<p><strong>Langkah 1 – Terima File</strong></p>\n<ul><li>Terima file dari pelanggan.</li><li>Pastikan file dapat dibuka.</li><li>Konfirmasi spesifikasi pesanan.</li></ul>\n<p><strong>Langkah 2 – Pemeriksaan File</strong></p>\n<p>Periksa:</p>\n<ul><li>jumlah halaman;</li><li>ukuran dokumen;</li><li>orientasi;</li><li>font dan tata letak (apabila memungkinkan);</li><li>kualitas gambar.</li></ul>\n<p>Apabila ditemukan masalah, komunikasikan kepada pelanggan sebelum proses cetak.</p>\n<p><strong>Langkah 3 – Siapkan Printer</strong></p>\n<p>Pastikan:</p>\n<ul><li>printer siap digunakan;</li><li>tinta atau toner mencukupi;</li><li>kertas sesuai pesanan;</li><li>pengaturan printer sesuai spesifikasi.</li></ul>\n<p><strong>Langkah 4 – Proses Cetak</strong></p>\n<ul><li>Lakukan pencetakan sesuai pengaturan.</li><li>Awasi proses.</li><li>Hentikan apabila terjadi kesalahan.</li></ul>\n<p><strong>Langkah 5 – Pemeriksaan Hasil</strong></p>\n<p>Periksa:</p>\n<ul><li>jumlah;</li><li>kualitas;</li><li>urutan halaman;</li><li>warna;</li><li>posisi cetak;</li><li>kebersihan hasil.</li></ul>\n<p><strong>Langkah 6 – Serahkan</strong></p>\n<ul><li>Susun hasil dengan rapi.</li><li>Pastikan hasil sesuai pesanan.</li><li>Serahkan kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Hasil print harus memenuhi kriteria berikut:</p>\n<ul><li>teks terbaca jelas;</li><li>gambar tidak pecah sesuai kualitas file yang diterima;</li><li>warna konsisten sesuai kemampuan printer dan media;</li><li>ukuran sesuai;</li><li>halaman lengkap;</li><li>tidak terpotong;</li><li>tidak terdapat noda atau garis.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memeriksa file;</li><li>mencetak sesuai pesanan;</li><li>menjaga keamanan file pelanggan;</li><li>menjaga kebersihan dan kesiapan printer;</li><li>melaporkan kendala apabila terjadi masalah.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kualitas layanan;</li><li>memastikan printer dalam kondisi baik;</li><li>membimbing Anggota Tim;</li><li>mengevaluasi kualitas hasil cetak.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan dinilai berhasil apabila:</p>\n<ul><li>hasil sesuai file pelanggan;</li><li>spesifikasi sesuai pesanan;</li><li>pekerjaan selesai tepat waktu;</li><li>file pelanggan tetap aman;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-303 Standar Melayani Pelanggan;</li><li>Standar Quality Control;</li><li>Standar Pemeliharaan Mesin.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>nama pelanggan;</li><li>jenis file;</li><li>jenis layanan;</li><li>jumlah halaman;</li><li>operator;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>kendala (jika ada).</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Print L21 diterapkan;</li><li>hasil memenuhi standar kualitas;</li><li>file pelanggan dikelola dengan aman;</li><li>printer dirawat sesuai jadwal;</li><li>kesalahan dicatat dan dianalisis.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan data operasional digunakan untuk meningkatkan kualitas layanan, kompetensi Anggota Tim, efisiensi proses, dan keandalan peralatan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan print di Lorongsatu21 merupakan proses mengubah file digital menjadi hasil cetak yang berkualitas.</p>\n<p>Setiap file diproses dengan ketelitian, tanggung jawab, dan profesionalisme agar menghasilkan cetakan yang benar, jelas, rapi, tepat waktu, serta menjaga keamanan data pelanggan.</p>", "order": 25, "no_formal_header": false}]}, {"code": "SL21-403", "official_title": "Standar Percetakan", "status": "ok", "note": "", "versions": [{"title": "LAYANAN PERCETAKAN", "meta": {"Kode Dokumen": "SL21-403", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan percetakan agar setiap produk cetak dihasilkan sesuai spesifikasi pelanggan, memenuhi standar kualitas Lorongsatu21, selesai tepat waktu, serta memberikan nilai tambah bagi pelanggan.</p>\n<p>Standar ini menjadi acuan umum bagi seluruh layanan percetakan yang disediakan Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap produk cetak mewakili identitas pelanggan.</li><li>Ketelitian menentukan kualitas.</li><li>Kualitas dibangun sejak tahap persiapan, bukan hanya pada hasil akhir.</li><li>Kepercayaan pelanggan dibangun melalui konsistensi kualitas.</li></ul>\n<p>Moto:</p>\n<p><strong>Benar • Berkualitas • Tepat Waktu • Terpercaya</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap pekerjaan percetakan harus:</p>\n<ul><li>sesuai spesifikasi pesanan;</li><li>menggunakan bahan yang tepat;</li><li>melalui pemeriksaan kualitas;</li><li>selesai sesuai waktu yang disepakati;</li><li>menjaga keamanan file dan data pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh layanan percetakan Lorongsatu21, antara lain:</p>\n<ul><li>banner;</li><li>brosur;</li><li>flyer;</li><li>kartu nama;</li><li>stiker;</li><li>undangan;</li><li>sertifikat;</li><li>kalender;</li><li>buku;</li><li>kemasan;</li><li>kop surat;</li><li>map;</li><li>nota;</li><li>dan produk cetak lainnya.</li></ul>\n<p>Setiap jenis produk memiliki SOP tersendiri yang mengacu pada standar ini.</p>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN PERCETAKAN L21</h3>\n<h3 class=\"sec-head\">A. Spesifikasi Benar</h3>\n<p>Pastikan:</p>\n<ul><li>desain sesuai persetujuan pelanggan;</li><li>ukuran benar;</li><li>jumlah benar;</li><li>bahan sesuai pesanan;</li><li>finishing sesuai permintaan.</li></ul>\n<h3 class=\"sec-head\">B. Produksi Berkualitas</h3>\n<p>Pastikan:</p>\n<ul><li>warna konsisten sesuai kemampuan mesin dan media;</li><li>posisi cetak presisi;</li><li>hasil bersih;</li><li>tidak terdapat cacat produksi.</li></ul>\n<h3 class=\"sec-head\">C. Finishing Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>potong presisi;</li><li>lipatan rapi;</li><li>laminasi baik;</li><li>jilid kuat;</li><li>pengepakan sesuai.</li></ul>\n<h3 class=\"sec-head\">D. Tepat Waktu</h3>\n<p>Setiap pekerjaan diselesaikan sesuai estimasi.</p>\n<p>Apabila terjadi kendala, pelanggan diinformasikan sesegera mungkin.</p>\n<h3 class=\"sec-head\">E. Aman</h3>\n<p>Seluruh file, desain, dan produk pelanggan:</p>\n<ul><li>dijaga kerahasiaannya;</li><li>tidak digunakan tanpa izin;</li><li>disimpan sesuai kebijakan perusahaan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN PERCETAKAN</h3>\n<ul><li>Terima pesanan.</li><li>Periksa spesifikasi.</li><li>Periksa file.</li><li>Siapkan bahan.</li><li>Produksi.</li><li>Finishing.</li><li>Quality Control.</li><li>Serahkan kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Produk cetak harus memenuhi:</p>\n<ul><li>ukuran sesuai;</li><li>warna sesuai kemampuan produksi dan kesepakatan dengan pelanggan;</li><li>tidak terdapat cacat cetak;</li><li>finishing rapi;</li><li>jumlah sesuai pesanan;</li><li>siap digunakan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memastikan spesifikasi dipahami;</li><li>menjalankan proses sesuai SOP;</li><li>menjaga kualitas;</li><li>menjaga keamanan file pelanggan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kualitas produksi;</li><li>memastikan SOP dijalankan;</li><li>menyelesaikan kendala produksi.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan percetakan dinilai berhasil apabila:</p>\n<ul><li>produk sesuai spesifikasi;</li><li>kualitas memenuhi standar;</li><li>pesanan selesai tepat waktu;</li><li>pelanggan puas terhadap hasil;</li><li>tingkat produksi ulang (rework) rendah.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-303 Standar Melayani Pelanggan;</li><li>Standar Quality Control;</li><li>Standar Pemeliharaan Mesin;</li><li>seluruh SOP produk percetakan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis produk;</li><li>spesifikasi;</li><li>bahan;</li><li>jumlah;</li><li>operator;</li><li>waktu produksi;</li><li>hasil QC;</li><li>status penyelesaian.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Percetakan L21 diterapkan;</li><li>SOP setiap produk dijalankan;</li><li>hasil memenuhi standar kualitas;</li><li>data produksi terdokumentasi;</li><li>perbaikan dilakukan terhadap temuan yang berulang.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, data produksi, dan perkembangan teknologi digunakan untuk meningkatkan kualitas layanan percetakan serta menyempurnakan SOP masing-masing produk.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan percetakan di Lorongsatu21 menghasilkan produk yang mencerminkan identitas dan kebutuhan pelanggan.</p>\n<p>Melalui ketelitian, kualitas, dan proses yang terstandar, Lorongsatu21 berkomitmen menghasilkan produk cetak yang tepat, rapi, berkualitas, dan memberikan manfaat bagi pelanggan.</p>", "order": 26, "no_formal_header": false}]}, {"code": "SL21-404", "official_title": "Standar Foto", "status": "ok", "note": "", "versions": [{"title": "LAYANAN FOTO", "meta": {"Kode Dokumen": "SL21-404", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan foto agar setiap pelanggan memperoleh hasil foto yang sesuai kebutuhan, berkualitas, rapi, dan selesai tepat waktu.</p>\n<p>Layanan foto meliputi proses pemotretan, pengolahan sederhana, pencetakan foto, dan penyerahan hasil sesuai layanan yang tersedia di Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap foto memiliki nilai dan tujuan bagi pelanggan.</li><li>Ketelitian dalam setiap tahap menentukan kualitas hasil.</li><li>Pelayanan yang ramah membuat pelanggan merasa nyaman.</li><li>Hasil foto yang baik membangun kepercayaan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Nyaman • Jelas • Berkualitas • Tepat Waktu</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap layanan foto harus:</p>\n<ul><li>sesuai kebutuhan pelanggan;</li><li>menghasilkan foto yang jelas dan layak;</li><li>menjaga kenyamanan pelanggan selama proses;</li><li>menjaga keamanan file foto;</li><li>menjaga kerahasiaan foto pelanggan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk layanan:</p>\n<ul><li>foto pas;</li><li>cetak foto;</li><li>cetak ulang foto;</li><li>pengolahan foto sederhana (crop, resize, penyesuaian dasar);</li><li>layanan foto lain yang disediakan Lorongsatu21.</li></ul>\n<p>Layanan pengeditan lanjutan mengikuti SOP tersendiri apabila tersedia.</p>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN FOTO L21</h3>\n<h3 class=\"sec-head\">A. Kebutuhan Benar</h3>\n<p>Pastikan:</p>\n<ul><li>jenis layanan dipahami;</li><li>ukuran foto sesuai;</li><li>jumlah sesuai pesanan;</li><li>latar belakang sesuai permintaan (jika berlaku).</li></ul>\n<h3 class=\"sec-head\">B. Hasil Berkualitas</h3>\n<p>Pastikan:</p>\n<ul><li>foto tajam;</li><li>pencahayaan memadai;</li><li>warna alami sesuai kemampuan perangkat;</li><li>hasil cetak jelas.</li></ul>\n<h3 class=\"sec-head\">C. Hasil Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>pemotongan presisi;</li><li>ukuran sesuai;</li><li>tidak terdapat noda, goresan, atau lipatan;</li><li>hasil siap digunakan.</li></ul>\n<h3 class=\"sec-head\">D. Tepat Waktu</h3>\n<p>Pesanan diselesaikan sesuai estimasi yang telah disampaikan kepada pelanggan.</p>\n<p>Apabila terjadi kendala, pelanggan segera diinformasikan.</p>\n<h3 class=\"sec-head\">E. File Aman</h3>\n<p>Seluruh file foto pelanggan:</p>\n<ul><li>dijaga kerahasiaannya;</li><li>tidak digunakan untuk kepentingan lain;</li><li>tidak dibagikan tanpa izin;</li><li>dikelola sesuai kebijakan penyimpanan perusahaan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN FOTO</h3>\n<ul><li>Terima pelanggan dan pahami kebutuhan.</li><li>Konfirmasi ukuran, jumlah, dan tujuan penggunaan foto.</li><li>Lakukan pemotretan atau terima file pelanggan.</li><li>Lakukan pemeriksaan hasil.</li><li>Lakukan pengolahan sederhana apabila diperlukan.</li><li>Cetak foto sesuai pesanan.</li><li>Periksa hasil cetak.</li><li>Serahkan hasil kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Foto dinyatakan memenuhi standar apabila:</p>\n<ul><li>fokus baik;</li><li>pencahayaan cukup;</li><li>warna sesuai;</li><li>ukuran sesuai pesanan;</li><li>hasil cetak bersih;</li><li>tidak terdapat cacat produksi.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melayani pelanggan dengan ramah;</li><li>memastikan spesifikasi pesanan benar;</li><li>menjaga kualitas hasil;</li><li>menjaga keamanan file pelanggan;</li><li>menjaga kebersihan peralatan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kualitas layanan;</li><li>memastikan peralatan siap digunakan;</li><li>mengevaluasi kualitas hasil foto.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan dinilai berhasil apabila:</p>\n<ul><li>hasil sesuai kebutuhan pelanggan;</li><li>kualitas memenuhi standar;</li><li>pesanan selesai tepat waktu;</li><li>file pelanggan aman;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-303 Standar Melayani Pelanggan;</li><li>Standar Quality Control;</li><li>Standar Pemeliharaan Peralatan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis layanan;</li><li>ukuran foto;</li><li>jumlah cetakan;</li><li>operator;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>kendala (jika ada).</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Foto L21 diterapkan;</li><li>hasil memenuhi standar kualitas;</li><li>file pelanggan dikelola dengan aman;</li><li>peralatan dirawat sesuai jadwal;</li><li>kesalahan dicatat dan dianalisis.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, data operasional, dan perkembangan teknologi digunakan untuk meningkatkan kualitas layanan foto, kompetensi Anggota Tim, dan keandalan peralatan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan foto di Lorongsatu21 bertujuan menghasilkan foto yang sesuai kebutuhan pelanggan dengan kualitas yang baik, proses yang profesional, dan pelayanan yang ramah.</p>\n<p>Setiap foto diproses dengan ketelitian, tanggung jawab, dan penghargaan terhadap nilai yang dimiliki foto tersebut bagi pelanggan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-404</h3>", "order": 27, "no_formal_header": false}]}, {"code": "SL21-405", "official_title": "Standar Desain", "status": "ok", "note": "", "versions": [{"title": "LAYANAN DESAIN", "meta": {"Kode Dokumen": "SL21-405", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan desain agar setiap hasil desain memenuhi kebutuhan pelanggan, memiliki kualitas visual yang baik, mudah diproduksi, dan selesai sesuai waktu yang disepakati.</p>\n<p>Layanan desain merupakan bagian dari solusi kreatif Lorongsatu21 untuk membantu pelanggan menyampaikan informasi, membangun identitas, dan meningkatkan nilai produk atau layanan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Desain harus memiliki tujuan yang jelas.</li><li>Desain yang baik memudahkan orang memahami pesan.</li><li>Kreativitas harus didukung oleh ketelitian.</li><li>Desain harus siap diproduksi dengan kualitas yang baik.</li></ul>\n<p>Moto:</p>\n<p><strong>Pahami • Rancang • Periksa • Sempurnakan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap layanan desain harus:</p>\n<ul><li>memahami tujuan pelanggan;</li><li>mengutamakan fungsi sebelum dekorasi;</li><li>menghasilkan desain yang jelas dan menarik;</li><li>memperhatikan kesiapan produksi;</li><li>menghargai hak cipta dan etika penggunaan materi desain.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk layanan desain, antara lain:</p>\n<ul><li>banner;</li><li>brosur;</li><li>flyer;</li><li>kartu nama;</li><li>stiker;</li><li>undangan;</li><li>kemasan;</li><li>sertifikat;</li><li>media promosi;</li><li>konten media sosial;</li><li>desain digital lainnya.</li></ul>\n<p>Layanan ilustrasi atau desain khusus mengikuti kesepakatan dengan pelanggan.</p>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN DESAIN L21</h3>\n<h3 class=\"sec-head\">A. Tujuan Jelas</h3>\n<p>Sebelum mulai mendesain, pastikan dipahami:</p>\n<ul><li>tujuan desain;</li><li>target pengguna;</li><li>media yang digunakan;</li><li>ukuran akhir;</li><li>isi yang akan disampaikan.</li></ul>\n<h3 class=\"sec-head\">B. Visual Berkualitas</h3>\n<p>Pastikan desain memiliki:</p>\n<ul><li>tata letak yang rapi;</li><li>kombinasi warna yang sesuai;</li><li>tipografi yang mudah dibaca;</li><li>elemen visual yang mendukung pesan.</li></ul>\n<h3 class=\"sec-head\">C. Siap Produksi</h3>\n<p>Pastikan file desain:</p>\n<ul><li>menggunakan ukuran yang benar;</li><li>memiliki resolusi yang memadai;</li><li>menggunakan format file yang sesuai;</li><li>siap masuk ke proses produksi.</li></ul>\n<h3 class=\"sec-head\">D. Sesuai Persetujuan</h3>\n<p>Desain diproduksi setelah pelanggan menyetujui hasil akhir sesuai kebijakan yang berlaku.</p>\n<p>Perubahan setelah persetujuan mengikuti ketentuan revisi perusahaan.</p>\n<h3 class=\"sec-head\">E. File Aman</h3>\n<p>Seluruh file pelanggan:</p>\n<ul><li>dijaga kerahasiaannya;</li><li>tidak digunakan tanpa izin;</li><li>disimpan sesuai kebijakan perusahaan;</li><li>diserahkan kepada pelanggan sesuai kesepakatan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN DESAIN</h3>\n<ul><li>Terima kebutuhan pelanggan.</li><li>Kumpulkan informasi dan materi pendukung.</li><li>Susun konsep desain.</li><li>Buat desain.</li><li>Lakukan pemeriksaan internal.</li><li>Kirim pratinjau kepada pelanggan.</li><li>Lakukan revisi sesuai kesepakatan.</li><li>Dapatkan persetujuan akhir.</li><li>Siapkan file produksi atau file digital.</li><li>Serahkan hasil kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Desain dinyatakan memenuhi standar apabila:</p>\n<ul><li>tujuan komunikasi tercapai;</li><li>informasi benar;</li><li>tata letak rapi;</li><li>teks mudah dibaca;</li><li>gambar berkualitas;</li><li>siap diproduksi tanpa perbaikan besar.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memahami kebutuhan pelanggan;</li><li>membuat desain sesuai standar;</li><li>menjaga kualitas;</li><li>menjaga keamanan file.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>membimbing proses desain;</li><li>memastikan kualitas;</li><li>menyetujui hasil bila diperlukan;</li><li>membantu penyelesaian kendala.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan desain dinilai berhasil apabila:</p>\n<ul><li>desain sesuai kebutuhan pelanggan;</li><li>revisi dapat diminimalkan karena kebutuhan dipahami sejak awal;</li><li>file siap diproduksi;</li><li>pekerjaan selesai tepat waktu;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-303 Standar Melayani Pelanggan;</li><li>SL21-403 Standar Percetakan;</li><li>Standar Quality Control;</li><li>Standar Hak Cipta dan Pengelolaan File.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis desain;</li><li>ukuran;</li><li>jumlah revisi;</li><li>operator;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>status persetujuan pelanggan.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Desain L21 diterapkan;</li><li>file siap diproduksi;</li><li>persetujuan pelanggan terdokumentasi;</li><li>revisi terkendali;</li><li>arsip desain tersimpan dengan baik.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, perkembangan tren desain, dan teknologi digunakan untuk meningkatkan kualitas layanan, kompetensi Anggota Tim, serta efektivitas proses desain.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan desain di Lorongsatu21 bertujuan menghasilkan karya yang tidak hanya menarik secara visual, tetapi juga mampu menyampaikan pesan dengan jelas, memenuhi kebutuhan pelanggan, dan siap diproduksi sesuai Standar L21.</p>", "order": 32, "no_formal_header": false}]}, {"code": "SL21-406", "official_title": "Standar Finishing", "status": "ok", "note": "", "versions": [{"title": "LAYANAN FINISHING", "meta": {"Kode Dokumen": "SL21-406", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar layanan finishing agar setiap produk yang telah diproduksi memiliki hasil akhir yang rapi, kuat, bersih, aman, dan siap digunakan atau diserahkan kepada pelanggan.</p>\n<p>Finishing merupakan tahap akhir dalam proses produksi yang berperan menyempurnakan kualitas produk.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Finishing merupakan tahap penyempurna kualitas.</li><li>Ketelitian menghasilkan produk yang lebih bernilai.</li><li>Kerapian mencerminkan profesionalisme.</li><li>Produk yang selesai dengan baik akan meningkatkan kepuasan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Rapi • Presisi • Bersih • Siap Digunakan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap proses finishing harus:</p>\n<ul><li>sesuai spesifikasi pesanan;</li><li>menggunakan teknik yang tepat;</li><li>menghasilkan pekerjaan yang rapi;</li><li>menjaga kualitas produk;</li><li>dilakukan dengan aman.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh proses finishing, antara lain:</p>\n<ul><li>laminasi;</li><li>jilid;</li><li>pemotongan;</li><li>pelipatan;</li><li>perforasi;</li><li>pemasangan ring;</li><li>pemasangan spiral;</li><li>pemasangan hard cover;</li><li>pemasangan mata ayam;</li><li>pemasangan tali atau gantungan;</li><li>pengepakan;</li><li>proses finishing lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR LAYANAN FINISHING L21</h3>\n<h3 class=\"sec-head\">A. Spesifikasi Benar</h3>\n<p>Pastikan:</p>\n<ul><li>jenis finishing sesuai pesanan;</li><li>ukuran sesuai;</li><li>posisi finishing benar;</li><li>jumlah sesuai.</li></ul>\n<h3 class=\"sec-head\">B. Presisi</h3>\n<p>Pastikan:</p>\n<ul><li>potongan lurus;</li><li>lipatan simetris;</li><li>laminasi rata;</li><li>jilid kuat;</li><li>posisi ring atau spiral tepat.</li></ul>\n<h3 class=\"sec-head\">C. Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>tidak ada sisa lem;</li><li>tidak ada bekas potongan;</li><li>tidak ada gelembung laminasi;</li><li>produk bersih.</li></ul>\n<h3 class=\"sec-head\">D. Aman</h3>\n<p>Pastikan:</p>\n<ul><li>produk tidak rusak selama finishing;</li><li>operator menggunakan peralatan sesuai prosedur;</li><li>mesin digunakan dengan aman.</li></ul>\n<h3 class=\"sec-head\">E. Siap Diserahkan</h3>\n<p>Pastikan:</p>\n<ul><li>seluruh proses selesai;</li><li>produk telah diperiksa;</li><li>jumlah sesuai;</li><li>produk siap diserahkan kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR LAYANAN FINISHING</h3>\n<ul><li>Terima produk dari proses produksi.</li><li>Periksa spesifikasi finishing.</li><li>Siapkan mesin dan peralatan.</li><li>Lakukan proses finishing.</li><li>Periksa hasil finishing.</li><li>Rapikan dan bersihkan produk.</li><li>Serahkan ke Quality Control atau langsung kepada pelanggan sesuai alur kerja.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Produk finishing dinyatakan memenuhi standar apabila:</p>\n<ul><li>ukuran sesuai;</li><li>potongan presisi;</li><li>laminasi rata;</li><li>jilid kuat;</li><li>lipatan rapi;</li><li>produk bersih;</li><li>tidak terdapat kerusakan akibat proses finishing.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melaksanakan finishing sesuai standar;</li><li>menjaga kualitas hasil;</li><li>menjaga kebersihan area kerja;</li><li>merawat peralatan finishing.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan kualitas finishing;</li><li>memastikan peralatan siap digunakan;</li><li>mengevaluasi hasil pekerjaan;</li><li>membimbing Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Layanan finishing dinilai berhasil apabila:</p>\n<ul><li>hasil sesuai spesifikasi;</li><li>produk siap digunakan;</li><li>tidak terjadi kerusakan akibat finishing;</li><li>pekerjaan selesai tepat waktu;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-403 Standar Percetakan;</li><li>SL21-405 Standar Desain;</li><li>Standar Quality Control;</li><li>Standar Pemeliharaan Mesin.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis finishing;</li><li>operator;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>hasil pemeriksaan;</li><li>kendala yang terjadi.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Layanan Finishing L21 diterapkan;</li><li>hasil memenuhi standar kualitas;</li><li>mesin dan peralatan digunakan sesuai prosedur;</li><li>kesalahan dicatat dan dievaluasi.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, data operasional, dan perkembangan teknologi digunakan untuk meningkatkan kualitas finishing, kompetensi Anggota Tim, dan efisiensi proses kerja.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Layanan finishing merupakan tahap akhir yang menyempurnakan kualitas produk sebelum diterima pelanggan.</p>\n<p>Melalui ketelitian, kerapian, dan pengendalian mutu yang konsisten, Lorongsatu21 berkomitmen menghasilkan produk yang siap digunakan, memiliki nilai tambah, dan memberikan pengalaman terbaik kepada pelanggan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-406</h3>", "order": 33, "no_formal_header": false}]}, {"code": "SL21-407", "official_title": "Standar Quality Control", "status": "ok", "note": "", "versions": [{"title": "QUALITY CONTROL (QC)", "meta": {"Kode Dokumen": "SL21-407", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar Quality Control (QC) agar setiap produk dan layanan yang diserahkan kepada pelanggan telah memenuhi Standar L21 dalam aspek kualitas, ketepatan, kerapian, keamanan, dan kelengkapan.</p>\n<p>Quality Control merupakan proses verifikasi akhir sebelum produk diserahkan kepada pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Kualitas dibangun sejak awal proses kerja.</li><li>Quality Control memastikan standar benar-benar terpenuhi.</li><li>Kesalahan yang ditemukan sebelum penyerahan lebih baik daripada keluhan setelah produk diterima pelanggan.</li><li>Kualitas yang konsisten membangun kepercayaan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Periksa • Pastikan • Sempurnakan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap proses QC harus:</p>\n<ul><li>objektif;</li><li>teliti;</li><li>konsisten;</li><li>terdokumentasi;</li><li>berorientasi pada pencegahan kesalahan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh hasil pekerjaan Lorongsatu21, antara lain:</p>\n<ul><li>fotokopi;</li><li>print;</li><li>percetakan;</li><li>foto;</li><li>desain;</li><li>finishing;</li><li>produk dan layanan lainnya yang memerlukan pemeriksaan kualitas.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR QUALITY CONTROL L21</h3>\n<h3 class=\"sec-head\">A. Benar</h3>\n<p>Pastikan:</p>\n<ul><li>produk sesuai pesanan;</li><li>spesifikasi sesuai;</li><li>jumlah sesuai;</li><li>ukuran sesuai.</li></ul>\n<h3 class=\"sec-head\">B. Berkualitas</h3>\n<p>Pastikan:</p>\n<ul><li>hasil bersih;</li><li>warna sesuai kemampuan produksi dan kesepakatan;</li><li>tidak terdapat cacat;</li><li>hasil layak digunakan.</li></ul>\n<h3 class=\"sec-head\">C. Lengkap</h3>\n<p>Pastikan:</p>\n<ul><li>seluruh komponen pesanan tersedia;</li><li>dokumen asli telah dikembalikan (jika ada);</li><li>aksesori atau pelengkap telah disertakan sesuai pesanan.</li></ul>\n<h3 class=\"sec-head\">D. Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>produk tersusun baik;</li><li>kemasan rapi;</li><li>tidak terdapat kerusakan fisik.</li></ul>\n<h3 class=\"sec-head\">E. Siap Diserahkan</h3>\n<p>Pastikan:</p>\n<ul><li>seluruh pemeriksaan selesai;</li><li>produk dinyatakan lulus QC;</li><li>produk siap diserahkan kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR QUALITY CONTROL</h3>\n<ul><li>Terima produk dari proses finishing atau produksi.</li><li>Cocokkan dengan data pesanan.</li><li>Periksa kualitas sesuai checklist.</li><li>Tentukan status hasil pemeriksaan.</li><li>Apabila ditemukan ketidaksesuaian, kembalikan ke proses terkait untuk diperbaiki.</li><li>Lakukan pemeriksaan ulang setelah perbaikan.</li><li>Serahkan produk yang telah lulus QC kepada pelanggan atau bagian penyerahan.</li></ul>\n<h3 class=\"sec-head\">7. STATUS HASIL QC</h3>\n<p>Setiap hasil pemeriksaan diberi salah satu status berikut:</p>\n<p><strong>Lulus</strong></p>\n<p>Produk memenuhi seluruh Standar L21 dan dapat diserahkan kepada pelanggan.</p>\n<p><strong>Perlu Perbaikan</strong></p>\n<p>Produk belum memenuhi standar dan harus diperbaiki sebelum dilakukan pemeriksaan ulang.</p>\n<p><strong>Ditolak</strong></p>\n<p>Produk tidak dapat diperbaiki secara memadai sehingga harus diproduksi ulang sesuai prosedur.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melakukan pemeriksaan sesuai checklist;</li><li>mendokumentasikan hasil QC;</li><li>tidak menyerahkan produk yang belum lulus QC.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan sistem QC berjalan;</li><li>mengevaluasi temuan QC;</li><li>memastikan tindakan perbaikan dilakukan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Quality Control dinilai berhasil apabila:</p>\n<ul><li>produk yang diserahkan memenuhi standar;</li><li>kesalahan yang lolos ke pelanggan sangat rendah;</li><li>jumlah pekerjaan ulang menurun;</li><li>keluhan terkait kualitas menurun;</li><li>pelanggan puas terhadap hasil.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-401 Standar Fotokopi;</li><li>SL21-402 Standar Print;</li><li>SL21-403 Standar Percetakan;</li><li>SL21-404 Standar Foto;</li><li>SL21-405 Standar Desain;</li><li>SL21-406 Standar Finishing;</li><li>SL21-302 Standar Penanganan Keluhan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis layanan;</li><li>hasil QC;</li><li>temuan;</li><li>tindakan perbaikan;</li><li>pemeriksa;</li><li>tanggal pemeriksaan.</li></ul>\n<p>Data ini digunakan untuk menganalisis tren kesalahan, menentukan kebutuhan pelatihan, dan menyempurnakan proses kerja.</p>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>QC dilakukan pada setiap produk yang dipersyaratkan;</li><li>checklist digunakan secara konsisten;</li><li>produk yang tidak memenuhi standar tidak diserahkan kepada pelanggan;</li><li>data QC terdokumentasi dengan baik;</li><li>tindakan perbaikan ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Temuan QC menjadi dasar untuk:</p>\n<ul><li>penyempurnaan Standar L21;</li><li>pembaruan SOP;</li><li>materi Akademi L21;</li><li>peningkatan kompetensi Anggota Tim;</li><li>pencegahan kesalahan yang berulang.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Quality Control merupakan pengaman terakhir sebelum produk diterima pelanggan.</p>\n<p>Melalui pemeriksaan yang teliti, objektif, dan konsisten, Lorongsatu21 memastikan setiap produk yang diserahkan telah memenuhi Standar L21 serta mencerminkan komitmen perusahaan terhadap kualitas, kepercayaan, dan kepuasan pelanggan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-407</h3>", "order": 38, "no_formal_header": false}]}, {"code": "SL21-408", "official_title": "Standar Pengemasan", "status": "ok", "note": "", "versions": [{"title": "PENGEMASAN", "meta": {"Kode Dokumen": "SL21-408", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengemasan agar setiap produk diserahkan kepada pelanggan dalam kondisi bersih, aman, rapi, mudah dibawa, dan sesuai dengan jenis produk.</p>\n<p>Pengemasan merupakan tahap akhir sebelum penyerahan produk kepada pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Pengemasan melindungi hasil kerja.</li><li>Pengemasan yang rapi meningkatkan nilai produk.</li><li>Produk yang bersih menunjukkan profesionalisme.</li><li>Pengemasan merupakan bagian dari pengalaman pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Lindungi • Rapikan • Identifikasi • Serahkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap proses pengemasan harus:</p>\n<ul><li>melindungi produk dari kerusakan;</li><li>menjaga kebersihan produk;</li><li>memudahkan pelanggan membawa produk;</li><li>memudahkan identifikasi pesanan;</li><li>menggunakan bahan kemasan secara efisien dan bertanggung jawab.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh produk Lorongsatu21, antara lain:</p>\n<ul><li>hasil fotokopi;</li><li>hasil print;</li><li>hasil percetakan;</li><li>foto;</li><li>banner;</li><li>brosur;</li><li>undangan;</li><li>ATK yang memerlukan pengemasan;</li><li>produk lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PENGEMASAN L21</h3>\n<h3 class=\"sec-head\">A. Produk Terlindungi</h3>\n<p>Pastikan produk terlindungi dari:</p>\n<ul><li>lipatan;</li><li>goresan;</li><li>air;</li><li>debu;</li><li>kerusakan selama penyimpanan atau penyerahan.</li></ul>\n<h3 class=\"sec-head\">B. Kemasan Sesuai</h3>\n<p>Gunakan kemasan yang sesuai dengan:</p>\n<ul><li>ukuran produk;</li><li>jenis produk;</li><li>tingkat perlindungan yang dibutuhkan.</li></ul>\n<p>Hindari kemasan yang terlalu kecil maupun terlalu besar.</p>\n<h3 class=\"sec-head\">C. Bersih dan Rapi</h3>\n<p>Pastikan:</p>\n<ul><li>kemasan bersih;</li><li>produk tersusun rapi;</li><li>tidak ada bekas lem, selotip berlebihan, atau bahan kemasan yang rusak.</li></ul>\n<h3 class=\"sec-head\">D. Identitas Jelas</h3>\n<p>Setiap pesanan yang diperlukan diberi identitas yang memuat:</p>\n<ul><li>nomor pesanan;</li><li>nama pelanggan;</li><li>jenis produk (bila diperlukan).</li></ul>\n<p>Identitas harus mudah dibaca dan tidak menutupi produk.</p>\n<h3 class=\"sec-head\">E. Siap Diserahkan</h3>\n<p>Pastikan:</p>\n<ul><li>produk telah lulus Quality Control;</li><li>jumlah sesuai pesanan;</li><li>kemasan siap diserahkan kepada pelanggan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR PENGEMASAN</h3>\n<ul><li>Terima produk yang telah lulus Quality Control.</li><li>Pilih bahan kemasan yang sesuai.</li><li>Susun produk dengan rapi.</li><li>Lindungi produk sesuai kebutuhan.</li><li>Pasang identitas pesanan.</li><li>Lakukan pemeriksaan akhir.</li><li>Serahkan kepada pelanggan atau bagian penyerahan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Pengemasan dinyatakan memenuhi standar apabila:</p>\n<ul><li>produk terlindungi dengan baik;</li><li>kemasan bersih dan rapi;</li><li>identitas pesanan benar;</li><li>jumlah sesuai;</li><li>produk mudah dibawa;</li><li>tidak terjadi kerusakan akibat proses pengemasan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memilih kemasan yang tepat;</li><li>menjaga kebersihan produk;</li><li>memastikan identitas pesanan benar;</li><li>menyerahkan produk sesuai standar.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan ketersediaan bahan kemasan;</li><li>mengevaluasi kualitas pengemasan;</li><li>membimbing Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Pengemasan dinilai berhasil apabila:</p>\n<ul><li>produk sampai kepada pelanggan dalam kondisi baik;</li><li>tidak terjadi kerusakan akibat pengemasan;</li><li>pelanggan mudah mengenali pesanannya;</li><li>pelanggan puas terhadap kondisi produk saat diterima.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-406 Standar Finishing;</li><li>SL21-407 Standar Quality Control;</li><li>SL21-409 Standar Penyerahan Produk;</li><li>Standar Pengelolaan Persediaan Bahan Kemasan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>jenis produk;</li><li>jenis kemasan;</li><li>operator;</li><li>waktu pengemasan;</li><li>catatan khusus apabila ada.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Pengemasan L21 diterapkan;</li><li>produk dikemas sesuai jenisnya;</li><li>identitas pesanan benar;</li><li>tidak ada kerusakan akibat pengemasan;</li><li>bahan kemasan digunakan secara efisien.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan evaluasi operasional digunakan untuk meningkatkan kualitas pengemasan, efisiensi penggunaan bahan, dan pengalaman pelanggan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pengemasan merupakan tahap akhir yang melindungi hasil kerja dan mencerminkan kualitas pelayanan Lorongsatu21.</p>\n<p>Melalui pengemasan yang bersih, rapi, aman, dan sesuai kebutuhan, Lorongsatu21 berkomitmen menyerahkan setiap produk dalam kondisi terbaik sehingga memberikan pengalaman yang positif kepada pelanggan.</p>", "order": 43, "no_formal_header": false}]}, {"code": "SL21-409", "official_title": "Standar Pengiriman", "status": "ok", "note": "", "versions": [{"title": "PENYERAHAN DAN PENGIRIMAN PRODUK", "meta": {"Kode Dokumen": "SL21-409", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar penyerahan dan pengiriman produk agar setiap pesanan diterima pelanggan dalam kondisi lengkap, benar, aman, tepat waktu, dan sesuai dengan pesanan.</p>\n<p>Standar ini berlaku untuk penyerahan langsung di toko maupun pengiriman melalui kurir atau jasa ekspedisi.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Penyerahan produk merupakan bagian dari pelayanan pelanggan.</li><li>Produk yang berkualitas harus diterima pelanggan dalam kondisi yang sama baiknya.</li><li>Ketepatan dan ketelitian pada tahap akhir akan memperkuat kepercayaan pelanggan.</li></ul>\n<p>Moto:</p>\n<p><strong>Pastikan • Serahkan • Konfirmasi • Tuntaskan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap penyerahan atau pengiriman harus:</p>\n<ul><li>sesuai pesanan;</li><li>tepat penerima;</li><li>tepat waktu;</li><li>aman;</li><li>terdokumentasi.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk:</p>\n<ul><li>penyerahan langsung di toko;</li><li>pengiriman oleh Anggota Tim;</li><li>pengiriman melalui kurir;</li><li>pengiriman melalui jasa ekspedisi;</li><li>pengiriman file digital (apabila menjadi bagian dari layanan).</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PENYERAHAN DAN PENGIRIMAN L21</h3>\n<h3 class=\"sec-head\">A. Produk Benar</h3>\n<p>Pastikan:</p>\n<ul><li>nomor pesanan sesuai;</li><li>nama pelanggan sesuai;</li><li>jumlah sesuai;</li><li>spesifikasi sesuai.</li></ul>\n<h3 class=\"sec-head\">B. Produk Aman</h3>\n<p>Pastikan:</p>\n<ul><li>produk telah dikemas sesuai standar;</li><li>tidak ada kerusakan;</li><li>siap dipindahkan atau dikirim.</li></ul>\n<h3 class=\"sec-head\">C. Penerima Benar</h3>\n<p>Pastikan:</p>\n<ul><li>identitas penerima sesuai;</li><li>alamat benar (untuk pengiriman);</li><li>nomor kontak aktif.</li></ul>\n<h3 class=\"sec-head\">D. Tepat Waktu</h3>\n<p>Penyerahan atau pengiriman dilakukan sesuai waktu yang telah disepakati.</p>\n<p>Apabila terjadi kendala, pelanggan segera diberi informasi.</p>\n<h3 class=\"sec-head\">E. Penyerahan Terdokumentasi</h3>\n<p>Setiap penyerahan atau pengiriman didokumentasikan melalui:</p>\n<ul><li>tanda terima;</li><li>konfirmasi pelanggan;</li><li>bukti pengiriman;</li><li>dokumentasi digital bila diperlukan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR PENYERAHAN DAN PENGIRIMAN</h3>\n<ul><li>Terima produk yang telah lulus QC dan dikemas.</li><li>Periksa kembali data pesanan.</li><li>Verifikasi identitas penerima atau alamat tujuan.</li><li>Serahkan produk atau kirim melalui metode yang dipilih.</li><li>Minta konfirmasi penerimaan.</li><li>Catat status penyelesaian pesanan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Penyerahan atau pengiriman dinyatakan memenuhi standar apabila:</p>\n<ul><li>produk diterima oleh penerima yang benar;</li><li>kondisi produk tetap baik;</li><li>jumlah sesuai;</li><li>waktu sesuai kesepakatan;</li><li>bukti penyerahan tersedia.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memeriksa data pesanan;</li><li>memastikan produk siap diserahkan;</li><li>menjaga keamanan produk selama proses penyerahan atau pengiriman;</li><li>mendokumentasikan penyerahan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan proses berjalan sesuai standar;</li><li>menangani kendala penyerahan atau pengiriman;</li><li>mengevaluasi ketepatan waktu dan kualitas layanan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Penyerahan dan pengiriman dinilai berhasil apabila:</p>\n<ul><li>produk diterima dalam kondisi baik;</li><li>tidak terjadi kesalahan penerima;</li><li>tidak terjadi kehilangan atau kerusakan akibat pengiriman;</li><li>pelanggan menerima produk sesuai waktu yang dijanjikan;</li><li>pelanggan puas terhadap proses penyerahan.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-408 Standar Pengemasan;</li><li>SL21-407 Standar Quality Control;</li><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-302 Standar Penanganan Keluhan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pesanan;</li><li>nama pelanggan;</li><li>metode penyerahan;</li><li>tanggal dan waktu;</li><li>nama petugas;</li><li>bukti penyerahan;</li><li>status penyelesaian.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Penyerahan dan Pengiriman L21 diterapkan;</li><li>produk diserahkan kepada penerima yang benar;</li><li>dokumentasi lengkap;</li><li>kendala dicatat dan ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan pelanggan, hasil audit, dan data operasional digunakan untuk meningkatkan ketepatan, keamanan, dan efisiensi proses penyerahan serta pengiriman produk.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Penyerahan dan pengiriman merupakan tahap akhir yang menghubungkan hasil kerja Lorongsatu21 dengan pelanggan.</p>\n<p>Melalui proses yang tepat, aman, terdokumentasi, dan tepat waktu, Lorongsatu21 memastikan bahwa setiap produk diterima pelanggan dalam kondisi terbaik serta memberikan pengalaman pelayanan yang membangun kepercayaan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-409</h3>", "order": 44, "no_formal_header": false}]}]}, {"key": "E", "name": "MANAJEMEN PENGADAAN & PERSEDIAAN", "items": [{"code": "SL21-501", "official_title": "Standar Pembelian", "status": "ok", "note": "", "versions": [{"title": "PEMBELIAN", "meta": {"Kode Dokumen": "SL21-501", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pembelian barang, bahan, dan peralatan agar proses pengadaan di Lorongsatu21 dilakukan secara terencana, tepat kebutuhan, efisien, transparan, dan dapat dipertanggungjawabkan.</p>\n<p>Pembelian yang baik memastikan operasional berjalan lancar tanpa kelebihan maupun kekurangan persediaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Pembelian merupakan investasi bagi operasional perusahaan.</li><li>Barang yang tepat akan menghasilkan pelayanan yang lebih baik.</li><li>Perencanaan lebih baik daripada pembelian mendadak.</li><li>Transparansi membangun kepercayaan.</li></ul>\n<p>Moto:</p>\n<p><strong>Rencanakan • Bandingkan • Putuskan • Catat</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap pembelian harus:</p>\n<ul><li>berdasarkan kebutuhan nyata;</li><li>sesuai anggaran;</li><li>mempertimbangkan kualitas, harga, dan pelayanan pemasok;</li><li>terdokumentasi;</li><li>dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk pembelian:</p>\n<ul><li>bahan baku;</li><li>bahan habis pakai;</li><li>ATK operasional;</li><li>barang dagangan;</li><li>suku cadang;</li><li>mesin dan peralatan;</li><li>perlengkapan kantor;</li><li>kebutuhan operasional lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PEMBELIAN L21</h3>\n<h3 class=\"sec-head\">A. Kebutuhan Jelas</h3>\n<p>Pastikan:</p>\n<ul><li>barang benar-benar dibutuhkan;</li><li>jumlah sesuai kebutuhan;</li><li>spesifikasi telah ditentukan.</li></ul>\n<h3 class=\"sec-head\">B. Pemasok Tepat</h3>\n<p>Pemilihan pemasok mempertimbangkan:</p>\n<ul><li>kualitas;</li><li>harga;</li><li>ketepatan pengiriman;</li><li>layanan purna jual;</li><li>reputasi.</li></ul>\n<h3 class=\"sec-head\">C. Harga Wajar</h3>\n<p>Sebelum pembelian:</p>\n<ul><li>lakukan perbandingan harga apabila memungkinkan;</li><li>pertimbangkan total biaya, termasuk pengiriman;</li><li>pilih penawaran yang memberikan nilai terbaik, bukan semata-mata harga terendah.</li></ul>\n<h3 class=\"sec-head\">D. Dokumen Lengkap</h3>\n<p>Setiap pembelian harus memiliki dokumen yang sesuai, seperti:</p>\n<ul><li>permintaan pembelian;</li><li>penawaran (jika diperlukan);</li><li>pesanan pembelian;</li><li>faktur atau nota;</li><li>bukti pembayaran.</li></ul>\n<h3 class=\"sec-head\">E. Tercatat</h3>\n<p>Seluruh transaksi pembelian wajib dicatat dalam sistem atau administrasi Lorongsatu21 sehingga dapat ditelusuri kembali.</p>\n<h3 class=\"sec-head\">6. ALUR PEMBELIAN</h3>\n<ul><li>Identifikasi kebutuhan.</li><li>Verifikasi kebutuhan dan anggaran.</li><li>Pilih pemasok.</li><li>Lakukan pemesanan.</li><li>Terima barang (mengacu pada SL21-502).</li><li>Catat transaksi.</li><li>Arsipkan dokumen.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Pembelian dinyatakan memenuhi standar apabila:</p>\n<ul><li>barang sesuai kebutuhan;</li><li>kualitas sesuai spesifikasi;</li><li>harga sesuai kesepakatan;</li><li>dokumen lengkap;</li><li>transaksi tercatat dengan benar.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mengajukan kebutuhan sesuai prosedur;</li><li>memberikan informasi spesifikasi yang jelas;</li><li>menjaga dokumen pembelian.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memverifikasi kebutuhan;</li><li>menyetujui pembelian sesuai kewenangan;</li><li>mengevaluasi pemasok;</li><li>memastikan pencatatan dilakukan dengan benar.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Pembelian dinilai berhasil apabila:</p>\n<ul><li>barang diterima sesuai kebutuhan;</li><li>tidak terjadi pembelian yang tidak diperlukan;</li><li>anggaran terkendali;</li><li>pemasok memenuhi komitmen;</li><li>dokumen lengkap dan mudah ditelusuri.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-502 Standar Penerimaan Barang;</li><li>SL21-503 Standar Penyimpanan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-507 Standar Retur Barang;</li><li>Standar Keuangan dan Penganggaran.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor pembelian;</li><li>tanggal pembelian;</li><li>nama pemasok;</li><li>daftar barang;</li><li>jumlah;</li><li>harga;</li><li>nilai transaksi;</li><li>petugas;</li><li>status pembelian.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Pembelian L21 diterapkan;</li><li>pembelian sesuai kebutuhan;</li><li>dokumen lengkap;</li><li>pencatatan akurat;</li><li>evaluasi pemasok dilakukan secara berkala.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Data pembelian, hasil audit, evaluasi pemasok, dan kebutuhan operasional digunakan untuk meningkatkan efisiensi pengadaan, kualitas pemasok, dan pengendalian biaya.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pembelian merupakan langkah awal dalam memastikan kelancaran operasional Lorongsatu21.</p>\n<p>Melalui proses pembelian yang terencana, transparan, dan terdokumentasi, Lorongsatu21 berkomitmen memperoleh barang dan jasa yang tepat untuk mendukung pelayanan terbaik kepada pelanggan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-501</h3>", "order": 49, "no_formal_header": false}]}, {"code": "SL21-502", "official_title": "Standar Penerimaan Barang", "status": "ok", "note": "", "versions": [{"title": "PENERIMAAN BARANG", "meta": {"Kode Dokumen": "SL21-502", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar penerimaan barang agar setiap barang yang diterima oleh Lorongsatu21 sesuai dengan pesanan, memenuhi spesifikasi, dalam kondisi baik, terdokumentasi, dan siap disimpan atau digunakan.</p>\n<p>Penerimaan barang merupakan tahap verifikasi sebelum barang menjadi bagian dari persediaan perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Barang yang diterima harus diperiksa sebelum dicatat.</li><li>Ketelitian pada saat penerimaan mencegah kesalahan di kemudian hari.</li><li>Pencatatan yang benar membangun keakuratan persediaan.</li><li>Barang yang tidak sesuai harus segera ditindaklanjuti.</li></ul>\n<p>Moto:</p>\n<p><strong>Periksa • Cocokkan • Catat • Simpan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap penerimaan barang harus:</p>\n<ul><li>sesuai dengan dokumen pembelian;</li><li>sesuai spesifikasi;</li><li>diperiksa kondisinya;</li><li>dicatat dengan benar;</li><li>dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk penerimaan:</p>\n<ul><li>barang dagangan;</li><li>bahan baku;</li><li>bahan habis pakai;</li><li>ATK operasional;</li><li>mesin dan peralatan;</li><li>suku cadang;</li><li>perlengkapan kantor;</li><li>aset lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PENERIMAAN BARANG L21</h3>\n<h3 class=\"sec-head\">A. Barang Sesuai</h3>\n<p>Pastikan:</p>\n<ul><li>nama barang sesuai;</li><li>spesifikasi sesuai;</li><li>jumlah sesuai;</li><li>satuan sesuai.</li></ul>\n<h3 class=\"sec-head\">B. Kondisi Baik</h3>\n<p>Pastikan:</p>\n<ul><li>barang tidak rusak;</li><li>kemasan baik;</li><li>tidak ada cacat yang terlihat;</li><li>masa kedaluwarsa masih memenuhi ketentuan (apabila berlaku).</li></ul>\n<h3 class=\"sec-head\">C. Dokumen Sesuai</h3>\n<p>Periksa kesesuaian antara barang dengan:</p>\n<ul><li>surat jalan;</li><li>faktur atau nota;</li><li>pesanan pembelian (Purchase Order);</li><li>dokumen pendukung lainnya.</li></ul>\n<h3 class=\"sec-head\">D. Pencatatan Benar</h3>\n<p>Setelah barang diterima:</p>\n<ul><li>lakukan pencatatan;</li><li>beri identifikasi bila diperlukan;</li><li>perbarui data persediaan.</li></ul>\n<h3 class=\"sec-head\">E. Siap Disimpan</h3>\n<p>Barang yang telah diterima:</p>\n<ul><li>dipindahkan ke lokasi penyimpanan sesuai ketentuan;</li><li>diberi label apabila diperlukan;</li><li>siap digunakan atau dijual.</li></ul>\n<h3 class=\"sec-head\">6. ALUR PENERIMAAN BARANG</h3>\n<ul><li>Terima barang dari pemasok.</li><li>Periksa dokumen pengiriman.</li><li>Cocokkan barang dengan dokumen pembelian.</li><li>Periksa jumlah, spesifikasi, dan kondisi barang.</li><li>Catat hasil pemeriksaan.</li><li>Terima atau tolak barang sesuai hasil pemeriksaan.</li><li>Simpan barang sesuai standar penyimpanan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Penerimaan barang dinyatakan memenuhi standar apabila:</p>\n<ul><li>barang sesuai pesanan;</li><li>kondisi baik;</li><li>jumlah sesuai;</li><li>dokumen lengkap;</li><li>pencatatan selesai;</li><li>barang siap disimpan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memeriksa barang dan dokumen;</li><li>mencatat hasil penerimaan;</li><li>melaporkan ketidaksesuaian.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyetujui hasil penerimaan;</li><li>menangani ketidaksesuaian;</li><li>memastikan data persediaan diperbarui.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Penerimaan barang dinilai berhasil apabila:</p>\n<ul><li>tidak terjadi kesalahan pencatatan;</li><li>barang sesuai pesanan;</li><li>ketidaksesuaian segera ditangani;</li><li>persediaan tercatat dengan akurat.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-503 Standar Penyimpanan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-507 Standar Retur Barang.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor penerimaan;</li><li>nomor pembelian;</li><li>tanggal penerimaan;</li><li>pemasok;</li><li>daftar barang;</li><li>jumlah diterima;</li><li>kondisi barang;</li><li>petugas penerima;</li><li>status penerimaan.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Penerimaan Barang L21 diterapkan;</li><li>barang diperiksa sebelum diterima;</li><li>dokumen lengkap;</li><li>pencatatan sesuai kondisi sebenarnya;</li><li>ketidaksesuaian ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan hasil audit, data ketidaksesuaian, dan kinerja pemasok untuk meningkatkan akurasi penerimaan barang serta kualitas pengadaan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Penerimaan barang merupakan gerbang masuk seluruh barang ke dalam sistem persediaan Lorongsatu21.</p>\n<p>Melalui pemeriksaan yang teliti, pencatatan yang akurat, dan penanganan ketidaksesuaian yang cepat, Lorongsatu21 memastikan setiap barang yang masuk siap mendukung operasional dan pelayanan kepada pelanggan.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-502</h3>", "order": 54, "no_formal_header": false}]}, {"code": "SL21-503", "official_title": "Standar Penyimpanan Barang", "status": "ok", "note": "", "versions": [{"title": "PENYIMPANAN BARANG", "meta": {"Kode Dokumen": "SL21-503", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar penyimpanan barang agar seluruh barang milik Lorongsatu21 tersimpan dengan aman, rapi, mudah ditemukan, mudah dihitung, dan tetap terjaga kualitasnya.</p>\n<p>Penyimpanan yang baik mendukung kelancaran operasional, mempercepat pelayanan, dan menjaga keakuratan persediaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Barang yang tersimpan dengan baik akan lebih mudah dikelola.</li><li>Kerapian meningkatkan efisiensi kerja.</li><li>Penyimpanan yang benar menjaga kualitas barang.</li><li>Lokasi penyimpanan yang jelas mempercepat pelayanan.</li></ul>\n<p>Moto:</p>\n<p><strong>Susun • Lindungi • Tandai • Temukan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap penyimpanan barang harus:</p>\n<ul><li>memiliki lokasi yang jelas;</li><li>mudah diidentifikasi;</li><li>aman dari kerusakan;</li><li>mudah diambil;</li><li>mudah dihitung.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk penyimpanan:</p>\n<ul><li>barang dagangan;</li><li>bahan baku;</li><li>bahan habis pakai;</li><li>ATK operasional;</li><li>tinta;</li><li>kertas;</li><li>bahan percetakan;</li><li>suku cadang;</li><li>aset kecil;</li><li>perlengkapan kerja.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR PENYIMPANAN BARANG L21</h3>\n<h3 class=\"sec-head\">A. Lokasi Jelas</h3>\n<p>Pastikan:</p>\n<ul><li>setiap barang memiliki lokasi penyimpanan tetap;</li><li>setiap rak, lemari, atau area memiliki kode lokasi;</li><li>lokasi tercatat dalam sistem atau daftar lokasi.</li></ul>\n<h3 class=\"sec-head\">B. Identitas Jelas</h3>\n<p>Setiap barang atau lokasi diberi identitas yang memuat:</p>\n<ul><li>nama barang;</li><li>kode barang;</li><li>satuan;</li><li>kode lokasi (bila diperlukan).</li></ul>\n<h3 class=\"sec-head\">C. Aman</h3>\n<p>Pastikan barang:</p>\n<ul><li>terlindung dari air, debu, panas berlebih, dan hama;</li><li>disimpan sesuai karakteristiknya;</li><li>tidak membahayakan Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">D. Rapi</h3>\n<p>Barang disusun:</p>\n<ul><li>sesuai kategori;</li><li>tidak menghalangi akses;</li><li>mengikuti ukuran dan berat;</li><li>dengan prinsip <strong>FIFO (First In, First Out)</strong> atau <strong>FEFO (First Expired, First Out)</strong> untuk barang yang memiliki masa berlaku.</li></ul>\n<h3 class=\"sec-head\">E. Mudah Diambil</h3>\n<p>Pastikan:</p>\n<ul><li>barang mudah ditemukan;</li><li>jalur akses tidak terhalang;</li><li>waktu pencarian dapat diminimalkan.</li></ul>\n<h3 class=\"sec-head\">6. ALUR PENYIMPANAN BARANG</h3>\n<ul><li>Terima barang yang telah lolos pemeriksaan.</li><li>Tentukan lokasi penyimpanan.</li><li>Beri label bila diperlukan.</li><li>Susun sesuai kategori dan kode lokasi.</li><li>Perbarui data lokasi dalam sistem.</li><li>Lakukan pemeriksaan berkala terhadap kondisi penyimpanan.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR KUALITAS</h3>\n<p>Penyimpanan dinyatakan memenuhi standar apabila:</p>\n<ul><li>barang berada di lokasi yang benar;</li><li>kondisi barang tetap baik;</li><li>identitas barang jelas;</li><li>lokasi bersih dan rapi;</li><li>barang mudah
