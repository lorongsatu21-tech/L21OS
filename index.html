 ditemukan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyimpan barang sesuai lokasi;</li><li>menjaga kerapian area penyimpanan;</li><li>melaporkan kerusakan atau ketidaksesuaian.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menetapkan tata letak penyimpanan;</li><li>memastikan label dan kode lokasi tersedia;</li><li>mengevaluasi efektivitas sistem penyimpanan.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<p>Penyimpanan dinilai berhasil apabila:</p>\n<ul><li>barang mudah ditemukan;</li><li>tidak terjadi kehilangan karena salah penempatan;</li><li>kualitas barang tetap terjaga;</li><li>waktu pencarian barang semakin singkat;</li><li>area penyimpanan bersih dan teratur.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-502 Standar Penerimaan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-505 Standar Stock Opname;</li><li>SL21-506 Standar Pengeluaran Barang.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>kode barang;</li><li>nama barang;</li><li>kode lokasi;</li><li>jumlah;</li><li>tanggal penyimpanan;</li><li>petugas;</li><li>kondisi barang.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>Lima Standar Penyimpanan Barang L21 diterapkan;</li><li>barang berada pada lokasi yang benar;</li><li>label sesuai;</li><li>kondisi penyimpanan memenuhi standar;</li><li>tidak terdapat barang yang tidak teridentifikasi.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan hasil audit, waktu pencarian barang, kondisi gudang, dan masukan Anggota Tim untuk meningkatkan efisiensi tata letak serta kualitas penyimpanan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Penyimpanan barang yang baik merupakan dasar dari sistem persediaan yang akurat dan operasional yang efisien.</p>\n<p>Melalui lokasi yang jelas, identitas yang lengkap, dan tata letak yang teratur, Lorongsatu21 memastikan setiap barang selalu siap digunakan, mudah ditemukan, dan tetap dalam kondisi terbaik.</p>\n<h3 class=\"sec-head\">LAMPIRAN SL21-503</h3>", "order": 59, "no_formal_header": false}]}, {"code": "SL21-504", "official_title": "Standar Persediaan (Inventory)", "status": "ok", "note": "Isi lengkap, tapi tidak memakai header dokumen standar (tanpa baris Kode Dokumen/Versi/Status) seperti standar lain — diberi judul \"PENYEMPURNAAN SL21-504\".", "versions": [{"title": "STANDAR PERSEDIAAN (INVENTORY)", "meta": {}, "html": "<h3 class=\"sec-head\">A. PENAMBAHAN FILOSOFI L21</h3>\n<p>Selain filosofi yang telah ditetapkan, ditambahkan prinsip berikut:</p>\n<p><strong>&quot;Setiap perubahan persediaan harus memiliki alasan, dokumen, dan jejak pencatatan yang dapat ditelusuri.&quot;</strong></p>\n<p>Persediaan bukan hanya kumpulan barang, tetapi juga informasi yang menjadi dasar keputusan operasional, pembelian, produksi, dan keuangan.</p>\n<h3 class=\"sec-head\">B. PRINSIP TAMBAHAN</h3>\n<p>Selain lima prinsip utama, seluruh pengelolaan persediaan harus memenuhi prinsip berikut:</p>\n<h3 class=\"sec-head\">1. Akurat</h3>\n<p>Data sistem harus mencerminkan kondisi fisik.</p>\n<h3 class=\"sec-head\">2. Real-Time</h3>\n<p>Setiap perubahan stok dicatat segera setelah transaksi terjadi.</p>\n<h3 class=\"sec-head\">3. Traceable (Dapat Ditelusuri)</h3>\n<p>Seluruh perubahan stok harus memiliki:</p>\n<ul><li>tanggal;</li><li>waktu;</li><li>petugas;</li><li>jenis transaksi;</li><li>nomor dokumen;</li><li>alasan perubahan.</li></ul>\n<h3 class=\"sec-head\">4. Terukur</h3>\n<p>Setiap indikator persediaan dapat diukur dan dievaluasi.</p>\n<h3 class=\"sec-head\">5. Berkelanjutan</h3>\n<p>Persediaan selalu dievaluasi untuk meningkatkan efisiensi.</p>\n<h3 class=\"sec-head\">C. KLASIFIKASI BARANG</h3>\n<p>Seluruh barang Lorongsatu21 wajib memiliki klasifikasi.</p>\n<p><strong>Berdasarkan Fungsi</strong></p>\n<ul><li>Barang Dagangan</li><li>Bahan Baku</li><li>Barang Pendukung Produksi</li><li>Barang Habis Pakai</li><li>Aset Kecil</li><li>Aset Tetap</li></ul>\n<p><strong>Berdasarkan Pergerakan</strong></p>\n<ul><li>Fast Moving</li><li>Medium Moving</li><li>Slow Moving</li><li>Non Moving</li></ul>\n<p>Evaluasi dilakukan minimal setiap tiga bulan.</p>\n<p><strong>Berdasarkan Nilai</strong></p>\n<ul><li>Tinggi</li><li>Sedang</li><li>Rendah</li></ul>\n<p>Klasifikasi ini digunakan untuk menentukan prioritas pengawasan.</p>\n<h3 class=\"sec-head\">D. PARAMETER WAJIB MASTER BARANG</h3>\n<p>Setiap barang minimal memiliki data berikut:</p>\n<ul><li>Kode Barang</li><li>Barcode/QR Code (bila digunakan)</li><li>Nama Barang</li><li>Kategori</li><li>Merek</li><li>Satuan Dasar</li><li>Konversi Satuan</li><li>Lokasi Penyimpanan</li><li>Stok Saat Ini</li><li>Stok Minimum</li><li>Stok Maksimum</li><li>Safety Stock</li><li>Reorder Point (ROP)</li><li>Lead Time</li><li>Harga Pokok Terakhir</li><li>Harga Rata-rata (jika digunakan)</li><li>Harga Jual</li><li>Status Aktif/Tidak Aktif</li><li>Pemasok Utama</li><li>Pemasok Alternatif</li></ul>\n<h3 class=\"sec-head\">E. JENIS TRANSAKSI PERSEDIAAN</h3>\n<p>Setiap perubahan stok harus berasal dari transaksi yang sah.</p>\n<p><strong>Barang Masuk</strong></p>\n<ul><li>Pembelian</li><li>Retur Penjualan</li><li>Koreksi Positif</li><li>Produksi Selesai</li><li>Mutasi Masuk</li></ul>\n<p><strong>Barang Keluar</strong></p>\n<ul><li>Penjualan</li><li>Pemakaian Operasional</li><li>Produksi</li><li>Barang Rusak</li><li>Retur Pembelian</li><li>Mutasi Keluar</li><li>Koreksi Negatif</li></ul>\n<p>Tidak diperkenankan mengubah stok secara langsung tanpa transaksi yang sah.</p>\n<h3 class=\"sec-head\">F. STATUS BARANG</h3>\n<p>Untuk memudahkan pengendalian, barang dapat memiliki status:</p>\n<ul><li>Aktif</li><li>Stok Aman</li><li>Mendekati Minimum</li><li>Harus Dibeli</li><li>Karantina</li><li>Rusak</li><li>Retur</li><li>Tidak Aktif</li></ul>\n<p>Status diperbarui sesuai kondisi terbaru.</p>\n<h3 class=\"sec-head\">G. INDIKATOR KINERJA (KPI)</h3>\n<p>Keberhasilan pengelolaan persediaan diukur melalui:</p>\n<ul><li>Akurasi stok ≥ 98%.</li><li>Selisih stock opname ≤ 2%.</li><li>Kehabisan stok barang prioritas ≤ 1% per bulan.</li><li>Nilai barang rusak sesuai target perusahaan.</li><li>Barang non-moving terus menurun.</li><li>Waktu pencarian barang ≤ 3 menit.</li><li>Ketepatan pembelian berdasarkan ROP ≥ 95%.</li></ul>\n<p>Target KPI dapat ditinjau setiap tahun.</p>\n<h3 class=\"sec-head\">H. DASHBOARD PERSEDIAAN L21</h3>\n<p>Penanggung Jawab Cabang memantau minimal:</p>\n<ul><li>Total SKU.</li><li>Total nilai persediaan.</li><li>Barang Fast Moving.</li><li>Barang Slow Moving.</li><li>Barang Non Moving.</li><li>Barang di bawah stok minimum.</li><li>Barang mendekati kedaluwarsa (jika berlaku).</li><li>Nilai barang rusak.</li><li>Nilai retur.</li><li>Barang dalam Area Karantina.</li></ul>\n<p>Dashboard diperbarui secara berkala sebagai dasar pengambilan keputusan.</p>\n<h3 class=\"sec-head\">I. INTEGRASI DENGAN STANDAR LAIN</h3>\n<p>SL21-504 menjadi pusat integrasi dengan:</p>\n<ul><li>SL21-501 Standar Pembelian.</li><li>SL21-502 Standar Penerimaan Barang.</li><li>SL21-503 Standar Penyimpanan Barang.</li><li>SL21-505 Standar Stock Opname.</li><li>SL21-506 Standar Pengeluaran Barang.</li><li>SL21-507 Standar Retur Barang.</li><li>Standar Keuangan.</li><li>Standar Penjualan.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">J. ATURAN EMAS PERSEDIAAN L21</div>\n<p>Seluruh Anggota Tim wajib memegang sepuluh aturan berikut:</p>\n<ul><li>Tidak ada barang tanpa kode.</li><li>Tidak ada barang tanpa lokasi.</li><li>Tidak ada barang masuk tanpa pencatatan.</li><li>Tidak ada barang keluar tanpa pencatatan.</li><li>Tidak ada perubahan stok tanpa dokumen.</li><li>Tidak ada stok negatif kecuali telah disetujui sesuai prosedur.</li><li>Selalu gunakan FIFO atau FEFO sesuai jenis barang.</li><li>Pisahkan barang rusak dan barang karantina dari stok aktif.</li><li>Lakukan pemeriksaan stok secara berkala.</li><li>Setiap selisih stok harus dicari penyebabnya, bukan hanya disesuaikan angkanya.</li></ul></div>\n<h3 class=\"sec-head\">K. PRINSIP L21</h3>\n<p>Persediaan bukan sekadar menghitung barang.</p>\n<p>Persediaan adalah menjaga agar barang yang tepat tersedia, pada jumlah yang tepat, di tempat yang tepat, pada waktu yang tepat, dengan biaya yang tepat, sehingga Lorongsatu21 mampu memberikan pelayanan terbaik kepada pelanggan.</p>", "order": 64, "no_formal_header": true}]}, {"code": "SL21-505", "official_title": "Standar Stock Opname", "status": "ok", "note": "", "versions": [{"title": "STOCK OPNAME", "meta": {"Kode Dokumen": "SL21-505", "Versi": "1.0 (Final)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pelaksanaan stock opname agar jumlah fisik barang sesuai dengan data persediaan, setiap selisih dapat diketahui penyebabnya, dan tindakan perbaikan dilakukan secara terdokumentasi.</p>\n<p>Stock opname merupakan proses verifikasi yang menjaga keakuratan data persediaan dan mendukung pengambilan keputusan yang tepat.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Stock opname adalah proses verifikasi, bukan sekadar menghitung barang.</li><li>Selisih stok merupakan informasi yang harus dianalisis, bukan sekadar disesuaikan.</li><li>Keakuratan persediaan mencerminkan kualitas pengelolaan operasional.</li><li>Data yang benar menghasilkan keputusan yang benar.</li></ul>\n<p>Moto:</p>\n<p><strong>Hitung • Cocokkan • Analisis • Perbaiki</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap stock opname harus:</p>\n<ul><li>objektif;</li><li>teliti;</li><li>terdokumentasi;</li><li>dapat ditelusuri;</li><li>menghasilkan tindakan perbaikan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh persediaan Lorongsatu21, meliputi:</p>\n<ul><li>barang dagangan;</li><li>bahan baku;</li><li>bahan habis pakai;</li><li>ATK operasional;</li><li>bahan percetakan;</li><li>tinta;</li><li>kertas;</li><li>suku cadang;</li><li>perlengkapan kerja;</li><li>persediaan lainnya.</li></ul>\n<h3 class=\"sec-head\">5. LIMA STANDAR STOCK OPNAME L21</h3>\n<h3 class=\"sec-head\">A. Hitung Fisik</h3>\n<p>Pastikan seluruh barang dihitung berdasarkan kondisi fisik sebenarnya.</p>\n<h3 class=\"sec-head\">B. Cocokkan Data</h3>\n<p>Bandingkan hasil perhitungan fisik dengan data persediaan yang berlaku.</p>\n<h3 class=\"sec-head\">C. Analisis Selisih</h3>\n<p>Apabila terdapat selisih, lakukan analisis terhadap kemungkinan penyebab, seperti:</p>\n<ul><li>kesalahan pencatatan;</li><li>barang belum dicatat;</li><li>salah lokasi;</li><li>kehilangan;</li><li>kerusakan;</li><li>kesalahan satuan.</li></ul>\n<h3 class=\"sec-head\">D. Tindak Lanjut</h3>\n<p>Setiap selisih harus memiliki:</p>\n<ul><li>penyebab;</li><li>tindakan perbaikan;</li><li>persetujuan sesuai kewenangan;</li><li>dokumentasi.</li></ul>\n<h3 class=\"sec-head\">E. Evaluasi</h3>\n<p>Hasil stock opname digunakan untuk:</p>\n<ul><li>meningkatkan akurasi persediaan;</li><li>memperbaiki prosedur;</li><li>menyusun rencana pembelian;</li><li>mengevaluasi sistem penyimpanan.</li></ul>\n<h3 class=\"sec-head\">6. JENIS STOCK OPNAME</h3>\n<p><strong>Harian</strong></p>\n<p>Untuk barang tertentu yang bernilai tinggi atau sangat cepat bergerak.</p>\n<p><strong>Mingguan</strong></p>\n<p>Untuk kategori barang prioritas.</p>\n<p><strong>Bulanan</strong></p>\n<p>Untuk seluruh kategori utama.</p>\n<p><strong>Tahunan</strong></p>\n<p>Pemeriksaan menyeluruh terhadap seluruh persediaan sebagai bagian dari evaluasi akhir tahun.</p>\n<p>Frekuensi dapat disesuaikan dengan kebutuhan operasional.</p>\n<h3 class=\"sec-head\">7. ALUR STOCK OPNAME</h3>\n<ul><li>Menentukan jadwal stock opname.</li><li>Menyiapkan daftar barang.</li><li>Menghitung fisik barang.</li><li>Mencocokkan dengan data persediaan.</li><li>Mencatat selisih.</li><li>Menganalisis penyebab.</li><li>Melakukan tindakan perbaikan sesuai persetujuan.</li><li>Memperbarui data apabila diperlukan.</li><li>Menyusun laporan hasil stock opname.</li></ul>\n<h3 class=\"sec-head\">8. STANDAR KUALITAS</h3>\n<p>Stock opname dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh barang diperiksa;</li><li>data hasil perhitungan akurat;</li><li>selisih terdokumentasi;</li><li>penyebab selisih dianalisis;</li><li>tindakan perbaikan dilakukan sesuai prosedur.</li></ul>\n<h3 class=\"sec-head\">9. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>melakukan perhitungan sesuai prosedur;</li><li>mencatat hasil secara benar;</li><li>melaporkan setiap selisih.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>mengesahkan hasil stock opname;</li><li>mengevaluasi penyebab selisih;</li><li>menyetujui penyesuaian stok;</li><li>menyusun rencana perbaikan.</li></ul>\n<h3 class=\"sec-head\">10. INDIKATOR KEBERHASILAN</h3>\n<p>Stock opname dinilai berhasil apabila:</p>\n<ul><li>akurasi stok tinggi;</li><li>selisih stok rendah;</li><li>penyebab selisih dapat dijelaskan;</li><li>tindakan perbaikan dilaksanakan;</li><li>tren akurasi meningkat dari waktu ke waktu.</li></ul>\n<h3 class=\"sec-head\">11. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-502 Standar Penerimaan Barang;</li><li>SL21-503 Standar Penyimpanan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-506 Standar Pengeluaran Barang.</li></ul>\n<h3 class=\"sec-head\">12. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>tanggal stock opname;</li><li>lokasi;</li><li>petugas;</li><li>hasil hitung fisik;</li><li>data sistem;</li><li>selisih;</li><li>penyebab;</li><li>tindakan perbaikan;</li><li>status penyelesaian.</li></ul>\n<h3 class=\"sec-head\">13. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>stock opname dilaksanakan sesuai jadwal;</li><li>seluruh hasil terdokumentasi;</li><li>penyesuaian stok memperoleh persetujuan;</li><li>penyebab selisih dianalisis;</li><li>tindakan perbaikan ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">14. PERBAIKAN BERKELANJUTAN</h3>\n<p>Hasil stock opname menjadi dasar untuk:</p>\n<ul><li>meningkatkan akurasi persediaan;</li><li>memperbaiki tata letak penyimpanan;</li><li>menyempurnakan prosedur pembelian dan pengeluaran barang;</li><li>meningkatkan kompetensi Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Stock opname merupakan proses pengendalian yang memastikan kesesuaian antara kondisi fisik barang dan data persediaan.</p>\n<p>Melalui perhitungan yang teliti, analisis yang objektif, dan tindakan perbaikan yang terdokumentasi, Lorongsatu21 menjaga keakuratan persediaan sebagai dasar pelayanan, operasional, dan pengambilan keputusan yang berkualitas.</p>", "order": 65, "no_formal_header": false}]}, {"code": "SL21-506", "official_title": "Standar Pengeluaran Barang", "status": "ok", "note": "", "versions": [{"title": "PENGELUARAN BARANG", "meta": {"Kode Dokumen": "SL21-506", "Versi": "2.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengeluaran barang agar setiap barang yang keluar dari persediaan dilakukan secara sah, terdokumentasi, akurat, dapat ditelusuri, dan sesuai dengan kebutuhan operasional maupun pelayanan pelanggan.</p>\n<p>Standar ini bertujuan menjaga keakuratan persediaan, mencegah kehilangan, mengurangi pemborosan, serta memastikan seluruh pergerakan barang keluar dapat dipertanggungjawabkan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Setiap barang merupakan aset perusahaan.</li><li>Barang hanya boleh keluar untuk tujuan yang sah.</li><li>Setiap pengeluaran harus meninggalkan jejak administrasi.</li><li>Pengendalian yang baik menjaga kepercayaan pelanggan dan keberlanjutan usaha.</li></ul>\n<p>Moto:</p>\n<p><strong>Verifikasi • Keluarkan • Catat • Telusuri</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh pengeluaran barang harus memenuhi prinsip berikut:</p>\n<ul><li>memiliki tujuan yang jelas;</li><li>menggunakan dokumen yang sah;</li><li>memperoleh persetujuan sesuai kewenangan;</li><li>dicatat segera setelah transaksi;</li><li>dapat ditelusuri kembali;</li><li>menjaga akurasi data persediaan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh pengeluaran:</p>\n<ul><li>barang dagangan;</li><li>bahan baku;</li><li>bahan habis pakai;</li><li>ATK operasional;</li><li>tinta;</li><li>kertas;</li><li>perlengkapan finishing;</li><li>suku cadang;</li><li>aset kecil;</li><li>perlengkapan kerja;</li><li>persediaan lainnya.</li></ul>\n<h3 class=\"sec-head\">5. KLASIFIKASI PENGELUARAN BARANG</h3>\n<p>Seluruh transaksi pengeluaran wajib diklasifikasikan sebagai berikut.</p>\n<h3 class=\"sec-head\">A. Penjualan</h3>\n<p>Barang keluar kepada pelanggan berdasarkan transaksi penjualan.</p>\n<h3 class=\"sec-head\">B. Produksi</h3>\n<p>Bahan baku atau bahan pendukung yang digunakan dalam proses produksi.</p>\n<h3 class=\"sec-head\">C. Operasional</h3>\n<p>Barang yang digunakan untuk kegiatan operasional perusahaan.</p>\n<h3 class=\"sec-head\">D. Retur Pembelian</h3>\n<p>Barang dikembalikan kepada pemasok sesuai prosedur retur.</p>\n<h3 class=\"sec-head\">E. Mutasi</h3>\n<p>Perpindahan barang antar lokasi, gudang, atau cabang.</p>\n<h3 class=\"sec-head\">F. Barang Rusak atau Hilang</h3>\n<p>Pengeluaran karena kerusakan, kehilangan, atau penyusutan yang telah memperoleh persetujuan.</p>\n<h3 class=\"sec-head\">G. Lainnya</h3>\n<p>Pengeluaran dengan tujuan khusus yang telah disetujui dan terdokumentasi.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR PENGELUARAN BARANG L21</h3>\n<h3 class=\"sec-head\">A. Tujuan Jelas</h3>\n<p>Setiap pengeluaran harus memiliki alasan yang sah dan sesuai dengan klasifikasi pengeluaran.</p>\n<h3 class=\"sec-head\">B. Dokumen Sah</h3>\n<p>Pengeluaran didukung dokumen yang sesuai, seperti:</p>\n<ul><li>nota penjualan;</li><li>formulir permintaan barang;</li><li>surat jalan;</li><li>formulir mutasi;</li><li>formulir retur;</li><li>dokumen operasional lainnya.</li></ul>\n<h3 class=\"sec-head\">C. Barang Benar</h3>\n<p>Pastikan:</p>\n<ul><li>kode barang benar;</li><li>nama barang benar;</li><li>jumlah benar;</li><li>satuan benar;</li><li>lokasi pengambilan benar.</li></ul>\n<h3 class=\"sec-head\">D. Pencatatan Akurat</h3>\n<p>Setiap pengeluaran wajib memperbarui data persediaan dengan mencatat:</p>\n<ul><li>tanggal;</li><li>waktu;</li><li>nomor transaksi;</li><li>petugas;</li><li>tujuan pengeluaran;</li><li>jumlah barang.</li></ul>\n<h3 class=\"sec-head\">E. Dapat Ditelusuri</h3>\n<p>Seluruh transaksi pengeluaran harus dapat ditelusuri melalui dokumen, riwayat transaksi, dan data persediaan.</p>\n<h3 class=\"sec-head\">7. PRINSIP DUA VERIFIKASI</h3>\n<p>Untuk barang bernilai tinggi, sensitif, atau berisiko tinggi, diterapkan dua tahap verifikasi.</p>\n<p><strong>Verifikasi Pertama</strong></p>\n<p>Dilakukan oleh Petugas Gudang untuk memastikan:</p>\n<ul><li>barang benar;</li><li>jumlah benar;</li><li>kondisi baik.</li></ul>\n<p><strong>Verifikasi Kedua</strong></p>\n<p>Dilakukan oleh penerima barang atau Penanggung Jawab untuk memastikan barang yang diterima telah sesuai.</p>\n<p>Penerapan dua verifikasi bertujuan mengurangi risiko salah ambil, salah jumlah, kehilangan, dan penyalahgunaan.</p>\n<h3 class=\"sec-head\">8. ALUR PENGELUARAN BARANG</h3>\n<ul><li>Terima permintaan pengeluaran.</li><li>Verifikasi kebutuhan.</li><li>Verifikasi persetujuan.</li><li>Ambil barang sesuai lokasi.</li><li>Lakukan pemeriksaan barang.</li><li>Terapkan dua verifikasi apabila diperlukan.</li><li>Serahkan barang.</li><li>Catat transaksi.</li><li>Arsipkan dokumen.</li></ul>\n<h3 class=\"sec-head\">9. STANDAR KUALITAS</h3>\n<p>Pengeluaran barang dinyatakan memenuhi standar apabila:</p>\n<ul><li>barang sesuai permintaan;</li><li>jumlah sesuai;</li><li>dokumen lengkap;</li><li>stok diperbarui;</li><li>transaksi dapat ditelusuri;</li><li>tidak terjadi kesalahan pengeluaran.</li></ul>\n<h3 class=\"sec-head\">10. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>memverifikasi dokumen;</li><li>mengambil barang sesuai lokasi;</li><li>memastikan ketepatan jumlah;</li><li>mencatat transaksi;</li><li>menjaga keamanan barang.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memberikan persetujuan sesuai kewenangan;</li><li>mengawasi pengeluaran barang;</li><li>mengevaluasi transaksi yang tidak biasa;</li><li>memastikan kepatuhan terhadap standar.</li></ul>\n<h3 class=\"sec-head\">11. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengeluaran barang diukur melalui:</p>\n<ul><li>akurasi pengeluaran ≥ 99%;</li><li>tidak ada pengeluaran tanpa dokumen;</li><li>tidak ada stok negatif tanpa persetujuan;</li><li>waktu pelayanan pengeluaran sesuai target;</li><li>seluruh transaksi dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">12. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-503 Standar Penyimpanan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-505 Standar Stock Opname;</li><li>SL21-507 Standar Retur Barang;</li><li>Standar Penjualan;</li><li>Standar Produksi.</li></ul>\n<h3 class=\"sec-head\">13. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>nomor transaksi;</li><li>tanggal;</li><li>waktu;</li><li>kode barang;</li><li>nama barang;</li><li>kategori pengeluaran;</li><li>jumlah;</li><li>satuan;</li><li>lokasi;</li><li>tujuan;</li><li>petugas;</li><li>penerima;</li><li>dokumen pendukung.</li></ul>\n<h3 class=\"sec-head\">14. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh pengeluaran memiliki dokumen;</li><li>transaksi telah dicatat;</li><li>stok telah diperbarui;</li><li>pengeluaran sesuai klasifikasi;</li><li>prinsip dua verifikasi diterapkan pada barang yang dipersyaratkan.</li></ul>\n<h3 class=\"sec-head\">15. PERBAIKAN BERKELANJUTAN</h3>\n<p>Data pengeluaran, hasil audit, stock opname, dan evaluasi operasional digunakan untuk:</p>\n<ul><li>meningkatkan akurasi persediaan;</li><li>mengurangi pemborosan;</li><li>menyempurnakan prosedur kerja;</li><li>meningkatkan efisiensi operasional.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">16. ATURAN EMAS PENGELUARAN BARANG L21</div>\n<p>Seluruh Anggota Tim wajib mematuhi ketentuan berikut:</p>\n<ul><li>Tidak ada barang keluar tanpa dokumen.</li><li>Tidak ada barang keluar tanpa tujuan yang jelas.</li><li>Tidak ada barang keluar tanpa pencatatan.</li><li>Tidak ada stok negatif tanpa persetujuan.</li><li>Barang bernilai tinggi mengikuti Prinsip Dua Verifikasi.</li><li>Setiap transaksi harus dapat ditelusuri.</li><li>Setiap penyimpangan wajib dilaporkan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pengeluaran barang merupakan bagian penting dari pengendalian persediaan Lorongsatu21.</p>\n<p>Melalui verifikasi, pencatatan, pengendalian, dan dokumentasi yang konsisten, Lorongsatu21 memastikan setiap barang keluar secara sah, tepat, dapat dipertanggungjawabkan, serta mendukung pelayanan yang cepat, akurat, dan profesional kepada pelanggan.</p>", "order": 66, "no_formal_header": false}]}, {"code": "SL21-507", "official_title": "Standar Retur Barang", "status": "ok", "note": "", "versions": [{"title": "RETUR BARANG", "meta": {"Kode Dokumen": "SL21-507", "Versi": "3.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan retur barang agar setiap barang yang dikembalikan, baik kepada pemasok, dari pelanggan, maupun antarbagian internal, diproses secara cepat, adil, terdokumentasi, dan dapat dipertanggungjawabkan.</p>\n<p>Standar ini bertujuan menjaga akurasi persediaan, meningkatkan kualitas pelayanan, memperbaiki proses operasional, serta membangun hubungan yang baik dengan pelanggan dan pemasok.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Retur merupakan bagian dari pengendalian mutu.</li><li>Setiap retur adalah peluang untuk melakukan perbaikan.</li><li>Barang retur harus diperlakukan secara tertib dan terpisah dari stok aktif.</li><li>Penyebab retur lebih penting dipelajari daripada sekadar menyelesaikan proses retur.</li></ul>\n<p>Moto:</p>\n<p><strong>Verifikasi • Dokumentasikan • Analisis • Selesaikan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Setiap proses retur harus:</p>\n<ul><li>memiliki alasan yang sah;</li><li>didukung dokumen yang lengkap;</li><li>melalui pemeriksaan fisik;</li><li>tercatat dalam sistem;</li><li>memiliki status yang jelas;</li><li>menghasilkan tindakan penyelesaian.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh proses retur di Lorongsatu21.</p>\n<h3 class=\"sec-head\">A. Retur Pembelian</h3>\n<p>Pengembalian barang kepada pemasok karena tidak sesuai dengan pesanan atau spesifikasi.</p>\n<h3 class=\"sec-head\">B. Retur Penjualan</h3>\n<p>Pengembalian barang oleh pelanggan sesuai kebijakan perusahaan.</p>\n<h3 class=\"sec-head\">C. Retur Internal</h3>\n<p>Pengembalian barang dari bagian produksi, operasional, gudang, atau antarbagian karena kesalahan, kerusakan, atau tidak lagi diperlukan.</p>\n<h3 class=\"sec-head\">5. ALASAN RETUR</h3>\n<p>Retur dapat dilakukan apabila:</p>\n<ul><li>barang rusak;</li><li>barang cacat;</li><li>barang tidak sesuai spesifikasi;</li><li>barang salah kirim;</li><li>jumlah tidak sesuai;</li><li>masa kedaluwarsa tidak memenuhi ketentuan (jika berlaku);</li><li>kesalahan administrasi;</li><li>kesalahan produksi;</li><li>alasan lain yang disetujui sesuai prosedur.</li></ul>\n<h3 class=\"sec-head\">6. AREA PENGELOLAAN BARANG RETUR</h3>\n<p>Barang retur <strong>tidak boleh langsung dimasukkan ke stok aktif</strong>.</p>\n<p>Seluruh barang retur ditempatkan pada <strong>Area Retur</strong> yang terpisah dari:</p>\n<ul><li>Area Transit;</li><li>Area Penyimpanan;</li><li>Area Karantina.</li></ul>\n<p>Area Retur digunakan untuk barang yang:</p>\n<ul><li>menunggu penggantian;</li><li>menunggu pengiriman kembali ke pemasok;</li><li>menunggu keputusan akhir;</li><li>menunggu penyelesaian administrasi.</li></ul>\n<h3 class=\"sec-head\">7. LIMA STANDAR RETUR BARANG L21</h3>\n<h3 class=\"sec-head\">A. Alasan Jelas</h3>\n<p>Setiap retur wajib memiliki alasan yang terdokumentasi.</p>\n<h3 class=\"sec-head\">B. Pemeriksaan Menyeluruh</h3>\n<p>Pastikan:</p>\n<ul><li>identitas barang benar;</li><li>jumlah benar;</li><li>kondisi barang diperiksa;</li><li>penyebab retur dicatat.</li></ul>\n<h3 class=\"sec-head\">C. Dokumen Lengkap</h3>\n<p>Retur didukung oleh:</p>\n<ul><li>formulir retur;</li><li>nota atau faktur;</li><li>bukti pembelian atau pengiriman;</li><li>dokumentasi foto (bila diperlukan);</li><li>persetujuan sesuai kewenangan.</li></ul>\n<h3 class=\"sec-head\">D. Pencatatan Akurat</h3>\n<p>Seluruh perubahan akibat retur harus memperbarui:</p>\n<ul><li>data persediaan;</li><li>status barang;</li><li>transaksi pembelian atau penjualan;</li><li>riwayat barang.</li></ul>\n<h3 class=\"sec-head\">E. Penyelesaian Jelas</h3>\n<p>Setiap retur harus memiliki keputusan akhir, yaitu:</p>\n<ul><li>diterima kembali;</li><li>diganti;</li><li>diperbaiki;</li><li>dikembalikan kepada pemasok;</li><li>dijual sebagai barang khusus (bila sesuai kebijakan);</li><li>dimusnahkan sesuai prosedur.</li></ul>\n<h3 class=\"sec-head\">8. STATUS BARANG RETUR</h3>\n<p>Setiap barang retur memiliki salah satu status berikut:</p>\n<ul><li>Menunggu Pemeriksaan.</li><li>Menunggu Persetujuan.</li><li>Menunggu Penggantian.</li><li>Menunggu Pengiriman.</li><li>Disetujui.</li><li>Ditolak.</li><li>Selesai.</li><li>Dimusnahkan.</li></ul>\n<p>Status harus selalu diperbarui dalam sistem.</p>\n<h3 class=\"sec-head\">9. ALUR RETUR BARANG</h3>\n<ul><li>Terima permintaan retur.</li><li>Verifikasi dokumen.</li><li>Periksa kondisi barang.</li><li>Tempatkan barang di Area Retur.</li><li>Tentukan jenis retur.</li><li>Berikan status awal.</li><li>Lakukan analisis penyebab.</li><li>Tentukan tindakan penyelesaian.</li><li>Perbarui data persediaan.</li><li>Arsipkan seluruh dokumen.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Retur dinyatakan memenuhi standar apabila:</p>\n<ul><li>alasan retur dapat dibuktikan;</li><li>pemeriksaan selesai;</li><li>dokumen lengkap;</li><li>status jelas;</li><li>data persediaan diperbarui;</li><li>penyelesaian terdokumentasi.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menerima barang retur;</li><li>memeriksa barang;</li><li>menjaga Area Retur;</li><li>memperbarui data;</li><li>melaporkan penyebab retur.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyetujui retur sesuai kewenangan;</li><li>menentukan keputusan akhir;</li><li>mengevaluasi tren retur;</li><li>melakukan tindakan perbaikan.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan retur diukur melalui:</p>\n<ul><li>seluruh retur memiliki dokumen;</li><li>seluruh barang retur memiliki status;</li><li>waktu penyelesaian retur sesuai target;</li><li>tidak ada barang retur tercampur dengan stok aktif;</li><li>penyebab retur terdokumentasi;</li><li>tren retur berulang menurun.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-502 Standar Penerimaan Barang;</li><li>SL21-503 Standar Penyimpanan Barang;</li><li>SL21-504 Standar Persediaan;</li><li>SL21-506 Standar Pengeluaran Barang;</li><li>SL21-301 Standar Pelayanan Pelanggan;</li><li>SL21-302 Standar Penanganan Keluhan.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>nomor retur;</li><li>tanggal;</li><li>jenis retur;</li><li>kode dan nama barang;</li><li>jumlah;</li><li>alasan retur;</li><li>kondisi barang;</li><li>lokasi penyimpanan (Area Retur);</li><li>status;</li><li>tindakan penyelesaian;</li><li>petugas;</li><li>pihak terkait.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh retur terdokumentasi;</li><li>barang retur berada di Area Retur;</li><li>data persediaan telah diperbarui;</li><li>penyebab retur dianalisis;</li><li>tindakan perbaikan dilaksanakan.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap data retur digunakan untuk:</p>\n<ul><li>mengevaluasi kualitas pemasok;</li><li>mengevaluasi kualitas produksi;</li><li>memperbaiki proses penyimpanan;</li><li>meningkatkan kualitas pelayanan;</li><li>mengurangi kejadian retur di masa mendatang.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS RETUR BARANG L21</div>\n<p>Seluruh Anggota Tim wajib mematuhi ketentuan berikut:</p>\n<ul><li>Tidak ada retur tanpa alasan yang jelas.</li><li>Tidak ada retur tanpa pemeriksaan fisik.</li><li>Tidak ada retur tanpa dokumen.</li><li>Tidak ada barang retur yang langsung masuk ke stok aktif.</li><li>Seluruh barang retur ditempatkan di Area Retur.</li><li>Setiap retur harus memiliki status.</li><li>Setiap retur harus memiliki keputusan akhir.</li><li>Setiap perubahan stok akibat retur harus dicatat.</li><li>Penyebab retur wajib dianalisis.</li><li>Setiap retur menjadi bahan pembelajaran untuk mencegah kejadian serupa.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Retur barang merupakan bagian dari sistem pengendalian mutu, persediaan, dan pelayanan pelanggan Lorongsatu21.</p>\n<p>Melalui proses yang terstruktur, terdokumentasi, dan berorientasi pada perbaikan berkelanjutan, Lorongsatu21 memastikan bahwa setiap retur diselesaikan secara cepat, adil, transparan, dan dapat dipertanggungjawabkan, sekaligus menjadi sumber pembelajaran untuk meningkatkan kualitas operasional perusahaan.</p>", "order": 67, "no_formal_header": false}]}, {"code": "SL21-508", "official_title": "Standar Pengelolaan Aset", "status": "ok", "note": "", "versions": [{"title": "PENGELOLAAN ASET PERUSAHAAN", "meta": {"Kode Dokumen": "SL21-508", "Versi": "3.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan aset perusahaan agar seluruh aset Lorongsatu21 tercatat, teridentifikasi, digunakan secara bertanggung jawab, dipelihara, diamankan, dievaluasi, dan dimanfaatkan secara optimal untuk mendukung operasional perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Aset merupakan investasi perusahaan.</li><li>Aset harus memberikan manfaat bagi pelanggan dan perusahaan.</li><li>Setiap aset memiliki nilai yang harus dijaga.</li><li>Pengelolaan aset yang baik meningkatkan produktivitas dan keberlanjutan usaha.</li></ul>\n<p>Moto:</p>\n<p><strong>Catat • Gunakan • Jaga • Kembangkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh aset harus:</p>\n<ul><li>memiliki identitas;</li><li>memiliki penanggung jawab;</li><li>digunakan sesuai fungsi;</li><li>dipelihara secara berkala;</li><li>tercatat sepanjang siklus hidupnya.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh aset Lorongsatu21.</p>\n<h3 class=\"sec-head\">A. Aset Tetap</h3>\n<ul><li>Bangunan</li><li>Mesin fotokopi</li><li>Printer</li><li>Komputer</li><li>Laptop</li><li>Kamera</li><li>Mesin produksi</li><li>Kendaraan</li><li>Peralatan kantor</li></ul>\n<h3 class=\"sec-head\">B. Aset Bergerak</h3>\n<ul><li>Peralatan kerja</li><li>Peralatan servis</li><li>Peralatan pendukung produksi</li></ul>\n<h3 class=\"sec-head\">C. Aset Digital</h3>\n<ul><li>Lisensi perangkat lunak</li><li>Domain</li><li>Hosting</li><li>Akun bisnis</li><li>Template desain</li><li>Database perusahaan</li><li>Arsip digital</li></ul>\n<h3 class=\"sec-head\">D. Aset Tidak Berwujud</h3>\n<ul><li>Merek dagang</li><li>Hak cipta</li><li>SOP</li><li>Standar L21</li><li>L21OS</li><li>Dokumen intelektual perusahaan</li></ul>\n<h3 class=\"sec-head\">5. SIKLUS HIDUP ASET</h3>\n<p>Seluruh aset mengikuti siklus:</p>\n<p>Perencanaan</p>\n<p>↓</p>\n<p>Pengadaan</p>\n<p>↓</p>\n<p>Penerimaan</p>\n<p>↓</p>\n<p>Pencatatan</p>\n<p>↓</p>\n<p>Pemanfaatan</p>\n<p>↓</p>\n<p>Pemeliharaan</p>\n<p>↓</p>\n<p>Evaluasi</p>\n<p>↓</p>\n<p>Perbaikan</p>\n<p>↓</p>\n<p>Penghapusan</p>\n<p>↓</p>\n<p>Arsip</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR PENGELOLAAN ASET L21</h3>\n<h3 class=\"sec-head\">A. Identitas Jelas</h3>\n<p>Setiap aset memiliki:</p>\n<ul><li>kode aset;</li><li>nama aset;</li><li>nomor seri (jika ada);</li><li>lokasi;</li><li>tanggal perolehan;</li><li>nilai perolehan;</li><li>penanggung jawab.</li></ul>\n<h3 class=\"sec-head\">B. Digunakan dengan Benar</h3>\n<p>Aset digunakan:</p>\n<ul><li>sesuai fungsi;</li><li>sesuai petunjuk penggunaan;</li><li>oleh personel yang berwenang.</li></ul>\n<h3 class=\"sec-head\">C. Dijaga</h3>\n<p>Setiap aset:</p>\n<ul><li>dibersihkan;</li><li>diperiksa;</li><li>diamankan;</li><li>dilindungi dari kerusakan.</li></ul>\n<h3 class=\"sec-head\">D. Dipelihara</h3>\n<p>Pemeliharaan dilakukan:</p>\n<ul><li>terjadwal;</li><li>terdokumentasi;</li><li>sesuai rekomendasi pabrikan atau kebutuhan operasional.</li></ul>\n<h3 class=\"sec-head\">E. Dievaluasi</h3>\n<p>Evaluasi aset meliputi:</p>\n<ul><li>kondisi;</li><li>tingkat pemanfaatan;</li><li>biaya pemeliharaan;</li><li>kebutuhan penggantian;</li><li>nilai ekonomis.</li></ul>\n<h3 class=\"sec-head\">7. KLASIFIKASI KONDISI ASET</h3>\n<p>Setiap aset diberi status:</p>\n<ul><li>Sangat Baik.</li><li>Baik.</li><li>Perlu Perawatan.</li><li>Perlu Perbaikan.</li><li>Rusak Berat.</li><li>Tidak Digunakan.</li><li>Dihapus.</li></ul>\n<h3 class=\"sec-head\">8. ALUR PENGELOLAAN ASET</h3>\n<ul><li>Pengadaan.</li><li>Penerimaan.</li><li>Pemberian kode aset.</li><li>Pencatatan.</li><li>Penempatan.</li><li>Penetapan penanggung jawab.</li><li>Penggunaan.</li><li>Pemeliharaan.</li><li>Evaluasi.</li><li>Penghapusan bila diperlukan.</li></ul>\n<h3 class=\"sec-head\">9. STANDAR KUALITAS</h3>\n<p>Pengelolaan aset dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh aset memiliki identitas;</li><li>lokasi aset diketahui;</li><li>penanggung jawab ditetapkan;</li><li>kondisi aset dipantau;</li><li>riwayat aset terdokumentasi.</li></ul>\n<h3 class=\"sec-head\">10. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menggunakan aset dengan benar;</li><li>menjaga kebersihan dan keamanan aset;</li><li>melaporkan kerusakan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>mengawasi penggunaan aset;</li><li>menyetujui perpindahan aset;</li><li>mengevaluasi kondisi aset;</li><li>menyusun rencana penggantian aset.</li></ul>\n<h3 class=\"sec-head\">11. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan aset diukur melalui:</p>\n<ul><li>100% aset memiliki kode dan identitas.</li><li>100% aset memiliki penanggung jawab.</li><li>Riwayat pemeliharaan terdokumentasi.</li><li>Tidak ada aset hilang tanpa penjelasan.</li><li>Tingkat utilisasi aset sesuai kebutuhan operasional.</li><li>Penurunan kerusakan akibat kelalaian.</li></ul>\n<h3 class=\"sec-head\">12. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-502 Standar Penerimaan Barang;</li><li>SL21-509 Standar Pemeliharaan Peralatan;</li><li>Standar Keuangan;</li><li>Standar Keselamatan Kerja.</li></ul>\n<h3 class=\"sec-head\">13. PUSAT DATA L21</h3>\n<p>Setiap aset memiliki data berikut:</p>\n<ul><li>kode aset;</li><li>nama aset;</li><li>kategori;</li><li>nomor seri;</li><li>lokasi;</li><li>tanggal perolehan;</li><li>nilai perolehan;</li><li>umur manfaat;</li><li>kondisi;</li><li>penanggung jawab;</li><li>riwayat pemeliharaan;</li><li>riwayat perpindahan;</li><li>status.</li></ul>\n<h3 class=\"sec-head\">14. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh aset tercatat;</li><li>kondisi sesuai data;</li><li>aset berada di lokasi yang benar;</li><li>pemeliharaan dilakukan sesuai jadwal;</li><li>aset yang tidak digunakan dievaluasi.</li></ul>\n<h3 class=\"sec-head\">15. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi aset digunakan untuk:</p>\n<ul><li>meningkatkan produktivitas;</li><li>merencanakan investasi;</li><li>mengurangi biaya perbaikan;</li><li>memperpanjang umur aset;</li><li>meningkatkan efisiensi operasional.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">16. ATURAN EMAS PENGELOLAAN ASET L21</div>\n<ul><li>Tidak ada aset tanpa kode.</li><li>Tidak ada aset tanpa penanggung jawab.</li><li>Tidak ada aset berpindah lokasi tanpa pencatatan.</li><li>Tidak ada aset digunakan di luar fungsinya.</li><li>Seluruh kerusakan harus segera dilaporkan.</li><li>Seluruh pemeliharaan harus dicatat.</li><li>Seluruh aset dievaluasi secara berkala.</li><li>Seluruh aset digital diamankan dengan pengelolaan akses yang sesuai.</li><li>Seluruh aset yang sudah tidak layak digunakan harus diputuskan statusnya.</li><li>Setiap aset harus memberikan nilai bagi perusahaan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Aset merupakan investasi jangka panjang yang mendukung pelayanan, produktivitas, dan pertumbuhan Lorongsatu21.</p>\n<p>Melalui pencatatan yang lengkap, penggunaan yang bertanggung jawab, pemeliharaan yang teratur, serta evaluasi yang berkelanjutan, Lorongsatu21 memastikan setiap aset memberikan manfaat optimal sepanjang siklus hidupnya dan mendukung keberlangsungan usaha.</p>", "order": 68, "no_formal_header": false}]}, {"code": "SL21-509", "official_title": "Standar Pemeliharaan Peralatan", "status": "ok", "note": "", "versions": [{"title": "PEMELIHARAAN PERALATAN", "meta": {"Kode Dokumen": "SL21-509", "Versi": "4.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pemeliharaan seluruh peralatan operasional Lorongsatu21 agar selalu dalam kondisi aman, andal, siap digunakan, produktif, dan memiliki umur pakai yang optimal.</p>\n<p>Standar ini bertujuan mengurangi kerusakan, meminimalkan waktu henti (downtime), menjaga kualitas pelayanan, mengendalikan biaya perbaikan, serta melindungi investasi perusahaan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Peralatan adalah aset produktif perusahaan.</li><li>Pemeliharaan merupakan investasi jangka panjang.</li><li>Mencegah kerusakan selalu lebih baik daripada memperbaiki kerusakan.</li><li>Peralatan yang andal menghasilkan pelayanan yang andal.</li></ul>\n<p>Moto:</p>\n<p><strong>Periksa • Rawat • Catat • Tingkatkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh kegiatan pemeliharaan harus:</p>\n<ul><li>terjadwal;</li><li>terdokumentasi;</li><li>aman;</li><li>sesuai rekomendasi pabrikan;</li><li>berorientasi pada pencegahan kerusakan;</li><li>menghasilkan peningkatan keandalan peralatan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh peralatan operasional Lorongsatu21, meliputi:</p>\n<ul><li>mesin fotokopi;</li><li>printer;</li><li>komputer;</li><li>laptop;</li><li>kamera;</li><li>scanner;</li><li>mesin laminasi;</li><li>mesin potong;</li><li>mesin jilid;</li><li>mesin press;</li><li>UPS;</li><li>AC;</li><li>peralatan finishing;</li><li>peralatan pendukung lainnya.</li></ul>\n<h3 class=\"sec-head\">5. KLASIFIKASI PRIORITAS PERALATAN</h3>\n<p>Untuk menentukan prioritas pemeliharaan, seluruh peralatan dikelompokkan menjadi:</p>\n<h3 class=\"sec-head\">A. Peralatan Kritis</h3>\n<p>Peralatan yang secara langsung memengaruhi pelayanan utama perusahaan.</p>\n<p>Contoh:</p>\n<ul><li>mesin fotokopi utama;</li><li>printer produksi utama.</li></ul>\n<p>Target:</p>\n<ul><li>pemeriksaan harian;</li><li>prioritas utama apabila terjadi kerusakan.</li></ul>\n<h3 class=\"sec-head\">B. Peralatan Penting</h3>\n<p>Peralatan yang mendukung proses produksi.</p>\n<p>Contoh:</p>\n<ul><li>mesin laminasi;</li><li>mesin potong;</li><li>komputer desain;</li><li>mesin jilid.</li></ul>\n<p>Target:</p>\n<ul><li>pemeriksaan berkala;</li><li>pemeliharaan sesuai jadwal.</li></ul>\n<h3 class=\"sec-head\">C. Peralatan Pendukung</h3>\n<p>Peralatan yang menunjang kenyamanan dan kelancaran operasional.</p>\n<p>Contoh:</p>\n<ul><li>AC;</li><li>UPS;</li><li>scanner;</li><li>CCTV;</li><li>perangkat kantor lainnya.</li></ul>\n<p>Target:</p>\n<ul><li>pemeliharaan berkala sesuai kebutuhan.</li></ul>\n<h3 class=\"sec-head\">6. JENIS PEMELIHARAAN</h3>\n<h3 class=\"sec-head\">A. Pemeliharaan Harian</h3>\n<p>Dilakukan oleh Anggota Tim setiap hari.</p>\n<p>Contoh:</p>\n<ul><li>membersihkan mesin;</li><li>memeriksa indikator;</li><li>memastikan kondisi normal;</li><li>mematikan mesin sesuai prosedur.</li></ul>\n<h3 class=\"sec-head\">B. Pemeliharaan Berkala</h3>\n<p>Dilaksanakan sesuai jadwal:</p>\n<ul><li>mingguan;</li><li>bulanan;</li><li>triwulanan;</li><li>semesteran;</li><li>tahunan.</li></ul>\n<h3 class=\"sec-head\">C. Perbaikan Korektif</h3>\n<p>Dilakukan apabila terjadi gangguan atau kerusakan.</p>\n<h3 class=\"sec-head\">D. Penggantian Komponen</h3>\n<p>Dilakukan berdasarkan:</p>\n<ul><li>umur pakai;</li><li>hasil inspeksi;</li><li>rekomendasi teknisi;</li><li>rekomendasi pabrikan.</li></ul>\n<h3 class=\"sec-head\">7. LIMA STANDAR PEMELIHARAAN PERALATAN L21</h3>\n<h3 class=\"sec-head\">A. Pemeriksaan Rutin</h3>\n<p>Setiap peralatan diperiksa sesuai jadwal.</p>\n<h3 class=\"sec-head\">B. Pemeliharaan Tepat Waktu</h3>\n<p>Pemeliharaan dilakukan sebelum terjadi kerusakan besar.</p>\n<h3 class=\"sec-head\">C. Dokumentasi Lengkap</h3>\n<p>Seluruh kegiatan dicatat dalam riwayat peralatan.</p>\n<h3 class=\"sec-head\">D. Keselamatan Kerja</h3>\n<p>Pemeliharaan dilakukan dengan memperhatikan prosedur keselamatan dan penggunaan alat pelindung yang sesuai.</p>\n<h3 class=\"sec-head\">E. Evaluasi Berkelanjutan</h3>\n<p>Peralatan dievaluasi berdasarkan:</p>\n<ul><li>tingkat pemanfaatan;</li><li>frekuensi kerusakan;</li><li>biaya perawatan;</li><li>downtime;</li><li>umur ekonomis.</li></ul>\n<h3 class=\"sec-head\">8. KARTU RIWAYAT PERALATAN</h3>\n<p>Setiap peralatan wajib memiliki riwayat yang memuat:</p>\n<ul><li>kode aset;</li><li>nama peralatan;</li><li>nomor seri;</li><li>lokasi;</li><li>tanggal pembelian;</li><li>tanggal mulai digunakan;</li><li>jadwal pemeliharaan;</li><li>riwayat pemeriksaan;</li><li>riwayat perbaikan;</li><li>riwayat penggantian komponen;</li><li>biaya pemeliharaan;</li><li>nama teknisi;</li><li>status terakhir.</li></ul>\n<p>Kartu riwayat dapat berbentuk digital maupun cetak.</p>\n<h3 class=\"sec-head\">9. ALUR PEMELIHARAAN</h3>\n<ul><li>Pemeriksaan kondisi.</li><li>Identifikasi kebutuhan.</li><li>Penjadwalan.</li><li>Persetujuan (bila diperlukan).</li><li>Pelaksanaan pemeliharaan.</li><li>Pengujian fungsi.</li><li>Pencatatan hasil.</li><li>Evaluasi.</li><li>Penjadwalan berikutnya.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Pemeliharaan dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh jadwal terlaksana;</li><li>peralatan berfungsi normal;</li><li>downtime terkendali;</li><li>riwayat lengkap;</li><li>tindakan perbaikan terdokumentasi.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menggunakan peralatan sesuai prosedur;</li><li>melakukan pemeriksaan harian;</li><li>membersihkan peralatan;</li><li>melaporkan gangguan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menyusun jadwal;</li><li>mengawasi pelaksanaan;</li><li>mengevaluasi kondisi;</li><li>menentukan prioritas perbaikan;</li><li>mengusulkan penggantian apabila diperlukan.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pemeliharaan diukur melalui:</p>\n<ul><li>≥95% jadwal pemeliharaan terlaksana.</li><li>Penurunan jumlah kerusakan berulang.</li><li>Downtime sesuai target perusahaan.</li><li>100% peralatan memiliki riwayat pemeliharaan.</li><li>Penurunan biaya perbaikan darurat.</li><li>Tidak ada kerusakan akibat kelalaian penggunaan.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-508 Standar Pengelolaan Aset Perusahaan;</li><li>SL21-501 Standar Pembelian;</li><li>Standar Keselamatan Kerja;</li><li>Standar Produksi;</li><li>Standar Quality Control.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>kode aset;</li><li>nama peralatan;</li><li>kategori prioritas;</li><li>lokasi;</li><li>tanggal pemeliharaan;</li><li>jenis pemeliharaan;</li><li>hasil pemeriksaan;</li><li>komponen yang diganti;</li><li>biaya;</li><li>teknisi;</li><li>jadwal berikutnya;</li><li>status.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh peralatan memiliki jadwal pemeliharaan;</li><li>riwayat pemeliharaan lengkap;</li><li>pemeriksaan dilakukan sesuai jadwal;</li><li>tindakan perbaikan terdokumentasi;</li><li>evaluasi dilakukan terhadap peralatan dengan kerusakan berulang.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Data pemeliharaan digunakan untuk:</p>\n<ul><li>meningkatkan keandalan peralatan;</li><li>mengurangi biaya operasional;</li><li>memperpanjang umur aset;</li><li>merencanakan investasi penggantian;</li><li>meningkatkan produktivitas.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS PEMELIHARAAN PERALATAN L21</div>\n<p>Seluruh Anggota Tim wajib mematuhi ketentuan berikut:</p>\n<ul><li>Tidak ada peralatan digunakan dalam kondisi tidak aman.</li><li>Tidak ada jadwal pemeliharaan yang diabaikan tanpa alasan yang sah.</li><li>Tidak ada pemeliharaan tanpa pencatatan.</li><li>Setiap gangguan harus segera dilaporkan.</li><li>Setiap kerusakan harus dianalisis penyebabnya.</li><li>Setiap komponen yang diganti harus didokumentasikan.</li><li>Peralatan dibersihkan setelah digunakan.</li><li>Peralatan yang tidak layak diberi label <strong>&quot;JANGAN DIGUNAKAN&quot;</strong> hingga dinyatakan aman.</li><li>Keputusan memperbaiki atau mengganti peralatan didasarkan pada data riwayat, biaya, dan manfaat.</li><li>Setiap peralatan harus selalu siap mendukung pelayanan terbaik kepada pelanggan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Pemeliharaan peralatan merupakan bagian penting dari pengelolaan aset dan keberlangsungan operasional Lorongsatu21.</p>\n<p>Melalui pemeriksaan rutin, pemeliharaan terjadwal, dokumentasi yang lengkap, evaluasi berbasis data, dan budaya perbaikan berkelanjutan, Lorongsatu21 memastikan setiap peralatan selalu siap digunakan secara aman, andal, dan produktif sehingga mampu memberikan pelayanan terbaik kepada pelanggan sekaligus menjaga nilai investasi perusahaan.</p>", "order": 69, "no_formal_header": false}]}]}, {"key": "F", "name": "KEUANGAN", "items": [{"code": "SL21-601", "official_title": "Standar Manajemen Kas", "status": "ok", "note": "", "versions": [{"title": "MANAJEMEN KAS", "meta": {"Kode Dokumen": "SL21-601", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan kas agar seluruh penerimaan dan pengeluaran uang di Lorongsatu21 dilaksanakan secara aman, akurat, terdokumentasi, transparan, dan dapat dipertanggungjawabkan.</p>\n<p>Standar ini menjadi dasar pengendalian kas perusahaan sehingga operasional berjalan lancar, risiko kehilangan dapat diminimalkan, serta informasi keuangan tersedia secara tepat waktu.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Kas adalah darah yang mengalir dalam perusahaan.</li><li>Setiap rupiah memiliki tujuan dan tanggung jawab.</li><li>Disiplin mengelola kas membangun kepercayaan.</li><li>Pengendalian kas yang baik menjaga keberlangsungan usaha.</li></ul>\n<p>Moto:</p>\n<p><strong>Terima • Catat • Amankan • Pertanggungjawabkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh pengelolaan kas harus memenuhi prinsip:</p>\n<ul><li>Akurat.</li><li>Tepat waktu.</li><li>Transparan.</li><li>Aman.</li><li>Terdokumentasi.</li><li>Dapat ditelusuri.</li><li>Dipisahkan sesuai fungsi dan kewenangan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh transaksi kas Lorongsatu21, meliputi:</p>\n<h3 class=\"sec-head\">A. Kas Tunai</h3>\n<ul><li>Kas laci kasir.</li><li>Kas operasional.</li><li>Kas kecil (petty cash).</li></ul>\n<h3 class=\"sec-head\">B. Kas Non Tunai</h3>\n<ul><li>Rekening bank.</li><li>Transfer.</li><li>QRIS.</li><li>Dompet digital yang disetujui perusahaan.</li></ul>\n<h3 class=\"sec-head\">C. Transaksi Kas</h3>\n<ul><li>Penjualan.</li><li>Pembelian.</li><li>Pengeluaran operasional.</li><li>Pembayaran gaji.</li><li>Uang muka (DP).</li><li>Pelunasan.</li><li>Pengembalian dana (refund).</li><li>Penerimaan dan pengeluaran lainnya.</li></ul>\n<h3 class=\"sec-head\">5. KLASIFIKASI KAS</h3>\n<h3 class=\"sec-head\">A. Kas Operasional</h3>\n<p>Digunakan untuk transaksi harian.</p>\n<h3 class=\"sec-head\">B. Kas Kecil</h3>\n<p>Digunakan untuk pengeluaran kecil dengan batas nominal yang ditetapkan perusahaan.</p>\n<h3 class=\"sec-head\">C. Kas Bank</h3>\n<p>Dana perusahaan yang tersimpan pada rekening resmi.</p>\n<h3 class=\"sec-head\">D. Kas Dalam Perjalanan</h3>\n<p>Dana yang sedang diproses untuk disetor atau ditransfer.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN KAS L21</h3>\n<h3 class=\"sec-head\">A. Seluruh Transaksi Dicatat</h3>\n<p>Tidak ada penerimaan maupun pengeluaran kas tanpa pencatatan.</p>\n<h3 class=\"sec-head\">B. Dokumen Lengkap</h3>\n<p>Seluruh transaksi wajib memiliki dokumen pendukung, seperti:</p>\n<ul><li>nota;</li><li>kuitansi;</li><li>bukti transfer;</li><li>bukti QRIS;</li><li>voucher kas;</li><li>dokumen lainnya yang sah.</li></ul>\n<h3 class=\"sec-head\">C. Kas Diamankan</h3>\n<p>Kas disimpan pada tempat yang aman dengan akses sesuai kewenangan.</p>\n<p>Saldo kas tunai mengikuti batas maksimum yang ditetapkan perusahaan. Kelebihan kas disetorkan ke rekening perusahaan sesuai jadwal.</p>\n<h3 class=\"sec-head\">D. Rekonsiliasi Berkala</h3>\n<p>Kas direkonsiliasi secara rutin antara saldo fisik, sistem, dan rekening bank untuk memastikan kesesuaiannya.</p>\n<h3 class=\"sec-head\">E. Pertanggungjawaban Jelas</h3>\n<p>Setiap transaksi kas memiliki:</p>\n<ul><li>petugas;</li><li>waktu transaksi;</li><li>nomor dokumen;</li><li>tujuan transaksi;</li><li>bukti pendukung.</li></ul>\n<h3 class=\"sec-head\">7. PENGENDALIAN INTERNAL</h3>\n<p>Untuk memperkuat pengelolaan kas diterapkan ketentuan berikut:</p>\n<ul><li>seluruh transaksi dicatat segera setelah terjadi;</li><li>setiap penerimaan pelanggan diberikan bukti pembayaran;</li><li>pengeluaran kas mengikuti prosedur dan kewenangan yang berlaku;</li><li>rekonsiliasi dilakukan secara berkala;</li><li>transaksi bernilai besar atau kondisi tertentu menggunakan prinsip <strong>dua verifikasi</strong>;</li><li>akses terhadap kas dibatasi sesuai tugas dan tanggung jawab.</li></ul>\n<h3 class=\"sec-head\">8. TUTUP KAS HARIAN</h3>\n<p>Pada akhir setiap hari operasional dilakukan proses <strong>Tutup Kas Harian</strong> yang meliputi:</p>\n<ul><li>Menghitung kas fisik.</li><li>Memeriksa saldo pada sistem/POS.</li><li>Mencocokkan transaksi tunai, transfer, QRIS, dan metode pembayaran lainnya.</li><li>Menjelaskan setiap selisih yang ditemukan.</li><li>Membuat berita acara apabila terdapat selisih.</li><li>Menandatangani laporan penutupan kas oleh petugas dan Penanggung Jawab Cabang sesuai kebutuhan.</li></ul>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN KAS</h3>\n<ul><li>Terima atau keluarkan kas.</li><li>Verifikasi transaksi.</li><li>Lengkapi dokumen.</li><li>Catat transaksi.</li><li>Simpan atau setorkan kas sesuai ketentuan.</li><li>Rekonsiliasi.</li><li>Tutup kas harian.</li><li>Arsipkan dokumen.</li><li>Laporkan hasil pengelolaan kas.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Manajemen kas dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh transaksi tercatat;</li><li>saldo kas sesuai;</li><li>dokumen lengkap;</li><li>rekonsiliasi selesai;</li><li>tidak terdapat transaksi tanpa bukti;</li><li>kas tersimpan dengan aman.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mencatat transaksi;</li><li>menjaga keamanan kas;</li><li>menyerahkan bukti transaksi;</li><li>melaporkan selisih.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>mengawasi pengelolaan kas;</li><li>memverifikasi laporan kas;</li><li>menyetujui transaksi sesuai kewenangan;</li><li>mengevaluasi selisih;</li><li>memastikan pelaksanaan tutup kas harian.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan kas diukur melalui:</p>\n<ul><li>100% transaksi memiliki bukti.</li><li>Selisih kas yang tidak dapat dijelaskan = 0.</li><li>Rekonsiliasi selesai sesuai jadwal.</li><li>Tutup kas harian terlaksana setiap hari operasional.</li><li>Tidak ada transaksi di luar prosedur.</li><li>Seluruh transaksi dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-303 Standar Melayani Pelanggan;</li><li>SL21-501 Standar Pembelian;</li><li>Standar Penjualan;</li><li>Standar Audit Internal;</li><li>Seluruh Standar Keuangan L21 (Kelompok 600).</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>nomor transaksi;</li><li>tanggal dan waktu;</li><li>jenis transaksi;</li><li>metode pembayaran;</li><li>penerimaan atau pengeluaran;</li><li>jumlah;</li><li>saldo;</li><li>petugas;</li><li>nomor dokumen;</li><li>keterangan;</li><li>bukti transaksi.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh transaksi tercatat;</li><li>bukti transaksi lengkap;</li><li>saldo kas sesuai;</li><li>tutup kas harian dilaksanakan;</li><li>rekonsiliasi dilakukan;</li><li>pengendalian internal berjalan efektif.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>hasil audit;</li><li>hasil rekonsiliasi;</li><li>laporan selisih kas;</li><li>analisis arus kas;</li><li>masukan dari Anggota Tim.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan keamanan, akurasi, dan efisiensi pengelolaan kas.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN KAS L21</div>\n<ul><li>Tidak ada uang masuk tanpa pencatatan.</li><li>Tidak ada uang keluar tanpa dokumen.</li><li>Tidak ada transaksi tanpa bukti pembayaran.</li><li>Tidak ada penggunaan kas perusahaan untuk kepentingan pribadi.</li><li>Saldo kas harus dapat dijelaskan setiap saat.</li><li>Selisih kas harus segera dilaporkan dan dianalisis.</li><li>Tutup kas harian wajib dilaksanakan.</li><li>Rekonsiliasi dilakukan sesuai jadwal.</li><li>Akses terhadap kas dibatasi sesuai kewenangan.</li><li>Setiap rupiah harus dapat dipertanggungjawabkan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen kas merupakan fondasi utama pengelolaan keuangan Lorongsatu21.</p>\n<p>Melalui pencatatan yang disiplin, pengamanan yang memadai, rekonsiliasi yang konsisten, serta budaya pertanggungjawaban, Lorongsatu21 memastikan bahwa setiap penerimaan dan pengeluaran kas dikelola secara aman, transparan, dan profesional untuk mendukung keberlanjutan usaha serta memberikan pelayanan terbaik kepada pelanggan.</p>", "order": 70, "no_formal_header": false}]}, {"code": "SL21-602", "official_title": "Standar Manajemen Rekening Bank", "status": "ok", "note": "", "versions": [{"title": "MANAJEMEN REKENING BANK", "meta": {"Kode Dokumen": "SL21-602", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan rekening bank agar seluruh transaksi perbankan Lorongsatu21 dilakukan secara aman, akurat, terdokumentasi, transparan, dan dapat dipertanggungjawabkan.</p>\n<p>Standar ini bertujuan menjaga keamanan dana perusahaan, memperlancar transaksi non-tunai, memperkuat pengendalian internal, serta mendukung pengelolaan keuangan yang sehat.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Rekening bank merupakan tempat penyimpanan utama dana perusahaan.</li><li>Setiap transaksi perbankan harus dapat ditelusuri.</li><li>Rekonsiliasi yang baik menjaga keakuratan laporan keuangan.</li><li>Pengelolaan rekening bank yang disiplin meningkatkan kepercayaan.</li></ul>\n<p>Moto:</p>\n<p><strong>Terima • Bayar • Rekonsiliasi • Amankan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh pengelolaan rekening bank harus:</p>\n<ul><li>aman;</li><li>akurat;</li><li>terdokumentasi;</li><li>tepat waktu;</li><li>transparan;</li><li>sesuai kewenangan.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh rekening bank perusahaan, termasuk:</p>\n<ul><li>rekening operasional;</li><li>rekening penerimaan pembayaran;</li><li>rekening penggajian (apabila ada);</li><li>rekening tabungan perusahaan;</li><li>deposito atau instrumen penyimpanan dana lainnya;</li><li>fasilitas perbankan digital yang digunakan perusahaan.</li></ul>\n<h3 class=\"sec-head\">5. JENIS TRANSAKSI</h3>\n<p>Seluruh transaksi bank diklasifikasikan sebagai:</p>\n<h3 class=\"sec-head\">A. Penerimaan</h3>\n<ul><li>transfer pelanggan;</li><li>pembayaran QRIS yang disalurkan ke rekening;</li><li>pencairan deposito;</li><li>penerimaan lainnya.</li></ul>\n<h3 class=\"sec-head\">B. Pengeluaran</h3>\n<ul><li>pembayaran pemasok;</li><li>pembayaran gaji;</li><li>pembayaran operasional;</li><li>pembayaran pajak;</li><li>pembayaran lainnya.</li></ul>\n<h3 class=\"sec-head\">C. Transfer Internal</h3>\n<ul><li>antar rekening perusahaan;</li><li>setoran kas;</li><li>penempatan dana.</li></ul>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN REKENING BANK L21</h3>\n<h3 class=\"sec-head\">A. Rekening Resmi</h3>\n<p>Seluruh transaksi perusahaan dilakukan menggunakan rekening yang ditetapkan perusahaan.</p>\n<h3 class=\"sec-head\">B. Otorisasi Jelas</h3>\n<p>Setiap transaksi dilakukan sesuai kewenangan dan memperoleh persetujuan apabila dipersyaratkan.</p>\n<h3 class=\"sec-head\">C. Dokumen Lengkap</h3>\n<p>Setiap transaksi didukung oleh:</p>\n<ul><li>bukti transfer;</li><li>mutasi rekening;</li><li>invoice atau tagihan;</li><li>bukti pembayaran;</li><li>dokumen pendukung lainnya.</li></ul>\n<h3 class=\"sec-head\">D. Rekonsiliasi Berkala</h3>\n<p>Mutasi rekening dibandingkan dengan pencatatan internal secara berkala untuk memastikan seluruh transaksi telah tercatat dengan benar.</p>\n<h3 class=\"sec-head\">E. Keamanan Rekening</h3>\n<p>Akses terhadap rekening, aplikasi perbankan, token, perangkat autentikasi, dan data keamanan hanya diberikan kepada pihak yang berwenang.</p>\n<h3 class=\"sec-head\">7. PENGENDALIAN INTERNAL</h3>\n<p>Untuk menjaga keamanan rekening bank diterapkan ketentuan berikut:</p>\n<ul><li>transaksi mengikuti batas kewenangan;</li><li>perubahan data rekening perusahaan harus mendapat persetujuan;</li><li>informasi akses dijaga kerahasiaannya;</li><li>transaksi bernilai besar dapat memerlukan dua tingkat persetujuan sesuai kebijakan perusahaan;</li><li>rekening perusahaan tidak digunakan untuk transaksi pribadi.</li></ul>\n<h3 class=\"sec-head\">8. REKONSILIASI BANK</h3>\n<p>Rekonsiliasi dilakukan secara berkala dengan cara:</p>\n<ul><li>Mengambil mutasi rekening.</li><li>Mencocokkan seluruh transaksi dengan pencatatan internal.</li><li>Mengidentifikasi selisih.</li><li>Menjelaskan penyebab selisih.</li><li>Melakukan koreksi apabila diperlukan.</li><li>Mendokumentasikan hasil rekonsiliasi.</li></ul>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN REKENING BANK</h3>\n<ul><li>Menerima atau melakukan transaksi.</li><li>Memverifikasi dokumen.</li><li>Melaksanakan transaksi.</li><li>Menyimpan bukti transaksi.</li><li>Memperbarui pencatatan.</li><li>Melakukan rekonsiliasi.</li><li>Mengarsipkan dokumen.</li><li>Menyusun laporan.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Pengelolaan rekening bank dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh transaksi tercatat;</li><li>dokumen lengkap;</li><li>mutasi rekening sesuai pencatatan;</li><li>rekonsiliasi selesai tepat waktu;</li><li>tidak ada transaksi yang tidak dapat dijelaskan.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyiapkan dokumen transaksi sesuai tugas;</li><li>menjaga kerahasiaan data yang menjadi kewenangannya;</li><li>melaporkan ketidaksesuaian.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memverifikasi transaksi sesuai kewenangan;</li><li>mengawasi rekonsiliasi;</li><li>mengevaluasi penyimpangan;</li><li>memastikan kepatuhan terhadap standar.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan rekening bank diukur melalui:</p>\n<ul><li>100% transaksi memiliki bukti.</li><li>Rekonsiliasi selesai sesuai jadwal.</li><li>Tidak ada transaksi tanpa otorisasi.</li><li>Tidak ada transaksi pribadi menggunakan rekening perusahaan.</li><li>Seluruh mutasi dapat dijelaskan.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-601 Standar Manajemen Kas;</li><li>SL21-603 Standar Piutang;</li><li>SL21-604 → Standar Manajemen Hutang</li><li>SL21-605 → Standar Anggaran</li><li>SL21-606 → Standar Laporan Keuangan</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>nomor transaksi;</li><li>tanggal dan waktu;</li><li>rekening asal;</li><li>rekening tujuan;</li><li>nama bank;</li><li>jenis transaksi;</li><li>jumlah;</li><li>keterangan;</li><li>dokumen pendukung;</li><li>petugas.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh transaksi bank terdokumentasi;</li><li>rekonsiliasi dilaksanakan sesuai jadwal;</li><li>otorisasi dipatuhi;</li><li>akses rekening dikelola dengan aman;</li><li>tidak ada penggunaan rekening perusahaan di luar kepentingan usaha.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>hasil rekonsiliasi;</li><li>hasil audit;</li><li>efisiensi biaya transaksi bank;</li><li>keamanan transaksi;</li><li>perkembangan layanan perbankan.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan efisiensi, keamanan, dan kualitas pengelolaan rekening bank.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN REKENING BANK L21</div>\n<ul><li>Seluruh transaksi perusahaan menggunakan rekening resmi perusahaan.</li><li>Tidak ada transaksi tanpa dokumen.</li><li>Tidak ada transaksi tanpa kewenangan.</li><li>Rekonsiliasi dilakukan secara berkala.</li><li>Akses rekening dijaga kerahasiaannya.</li><li>Token, PIN, dan autentikasi tidak boleh dibagikan kepada pihak yang tidak berwenang.</li><li>Rekening perusahaan tidak digunakan untuk kepentingan pribadi.</li><li>Setiap mutasi rekening harus dapat dijelaskan.</li><li>Seluruh bukti transaksi diarsipkan.</li><li>Dana perusahaan dikelola secara aman dan bertanggung jawab.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen rekening bank merupakan bagian penting dari sistem keuangan Lorongsatu21.</p>\n<p>Melalui pengelolaan rekening yang aman, pencatatan yang akurat, rekonsiliasi yang konsisten, serta pengendalian internal yang kuat, Lorongsatu21 memastikan bahwa seluruh transaksi perbankan mendukung operasional yang efisien, laporan keuangan yang andal, dan pertumbuhan usaha yang berkelanjutan.</p>", "order": 71, "no_formal_header": false}]}, {"code": "SL21-603", "official_title": "Standar Manajemen Piutang", "status": "ok", "note": "", "versions": [{"title": "MANAJEMEN PIUTANG", "meta": {"Kode Dokumen": "SL21-603", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan piutang agar setiap transaksi yang menimbulkan piutang tercatat secara akurat, dipantau, ditagih sesuai kesepakatan, dan diselesaikan tepat waktu.</p>\n<p>Standar ini bertujuan menjaga kelancaran arus kas, mengurangi risiko piutang bermasalah, serta meningkatkan disiplin administrasi dan hubungan baik dengan pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Piutang adalah aset perusahaan yang harus dikelola secara aktif.</li><li>Penjualan belum sepenuhnya selesai sampai pembayaran diterima.</li><li>Penagihan yang baik menjaga hubungan baik dengan pelanggan.</li><li>Pengendalian piutang yang disiplin mendukung keberlangsungan usaha.</li></ul>\n<p>Moto:</p>\n<p><strong>Catat • Pantau • Tagih • Selesaikan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh pengelolaan piutang harus:</p>\n<ul><li>berdasarkan transaksi yang sah;</li><li>memiliki dokumen yang lengkap;</li><li>memiliki jadwal pembayaran yang jelas;</li><li>dipantau secara berkala;</li><li>ditindaklanjuti apabila terjadi keterlambatan;</li><li>dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh piutang perusahaan, meliputi:</p>\n<ul><li>piutang pelanggan;</li><li>piutang instansi;</li><li>piutang proyek;</li><li>piutang cicilan;</li><li>piutang uang muka yang belum dilunasi;</li><li>piutang lainnya yang disetujui perusahaan.</li></ul>\n<h3 class=\"sec-head\">5. KLASIFIKASI PIUTANG</h3>\n<h3 class=\"sec-head\">A. Piutang Lancar</h3>\n<p>Belum jatuh tempo.</p>\n<h3 class=\"sec-head\">B. Piutang Jatuh Tempo</h3>\n<p>Telah melewati tanggal pembayaran sesuai kesepakatan.</p>\n<h3 class=\"sec-head\">C. Piutang Bermasalah</h3>\n<p>Piutang yang memerlukan tindak lanjut khusus karena keterlambatan berulang atau terdapat indikasi sulit tertagih.</p>\n<h3 class=\"sec-head\">D. Piutang Selesai</h3>\n<p>Piutang yang telah dilunasi seluruhnya.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN PIUTANG L21</h3>\n<h3 class=\"sec-head\">A. Transaksi Sah</h3>\n<p>Piutang hanya dapat timbul dari transaksi yang telah disetujui dan didukung dokumen yang lengkap.</p>\n<h3 class=\"sec-head\">B. Data Lengkap</h3>\n<p>Setiap piutang memiliki data:</p>\n<ul><li>identitas pelanggan;</li><li>nomor transaksi;</li><li>tanggal transaksi;</li><li>nilai piutang;</li><li>uang muka (jika ada);</li><li>sisa piutang;</li><li>tanggal jatuh tempo.</li></ul>\n<h3 class=\"sec-head\">C. Pemantauan Berkala</h3>\n<p>Seluruh piutang dipantau secara berkala berdasarkan umur piutang dan tanggal jatuh tempo.</p>\n<h3 class=\"sec-head\">D. Penagihan Profesional</h3>\n<p>Penagihan dilakukan secara sopan, tepat waktu, dan terdokumentasi, dengan tetap menjaga hubungan baik dengan pelanggan.</p>\n<h3 class=\"sec-head\">E. Penyelesaian Tuntas</h3>\n<p>Setiap piutang harus memiliki status akhir yang jelas:</p>\n<ul><li>lunas;</li><li>diperpanjang sesuai persetujuan;</li><li>diselesaikan melalui kesepakatan lain;</li><li>atau ditetapkan sebagai piutang yang tidak tertagih sesuai kebijakan perusahaan.</li></ul>\n<h3 class=\"sec-head\">7. UMUR PIUTANG (AGING)</h3>\n<p>Piutang dipantau berdasarkan kelompok umur:</p>\n<ul><li>Belum jatuh tempo.</li><li>1–30 hari.</li><li>31–60 hari.</li><li>61–90 hari.</li><li>Lebih dari 90 hari.</li></ul>\n<p>Semakin lama umur piutang, semakin tinggi prioritas tindak lanjutnya.</p>\n<h3 class=\"sec-head\">8. PROSES PENAGIHAN</h3>\n<p>Penagihan dilakukan secara bertahap:</p>\n<ul><li>Pengingat sebelum jatuh tempo.</li><li>Pengingat pada saat jatuh tempo.</li><li>Pengingat setelah jatuh tempo.</li><li>Komunikasi lanjutan apabila belum dibayar.</li><li>Evaluasi dan keputusan penyelesaian sesuai kebijakan perusahaan.</li></ul>\n<p>Seluruh komunikasi penagihan dicatat sebagai bagian dari riwayat piutang.</p>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN PIUTANG</h3>\n<ul><li>Terjadi transaksi.</li><li>Piutang dicatat.</li><li>Jadwal pembayaran ditetapkan.</li><li>Piutang dipantau.</li><li>Penagihan dilakukan.</li><li>Pembayaran diterima.</li><li>Status diperbarui.</li><li>Arsipkan dokumen.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Manajemen piutang dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh piutang tercatat;</li><li>jadwal pembayaran jelas;</li><li>penagihan dilakukan sesuai prosedur;</li><li>pembayaran dicatat tepat waktu;</li><li>tidak terdapat piutang tanpa status.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mencatat data piutang;</li><li>memperbarui status pembayaran;</li><li>membantu proses penagihan sesuai kewenangan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memantau umur piutang;</li><li>menyetujui perubahan jadwal pembayaran sesuai kewenangan;</li><li>mengevaluasi piutang bermasalah;</li><li>menyusun langkah penyelesaian.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan piutang diukur melalui:</p>\n<ul><li>100% piutang memiliki dokumen.</li><li>100% piutang memiliki tanggal jatuh tempo.</li><li>Persentase piutang jatuh tempo sesuai target perusahaan.</li><li>Penurunan jumlah piutang bermasalah.</li><li>Seluruh pembayaran tercatat pada hari diterima.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-601 Standar Manajemen Kas;</li><li>SL21-602 Standar Manajemen Rekening Bank;</li><li>SL21-604 Standar Manajemen Hutang;</li><li>Standar Penjualan;</li><li>Standar Laporan Keuangan.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>nomor transaksi;</li><li>nama pelanggan;</li><li>nilai transaksi;</li><li>uang muka;</li><li>sisa piutang;</li><li>tanggal transaksi;</li><li>tanggal jatuh tempo;</li><li>riwayat pembayaran;</li><li>status piutang;</li><li>petugas.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>seluruh piutang tercatat;</li><li>dokumen lengkap;</li><li>penagihan dilakukan sesuai prosedur;</li><li>pembayaran diperbarui pada sistem;</li><li>piutang bermasalah ditindaklanjuti.</li></ul>\n<h3 class=\"sec-head\">16. PERBAIKAN BERKELANJUTAN</h3>\n<p>Evaluasi dilakukan berdasarkan:</p>\n<ul><li>umur piutang;</li><li>tingkat keterlambatan pembayaran;</li><li>efektivitas penagihan;</li><li>hasil audit;</li><li>masukan pelanggan.</li></ul>\n<p>Hasil evaluasi digunakan untuk meningkatkan proses pemberian kredit, penagihan, dan pengendalian piutang.</p>\n<div class=\"gold-box\"><div class=\"gold-title\">17. ATURAN EMAS MANAJEMEN PIUTANG L21</div>\n<ul><li>Tidak ada piutang tanpa dokumen.</li><li>Tidak ada piutang tanpa tanggal jatuh tempo.</li><li>Tidak ada pembayaran tanpa pencatatan.</li><li>Seluruh penagihan dilakukan secara profesional.</li><li>Setiap komunikasi penagihan didokumentasikan.</li><li>Piutang dipantau berdasarkan umur piutang.</li><li>Perubahan jadwal pembayaran memerlukan persetujuan sesuai kewenangan.</li><li>Piutang bermasalah segera dievaluasi.</li><li>Seluruh status piutang diperbarui secara berkala.</li><li>Tujuan utama pengelolaan piutang adalah mempercepat penerimaan kas sekaligus menjaga hubungan baik dengan pelanggan.</li></ul></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Manajemen piutang merupakan bagian penting dari pengelolaan keuangan Lorongsatu21.</p>\n<p>Melalui pencatatan yang akurat, pemantauan yang disiplin, penagihan yang profesional, dan evaluasi yang berkelanjutan, Lorongsatu21 memastikan setiap piutang dikelola secara bertanggung jawab sehingga mendukung arus kas yang sehat, pelayanan yang baik, dan pertumbuhan usaha yang berkelanjutan.</p>", "order": 72, "no_formal_header": false}]}, {"code": "SL21-604", "official_title": "Standar Laporan Keuangan (terdaftar) / isi aktual: Manajemen Hutang", "status": "ok", "note": "Daftar Standar Resmi menyebut kode ini \"Standar Laporan Keuangan\", tapi isi aktual dokumennya adalah Manajemen Hutang.", "versions": [{"title": "MANAJEMEN HUTANG", "meta": {"Kode Dokumen": "SL21-604", "Versi": "5.0 (Final L21OS)"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan standar pengelolaan hutang agar seluruh kewajiban pembayaran Lorongsatu21 dikelola secara tertib, tepat waktu, terdokumentasi, dan dapat dipertanggungjawabkan.</p>\n<p>Standar ini bertujuan menjaga arus kas, membangun hubungan baik dengan pemasok, menghindari keterlambatan pembayaran, serta mendukung pengelolaan keuangan yang sehat.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa:</p>\n<ul><li>Hutang merupakan kewajiban yang harus dipenuhi sesuai kesepakatan.</li><li>Pembayaran yang tepat waktu membangun kepercayaan.</li><li>Pengelolaan hutang yang baik menjaga reputasi perusahaan.</li><li>Hutang harus menjadi alat pengelolaan arus kas, bukan beban yang tidak terkendali.</li></ul>\n<p>Moto:</p>\n<p><strong>Catat • Jadwalkan • Bayar • Pertanggungjawabkan</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<p>Seluruh pengelolaan hutang harus:</p>\n<ul><li>berdasarkan transaksi yang sah;</li><li>memiliki dokumen lengkap;</li><li>memiliki jadwal pembayaran;</li><li>dipantau secara berkala;</li><li>dibayar sesuai kesepakatan;</li><li>dapat ditelusuri.</li></ul>\n<h3 class=\"sec-head\">4. RUANG LINGKUP</h3>\n<p>Standar ini berlaku untuk seluruh kewajiban perusahaan, meliputi:</p>\n<ul><li>hutang kepada pemasok;</li><li>hutang pembelian aset;</li><li>hutang jasa;</li><li>hutang operasional;</li><li>hutang pajak;</li><li>hutang lainnya yang disetujui perusahaan.</li></ul>\n<h3 class=\"sec-head\">5. KLASIFIKASI HUTANG</h3>\n<h3 class=\"sec-head\">A. Hutang Lancar</h3>\n<p>Kewajiban yang jatuh tempo dalam jangka pendek.</p>\n<h3 class=\"sec-head\">B. Hutang Jatuh Tempo</h3>\n<p>Hutang yang telah mencapai tanggal pembayaran.</p>\n<h3 class=\"sec-head\">C. Hutang Lewat Jatuh Tempo</h3>\n<p>Hutang yang belum dibayar setelah melewati tanggal yang disepakati.</p>\n<h3 class=\"sec-head\">D. Hutang Selesai</h3>\n<p>Hutang yang telah dilunasi sepenuhnya.</p>\n<h3 class=\"sec-head\">6. LIMA STANDAR MANAJEMEN HUTANG L21</h3>\n<h3 class=\"sec-head\">A. Transaksi Sah</h3>\n<p>Hutang hanya timbul dari transaksi yang telah disetujui dan didukung dokumen yang lengkap.</p>\n<h3 class=\"sec-head\">B. Data Lengkap</h3>\n<p>Setiap hutang memiliki:</p>\n<ul><li>nama pemasok;</li><li>nomor dokumen;</li><li>tanggal transaksi;</li><li>nilai hutang;</li><li>termin pembayaran;</li><li>tanggal jatuh tempo;</li><li>status pembayaran.</li></ul>\n<h3 class=\"sec-head\">C. Pemantauan Berkala</h3>\n<p>Seluruh hutang dipantau berdasarkan tanggal jatuh tempo.</p>\n<h3 class=\"sec-head\">D. Pembayaran Tepat Waktu</h3>\n<p>Pembayaran dilakukan sesuai kesepakatan dan mengikuti prioritas yang telah ditetapkan.</p>\n<h3 class=\"sec-head\">E. Penyelesaian Tuntas</h3>\n<p>Setiap hutang harus memiliki status akhir yang jelas, yaitu lunas atau diselesaikan melalui kesepakatan yang terdokumentasi.</p>\n<h3 class=\"sec-head\">7. PRIORITAS PEMBAYARAN</h3>\n<p>Urutan prioritas pembayaran ditetapkan sebagai berikut:</p>\n<ul><li>Pajak dan kewajiban hukum.</li><li>Gaji dan hak Anggota Tim.</li><li>Pemasok utama yang mendukung operasional.</li><li>Kewajiban operasional lainnya.</li><li>Kewajiban lain sesuai keputusan manajemen.</li></ul>\n<p>Prioritas dapat disesuaikan apabila terdapat keadaan khusus yang telah disetujui.</p>\n<h3 class=\"sec-head\">8. PROSES PEMBAYARAN</h3>\n<ul><li>Terima dokumen tagihan.</li><li>Verifikasi kesesuaian dengan transaksi.</li><li>Catat sebagai hutang.</li><li>Jadwalkan pembayaran.</li><li>Lakukan pembayaran sesuai kewenangan.</li><li>Simpan bukti pembayaran.</li><li>Perbarui status hutang.</li><li>Arsipkan dokumen.</li></ul>\n<h3 class=\"sec-head\">9. ALUR MANAJEMEN HUTANG</h3>\n<ul><li>Transaksi terjadi.</li><li>Hutang dicatat.</li><li>Jadwal pembayaran ditetapkan.</li><li>Hutang dipantau.</li><li>Pembayaran dilakukan.</li><li>Bukti pembayaran dicatat.</li><li>Status diperbarui.</li><li>Dokumen diarsipkan.</li></ul>\n<h3 class=\"sec-head\">10. STANDAR KUALITAS</h3>\n<p>Manajemen hutang dinyatakan memenuhi standar apabila:</p>\n<ul><li>seluruh hutang tercatat;</li><li>jadwal pembayaran jelas;</li><li>pembayaran dilakukan tepat waktu;</li><li>dokumen lengkap;</li><li>tidak ada hutang tanpa status.</li></ul>\n<h3 class=\"sec-head\">11. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>mencatat hutang;</li><li>memperbarui data pembayaran;</li><li>menyiapkan dokumen sesuai kewenangan.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memantau jadwal pembayaran;</li><li>memverifikasi tagihan;</li><li>menyetujui pembayaran sesuai kewenangan;</li><li>mengevaluasi hutang yang melewati jatuh tempo.</li></ul>\n<h3 class=\"sec-head\">12. INDIKATOR KEBERHASILAN (KPI)</h3>\n<p>Keberhasilan pengelolaan hutang diukur melalui:</p>\n<ul><li>100% hutang memiliki dokumen.</li><li>100% hutang memiliki tanggal jatuh tempo.</li><li>Persentase pembayaran tepat waktu sesuai target perusahaan.</li><li>Tidak ada pembayaran ganda.</li><li>Seluruh pembayaran memiliki bukti.</li></ul>\n<h3 class=\"sec-head\">13. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<p>Standar ini berkaitan dengan:</p>\n<ul><li>SL21-501 Standar Pembelian;</li><li>SL21-601 Standar Manajemen Kas;</li><li>SL21-602 Standar Manajemen Rekening Bank;</li><li>SL21-603 Standar Manajemen Piutang;</li><li>SL21-605 Standar Manajemen Anggaran;</li><li>SL21-606 Standar Laporan Keuangan.</li></ul>\n<h3 class=\"sec-head\">14. PUSAT DATA L21</h3>\n<p>Data yang dicatat meliputi:</p>\n<ul><li>nomor transaksi;</li><li>nama pemasok;</li><li>nomor faktur;</li><li>nilai hutang;</li><li>termin pembayaran;</li><li>tanggal jatuh tempo;</li><li>tanggal pembayaran;</li><li>metode pembayaran;</li><li>status;</li><li>petugas.</li></ul>\n<h3 class=\"sec-head\">15. AUDIT</h3>\n<p>Audit
