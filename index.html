<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132038; --navy-soft:#1c2c4d; --navy-line: rgba(255,255,255,.09);
  --paper:#f4f5f8; --card:#ffffff; --ink:#1a1e29; --ink-soft:#5c616e; --ink-faint:#8a8f9c;
  --line:#e2e4ea; --line-soft:#edeef2;
  --gold:#a9791f; --gold-soft:#c9a745; --gold-tint:#fbf3df;
  --ok:#3f7a5a; --ok-tint:#e9f4ee;
  --missing:#b5533c; --missing-tint:#fbeee9;
  --dup:#b8811f; --dup-tint:#fbf1de;
  --radius:2px;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --display: 'Fraunces', Georgia, serif;
  --body: 'Plus Jakarta Sans', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.6;
}
.app{ display:flex; min-height:100vh; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:320px; flex:0 0 320px; background:var(--navy); color:#f0f1f5;
  height:100vh; position:sticky; top:0; overflow-y:auto;
  display:flex; flex-direction:column;
}
.brand{ padding:22px 20px 16px; border-bottom:1px solid var(--navy-line); }
.brand .mark{
  font-family:var(--mono); font-weight:600; font-size:20px; letter-spacing:.5px;
  color:#fff; display:flex; align-items:baseline; gap:6px;
}
.brand .mark .os{ color:var(--gold-soft); }
.brand .tagline{ font-size:12px; color:#aeb4c4; margin-top:4px; }

.search-wrap{ padding:14px 18px; border-bottom:1px solid var(--navy-line); }
.search-input{
  width:100%; padding:9px 12px; border-radius:var(--radius); border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06); color:#fff; font-family:var(--body); font-size:13.5px;
}
.search-input::placeholder{ color:#8891a3; }
.search-input:focus{ outline:none; border-color:var(--gold-soft); background:rgba(255,255,255,.09); }

.nav{ flex:1; padding:8px 0 30px; }
.nav-section{ margin-top:6px; }
.nav-section-head{
  padding:12px 18px 6px; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:#8891a3; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
  user-select:none;
}
.nav-section-head:hover{ color:#c7cbd8; }
.nav-section-head .chev{ transition:transform .15s ease; font-size:10px; }
.nav-section.collapsed .chev{ transform:rotate(-90deg); }
.nav-section.collapsed .nav-list{ display:none; }
.nav-list{ display:flex; flex-direction:column; }
.nav-item{
  padding:7px 18px 7px 22px; font-size:13px; cursor:pointer; color:#cfd3de;
  display:flex; align-items:center; gap:8px; border-left:2px solid transparent;
  line-height:1.35;
}
.nav-item:hover{ background:rgba(255,255,255,.05); color:#fff; }
.nav-item.active{ background:rgba(255,255,255,.09); color:#fff; border-left-color:var(--gold-soft); }
.nav-item .code{
  font-family:var(--mono); font-size:10.5px; color:#9aa1b3; flex:0 0 auto; letter-spacing:.02em;
}
.nav-item.active .code{ color:var(--gold-soft); }
.nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
.dot.ok{ background:#5fae83; }
.dot.missing{ background:transparent; border:1.4px dashed #c98a76; }
.dot.duplicate{ background:#e0ac4a; }
.dot.retired{ background:transparent; border:1.4px dashed #9aa1b3; }

.nav-sub{ padding-left:16px; }
.nav-sub .nav-item{ font-size:12px; padding-top:5px; padding-bottom:5px; color:#a9aebd; }
.nav-sub .nav-item .code{ font-size:10px; }

.sidebar-footer{ padding:14px 18px; font-size:11px; color:#7c8399; border-top:1px solid var(--navy-line); }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; }
.topbar{
  display:none; align-items:center; gap:12px; padding:12px 16px; background:var(--navy); color:#fff;
  position:sticky; top:0; z-index:20;
}
.hamburger{ background:none; border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:var(--radius); padding:6px 10px; font-size:16px; cursor:pointer;}
.topbar .mark{ font-family:var(--mono); font-weight:600; letter-spacing:.5px;}

.content{ max-width:880px; margin:0 auto; padding:48px 40px 120px; }

.crumb{ font-size:12px; color:var(--ink-faint); margin-bottom:14px; font-family:var(--mono); letter-spacing:.02em;}
.crumb a{ color:var(--ink-faint); text-decoration:none; }
.crumb a:hover{ color:var(--navy); text-decoration:underline; }

.doc-header{ margin-bottom:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.doc-header-main{ flex:1; min-width:0; }
.print-btn{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; font-family:var(--body); font-size:12.5px;
  padding:7px 13px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  border-radius:20px; cursor:pointer; margin-top:2px;
}
.print-btn:hover{ border-color:var(--navy); color:var(--navy); }
.print-btn .ic{ font-size:13px; }
.book-btn{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--body); font-size:13px; font-weight:600;
  padding:10px 18px; border:1px solid var(--navy); background:var(--navy); color:#fff;
  border-radius:4px; cursor:pointer; margin:6px 0 0;
}
.book-btn:hover{ background:var(--navy-soft); }

.doc-nav{ display:flex; justify-content:space-between; gap:12px; margin-top:44px; padding-top:22px; border-top:1px solid var(--line); flex-wrap:wrap; }
.docnav-btn{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--body); font-size:13px;
  padding:11px 16px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  border-radius:4px; cursor:pointer; max-width:100%; text-align:left;
}
.docnav-btn:hover{ border-color:var(--navy); color:var(--navy); }
.docnav-btn.back{ margin-right:auto; }
.docnav-btn.next{ margin-left:auto; text-align:right; flex-direction:row-reverse; }
.docnav-btn .arrow{ color:var(--gold); font-size:14px; flex:0 0 auto; }
@media (max-width:500px){
  .doc-nav{ flex-direction:column; }
  .docnav-btn.next{ text-align:left; flex-direction:row; }
  .docnav-btn{ width:100%; }
}
.doc-code-badge{
  display:inline-block; font-family:var(--mono); font-size:12px; font-weight:600;
  background:var(--navy); color:#fff; padding:3px 9px; border-radius:var(--radius);
  letter-spacing:.03em; margin-bottom:14px;
}
.doc-title{
  font-family:var(--display); font-size:33px; font-weight:600; line-height:1.18; margin:0 0 14px;
  color:var(--navy);
}
.doc-meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px; }
.pill{
  font-size:11.5px; padding:3px 10px; border-radius:20px; border:1px solid var(--line);
  color:var(--ink-soft); background:var(--card); font-family:var(--mono);
}
.pill.status-ok{ border-color:#bfe0cd; color:var(--ok); background:var(--ok-tint); }
.pill.status-missing{ border-color:#f0c9bc; color:var(--missing); background:var(--missing-tint); }
.pill.status-duplicate{ border-color:#efd79c; color:var(--dup); background:var(--dup-tint); }
.pill.status-retired{ border-color:var(--line); color:var(--ink-faint); background:#f2f2f4; }

.note-box{
  border:1px solid var(--line); border-left:3px solid var(--ink-faint); background:var(--card);
  padding:12px 16px; font-size:13px; color:var(--ink-soft); border-radius:var(--radius); margin-bottom:28px;
}
.note-box.warn{ border-left-color:var(--missing); }
.note-box.dupe{ border-left-color:var(--dup); }
.note-box.info{ border-left-color:var(--ok); }

.version-tabs{ display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap; }
.version-tab{
  padding:6px 13px; font-size:12.5px; border:1px solid var(--line); background:var(--card);
  border-radius:20px; cursor:pointer; color:var(--ink-soft); font-family:var(--mono);
}
.version-tab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

.doc-body h3.sec-head{
  font-family:var(--display); font-size:16.5px; font-weight:600; color:var(--navy);
  margin:28px 0 10px; letter-spacing:.01em;
}
.doc-body p{ margin:0 0 13px; color:#292d38; }
.doc-body ul{ margin:0 0 15px; padding-left:22px; }
.doc-body li{ margin-bottom:5px; color:#292d38; }
.doc-body strong{ color:var(--navy); font-weight:650; }
.chapter-label{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--gold);
  margin-top:34px; font-weight:600;
}
.pasal-label{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); margin-top:18px; font-weight:600; }
.kv-line{ font-size:13.5px; }
.kv-label{ font-weight:600; color:var(--navy); }
.checkbox-line{ font-size:13.5px; padding:2px 0; }
.mark-list{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; margin-bottom:15px;}

.field-grid{ display:flex; flex-direction:column; gap:16px; margin:14px 0 22px; }
.field-row{ display:flex; align-items:flex-end; gap:14px; border-bottom:1px solid var(--line); padding-bottom:7px; }
.field-label{ font-size:12px; color:var(--ink-soft); flex:0 0 220px; }
.field-blank{ flex:1; min-height:18px; border-bottom:1px solid var(--line); }
.blank-area{ border:1px dashed var(--line); border-radius:var(--radius); margin-bottom:18px; }
.form-badge{
  display:inline-block; font-size:10.5px; font-family:var(--mono); letter-spacing:.06em; color:var(--gold);
  border:1px solid #e8d192; background:var(--gold-tint); padding:2px 9px; border-radius:20px; margin-bottom:10px;
}
.form-links{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 26px; }
.form-links .fl-label{ font-size:12px; color:var(--ink-faint); align-self:center; margin-right:2px; }
.form-link-btn{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-family:var(--body);
  padding:6px 13px; border:1px solid var(--gold); color:var(--gold); background:var(--gold-tint);
  border-radius:20px; cursor:pointer;
}
.form-link-btn:hover{ background:#f6e8bf; }
.mark-line{ margin:0; padding:3px 0; font-size:13.5px; }
.mark-line.mark-ok{ color:var(--ok); }
.mark-line.mark-no{ color:var(--missing); }

.gold-box{
  background:var(--gold-tint); border:1px solid #e8d192; border-left:4px solid var(--gold);
  padding:18px 20px 6px; margin:30px 0; border-radius:var(--radius);
}
.gold-box .gold-title{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; color:var(--gold); font-weight:700;
  margin-bottom:10px; text-transform:uppercase;
}
.gold-box ul{ padding-left:20px; }
.gold-box li{ color:#4a3c14; }
.gold-box p{ color:#4a3c14; }

.tbl-wrap{ overflow-x:auto; margin:16px 0 20px; border:1px solid var(--line); border-radius:var(--radius);}
table{ border-collapse:collapse; width:100%; font-size:13px; }
th{ background:var(--navy); color:#fff; text-align:left; padding:9px 12px; font-weight:600; white-space:nowrap; font-size:12px;}
td{ padding:8px 12px; border-top:1px solid var(--line-soft); vertical-align:top; }
tr:nth-child(even) td{ background:#fafafc; }

.missing-state{
  border:1.5px dashed #dcc4b8; background:#fdf8f5; padding:34px 28px; border-radius:var(--radius);
  text-align:left;
}
.missing-state h4{ font-family:var(--display); font-size:19px; color:var(--missing); margin:0 0 10px;}
.missing-state p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 8px; }

/* ---------- Home / Dashboard ---------- */
.hero{ margin-bottom:8px; }
.hero .eyebrow{ font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase; margin-bottom:10px;}
.hero h1{ font-family:var(--display); font-size:40px; line-height:1.12; margin:0 0 16px; color:var(--navy); font-weight:600;}
.hero .lede{ font-size:15px; color:var(--ink-soft); max-width:560px; margin:0 0 34px; }

.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:40px; }
.stat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
.stat-card .num{ font-family:var(--display); font-size:32px; font-weight:600; color:var(--navy); }
.stat-card.ok .num{ color:var(--ok); }
.stat-card.missing .num{ color:var(--missing); }
.stat-card.duplicate .num{ color:var(--dup); }
.stat-card .lbl{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

.section-title{ font-family:var(--display); font-size:19px; color:var(--navy); margin:36px 0 14px; font-weight:600;}
.kelompok-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kelompok-card{
  border:1px solid var(--line); background:var(--card); border-radius:var(--radius); padding:14px 16px;
  cursor:pointer;
}
.kelompok-card:hover{ border-color:var(--navy); }
.kelompok-card .kk{ font-family:var(--mono); font-size:10.5px; color:var(--gold); letter-spacing:.06em; }
.kelompok-card .kn{ font-size:13.5px; font-weight:600; color:var(--navy); margin:3px 0 8px; }
.kelompok-card .kstat{ font-size:11.5px; color:var(--ink-soft); display:flex; gap:10px;}

.gap-list{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.gap-row{ display:flex; gap:12px; padding:10px 14px; background:var(--card); align-items:baseline; font-size:13px; }
.gap-row .code{ font-family:var(--mono); font-size:11.5px; color:var(--missing); flex:0 0 78px; }
.gap-row .grp{ flex:0 0 150px; color:var(--ink-faint); font-size:11.5px; }
.gap-row .ttl{ flex:1; color:var(--ink); }

.std-list{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.std-row{ display:flex; gap:12px; padding:11px 14px; background:var(--card); align-items:center; font-size:13.5px; cursor:pointer; }
.std-row:hover{ background:#f2f3f7; }
.std-row .dot{ flex:0 0 auto; }
.std-row .code{ font-family:var(--mono); font-size:11.5px; color:var(--gold); flex:0 0 74px; }
.std-row .ttl{ flex:1; color:var(--ink); }

/* ---------- Search results ---------- */
.search-results{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-top:6px;}
.sr-item{ background:var(--card); padding:12px 16px; cursor:pointer; }
.sr-item:hover{ background:#f2f3f7; }
.sr-item .code{ font-family:var(--mono); font-size:11px; color:var(--gold); }
.sr-item .title{ font-size:13.5px; color:var(--navy); font-weight:600; margin-top:2px;}
.sr-item .snippet{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
.sr-empty{ padding:16px; color:var(--ink-faint); font-size:13px; }

/* ---------- Mobile ---------- */
.sidebar-backdrop{ display:none; }
@media (max-width: 860px){
  .sidebar{ position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s ease; width:82%; max-width:330px; }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-backdrop.open{ display:block; position:fixed; inset:0; background:rgba(10,14,24,.45); z-index:30; }
  .topbar{ display:flex; }
  .content{ padding:28px 18px 100px; }
  .doc-title{ font-size:26px; }
  .hero h1{ font-size:30px; }
  .stat-grid{ grid-template-columns:1fr 1fr; }
  .kelompok-grid{ grid-template-columns:1fr; }
  .gap-row{ flex-wrap:wrap; }
  .gap-row .grp{ flex:0 0 auto; }
}

/* ---------- Sidebar top tabs (Sampul / Daftar Isi) ---------- */
.sidebar-toptabs{ padding:8px 12px 12px; display:flex; flex-direction:column; gap:2px; border-bottom:1px solid var(--navy-line); margin-bottom:4px; }
.toptab{
  padding:9px 10px; border-radius:4px; font-size:13px; color:#cfd3de; cursor:pointer;
  display:flex; align-items:center; gap:9px; border-left:2px solid transparent;
}
.toptab:hover{ background:rgba(255,255,255,.06); color:#fff; }
.toptab.active{ background:rgba(255,255,255,.09); color:#fff; border-left-color:var(--gold-soft); }
.toptab .ic{ font-size:14px; }
.brand{ cursor:pointer; }

/* ---------- On-screen cover ---------- */
.app-cover{
  min-height:66vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, #1a2c4e 0%, #0f1a30 100%); color:#fff;
  padding:60px 34px; border-radius:6px; position:relative; margin-bottom:8px;
}
.app-cover::before{
  content:''; position:absolute; top:22px; right:22px; bottom:22px; left:22px;
  border:1.5px solid rgba(201,167,69,.5); pointer-events:none; border-radius:2px;
}
.app-cover::after{
  content:''; position:absolute; top:30px; right:30px; bottom:30px; left:30px;
  border:1px solid rgba(201,167,69,.28); pointer-events:none;
}
.cover-cta{
  margin-top:32px; display:inline-flex; align-items:center; gap:9px; font-family:var(--body);
  font-size:14px; font-weight:600; padding:13px 28px; border:1px solid var(--gold-soft);
  background:transparent; color:#fff; border-radius:30px; cursor:pointer;
}
.cover-cta:hover{ background:rgba(201,167,69,.15); }
.cover-cta .arrow{ color:var(--gold-soft); }

/* ---------- Daftar Isi Utama (full index) ---------- */
.toc-full-kelompok{ margin-top:30px; }
.toc-full-kelompok .tk-head{
  display:flex; align-items:baseline; gap:10px; padding:8px 2px; cursor:pointer;
}
.toc-full-kelompok .tk-head:hover .tk-name{ color:var(--navy); }
.toc-full-kelompok .tk-kk{ font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:.06em; }
.toc-full-kelompok .tk-name{ font-family:var(--display); font-size:16px; font-weight:600; color:var(--ink); }
.toc-full-kelompok .tk-count{ font-size:11px; color:var(--ink-faint); margin-left:auto; }

/* ---------- Print / PDF ---------- */
#book-container{ display:none; }
body.printing-book .content{ display:none; }
body.printing-book #book-container{ display:block; }
@media print{ .app-cover{ display:none !important; } }

.book-cover{
  min-height:960px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, #1a2c4e 0%, #0f1a30 100%); color:#fff;
  margin-bottom:30px; padding:60px 40px; position:relative;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.book-cover::before{
  content:''; position:absolute; top:26px; right:26px; bottom:26px; left:26px;
  border:1.5px solid rgba(201,167,69,.55); pointer-events:none;
}
.book-cover::after{
  content:''; position:absolute; top:34px; right:34px; bottom:34px; left:34px;
  border:1px solid rgba(201,167,69,.3); pointer-events:none;
}
.bc-frame{ max-width:440px; text-align:center; position:relative; z-index:1; }
.bc-emblem{
  font-family:var(--display); font-weight:700; font-size:52px; letter-spacing:.02em; color:#fff;
  display:inline-flex; align-items:baseline; gap:2px;
}
.bc-emblem .bc-os{ color:var(--gold-soft); }
.bc-rule{ width:64px; height:1px; background:var(--gold-soft); margin:22px auto; opacity:.8; }
.bc-rule.small{ width:40px; margin:26px auto; }
.bc-kicker{ font-family:var(--mono); font-size:11.5px; letter-spacing:.22em; color:#aeb4c4; text-transform:uppercase; }
.bc-title{ font-family:var(--display); font-size:30px; font-weight:600; line-height:1.25; color:#fff; margin-top:18px; }
.bc-motto{ font-family:var(--body); font-size:12.5px; letter-spacing:.06em; color:var(--gold-soft); margin-top:20px; }
.bc-meta{ font-family:var(--mono); font-size:11px; color:#8891a3; margin-top:6px; line-height:1.8; }
.book-toc{ margin-bottom:10px; }
.book-toc .toc-kelompok{ font-family:var(--display); font-size:15px; color:var(--navy); font-weight:600; margin:16px 0 6px; }
.book-toc .toc-item{ font-size:12.5px; color:var(--ink-soft); padding:3px 4px 3px 14px; font-family:var(--mono); display:block; text-decoration:none; border-radius:3px; cursor:pointer; }
.book-toc .toc-item:hover{ background:var(--paper); color:var(--navy); }
.book-section{ margin-bottom:10px; }
.book-section .doc-header{ border-bottom:1px solid var(--line); padding-bottom:14px; }

  .sidebar, .topbar, .sidebar-backdrop, .print-btn, .book-btn, .version-tabs{ display:none !important; }

<script>window.L21OS_DATA = {"foundational": [{"code": "L21OS-000", "label": "L21OS-000", "versions": [{"title": "PIAGAM LORONGSATU21 — (The Lorongsatu21 Charter)", "meta": {"Kode Dokumen": "L21OS-000", "Nama Dokumen": "Piagam Lorongsatu21", "Versi": "1.0", "Status": "Berlaku"}, "html": "<p><strong>Dokumen Induk L21OS</strong></p>\n<h3 class=\"sec-head\">PEMBUKAAN</h3>\n<p>Dengan memohon rahmat Tuhan Yang Maha Esa, kami membangun Lorongsatu21 sebagai perusahaan yang berlandaskan kejujuran, tanggung jawab, pembelajaran, dan semangat untuk memberikan manfaat.</p>\n<p>Kami percaya bahwa perusahaan yang kuat tidak dibangun hanya oleh produk yang baik atau keuntungan yang besar, tetapi oleh manusia yang berkarakter, sistem yang sederhana, dan budaya yang terus bertumbuh.</p>\n<p>Piagam ini menjadi landasan bagi seluruh Anggota Tim Lorongsatu21 dalam berpikir, mengambil keputusan, bekerja, melayani pelanggan, dan mengembangkan perusahaan.</p>\n<div class=\"chapter-label\">BAB I</div>\n<h3 class=\"sec-head\">IDENTITAS PERUSAHAAN</h3>\n<p>Nama</p>\n<h3 class=\"sec-head\">LORONGSATU21</h3>\n<p>Bidang Usaha</p>\n<p><strong>Pusat Solusi Bisnis, Percetakan, dan Kreativitas</strong></p>\n<p>Sistem Manajemen</p>\n<p><strong>L21OS (Lorongsatu21 Operating System)</strong></p>\n<p>Sistem Pembelajaran</p>\n<p><strong>Akademi L21</strong></p>\n<p>Motto</p>\n<p><strong>Berkarakter • Belajar • Bertumbuh • Bermanfaat</strong></p>\n<p>Filosofi</p>\n<p><strong>Bangun Manusia. Bangun Sistem. Manfaat Bertumbuh.</strong></p>\n<div class=\"chapter-label\">BAB II</div>\n<h3 class=\"sec-head\">MENGAPA KAMI ADA</h3>\n<p>Lorongsatu21 hadir untuk memberikan solusi bagi kebutuhan bisnis, percetakan, dan kreativitas masyarakat melalui pelayanan yang berkualitas, sistem yang profesional, serta pembelajaran yang berkelanjutan.</p>\n<p>Kami percaya bahwa keberhasilan perusahaan bukan hanya diukur dari keuntungan, tetapi juga dari manfaat yang diberikan kepada pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan itu sendiri.</p>\n<div class=\"chapter-label\">BAB III</div>\n<h3 class=\"sec-head\">VISI</h3>\n<p><strong>Menjadi Pusat Solusi Bisnis, Percetakan, dan Kreativitas yang terpercaya, bertumbuh melalui karakter, kompetensi, sistem yang sederhana, serta memberikan manfaat yang berkelanjutan bagi banyak orang.</strong></p>\n<div class=\"chapter-label\">BAB IV</div>\n<h3 class=\"sec-head\">MISI</h3>\n<ul><li>Memberikan pelayanan yang cepat, ramah, tepat, dan berkualitas.</li><li>Mengembangkan karakter dan kompetensi setiap Anggota Tim.</li><li>Membangun sistem kerja yang sederhana, terukur, dan mudah dikembangkan.</li><li>Menghasilkan produk dan layanan yang memberikan nilai tambah bagi pelanggan.</li><li>Memanfaatkan teknologi untuk meningkatkan kualitas layanan dan efisiensi kerja.</li><li>Menjadi perusahaan yang memberi manfaat bagi pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan.</li></ul>\n<div class=\"chapter-label\">BAB V</div>\n<h3 class=\"sec-head\">NILAI-NILAI INTI</h3>\n<p><strong>Berkarakter</strong></p>\n<p>Kami menjunjung tinggi kejujuran, disiplin, tanggung jawab, rasa hormat, dan kepedulian.</p>\n<p><strong>Belajar</strong></p>\n<p>Kami percaya bahwa setiap hari adalah kesempatan untuk menambah pengetahuan, keterampilan, dan pengalaman.</p>\n<p><strong>Bertumbuh</strong></p>\n<p>Kami bertumbuh sebagai individu, sebagai tim, dan sebagai perusahaan.</p>\n<p><strong>Bermanfaat</strong></p>\n<p>Kami mengukur keberhasilan dari manfaat yang kami berikan kepada orang lain.</p>\n<div class=\"chapter-label\">BAB VI</div>\n<h3 class=\"sec-head\">PRINSIP L21OS</h3>\n<p>Dalam setiap sistem, keputusan, dan tindakan, Lorongsatu21 berpegang pada prinsip:</p>\n<ul><li>Sederhana.</li><li>Terstandar.</li><li>Terukur.</li><li>Mudah diajarkan.</li><li>Mudah dikembangkan.</li><li>Berorientasi pada manfaat.</li></ul>\n<div class=\"chapter-label\">BAB VII</div>\n<div class=\"gold-box\"><div class=\"gold-title\">GOLDEN RULE</div>\n<p><strong>Setiap sistem, keputusan, dan tindakan di Lorongsatu21 harus membuat perusahaan lebih sederhana untuk dijalankan, lebih mudah diajarkan, lebih mudah diukur, lebih mudah dikembangkan, serta memberikan manfaat yang sebesar-besarnya bagi pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan.</strong></p></div>\n<div class=\"chapter-label\">BAB VIII</div>\n<h3 class=\"sec-head\">KOMITMEN ANGGOTA TIM</h3>\n<p>Setiap Anggota Tim Lorongsatu21 berkomitmen untuk:</p>\n<ul><li>Menjaga karakter dalam setiap tindakan.</li><li>Terus belajar dan meningkatkan kompetensi.</li><li>Memberikan pelayanan terbaik kepada pelanggan.</li><li>Menjaga kualitas pekerjaan.</li><li>Bekerja sama dan saling membantu.</li><li>Menjaga nama baik Lorongsatu21.</li><li>Memberikan manfaat melalui setiap pekerjaan yang dilakukan.</li></ul>\n<div class=\"chapter-label\">BAB IX</div>\n<h3 class=\"sec-head\">JANJI LORONGSATU21</h3>\n<p>Lorongsatu21 berkomitmen untuk:</p>\n<ul><li>Mengembangkan setiap Anggota Tim.</li><li>Membangun sistem yang adil dan transparan.</li><li>Memberikan kesempatan bertumbuh berdasarkan karakter, kompetensi, dan kontribusi.</li><li>Menghargai setiap ide yang membawa perbaikan.</li><li>Menjalankan usaha dengan integritas dan tanggung jawab sosial.</li></ul>\n<div class=\"chapter-label\">BAB X</div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Piagam Lorongsatu21 merupakan dasar dari seluruh L21OS.</p>\n<p>Seluruh kebijakan perusahaan, manual, SOP, formulir, sistem informasi, dan pengambilan keputusan wajib selaras dengan nilai, prinsip, dan tujuan yang tercantum dalam Piagam ini.</p>\n<p>Piagam ini menjadi kompas yang menjaga agar Lorongsatu21 terus bertumbuh sebagai perusahaan yang profesional, berintegritas, dan memberikan manfaat bagi banyak orang.</p>\n<h3 class=\"sec-head\">CREDO LORONGSATU21</h3>\n<p>Kami berkarakter dalam setiap tindakan.</p>\n<p>Kami belajar setiap hari.</p>\n<p>Kami bertumbuh bersama.</p>\n<p>Kami bekerja dengan sistem.</p>\n<p>Kami melayani dengan sepenuh hati.</p>\n<p>Kami menjaga kepercayaan.</p>\n<p>Kami memberikan manfaat.</p>\n<p>Karena kami adalah Anggota Tim Lorongsatu21.</p>", "order": 0, "no_formal_header": false}]}, {"code": "L21OS-001", "label": "L21OS-001", "versions": [{"title": "ANGGARAN DASAR LORONGSATU21 (ADL21)", "meta": {"Kode Dokumen": "L21OS-001", "Nama Dokumen": "Anggaran Dasar Lorongsatu21 (ADL21)", "Versi": "1.0", "Status": "Dokumen Induk L21OS"}, "html": "<h3 class=\"sec-head\">PEMBUKAAN</h3>\n<p>Dengan memohon rahmat Tuhan Yang Maha Esa, Lorongsatu21 didirikan sebagai perusahaan yang berlandaskan integritas, pembelajaran, pelayanan, dan semangat memberikan manfaat bagi banyak orang.</p>\n<p>Kami meyakini bahwa keberhasilan perusahaan tidak hanya ditentukan oleh produk, teknologi, atau modal, tetapi terutama oleh karakter manusia, kompetensi yang terus berkembang, budaya berbagi pengetahuan, dan sistem yang sederhana serta berkelanjutan.</p>\n<p>Oleh karena itu, Anggaran Dasar Lorongsatu21 disusun sebagai landasan utama bagi seluruh kebijakan, sistem, manual, SOP, formulir, dan keputusan perusahaan.</p>\n<p>Seluruh Anggota Tim berkewajiban memahami, menjaga, dan menjalankan Anggaran Dasar ini sebagai pedoman dalam bekerja dan mengembangkan perusahaan.</p>\n<div class=\"pasal-label\">PASAL 1</div>\n<p><strong>Nama dan Identitas</strong></p>\n<ul><li>Nama perusahaan adalah <strong>LORONGSATU21</strong>.</li><li>Identitas usaha adalah <strong>Pusat Solusi Bisnis, Percetakan, dan Kreativitas</strong>.</li><li>Sistem manajemen perusahaan disebut <strong>L21OS (Lorongsatu21 Operating System)</strong>.</li><li>Sistem pembelajaran internal disebut <strong>Akademi L21</strong>.</li></ul>\n<div class=\"pasal-label\">PASAL 2</div>\n<p><strong>Motto dan Filosofi</strong></p>\n<p>Motto perusahaan adalah:</p>\n<p><strong>Berkarakter • Belajar • Bertumbuh • Berbagi • Bermanfaat</strong></p>\n<p>Filosofi perusahaan adalah:</p>\n<p><strong>Bangun Manusia. Bangun Sistem. Manfaat Bertumbuh.</strong></p>\n<div class=\"pasal-label\">PASAL 3</div>\n<p><strong>Tujuan Perusahaan</strong></p>\n<p>Lorongsatu21 bertujuan untuk:</p>\n<ul><li>Memberikan solusi bagi kebutuhan bisnis, percetakan, dan kreativitas.</li><li>Memberikan pelayanan yang berkualitas dan terpercaya.</li><li>Mengembangkan karakter, kompetensi, dan kesejahteraan Anggota Tim.</li><li>Membangun sistem yang sederhana, profesional, dan berkelanjutan.</li><li>Memberikan manfaat bagi pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan.</li><li>Menjaga keberlanjutan perusahaan agar dapat terus berkembang lintas generasi.</li></ul>\n<div class=\"pasal-label\">PASAL 4</div>\n<p><strong>Nilai Dasar</strong></p>\n<p>Seluruh kegiatan perusahaan berlandaskan lima nilai utama:</p>\n<ul><li>Berkarakter.</li><li>Belajar.</li><li>Bertumbuh.</li><li>Berbagi.</li><li>Bermanfaat.</li></ul>\n<p>Kelima nilai tersebut menjadi dasar dalam pengambilan keputusan, penilaian kinerja, pengembangan Anggota Tim, dan penyusunan seluruh sistem perusahaan.</p>\n<div class=\"pasal-label\">PASAL 5</div>\n<div class=\"gold-box\"><div class=\"gold-title\">Golden Rule</div>\n<p>Setiap sistem, keputusan, dan tindakan di Lorongsatu21 wajib:</p>\n<ul><li>lebih sederhana untuk dijalankan;</li><li>lebih mudah diajarkan;</li><li>lebih mudah diukur;</li><li>lebih mudah dikembangkan; dan</li><li>memberikan manfaat yang sebesar-besarnya bagi pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan.</li></ul>\n<p>Seluruh dokumen L21OS harus mengacu pada prinsip ini.</p></div>\n<h3 class=\"sec-head\">L21OS-001</h3>\n<h3 class=\"sec-head\">ANGGARAN DASAR LORONGSATU21 (ADL21)</h3>\n<p><strong>Lanjutan – Pasal 6 s.d. Pasal 15</strong></p>\n<div class=\"pasal-label\">PASAL 6</div>\n<p><strong>Visi Perusahaan</strong></p>\n<p>Lorongsatu21 memiliki visi:</p>\n<p><strong>Menjadi Pusat Solusi Bisnis, Percetakan, dan Kreativitas yang terpercaya, bertumbuh melalui karakter, kompetensi, sistem yang sederhana, serta memberikan manfaat yang berkelanjutan bagi banyak orang.</strong></p>\n<p>Visi ini menjadi arah jangka panjang seluruh pengembangan perusahaan.</p>\n<div class=\"pasal-label\">PASAL 7</div>\n<p><strong>Misi Perusahaan</strong></p>\n<p>Untuk mewujudkan visi tersebut, Lorongsatu21 menjalankan misi sebagai berikut:</p>\n<ul><li>Memberikan pelayanan yang cepat, ramah, tepat, dan berkualitas.</li><li>Mengembangkan karakter, kompetensi, dan kesejahteraan Anggota Tim.</li><li>Membangun sistem kerja yang sederhana, terukur, terdokumentasi, dan mudah dikembangkan.</li><li>Menghasilkan produk dan layanan yang bernilai tambah.</li><li>Memanfaatkan teknologi secara bijaksana untuk meningkatkan pelayanan dan produktivitas.</li><li>Menjadi perusahaan yang memberikan manfaat bagi pelanggan, Anggota Tim, mitra, masyarakat, dan perusahaan.</li></ul>\n<div class=\"pasal-label\">PASAL 8</div>\n<p><strong>Prinsip Manajemen</strong></p>\n<p>Seluruh sistem manajemen Lorongsatu21 dibangun berdasarkan prinsip berikut:</p>\n<ul><li>Sederhana.</li><li>Terstandar.</li><li>Terukur.</li><li>Transparan.</li><li>Akuntabel.</li><li>Mudah diajarkan.</li><li>Mudah dikembangkan.</li><li>Berorientasi pada manfaat.</li></ul>\n<p>Setiap perubahan sistem wajib memperkuat prinsip-prinsip tersebut.</p>\n<div class=\"pasal-label\">PASAL 9</div>\n<p><strong>Struktur Organisasi</strong></p>\n<p>Lorongsatu21 menerapkan struktur organisasi yang sederhana dan jelas.</p>\n<p>Struktur dasar perusahaan terdiri atas:</p>\n<ul><li>Pemilik.</li><li>Penanggung Jawab Cabang.</li><li>Anggota Tim.</li></ul>\n<p>Penambahan fungsi atau unit kerja tidak boleh menghilangkan kesederhanaan struktur organisasi.</p>\n<div class=\"pasal-label\">PASAL 10</div>\n<p><strong>Sistem Pengembangan Anggota Tim</strong></p>\n<p>Perusahaan mengembangkan Anggota Tim berdasarkan:</p>\n<ul><li>Karakter.</li><li>Kompetensi.</li><li>Kontribusi.</li></ul>\n<p>Pengembangan dilakukan melalui:</p>\n<ul><li>Akademi L21.</li><li>Pelatihan.</li><li>Pendampingan (Mentoring).</li><li>Evaluasi Kompetensi.</li><li>Penugasan.</li><li>Rotasi.</li><li>Pembelajaran mandiri.</li></ul>\n<p>Masa kerja menjadi pengalaman yang dihargai, tetapi bukan penentu utama kesempatan berkembang.</p>\n<div class=\"pasal-label\">PASAL 11</div>\n<p><strong>Akademi L21</strong></p>\n<p>Akademi L21 merupakan sistem pembelajaran internal Lorongsatu21.</p>\n<p>Akademi L21 bertujuan untuk:</p>\n<ul><li>Menyiapkan Anggota Tim yang kompeten.</li><li>Menumbuhkan budaya belajar.</li><li>Menyiapkan calon Penanggung Jawab Cabang.</li><li>Mendokumentasikan seluruh pengetahuan perusahaan.</li><li>Menjaga standar kualitas di seluruh cabang.</li></ul>\n<p>Setiap Anggota Tim memiliki hak dan tanggung jawab untuk terus belajar melalui Akademi L21.</p>\n<div class=\"pasal-label\">PASAL 12</div>\n<p><strong>Knowledge Base</strong></p>\n<p>Seluruh pengetahuan yang diperoleh selama menjalankan perusahaan merupakan aset perusahaan.</p>\n<p>Pengetahuan tersebut wajib didokumentasikan dalam Knowledge Base L21OS, meliputi:</p>\n<ul><li>Standar kerja.</li><li>Pengalaman lapangan.</li><li>Penyelesaian masalah.</li><li>Inovasi.</li><li>Penggunaan teknologi.</li><li>Materi pelatihan.</li><li>Praktik terbaik (Best Practice).</li></ul>\n<p>Knowledge Base menjadi bagian dari proses pembelajaran di Akademi L21.</p>\n<div class=\"pasal-label\">PASAL 13</div>\n<p><strong>Pelanggan</strong></p>\n<p>Pelanggan adalah alasan utama keberadaan Lorongsatu21.</p>\n<p>Seluruh Anggota Tim wajib:</p>\n<ul><li>Mengutamakan kepuasan pelanggan.</li><li>Menjaga kepercayaan pelanggan.</li><li>Memberikan pelayanan yang ramah, cepat, tepat, dan profesional.</li><li>Menjaga kualitas setiap produk dan layanan.</li></ul>\n<p>Setiap keluhan pelanggan dipandang sebagai kesempatan untuk melakukan perbaikan.</p>\n<div class=\"pasal-label\">PASAL 14</div>\n<p><strong>Kepemimpinan</strong></p>\n<p>Pemimpin di Lorongsatu21 adalah pelayan bagi timnya.</p>\n<p>Pemimpin bertanggung jawab untuk:</p>\n<ul><li>Menjadi teladan.</li><li>Mengembangkan Anggota Tim.</li><li>Menjaga budaya perusahaan.</li><li>Mencapai target bersama tim.</li><li>Menyelesaikan masalah secara adil.</li><li>Menjaga komunikasi yang terbuka.</li></ul>\n<p>Keberhasilan seorang pemimpin diukur dari perkembangan tim yang dipimpinnya.</p>\n<div class=\"pasal-label\">PASAL 15</div>\n<p><strong>Pengambilan Keputusan</strong></p>\n<p>Seluruh keputusan perusahaan harus mempertimbangkan:</p>\n<ul><li>Kesesuaian dengan Piagam Lorongsatu21.</li><li>Kesesuaian dengan Anggaran Dasar Lorongsatu21.</li><li>Dampak terhadap pelanggan.</li><li>Dampak terhadap Anggota Tim.</li><li>Dampak terhadap keberlanjutan perusahaan.</li><li>Dampak terhadap masyarakat.</li></ul>\n<p>Setiap keputusan strategis harus didasarkan pada data, analisis, dan nilai-nilai perusahaan, bukan semata-mata pada kebiasaan atau kepentingan jangka pendek.</p>\n<h3 class=\"sec-head\">PENEGASAN</h3>\n<p>Seluruh pasal dalam Anggaran Dasar Lorongsatu21 menjadi dasar penyusunan kebijakan perusahaan, manual, SOP, formulir, dashboard, aplikasi ERP, serta seluruh sistem yang dikembangkan di masa mendatang.</p>\n<h3 class=\"sec-head\">L21OS-001</h3>\n<h3 class=\"sec-head\">ANGGARAN DASAR LORONGSATU21 (ADL21)</h3>\n<p><strong>Lanjutan – Pasal 16 s.d. Pasal 25</strong></p>\n<div class=\"pasal-label\">PASAL 16</div>\n<p><strong>Sistem Kompensasi</strong></p>\n<ul><li>Lorongsatu21 menerapkan sistem kompensasi yang adil, transparan, dan berkelanjutan.</li><li>Kompensasi diberikan berdasarkan:</li><li>Karakter;</li><li>Level Kompetensi;</li><li>Tanggung Jawab;</li><li>Kontribusi terhadap perusahaan.</li><li>Masa kerja dihargai sebagai pengalaman dan menjadi salah satu pertimbangan pengembangan, namun bukan penentu utama besaran gaji atau bonus.</li><li>Besaran gaji, tunjangan, dan bonus diatur lebih lanjut dalam Kebijakan Kompensasi Perusahaan.</li></ul>\n<div class=\"pasal-label\">PASAL 17</div>\n<p><strong>Inovasi dan Perbaikan Berkelanjutan</strong></p>\n<ul><li>Setiap Anggota Tim berhak mengajukan ide perbaikan.</li><li>Setiap ide akan dievaluasi berdasarkan manfaat, efisiensi, kualitas, dan kemudahan penerapan.</li><li>Inovasi yang terbukti berhasil akan:</li><li>didokumentasikan;</li><li>menjadi bagian dari Knowledge Base;</li><li>diperbarui dalam SOP apabila diperlukan.</li><li>Perusahaan mendorong budaya <strong>&quot;lebih baik setiap hari&quot;</strong> (continuous improvement).</li></ul>\n<div class=\"pasal-label\">PASAL 18</div>\n<p><strong>Teknologi dan Digitalisasi</strong></p>\n<ul><li>Teknologi digunakan untuk meningkatkan kualitas pelayanan dan efisiensi kerja.</li><li>Seluruh sistem digital harus mendukung prinsip:</li><li>sederhana;</li><li>aman;</li><li>mudah digunakan;</li><li>mudah dikembangkan.</li><li>L21OS menjadi dasar pengembangan seluruh aplikasi perusahaan, termasuk Excel ERP dan sistem digital lainnya.</li><li>Teknologi tidak menggantikan nilai-nilai perusahaan, tetapi mendukung pelaksanaannya.</li></ul>\n<div class=\"pasal-label\">PASAL 19</div>\n<p><strong>Etika Perusahaan</strong></p>\n<p>Seluruh Anggota Tim wajib:</p>\n<ul><li>bertindak jujur;</li><li>menjaga kepercayaan pelanggan;</li><li>menghormati sesama;</li><li>menjaga kerahasiaan data perusahaan dan pelanggan;</li><li>menggunakan aset perusahaan secara bertanggung jawab;</li><li>menghindari benturan kepentingan;</li><li>menjaga nama baik Lorongsatu21.</li></ul>\n<p>Etika merupakan bagian dari karakter dan menjadi dasar penilaian dalam pengembangan Anggota Tim.</p>\n<div class=\"pasal-label\">PASAL 20</div>\n<p><strong>Pengelolaan Dokumen</strong></p>\n<ul><li>Seluruh dokumen resmi perusahaan menjadi bagian dari L21OS.</li><li>Dokumen diklasifikasikan sebagai:</li><li>Piagam;</li><li>Anggaran Dasar;</li><li>Kebijakan;</li><li>Manual;</li><li>SOP;</li><li>Formulir;</li><li>Lampiran;</li><li>Knowledge Base.</li><li>Setiap dokumen memiliki:</li><li>kode dokumen;</li><li>nomor versi;</li><li>tanggal berlaku;</li><li>riwayat revisi;</li><li>penanggung jawab.</li><li>Dokumen yang sudah tidak berlaku harus diarsipkan dan tidak digunakan lagi.</li></ul>\n<div class=\"pasal-label\">PASAL 21</div>\n<p><strong>Pengembangan Cabang</strong></p>\n<ul><li>Setiap cabang wajib menerapkan L21OS secara konsisten.</li><li>Seluruh cabang menggunakan standar pelayanan, kompetensi, dan operasional yang sama.</li><li>Penyesuaian lokal diperbolehkan sepanjang tidak bertentangan dengan Piagam dan Anggaran Dasar.</li><li>Pembukaan cabang baru harus disertai pelatihan, pendampingan, dan audit implementasi L21OS.</li></ul>\n<div class=\"pasal-label\">PASAL 22</div>\n<p><strong>Audit dan Evaluasi</strong></p>\n<ul><li>Perusahaan melaksanakan audit internal secara berkala.</li><li>Audit bertujuan untuk memastikan:</li><li>kepatuhan terhadap L21OS;</li><li>kualitas pelayanan;</li><li>efektivitas sistem;</li><li>peluang perbaikan.</li><li>Hasil audit digunakan sebagai dasar penyempurnaan sistem, bukan untuk mencari kesalahan individu.</li></ul>\n<div class=\"pasal-label\">PASAL 23</div>\n<p><strong>Perubahan Sistem</strong></p>\n<ul><li>L21OS merupakan sistem yang hidup dan dapat dikembangkan.</li><li>Setiap perubahan harus:</li><li>sesuai dengan Piagam Lorongsatu21;</li><li>tidak bertentangan dengan Anggaran Dasar;</li><li>memberikan manfaat yang jelas;</li><li>disetujui oleh Pemilik.</li><li>Setiap perubahan wajib didokumentasikan dalam riwayat revisi.</li></ul>\n<div class=\"pasal-label\">PASAL 24</div>\n<p><strong>Keberlanjutan Perusahaan</strong></p>\n<p>Lorongsatu21 berkomitmen untuk:</p>\n<ul><li>membangun perusahaan yang dapat berkembang lintas generasi;</li><li>mengembangkan pemimpin dari dalam organisasi;</li><li>mendokumentasikan seluruh pengetahuan penting perusahaan;</li><li>menjaga keseimbangan antara pertumbuhan usaha, kesejahteraan Anggota Tim, dan manfaat bagi masyarakat.</li></ul>\n<div class=\"pasal-label\">PASAL 25</div>\n<p><strong>Ketentuan Penutup</strong></p>\n<ul><li>Anggaran Dasar Lorongsatu21 merupakan dokumen induk dalam L21OS.</li><li>Seluruh kebijakan, manual, SOP, formulir, dashboard, dan aplikasi perusahaan wajib mengacu pada Anggaran Dasar ini.</li><li>Apabila terdapat pertentangan antara dokumen, maka urutan prioritas adalah:</li><li>Piagam Lorongsatu21 (L21OS-000)</li><li>Anggaran Dasar Lorongsatu21 (L21OS-001)</li><li>Kebijakan Perusahaan</li><li>Manual</li><li>SOP</li><li>Formulir</li><li>Petunjuk Kerja</li><li>Knowledge Base</li><li>Anggaran Dasar ini mulai berlaku sejak ditetapkan dan menjadi pedoman resmi bagi seluruh Anggota Tim Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">PENUTUP RESMI</h3>\n<p>L21OS dibangun bukan hanya untuk mengatur pekerjaan, tetapi untuk membangun budaya perusahaan yang berkarakter, gemar belajar, terus bertumbuh, senang berbagi, dan memberikan manfaat.</p>\n<p>Setiap Anggota Tim memiliki tanggung jawab untuk menjaga, menjalankan, dan menyempurnakan sistem ini demi keberlanjutan Lorongsatu21 sebagai <strong>Pusat Solusi Bisnis, Percetakan, dan Kreativitas</strong>.</p>", "order": 1, "no_formal_header": false}]}, {"code": "L21OS-002", "label": "L21OS-002", "versions": [{"title": "KEBIJAKAN PERUSAHAAN LORONGSATU21", "meta": {"Kode Dokumen": "L21OS-002", "Nama Dokumen": "Kebijakan Perusahaan Lorongsatu21", "Versi": "1.0", "Status": "Dokumen Induk Kebijakan"}, "html": "<h3 class=\"sec-head\">PEMBUKAAN</h3>\n<p>Kebijakan Perusahaan Lorongsatu21 disusun sebagai pedoman resmi dalam mengelola perusahaan secara profesional, adil, sederhana, dan berkelanjutan.</p>\n<p>Seluruh kebijakan dalam dokumen ini merupakan turunan dari Piagam Lorongsatu21 dan Anggaran Dasar Lorongsatu21, serta menjadi dasar penyusunan manual, SOP, formulir, dan sistem digital perusahaan.</p>\n<div class=\"chapter-label\">BAGIAN I</div>\n<h3 class=\"sec-head\">KEBIJAKAN UMUM</h3>\n<div class=\"pasal-label\">Pasal 1</div>\n<p>Seluruh kegiatan perusahaan wajib mengacu pada nilai:</p>\n<p><strong>Berkarakter • Belajar • Bertumbuh • Berbagi • Bermanfaat</strong></p>\n<div class=\"pasal-label\">Pasal 2</div>\n<p>Seluruh keputusan perusahaan harus memenuhi Golden Rule L21OS.</p>\n<div class=\"pasal-label\">Pasal 3</div>\n<p>Setiap kebijakan harus:</p>\n<ul><li>mudah dipahami;</li><li>mudah diterapkan;</li><li>mudah diajarkan;</li><li>mudah diaudit;</li><li>mudah dikembangkan.</li></ul>\n<div class=\"chapter-label\">BAGIAN II</div>\n<h3 class=\"sec-head\">KEBIJAKAN ORGANISASI</h3>\n<div class=\"pasal-label\">Pasal 4</div>\n<p>Struktur organisasi perusahaan terdiri dari:</p>\n<ul><li>Pemilik;</li><li>Penanggung Jawab Cabang;</li><li>Anggota Tim.</li></ul>\n<p>Struktur dibangun berdasarkan fungsi dan tanggung jawab, bukan status.</p>\n<div class=\"pasal-label\">Pasal 5</div>\n<p>Setiap Anggota Tim dapat dipindahkan antar bagian atau cabang sesuai kebutuhan operasional dan kompetensi.</p>\n<div class=\"pasal-label\">Pasal 6</div>\n<p>Tidak ada pembatasan pengembangan berdasarkan masa kerja. Kesempatan berkembang diberikan berdasarkan karakter, kompetensi, dan kontribusi.</p>\n<div class=\"chapter-label\">BAGIAN III</div>\n<h3 class=\"sec-head\">KEBIJAKAN PENGEMBANGAN ANGGOTA TIM</h3>\n<div class=\"pasal-label\">Pasal 7</div>\n<p>Seluruh Anggota Tim wajib mengikuti Akademi L21.</p>\n<div class=\"pasal-label\">Pasal 8</div>\n<p>Setiap Anggota Tim memiliki rencana pengembangan kompetensi yang diperbarui secara berkala.</p>\n<div class=\"pasal-label\">Pasal 9</div>\n<p>Kenaikan level dilakukan berdasarkan hasil evaluasi, bukan senioritas.</p>\n<div class=\"pasal-label\">Pasal 10</div>\n<p>Setiap Anggota Tim yang telah mencapai level tertentu berkewajiban membimbing Anggota Tim lain sesuai kapasitasnya.</p>\n<div class=\"chapter-label\">BAGIAN IV</div>\n<h3 class=\"sec-head\">KEBIJAKAN KOMPENSASI</h3>\n<div class=\"pasal-label\">Pasal 11</div>\n<p>Sistem kompensasi bertujuan memberikan penghargaan yang adil, transparan, dan mendorong pengembangan kompetensi.</p>\n<div class=\"pasal-label\">Pasal 12</div>\n<p>Gaji terdiri dari:</p>\n<ul><li>Gaji Dasar (berdasarkan Level Kompetensi);</li><li>Tunjangan Tanggung Jawab (berdasarkan struktur yang diemban);</li><li>Tunjangan Keahlian Khusus (apabila ditetapkan perusahaan).</li></ul>\n<div class=\"pasal-label\">Pasal 13</div>\n<p>Bonus diberikan apabila perusahaan mencapai target yang telah ditetapkan.</p>\n<p>Pembagian bonus mempertimbangkan:</p>\n<ul><li>kontribusi terhadap target;</li><li>tanggung jawab;</li><li>level kompetensi sesuai kebijakan yang berlaku.</li></ul>\n<div class=\"chapter-label\">BAGIAN V</div>\n<h3 class=\"sec-head\">KEBIJAKAN PELAYANAN</h3>\n<div class=\"pasal-label\">Pasal 14</div>\n<p>Pelanggan menjadi prioritas utama dalam setiap kegiatan perusahaan.</p>\n<div class=\"pasal-label\">Pasal 15</div>\n<p>Setiap pelayanan harus memenuhi standar:</p>\n<ul><li>ramah;</li><li>cepat;</li><li>tepat;</li><li>berkualitas;</li><li>profesional.</li></ul>\n<div class=\"pasal-label\">Pasal 16</div>\n<p>Setiap keluhan pelanggan wajib ditindaklanjuti sebagai bahan pembelajaran dan perbaikan.</p>\n<div class=\"chapter-label\">BAGIAN VI</div>\n<h3 class=\"sec-head\">KEBIJAKAN PENGETAHUAN</h3>\n<div class=\"pasal-label\">Pasal 17</div>\n<p>Setiap inovasi, pengalaman, solusi, atau pembelajaran yang bermanfaat wajib didokumentasikan dalam Knowledge Base L21OS.</p>\n<div class=\"pasal-label\">Pasal 18</div>\n<p>Pengetahuan perusahaan merupakan aset bersama dan digunakan untuk mengembangkan seluruh Anggota Tim.</p>\n<div class=\"chapter-label\">BAGIAN VII</div>\n<h3 class=\"sec-head\">KEBIJAKAN TEKNOLOGI</h3>\n<div class=\"pasal-label\">Pasal 19</div>\n<p>Perusahaan memanfaatkan teknologi untuk meningkatkan kualitas layanan, efisiensi, dan pembelajaran.</p>\n<div class=\"pasal-label\">Pasal 20</div>\n<p>Setiap sistem digital harus mengikuti standar L21OS dan mendukung integrasi dengan ERP perusahaan.</p>\n<div class=\"chapter-label\">BAGIAN VIII</div>\n<h3 class=\"sec-head\">KEBIJAKAN PERBAIKAN BERKELANJUTAN</h3>\n<div class=\"pasal-label\">Pasal 21</div>\n<p>Setiap Anggota Tim didorong untuk mengusulkan ide perbaikan.</p>\n<div class=\"pasal-label\">Pasal 22</div>\n<p>Usulan yang terbukti memberikan manfaat dapat ditetapkan menjadi standar perusahaan.</p>\n<div class=\"pasal-label\">Pasal 23</div>\n<p>L21OS dievaluasi secara berkala untuk memastikan tetap relevan dengan perkembangan perusahaan dan teknologi.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Kebijakan Perusahaan Lorongsatu21 menjadi acuan seluruh unit kerja dalam menyusun Manual, SOP, Formulir, Dashboard, dan Sistem ERP. Seluruh Anggota Tim berkewajiban memahami serta menjalankan kebijakan ini dengan penuh tanggung jawab.</p>", "order": 2, "no_formal_header": false}]}, {"code": "L21OS-003", "label": "L21OS-003", "versions": [{"title": "SISTEM PENGEMBANGAN ANGGOTA TIM", "meta": {"Kode Dokumen": "L21OS-003", "Versi": "1.0"}, "html": "<div class=\"chapter-label\">BAB I</div>\n<h3 class=\"sec-head\">FILOSOFI</h3>\n<p>Lorongsatu21 percaya bahwa setiap orang memiliki potensi untuk berkembang.</p>\n<p>Perusahaan tidak hanya mencari orang yang memiliki kemampuan tinggi, tetapi membangun lingkungan yang membantu setiap Anggota Tim menjadi pribadi yang lebih baik, lebih kompeten, dan lebih bermanfaat.</p>\n<p>Pengembangan Anggota Tim dilakukan secara terencana, terukur, berkelanjutan, dan adil.</p>\n<div class=\"chapter-label\">BAB II</div>\n<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Sistem Pengembangan Anggota Tim bertujuan untuk:</p>\n<ul><li>Mengembangkan karakter setiap Anggota Tim.</li><li>Meningkatkan kompetensi sesuai kebutuhan perusahaan.</li><li>Menumbuhkan budaya belajar dan berbagi.</li><li>Menyiapkan calon pemimpin dari dalam perusahaan.</li><li>Menjaga kualitas pelayanan di seluruh cabang.</li><li>Memberikan kesempatan berkembang secara adil berdasarkan karakter, kompetensi, dan kontribusi.</li></ul>\n<div class=\"chapter-label\">BAB III</div>\n<h3 class=\"sec-head\">PRINSIP DASAR</h3>\n<p>Seluruh pengembangan Anggota Tim berlandaskan prinsip berikut:</p>\n<h3 class=\"sec-head\">1. Karakter lebih utama daripada kemampuan.</h3>\n<p>Karakter menjadi dasar kepercayaan.</p>\n<h3 class=\"sec-head\">2. Semua orang dapat belajar.</h3>\n<p>Perusahaan menyediakan kesempatan belajar bagi seluruh Anggota Tim.</p>\n<h3 class=\"sec-head\">3. Kompetensi dapat dilatih.</h3>\n<p>Kemampuan dikembangkan melalui Akademi L21, praktik kerja, mentoring, dan evaluasi.</p>\n<h3 class=\"sec-head\">4. Kontribusi dihargai.</h3>\n<p>Semakin besar kontribusi terhadap pelanggan, tim, dan perusahaan, semakin besar kesempatan berkembang.</p>\n<h3 class=\"sec-head\">5. Berbagi adalah kewajiban.</h3>\n<p>Ilmu, pengalaman, dan praktik terbaik wajib dibagikan agar menjadi pengetahuan perusahaan.</p>\n<div class=\"chapter-label\">BAB IV</div>\n<h3 class=\"sec-head\">MODEL PENGEMBANGAN L21</h3>\n<p>Perjalanan setiap Anggota Tim mengikuti lima tahap berikut.</p>\n<p><strong>Tahap 1</strong></p>\n<p><strong>Berkarakter</strong></p>\n<p>Membangun integritas, disiplin, tanggung jawab, dan etika kerja.</p>\n<p>↓</p>\n<p><strong>Tahap 2</strong></p>\n<p><strong>Belajar</strong></p>\n<p>Mengikuti Akademi L21, membaca SOP, praktik, dan mentoring.</p>\n<p>↓</p>\n<p><strong>Tahap 3</strong></p>\n<p><strong>Bertumbuh</strong></p>\n<p>Meningkatkan level kompetensi dan tanggung jawab.</p>\n<p>↓</p>\n<p><strong>Tahap 4</strong></p>\n<p><strong>Berbagi</strong></p>\n<p>Menjadi mentor, berbagi pengalaman, dan mendokumentasikan pengetahuan.</p>\n<p>↓</p>\n<p><strong>Tahap 5</strong></p>\n<p><strong>Bermanfaat</strong></p>\n<p>Memberikan manfaat nyata bagi pelanggan, Anggota Tim, perusahaan, dan masyarakat.</p>\n<p>Tahapan ini bersifat siklus. Setelah berbagi, Anggota Tim kembali belajar untuk terus berkembang.</p>\n<div class=\"chapter-label\">BAB V</div>\n<h3 class=\"sec-head\">AKADEMI L21</h3>\n<p>Akademi L21 adalah sistem pembelajaran internal Lorongsatu21.</p>\n<p>Program Akademi L21 terdiri atas:</p>\n<ul><li>Orientasi Anggota Tim Baru.</li><li>Pelatihan Dasar.</li><li>Pelatihan Teknis.</li><li>Pelatihan Pelayanan.</li><li>Pelatihan Kepemimpinan.</li><li>Pelatihan Teknologi dan AI.</li><li>Sertifikasi Kompetensi.</li><li>Pengembangan Penanggung Jawab Cabang.</li></ul>\n<p>Seluruh materi pembelajaran didokumentasikan dalam Knowledge Base L21OS.</p>\n<div class=\"chapter-label\">BAB VI</div>\n<h3 class=\"sec-head\">LEVEL KOMPETENSI</h3>\n<p>Perusahaan menggunakan lima level kompetensi.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Level</strong></th><th><strong>Fokus</strong></th></tr></thead><tbody><tr><td>L1</td><td>Belajar pekerjaan dasar dan budaya perusahaan.</td></tr><tr><td>L2</td><td>Mampu bekerja mandiri sesuai standar.</td></tr><tr><td>L3</td><td>Menjadi mentor teknis dan menjaga kualitas kerja.</td></tr><tr><td>L4</td><td>Mengelola operasional dan mengembangkan Anggota Tim.</td></tr><tr><td>L5</td><td>Memimpin pengembangan bisnis, budaya, dan sistem perusahaan.</td></tr></tbody></table></div>\n<p>Level ditentukan melalui evaluasi, bukan berdasarkan masa kerja.</p>\n<div class=\"chapter-label\">BAB VII</div>\n<h3 class=\"sec-head\">MODEL PENILAIAN</h3>\n<p>Pengembangan Anggota Tim dievaluasi melalui empat aspek utama.</p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Aspek</strong></th><th><strong>Tujuan</strong></th></tr></thead><tbody><tr><td>Karakter</td><td>Menilai integritas, disiplin, tanggung jawab, dan kerja sama.</td></tr><tr><td>Kompetensi</td><td>Menilai kemampuan teknis dan pengetahuan.</td></tr><tr><td>Kontribusi</td><td>Menilai dampak terhadap pelanggan, tim, dan perusahaan.</td></tr><tr><td>Pembelajaran</td><td>Menilai kemauan belajar dan berbagi pengetahuan.</td></tr></tbody></table></div>\n<p>Keempat aspek digunakan sebagai dasar evaluasi pengembangan, bukan hanya hasil kerja sesaat.</p>\n<div class=\"chapter-label\">BAB VIII</div>\n<h3 class=\"sec-head\">HAK ANGGOTA TIM</h3>\n<p>Setiap Anggota Tim berhak:</p>\n<ul><li>mendapatkan pelatihan;</li><li>memperoleh pendampingan;</li><li>mengetahui hasil evaluasi;</li><li>memperoleh kesempatan berkembang;</li><li>menyampaikan ide dan masukan;</li><li>diperlakukan secara adil dan profesional.</li></ul>\n<div class=\"chapter-label\">BAB IX</div>\n<h3 class=\"sec-head\">TANGGUNG JAWAB ANGGOTA TIM</h3>\n<p>Setiap Anggota Tim bertanggung jawab untuk:</p>\n<ul><li>menjaga karakter;</li><li>terus belajar;</li><li>meningkatkan kompetensi;</li><li>berbagi pengetahuan;</li><li>menjaga kualitas pelayanan;</li><li>menjalankan L21OS dengan penuh tanggung jawab.</li></ul>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Sistem Pengembangan Anggota Tim merupakan fondasi utama dalam membangun budaya belajar di Lorongsatu21. Seluruh kebijakan mengenai pelatihan, level kompetensi, evaluasi, kompensasi, dan kepemimpinan merupakan bagian yang tidak terpisahkan dari sistem ini.</p>", "order": 3, "no_formal_header": false}]}], "kelompok": [{"key": "A", "name": "NILAI & BUDAYA", "items": [{"code": "SL21-101", "official_title": "Standar Karakter", "status": "ok", "note": "Di dalam dokumen memakai kode SL21-001, bukan SL21-101 sesuai Daftar Standar Resmi.", "versions": [{"title": "STANDAR KARAKTER ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-001", "Kategori": "Standar L21", "Status": "Wajib Diterapkan"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menjadi dasar pembentukan karakter seluruh Anggota Tim Lorongsatu21.</p>\n<p>Karakter merupakan fondasi utama dalam membangun kepercayaan, budaya kerja, pelayanan, serta pengembangan kompetensi.</p>\n<h3 class=\"sec-head\">2. RUANG LINGKUP</h3>\n<p>Standar ini berlaku bagi:</p>\n<ul><li>Pemilik</li><li>Penanggung Jawab Cabang</li><li>Seluruh Anggota Tim</li><li>Peserta magang</li><li>Calon Anggota Tim</li></ul>\n<h3 class=\"sec-head\">3. PRINSIP DASAR</h3>\n<p>Lorongsatu21 meyakini bahwa:</p>\n<p>Karakter membangun kepercayaan.</p>\n<p>Kompetensi menghasilkan kualitas.</p>\n<p>Kapasitas memperluas tanggung jawab.</p>\n<p>Kontribusi menciptakan manfaat.</p>\n<h3 class=\"sec-head\">4. STANDAR KARAKTER</h3>\n<p>Seluruh Anggota Tim wajib mengembangkan sepuluh karakter berikut.</p>\n<h3 class=\"sec-head\">1. Jujur</h3>\n<p>Mengatakan dan melakukan hal yang benar.</p>\n<h3 class=\"sec-head\">2. Disiplin</h3>\n<p>Mematuhi waktu, standar, dan komitmen.</p>\n<h3 class=\"sec-head\">3. Bertanggung Jawab</h3>\n<p>Menyelesaikan pekerjaan sampai tuntas.</p>\n<h3 class=\"sec-head\">4. Mau Belajar</h3>\n<p>Terbuka terhadap pengetahuan baru.</p>\n<h3 class=\"sec-head\">5. Peduli</h3>\n<p>Membantu pelanggan dan sesama Anggota Tim.</p>\n<h3 class=\"sec-head\">6. Menghargai</h3>\n<p>Menghormati setiap orang.</p>\n<h3 class=\"sec-head\">7. Berinisiatif</h3>\n<p>Mencari solusi sebelum diminta.</p>\n<h3 class=\"sec-head\">8. Berbagi</h3>\n<p>Mau mengajarkan ilmu kepada Anggota Tim lain.</p>\n<h3 class=\"sec-head\">9. Menjaga Kualitas</h3>\n<p>Tidak puas dengan hasil yang asal selesai.</p>\n<h3 class=\"sec-head\">10. Menjaga Nama Baik Lorongsatu21</h3>\n<p>Bersikap profesional di dalam maupun di luar lingkungan kerja.</p>\n<h3 class=\"sec-head\">5. INDIKATOR</h3>\n<p>Karakter dinilai melalui perilaku nyata.</p>\n<p>Contoh:</p>\n<ul><li>datang tepat waktu;</li><li>menyelesaikan pekerjaan;</li><li>menjaga kebersihan;</li><li>membantu pelanggan;</li><li>membantu Anggota Tim lain;</li><li>mengakui kesalahan;</li><li>menjaga aset perusahaan.</li></ul>\n<h3 class=\"sec-head\">6. PENILAIAN</h3>\n<p>Penilaian karakter dilakukan menggunakan empat kategori.</p>\n<p>A = Teladan</p>\n<p>B = Konsisten</p>\n<p>C = Perlu Pembinaan</p>\n<p>D = Tidak Memenuhi Standar</p>\n<h3 class=\"sec-head\">7. HUBUNGAN DENGAN L21OS</h3>\n<p>Standar Karakter menjadi dasar:</p>\n<ul><li>Rekrutmen.</li><li>Masa percobaan.</li><li>Evaluasi.</li><li>Akademi L21.</li><li>Kenaikan Level.</li><li>Penempatan.</li><li>Pemberian tanggung jawab.</li></ul>\n<p>Karakter bukan satu-satunya penentu gaji, tetapi menjadi syarat untuk memperoleh kepercayaan dan tanggung jawab yang lebih besar.</p>\n<h3 class=\"sec-head\">8. KOMITMEN</h3>\n<p>Seluruh Anggota Tim berkomitmen untuk menjaga karakter sebagai dasar dalam bekerja, belajar, bertumbuh, berbagi, dan memberikan manfaat bagi pelanggan, sesama Anggota Tim, serta masyarakat.</p>", "order": 4, "no_formal_header": false}]}, {"code": "SL21-102", "official_title": "Standar Budaya Kerja", "status": "ok", "note": "", "versions": [{"title": "STANDAR BUDAYA KERJA", "meta": {"Kode Dokumen": "SL21-102", "Nama Dokumen": "Standar Budaya Kerja", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan budaya kerja sehari-hari di Lorongsatu21 agar seluruh Anggota Tim bekerja dengan cara yang sama, saling mendukung, dan mencerminkan nilai-nilai perusahaan dalam setiap aktivitas.</p>\n<p>Budaya kerja yang kuat membuat perusahaan mudah dijalankan, mudah diajarkan kepada Anggota Tim baru, dan mudah dikembangkan ke unit atau cabang berikutnya.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Budaya bukan slogan di dinding, tetapi kebiasaan yang benar-benar dijalankan setiap hari.</li><li>Budaya yang baik dibangun dari hal-hal kecil yang dilakukan berulang, bukan dari peraturan yang panjang.</li><li>Setiap Anggota Tim adalah penjaga budaya, bukan hanya pengikutnya.</li></ul>\n<p>Moto:</p>\n<p><strong>Datang dengan Niat • Bekerja dengan Standar • Pulang dengan Manfaat</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>Budaya kerja L21 harus sederhana dan mudah dijalankan setiap hari.</li><li>Budaya kerja dibangun dari kebiasaan Anggota Tim, bukan hanya instruksi Penanggung Jawab Cabang.</li><li>Budaya kerja berlaku sama untuk semua unit — Fotokopi, ATK, Percetakan, Foto, maupun Pakaian.</li></ul>\n<h3 class=\"sec-head\">4. BUDAYA HARIAN</h3>\n<p>Setiap hari kerja, Anggota Tim menjalankan kebiasaan berikut:</p>\n<ul><li>Datang sesuai jam operasional dan mempersiapkan area kerja sebelum toko dibuka.</li><li>Memeriksa kebersihan dan kesiapan area serta peralatan di unit masing-masing.</li><li>Mengikuti briefing singkat (bila dijadwalkan) untuk menyampaikan informasi penting hari itu.</li><li>Menyapa rekan kerja dan bersikap terbuka untuk saling membantu sepanjang hari.</li><li>Merapikan area kerja dan mencatat hal penting sebelum jam kerja berakhir.</li></ul>\n<h3 class=\"sec-head\">5. BUDAYA KOLABORASI ANTAR UNIT</h3>\n<p>Lorongsatu21 terdiri dari beberapa unit dalam satu lokasi. Anggota Tim wajib:</p>\n<ul><li>Saling membantu ketika satu unit sedang ramai dan unit lain lebih longgar, sesuai kompetensi yang dimiliki.</li><li>Tidak membeda-bedakan unit tempat bertugas — seluruh unit sama pentingnya bagi Lorongsatu21.</li><li>Menyampaikan informasi pelanggan atau pesanan secara jelas ketika pekerjaan berpindah tangan antar unit atau antar Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">6. BUDAYA KEBERSIHAN DAN KERAPIAN</h3>\n<p>Area kerja, etalase, dan ruang pelayanan pelanggan wajib selalu bersih dan rapi karena mencerminkan kualitas Lorongsatu21 di mata pelanggan.</p>\n<ul><li>Sampah dan sisa produksi dibersihkan segera, tidak menumpuk.</li><li>Barang dan alat dikembalikan ke tempatnya setelah digunakan.</li><li>Area yang terlihat langsung oleh pelanggan menjadi prioritas kebersihan tertinggi.</li></ul>\n<h3 class=\"sec-head\">7. BUDAYA BELAJAR</h3>\n<p>Setiap Anggota Tim didorong untuk terus belajar melalui Akademi L21, bimbingan sesama Anggota Tim, maupun pengalaman kerja sehari-hari.</p>\n<ul><li>Kesalahan dijadikan bahan belajar, bukan bahan menyalahkan.</li><li>Anggota Tim yang sudah kompeten membantu membimbing Anggota Tim yang baru belajar.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menjalankan budaya harian secara konsisten;</li><li>menjaga kebersihan dan kerapian area kerja;</li><li>saling membantu antar unit.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menjadi teladan budaya kerja;</li><li>menegur dengan cara yang mendidik apabila budaya tidak dijalankan;</li><li>memastikan budaya kerja diperkenalkan sejak masa orientasi.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Area kerja selalu bersih dan siap digunakan sejak toko dibuka.</li><li>Anggota Tim saling membantu tanpa harus selalu diminta.</li><li>Tidak ada keluhan pelanggan terkait kebersihan atau sikap kerja Anggota Tim.</li><li>Anggota Tim baru dapat mengikuti budaya kerja dalam waktu singkat setelah orientasi.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-001 Standar Karakter.</li><li>SL21-103 Standar Kepemimpinan.</li><li>SL21-105 Standar Komunikasi.</li><li>SL21-202 Standar Orientasi.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>hasil pemeriksaan kebersihan area (bila dijadwalkan);</li><li>catatan pembinaan budaya kerja;</li><li>partisipasi dalam briefing.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>area kerja memenuhi standar kebersihan;</li><li>budaya harian dijalankan secara konsisten;</li><li>kolaborasi antar unit berjalan baik.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Masukan Anggota Tim, hasil audit, dan pengamatan Penanggung Jawab Cabang digunakan untuk menyempurnakan kebiasaan kerja sehari-hari serta materi orientasi dan Akademi L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Budaya kerja adalah wajah Lorongsatu21 yang dilihat pelanggan setiap hari, meskipun tidak tertulis di produk atau struk transaksi.</p>\n<p>Dengan budaya kerja yang konsisten, Lorongsatu21 tumbuh menjadi perusahaan yang nyaman untuk bekerja dan dipercaya oleh pelanggan.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-103", "official_title": "Standar Kepemimpinan", "status": "ok", "note": "", "versions": [{"title": "STANDAR KEPEMIMPINAN", "meta": {"Kode Dokumen": "SL21-103", "Nama Dokumen": "Standar Kepemimpinan", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan prinsip dan perilaku kepemimpinan yang berlaku bagi Pemilik, Penanggung Jawab Cabang, dan setiap Anggota Tim yang diberi tanggung jawab membimbing orang lain.</p>\n<p>Kepemimpinan di Lorongsatu21 diukur dari kemampuan mengembangkan orang lain, bukan hanya dari jabatan yang dipegang.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Memimpin di Lorongsatu21 berarti melayani, bukan sekadar memerintah.</li><li>Pemimpin yang baik membuat timnya lebih mampu, bukan lebih tergantung.</li><li>Kepercayaan dipimpin dengan amanah — menjaga apa yang dititipkan, baik berupa tanggung jawab, informasi, maupun sumber daya perusahaan.</li></ul>\n<p>Moto:</p>\n<p><strong>Memimpin dengan Teladan. Membimbing dengan Sabar. Bertanggung Jawab Sampai Tuntas.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP KEPEMIMPINAN L21</h3>\n<ul><li>Teladan lebih dulu, instruksi kemudian.</li><li>Keputusan diambil berdasarkan data dan prinsip, bukan suasana hati.</li><li>Kesalahan tim ditangani sebagai bahan pembinaan, bukan pencarian kambing hitam.</li><li>Pemimpin bertanggung jawab atas hasil timnya, termasuk saat hasil belum sesuai target.</li></ul>\n<h3 class=\"sec-head\">4. TANGGUNG JAWAB PEMIMPIN</h3>\n<p>Setiap pemimpin di Lorongsatu21, pada level apa pun, bertanggung jawab untuk:</p>\n<ul><li>memastikan Anggota Tim memahami tugas dan standar kerjanya;</li><li>membimbing Anggota Tim yang masih belajar tanpa menyelesaikan semuanya sendiri;</li><li>memberi kepercayaan dan tanggung jawab yang bertahap sesuai kesiapan Anggota Tim;</li><li>menyampaikan kabar baik maupun kabar sulit secara jujur kepada atasan maupun bawahan.</li></ul>\n<h3 class=\"sec-head\">5. PENGAMBILAN KEPUTUSAN</h3>\n<p>Dalam mengambil keputusan, pemimpin L21 wajib:</p>\n<ul><li>mengumpulkan informasi yang cukup sebelum memutuskan;</li><li>mempertimbangkan dampaknya terhadap pelanggan, Anggota Tim, dan perusahaan;</li><li>berani mengambil keputusan tepat waktu, tidak berlarut-larut;</li><li>menjelaskan alasan keputusan kepada pihak yang terdampak, sepanjang memungkinkan.</li></ul>\n<h3 class=\"sec-head\">6. MEMBIMBING ANGGOTA TIM</h3>\n<ul><li>Memberi arahan yang jelas sebelum pekerjaan dimulai.</li><li>Mendampingi, bukan mengambil alih, saat Anggota Tim belajar hal baru.</li><li>Memberikan umpan balik segera setelah suatu pekerjaan selesai, baik untuk mengapresiasi maupun memperbaiki.</li><li>Memberi kesempatan kedua kepada Anggota Tim yang melakukan kesalahan wajar dalam proses belajar.</li></ul>\n<div class=\"gold-box\"><div class=\"gold-title\">7. ATURAN EMAS KEPEMIMPINAN L21</div><ul><li>Jangan meminta Anggota Tim melakukan sesuatu yang pemimpin sendiri tidak mau lakukan.</li><li>Jangan menyalahkan Anggota Tim di depan pelanggan atau Anggota Tim lain.</li><li>Jangan menahan informasi yang dibutuhkan tim untuk bekerja dengan baik.</li><li>Jangan mengambil kredit atas hasil kerja tim sebagai pencapaian pribadi.</li><li>Selalu utamakan penyelesaian masalah dibanding mencari siapa yang salah.</li></ul></div>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>menjalankan prinsip kepemimpinan L21 sehari-hari;</li><li>membina Anggota Tim menuju Level Kompetensi berikutnya;</li><li>melaporkan perkembangan tim kepada Pemilik.</li></ul>\n<p><strong>Pemilik</strong></p>\n<ul><li>menjadi teladan tertinggi budaya dan kepemimpinan L21;</li><li>mendukung Penanggung Jawab Cabang dalam pengambilan keputusan yang sulit.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Anggota Tim merasa dibimbing, bukan hanya diperintah.</li><li>Keputusan operasional harian dapat diambil tanpa selalu menunggu Pemilik.</li><li>Semakin banyak Anggota Tim yang siap naik Level Kompetensi dan diberi tanggung jawab baru.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-210 Standar Pengembangan Pemimpin.</li><li>SL21-001 Standar Karakter.</li><li>SL21-102 Standar Budaya Kerja.</li><li>SL21-205 Standar Penugasan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>catatan pembinaan Anggota Tim;</li><li>keputusan penting dan alasannya;</li><li>hasil evaluasi kepemimpinan Penanggung Jawab Cabang.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>keputusan operasional terdokumentasi dan beralasan jelas;</li><li>Anggota Tim menerima bimbingan yang memadai;</li><li>tidak terjadi pola kepemimpinan yang bertentangan dengan Piagam Lorongsatu21.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Hasil evaluasi kinerja, masukan Anggota Tim, dan pengamatan Pemilik digunakan untuk menyempurnakan cara memimpin dan materi Pengembangan Pemimpin (SL21-210).</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Kepemimpinan di Lorongsatu21 bukan tentang siapa yang paling berkuasa, tetapi siapa yang paling bertanggung jawab membuat orang lain bertumbuh.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-104", "official_title": "Standar Etika", "status": "ok", "note": "", "versions": [{"title": "STANDAR ETIKA", "meta": {"Kode Dokumen": "SL21-104", "Nama Dokumen": "Standar Etika", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan prinsip etika yang menjadi pedoman berpikir dan bertindak bagi seluruh Anggota Tim Lorongsatu21 dalam bekerja, melayani pelanggan, bertransaksi, dan menjalankan usaha.</p>\n<p>Etika menjadi dasar kepercayaan pelanggan, mitra, dan sesama Anggota Tim terhadap Lorongsatu21.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<p>Lorongsatu21 menjalankan usaha berlandaskan kejujuran, amanah, dan keadilan sebagaimana tercantum dalam Piagam Lorongsatu21, sejalan dengan prinsip muamalah yang menekankan kejujuran dalam bertransaksi, menjaga amanah, dan menghindari cara-cara yang merugikan pihak lain.</p>\n<ul><li>Kejujuran adalah dasar dari seluruh transaksi dan hubungan kerja.</li><li>Amanah berarti menjaga apa yang dipercayakan — uang, barang, data, maupun tanggung jawab.</li><li>Keuntungan yang baik adalah keuntungan yang diperoleh dengan cara yang jujur dan tidak merugikan orang lain.</li></ul>\n<p>Moto:</p>\n<p><strong>Jujur dalam Bertransaksi. Amanah dalam Bertanggung Jawab. Adil dalam Bertindak.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP ETIKA L21</h3>\n<ul><li>Kejujuran (Shidiq) — mengatakan dan melakukan hal yang benar, termasuk dalam menyampaikan harga, kualitas, dan waktu pengerjaan kepada pelanggan.</li><li>Amanah — menjaga kepercayaan yang diberikan, baik oleh perusahaan, pelanggan, maupun sesama Anggota Tim.</li><li>Keadilan — memperlakukan pelanggan, mitra, dan sesama Anggota Tim secara adil tanpa membeda-bedakan secara tidak wajar.</li><li>Tanggung Jawab — mengakui dan memperbaiki kesalahan, bukan menyembunyikannya.</li></ul>\n<h3 class=\"sec-head\">4. ETIKA DALAM BERTRANSAKSI</h3>\n<p>Prinsip muamalah menjadi acuan dalam seluruh transaksi Lorongsatu21, dengan penerapan sebagai berikut:</p>\n<ul><li>Harga, spesifikasi, dan waktu pengerjaan disampaikan dengan jelas dan jujur sebelum pesanan diproses (menghindari gharar atau ketidakjelasan dalam kesepakatan).</li><li>Tidak mengurangi kualitas, jumlah, atau ukuran hasil pekerjaan dari yang telah disepakati dengan pelanggan.</li><li>Tidak menaikkan harga secara sepihak setelah kesepakatan dibuat.</li><li>Pembiayaan dan kerja sama usaha Lorongsatu21 diupayakan menghindari unsur riba, mengutamakan skema yang adil dan transparan bagi kedua belah pihak.</li></ul>\n<h3 class=\"sec-head\">5. ETIKA DALAM HUBUNGAN KERJA</h3>\n<ul><li>Tidak menerima gratifikasi dari pemasok atau mitra yang dapat memengaruhi keputusan kerja secara tidak adil.</li><li>Tidak menggunakan posisi atau wewenang untuk kepentingan pribadi yang merugikan perusahaan.</li><li>Rekrutmen, penugasan, dan kenaikan level dilakukan berdasarkan karakter dan kompetensi, bukan hubungan keluarga atau kedekatan pribadi, sebagaimana ditetapkan dalam Kebijakan Perusahaan.</li><li>Menjaga kerahasiaan informasi perusahaan, pelanggan, dan sesama Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">6. ETIKA DALAM PENGGUNAAN ASET PERUSAHAAN</h3>\n<ul><li>Aset, bahan, dan waktu kerja perusahaan digunakan hanya untuk kepentingan perusahaan.</li><li>Tidak menggunakan kas, mesin, atau bahan produksi perusahaan untuk kepentingan pribadi tanpa izin.</li><li>Melaporkan dengan jujur apabila terjadi kerusakan, kehilangan, atau kesalahan penggunaan aset.</li></ul>\n<h3 class=\"sec-head\">7. PELANGGARAN ETIKA</h3>\n<p>Pelanggaran terhadap Standar Etika ditangani secara adil melalui proses pembinaan dan, apabila diperlukan, sesuai ketentuan lebih lanjut dalam Kebijakan Perusahaan.</p>\n<p>Anggota Tim yang menemukan indikasi pelanggaran etika didorong untuk melaporkannya kepada Penanggung Jawab Cabang atau Pemilik.</p>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menjalankan prinsip etika dalam setiap pekerjaan dan transaksi;</li><li>melaporkan pelanggaran etika yang diketahui.</li></ul>\n<p><strong>Penanggung Jawab Cabang dan Pemilik</strong></p>\n<ul><li>menjadi teladan etika bagi seluruh Anggota Tim;</li><li>menindaklanjuti laporan pelanggaran secara adil dan tidak berpihak.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Tidak ada keluhan pelanggan terkait ketidakjujuran dalam harga, spesifikasi, atau waktu pengerjaan.</li><li>Transaksi dan pengelolaan aset perusahaan berjalan transparan dan dapat dipertanggungjawabkan.</li><li>Anggota Tim merasa aman melaporkan pelanggaran etika tanpa takut disalahkan.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-001 Standar Karakter.</li><li>L21OS-002 Kebijakan Perusahaan.</li><li>SL21-301 Standar Pelayanan Pelanggan.</li><li>Seluruh Standar Keuangan (Kelompok F).</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>laporan pelanggaran etika (bila ada);</li><li>tindak lanjut dan penyelesaiannya.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa:</p>\n<ul><li>transaksi dengan pelanggan dan mitra dilakukan secara jujur dan transparan;</li><li>tidak ada penyalahgunaan aset perusahaan;</li><li>laporan pelanggaran etika ditindaklanjuti secara wajar.</li></ul>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap temuan terkait etika menjadi bahan evaluasi untuk memperkuat budaya kerja, materi Akademi L21, dan Kebijakan Perusahaan.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Etika adalah fondasi yang membuat kepercayaan pelanggan dan mitra terhadap Lorongsatu21 dapat terus dijaga dan bertumbuh dari waktu ke waktu.</p>", "order": 9999, "no_formal_header": false}]}, {"code": "SL21-105", "official_title": "Standar Komunikasi", "status": "ok", "note": "", "versions": [{"title": "STANDAR KOMUNIKASI", "meta": {"Kode Dokumen": "SL21-105", "Nama Dokumen": "Standar Komunikasi", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini menetapkan cara berkomunikasi yang berlaku di internal Lorongsatu21 — antar Anggota Tim, antara Anggota Tim dan Penanggung Jawab Cabang, maupun antara Penanggung Jawab Cabang dan Pemilik — agar informasi tersampaikan dengan jelas, cepat, dan tidak menimbulkan kesalahpahaman.</p>\n<p>Standar ini melengkapi SL21-304 Standar Komunikasi WhatsApp yang secara khusus mengatur komunikasi dengan pelanggan.</p>\n<h3 class=\"sec-head\">2. FILOSOFI</h3>\n<ul><li>Komunikasi yang jelas mencegah kesalahan kerja.</li><li>Informasi penting harus sampai ke orang yang tepat, tanpa harus ditanyakan berulang kali.</li><li>Menyampaikan masalah lebih awal selalu lebih baik daripada menyembunyikannya.</li></ul>\n<p>Moto:</p>\n<p><strong>Jelas Menyampaikan. Terbuka Menerima. Tepat Menindaklanjuti.</strong></p>\n<h3 class=\"sec-head\">3. PRINSIP</h3>\n<ul><li>sopan dan menghargai lawan bicara;</li><li>jelas dan tidak bertele-tele;</li><li>jujur, termasuk saat menyampaikan kabar yang kurang baik;</li><li>tepat sasaran — disampaikan kepada pihak yang berkepentingan.</li></ul>\n<h3 class=\"sec-head\">4. JENIS KOMUNIKASI INTERNAL</h3>\n<p><strong>Komunikasi Harian</strong></p>\n<p>Penyampaian informasi operasional sehari-hari, seperti stok, kendala mesin, atau jadwal kerja.</p>\n<p><strong>Briefing / Rapat</strong></p>\n<p>Penyampaian informasi penting yang perlu diketahui bersama secara terjadwal.</p>\n<p><strong>Laporan</strong></p>\n<p>Penyampaian hasil kerja, kendala, atau capaian secara tertulis kepada Penanggung Jawab Cabang atau Pemilik.</p>\n<p><strong>Eskalasi</strong></p>\n<p>Penyampaian masalah yang tidak dapat diselesaikan sendiri kepada pihak yang berwenang mengambil keputusan.</p>\n<h3 class=\"sec-head\">5. STANDAR KOMUNIKASI LISAN</h3>\n<ul><li>Berbicara dengan nada yang tenang dan sopan, termasuk saat menyampaikan keberatan.</li><li>Mendengarkan sampai selesai sebelum menanggapi.</li><li>Mengonfirmasi kembali instruksi penting untuk menghindari kesalahpahaman.</li></ul>\n<h3 class=\"sec-head\">6. STANDAR KOMUNIKASI TERTULIS/DIGITAL</h3>\n<ul><li>Menggunakan bahasa yang jelas dan mudah dipahami, tanpa singkatan yang membingungkan.</li><li>Informasi penting (perubahan jadwal, kendala produksi, keluhan pelanggan) disampaikan secara tertulis agar dapat ditelusuri kembali.</li><li>Membalas pesan kerja penting dalam waktu yang wajar sesuai jam operasional.</li></ul>\n<h3 class=\"sec-head\">7. STANDAR BRIEFING</h3>\n<p>Apabila briefing dijadwalkan, briefing dilakukan secara singkat dan fokus pada:</p>\n<ul><li>informasi penting hari itu;</li><li>kendala yang perlu diketahui bersama;</li><li>pengingat standar kerja atau pelayanan.</li></ul>\n<h3 class=\"sec-head\">8. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<ul><li>menyampaikan informasi penting secara jelas dan tepat waktu;</li><li>mengonfirmasi instruksi yang belum jelas.</li></ul>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<ul><li>memastikan informasi penting tersampaikan ke seluruh Anggota Tim yang terkait;</li><li>menjadi jalur eskalasi bagi masalah yang tidak dapat diselesaikan Anggota Tim.</li></ul>\n<h3 class=\"sec-head\">9. INDIKATOR KEBERHASILAN</h3>\n<ul><li>Tidak terjadi kesalahan kerja akibat informasi yang tidak tersampaikan.</li><li>Masalah dilaporkan dan ditindaklanjuti tanpa penundaan yang tidak perlu.</li><li>Anggota Tim merasa nyaman menyampaikan kendala maupun kabar kurang baik.</li></ul>\n<h3 class=\"sec-head\">10. HUBUNGAN DENGAN STANDAR LAIN</h3>\n<ul><li>SL21-304 Standar Komunikasi WhatsApp.</li><li>SL21-102 Standar Budaya Kerja.</li><li>SL21-103 Standar Kepemimpinan.</li></ul>\n<h3 class=\"sec-head\">11. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>laporan dan eskalasi penting;</li><li>tindak lanjut atas laporan tersebut.</li></ul>\n<h3 class=\"sec-head\">12. AUDIT</h3>\n<p>Audit memastikan bahwa informasi penting terdokumentasi dan eskalasi ditindaklanjuti sesuai standar.</p>\n<h3 class=\"sec-head\">13. PERBAIKAN BERKELANJUTAN</h3>\n<p>Kendala komunikasi yang berulang menjadi bahan evaluasi untuk memperbaiki alur informasi dan materi Akademi L21.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Komunikasi yang jelas dan terbuka membuat Lorongsatu21 bekerja sebagai satu tim yang solid, meskipun terdiri dari beberapa unit yang berbeda.</p>", "order": 9999, "no_formal_header": false}]}]}, {"key": "B", "name": "PENGEMBANGAN ANGGOTA TIM", "items": [{"code": "SL21-201", "official_title": "Standar Rekrutmen", "status": "ok", "note": "", "versions": [{"title": "REKRUTMEN ANGGOTA TIM", "meta": {"Kode Dokumen": "SL21-201", "Nama Dokumen": "Standar Rekrutmen Anggota Tim", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Standar ini bertujuan memperoleh Anggota Tim yang memiliki karakter baik, kemauan belajar, dan potensi berkembang sesuai budaya Lorongsatu21.</p>\n<p>Rekrutmen dilakukan bukan hanya untuk memenuhi kebutuhan tenaga kerja, tetapi untuk membangun organisasi yang terus belajar dan memberikan manfaat.</p>\n<h3 class=\"sec-head\">2. PRINSIP REKRUTMEN</h3>\n<p>Lorongsatu21 meyakini bahwa:</p>\n<ul><li>Karakter lebih sulit dibentuk daripada kompetensi.</li><li>Kompetensi dapat dipelajari.</li><li>Pengalaman dapat diperoleh.</li><li>Sikap belajar menentukan masa depan seseorang.</li></ul>\n<p>Oleh karena itu, karakter menjadi prioritas utama dalam proses rekrutmen.</p>\n<h3 class=\"sec-head\">3. KRITERIA CALON ANGGOTA TIM</h3>\n<h3 class=\"sec-head\">A. Karakter (Prioritas Utama)</h3>\n<p>Calon Anggota Tim diharapkan memiliki:</p>\n<ul><li>Jujur.</li><li>Disiplin.</li><li>Bertanggung jawab.</li><li>Sopan dan menghargai orang lain.</li><li>Mau belajar.</li><li>Mampu bekerja sama.</li><li>Memiliki semangat melayani.</li><li>Bersedia menerima masukan.</li></ul>\n<h3 class=\"sec-head\">B. Potensi Belajar</h3>\n<p>Calon Anggota Tim diharapkan:</p>\n<ul><li>cepat memahami arahan;</li><li>memiliki rasa ingin tahu;</li><li>tidak takut mencoba hal baru;</li><li>mampu belajar dari kesalahan.</li></ul>\n<h3 class=\"sec-head\">C. Kompetensi Awal</h3>\n<p>Kompetensi teknis menjadi nilai tambah, namun bukan syarat utama.</p>\n<p>Contoh:</p>\n<ul><li>Mengoperasikan komputer.</li><li>Menggunakan Microsoft Office.</li><li>Desain grafis dasar.</li><li>Fotografi dasar.</li><li>Komunikasi yang baik.</li></ul>\n<p>Jika belum menguasai kompetensi tersebut, perusahaan akan mengembangkan melalui Akademi L21.</p>\n<h3 class=\"sec-head\">4. SUMBER REKRUTMEN</h3>\n<p>Perusahaan dapat merekrut melalui:</p>\n<ul><li>Lamaran langsung.</li><li>Referensi Anggota Tim.</li><li>Sekolah atau SMK.</li><li>Perguruan tinggi.</li><li>Media sosial.</li><li>Website perusahaan.</li><li>Program magang.</li></ul>\n<h3 class=\"sec-head\">5. TAHAPAN REKRUTMEN</h3>\n<p>Tahap 1</p>\n<p>Seleksi administrasi.</p>\n<p>↓</p>\n<p>Tahap 2</p>\n<p>Wawancara karakter.</p>\n<p>↓</p>\n<p>Tahap 3</p>\n<p>Tes dasar.</p>\n<p>↓</p>\n<p>Tahap 4</p>\n<p>Praktik sederhana.</p>\n<p>↓</p>\n<p>Tahap 5</p>\n<p>Wawancara
