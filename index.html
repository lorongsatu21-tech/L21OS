-head\">A. PEMERIKSAAN DOKUMEN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Dokumen asli sesuai dengan pesanan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Jumlah halaman dokumen asli lengkap</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Dokumen asli dalam kondisi baik</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. PEMERIKSAAN HASIL FOTOKOPI</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Jumlah lembar sesuai pesanan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Seluruh halaman lengkap</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Urutan halaman sudah benar</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Posisi cetak lurus</td><td>☐</td><td>☐</td><td></td></tr><tr><td>5</td><td>Hasil tidak buram</td><td>☐</td><td>☐</td><td></td></tr><tr><td>6</td><td>Hasil tidak terlalu gelap atau terlalu terang</td><td>☐</td><td>☐</td><td></td></tr><tr><td>7</td><td>Tidak terdapat garis, noda toner, atau bayangan yang mengganggu</td><td>☐</td><td>☐</td><td></td></tr><tr><td>8</td><td>Ukuran kertas sesuai pesanan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>9</td><td>Fotokopi satu sisi/dua sisi sesuai permintaan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>10</td><td>Pembesaran atau pengecilan sesuai permintaan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. PEMERIKSAAN PENYELESAIAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Hasil telah disusun rapi</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Dokumen asli telah dikembalikan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Pesanan siap diserahkan kepada pelanggan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">D. DATA PEMERIKSAAN</h3>\n<p class=\"kv-line\"><span class=\"kv-label\">Nomor Pesanan</span>: _______________________</p>\n<p class=\"kv-line\"><span class=\"kv-label\">Nama Pelanggan</span>: _______________________</p>\n<p class=\"kv-line\"><span class=\"kv-label\">Tanggal</span>: _______________________</p>\n<p class=\"kv-line\"><span class=\"kv-label\">Anggota Tim</span>: _______________________</p>\n<p class=\"kv-line\"><span class=\"kv-label\">Waktu Selesai</span>: _______________________</p>\n<h3 class=\"sec-head\">E. HASIL PEMERIKSAAN</h3>\n<p class=\"checkbox-line\">☐ <strong>Lulus Pemeriksaan</strong> — Pesanan dapat diserahkan kepada pelanggan.</p>\n<p class=\"checkbox-line\">☐ <strong>Perlu Perbaikan</strong> — Perbaikan dilakukan sebelum pesanan diserahkan.</p>\n<p>Catatan:</p>\n<h3 class=\"sec-head\">PRINSIP PEMERIKSAAN L21</h3>\n<p>Setiap hasil fotokopi harus memenuhi prinsip:</p>\n<ul><li><strong>Benar</strong> — sesuai dengan pesanan pelanggan.</li><li><strong>Jelas</strong> — mudah dibaca dan berkualitas baik.</li><li><strong>Rapi</strong> — tersusun dengan baik dan bersih.</li><li><strong>Aman</strong> — dokumen pelanggan terjaga.</li><li><strong>Tepat</strong> — siap diserahkan sesuai waktu yang dijanjikan.</li></ul>\n<p>Checklist ini merupakan bagian dari sistem pengendalian mutu Lorongsatu21 dan menjadi salah satu alat untuk memastikan bahwa kualitas dibangun sebelum hasil diserahkan kepada pelanggan.</p>", "meta": {"Kode Dokumen": "L-401.01", "Lampiran dari": "SL21-401 Standar Layanan Fotokopi", "Versi": "1.0"}}], "SL21-404": [{"code": "L-404.01", "title": "CHECKLIST PEMERIKSAAN HASIL FOTO L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap hasil layanan foto telah memenuhi Standar L21 sebelum diserahkan kepada pelanggan.</p>\n<h3 class=\"sec-head\">A. PEMERIKSAAN PESANAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Jenis layanan sesuai pesanan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Ukuran foto sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Jumlah cetakan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Latar belakang sesuai permintaan (jika ada)</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. PEMERIKSAAN KUALITAS FOTO</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Foto tajam (tidak blur)</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Pencahayaan baik</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Warna sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Tidak ada noise berlebihan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>5</td><td>Komposisi sesuai kebutuhan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. PEMERIKSAAN HASIL CETAK</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Warna cetak baik</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Tidak ada noda tinta</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Tidak ada goresan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Tidak ada lipatan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>5</td><td>Potongan rapi</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">D. PEMERIKSAAN PENYERAHAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Jumlah sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Hasil disusun rapi</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>File pelanggan diamankan sesuai kebijakan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Siap diserahkan kepada pelanggan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<p><strong>Status Pemeriksaan</strong></p>\n<p class=\"checkbox-line\">☐ Lulus Pemeriksaan</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p>Nama Pemeriksa : ___________________</p>\n<p>Tanggal : ___________________</p>\n<p>Tanda Tangan : ___________________</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-404.01", "Lampiran dari": "SL21-404 Standar Layanan Foto", "Versi": "1.0"}}, {"code": "L-404.02", "title": "FORMULIR PENCATATAN LAYANAN FOTO", "html": "<h3 class=\"sec-head\">DATA PESANAN</h3>\n<p>Nomor Pesanan : _______________________</p>\n<p>Tanggal : _______________________</p>\n<p>Nama Pelanggan : _______________________</p>\n<p>Nomor WhatsApp : _______________________</p>\n<h3 class=\"sec-head\">JENIS LAYANAN</h3>\n<p class=\"checkbox-line\">☐ Foto Pas</p>\n<p class=\"checkbox-line\">☐ Cetak Foto</p>\n<p class=\"checkbox-line\">☐ Cetak Ulang</p>\n<p class=\"checkbox-line\">☐ Edit Sederhana</p>\n<p class=\"checkbox-line\">☐ Lainnya : ___________________</p>\n<h3 class=\"sec-head\">SPESIFIKASI</h3>\n<p>Ukuran : _______________________</p>\n<p>Jumlah : _______________________</p>\n<p>Jenis Kertas : _______________________</p>\n<p>Latar Belakang : _______________________</p>\n<p>Catatan Khusus :</p>\n<h3 class=\"sec-head\">DATA PRODUKSI</h3>\n<p>Operator : _______________________</p>\n<p>Waktu Mulai : _______________________</p>\n<p>Waktu Selesai : _______________________</p>\n<h3 class=\"sec-head\">HASIL</h3>\n<p class=\"checkbox-line\">☐ Selesai</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p>Catatan :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-404.02"}}, {"code": "L-404.03", "title": "PANDUAN PENANGANAN MASALAH UMUM LAYANAN FOTO", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Foto buram</td><td>Fokus tidak tepat</td><td>Ambil ulang foto atau gunakan file yang lebih baik</td></tr><tr><td>Warna tidak sesuai</td><td>Pengaturan printer atau monitor</td><td>Kalibrasi dan lakukan cetak uji</td></tr><tr><td>Hasil terlalu gelap</td><td>Pengaturan brightness</td><td>Sesuaikan pengaturan sebelum cetak</td></tr><tr><td>Hasil terlalu terang</td><td>Exposure berlebih</td><td>Sesuaikan pencahayaan atau file</td></tr><tr><td>Ada garis pada cetakan</td><td>Head printer kotor</td><td>Lakukan cleaning printer</td></tr><tr><td>Kertas macet</td><td>Jalur kertas bermasalah</td><td>Bersihkan jalur dan ulangi proses</td></tr><tr><td>Ukuran salah</td><td>Pengaturan cetak salah</td><td>Periksa kembali ukuran sebelum mencetak</td></tr><tr><td>File tidak dapat dibuka</td><td>File rusak atau format tidak didukung</td><td>Minta file baru atau konversi format</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">PRINSIP PENANGANAN</h3>\n<ul><li>Hentikan proses apabila ditemukan kesalahan.</li><li>Cari penyebab sebelum mengulang pekerjaan.</li><li>Jangan menyerahkan hasil yang belum memenuhi Standar L21.</li><li>Laporkan kepada Penanggung Jawab Cabang apabila masalah tidak dapat diselesaikan.</li></ul>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-404.03"}}, {"code": "L-404.04", "title": "STANDAR WAKTU LAYANAN FOTO", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Jenis Layanan</strong></th><th><strong>Target Waktu</strong>*</th></tr></thead><tbody><tr><td>Foto Pas</td><td>10–20 menit</td></tr><tr><td>Cetak Foto ≤ 10 lembar</td><td>10–15 menit</td></tr><tr><td>Cetak Foto 11–50 lembar</td><td>20–40 menit</td></tr><tr><td>Cetak Foto &gt; 50 lembar</td><td>Sesuai estimasi produksi</td></tr><tr><td>Cetak Ulang Foto</td><td>10–20 menit</td></tr><tr><td>Edit Sederhana + Cetak</td><td>20–45 menit</td></tr></tbody></table></div>\n<p>*Target waktu berlaku apabila mesin, bahan, dan file dalam kondisi normal.</p>\n<h3 class=\"sec-head\">KETENTUAN</h3>\n<ul><li>Apabila terjadi kendala teknis, pelanggan harus segera diberi informasi.</li><li>Pesanan prioritas mengikuti kebijakan operasional Lorongsatu21.</li><li>Estimasi waktu harus disampaikan sebelum pekerjaan dimulai.</li></ul>\n<h3 class=\"sec-head\">PRINSIP L21</h3>\n<p>Lebih baik memberikan estimasi yang realistis dan memenuhi janji, daripada memberikan estimasi yang terlalu singkat tetapi tidak dapat dipenuhi.</p>", "meta": {"Kode Dokumen": "L-404.04"}}], "SL21-406": [{"code": "L-406.01", "title": "CHECKLIST PEMERIKSAAN HASIL FINISHING L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan seluruh proses finishing telah memenuhi Standar L21 sebelum produk diserahkan ke Quality Control atau kepada pelanggan.</p>\n<h3 class=\"sec-head\">A. PEMERIKSAAN PESANAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Nomor pesanan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Jenis fini <p>Tanggal : _______________________</p>\n<p>Tanda Tangan : _______________________</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-406.01", "Lampiran dari": "SL21-406 Standar Layanan Finishing", "Versi": "1.0"}}, {"code": "L-406.02", "title": "FORMULIR PENCATATAN FINISHING", "html": "<h3 class=\"sec-head\">DATA PESANAN</h3>\n<p>Nomor Pesanan : _______________________</p>\n<p>Tanggal : _______________________</p>\n<p>Nama Pelanggan : _______________________</p>\n<h3 class=\"sec-head\">JENIS FINISHING</h3>\n<p class=\"checkbox-line\">☐ Laminasi</p>\n<p class=\"checkbox-line\">☐ Potong</p>\n<p class=\"checkbox-line\">☐ Lipat</p>\n<p class=\"checkbox-line\">☐ Jilid Spiral</p>\n<p class=\"checkbox-line\">☐ Jilid Lakban</p>\n<p class=\"checkbox-line\">☐ Hard Cover</p>\n<p class=\"checkbox-line\">☐ Mata Ayam</p>\n<p class=\"checkbox-line\">☐ Ring</p>\n<p class=\"checkbox-line\">☐ Pengepakan</p>\n<p class=\"checkbox-line\">☐ Lainnya : _______________________</p>\n<h3 class=\"sec-head\">SPESIFIKASI</h3>\n<p>Ukuran : _______________________</p>\n<p>Jumlah : _______________________</p>\n<p>Catatan Khusus :</p>\n<h3 class=\"sec-head\">DATA PRODUKSI</h3>\n<p>Operator : _______________________</p>\n<p>Waktu Mulai : _______________________</p>\n<p>Waktu Selesai : _______________________</p>\n<h3 class=\"sec-head\">HASIL</h3>\n<p class=\"checkbox-line\">☐ Selesai</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p>Catatan :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-406.02"}}, {"code": "L-406.03", "title": "PANDUAN PENANGANAN MASALAH UMUM FINISHING", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Laminasi bergelombang</td><td>Suhu atau tekanan tidak sesuai</td><td>Atur ulang mesin dan ulangi proses bila ></td><td></td></tr><tr><td>2</td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td></tr></tbody></table></div>\n<p>Kategori:</p>\n<ul><li>Minor</li><li>Mayor</li><li>Kritis</li></ul>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Lulus</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p class=\"checkbox-line\">☐ Produksi Ulang</p>\n<h3 class=\"sec-head\">TINDAKAN</h3>\n<p>Pemeriksa :</p>\n<p>Penanggung Jawab :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-407.02"}}, {"code": "L-407.03", "title": "PANDUAN PENANGANAN KETIDAKSESUAIAN", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Memberikan pedoman penanganan apabila ditemukan hasil pekerjaan yang belum memenuhi Standar L21.</p>\n<h3 class=\"sec-head\">KATEGORI TEMUAN</h3>\n<p><strong>Minor</strong></p>\n<p>Contoh:</p>\n<ul><li>sedikit kotor;</li><li>potongan kurang rapi;</li><li>posisi sedikit bergeser.</li></ul>\n<p>Tindakan:</p>\n<p>→ diperbaiki pada proses terkait.</p>\n<p><strong>Mayor</strong></p>\n<p>Contoh:</p>\n<ul><li>ukuran salah;</li><li>jumlah kurang;</li><li>finishing salah;</li><li>warna jauh berbeda dari kesepakatan.</li></ul>\n<p>Tindakan:</p>\n<p>→ dilakukan perbaikan atau produksi ulang sebagian.</p>\n<p><strong>Kritis</strong></p>\n<p>Contoh:</p>\n<ul><li>produk salah;</li><li>file salah;</li><li>nama pelanggan salah;</li><li>dokumen tertukar;</li><li>kerusakan berat.</li></ul>\n<p>Tindakan:</p>\n<p>→ produksi ulang.</p>\n<p>→ dilaporkan kepada Penanggung Jawab Cabang.</p>\n<h3 class=\"sec-head\">ALUR PENANGANAN</h3>\n<p>Temuan QC</p>\n<p>↓</p>\n<p>Identifikasi Penyebab</p>\n<p>↓</p>\n<p>Perbaikan</p>\n<p>↓</p>\n<p>QC Ulang</p>\n<p>↓</p>\n<p>Lulus</p>\n<p>↓</p>\n<p>Penyerahan</p>\n<h3 class=\"sec-head\">PRINSIP</h3>\n<p>Jangan pernah menyerahkan produk yang belum memenuhi Standar L21.</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-407.03"}}, {"code": "L-407.04", "title": "STANDAR WAKTU QUALITY CONTROL", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Jenis Layanan</strong></th><th><strong>Target QC</strong>*</th></tr></thead><tbody><tr><td>Fotokopi</td><td>2–5 menit</td></tr><tr><td>Print</td><td>2–5 menit</td></tr><tr><td>Foto</td><td>3–5 menit</td></tr><tr><td>Banner</td><td>5–10 menit</td></tr><tr><td>Brosur</td><td>5–10 menit</td></tr><tr><td>Undangan</td><td>10–20 menit</td></tr><tr><td>Kemasan</td><td>10–20 menit</td></tr><tr><td>Produk khusus</td><td>Sesuai kompleksitas</td></tr></tbody></table></div>\n<p>*Target waktu berlaku dalam kondisi normal.</p>\n<h3 class=\"sec-head\">KETENTUAN</h3>\n<ul><li>Pemeriksaan dilakukan sebelum produk diserahkan.</li><li>Produk yang memerlukan perbaikan harus diperiksa kembali.</li><li>Seluruh hasil QC dicatat dalam Pusat Data L21.</li></ul>\n<h3 class=\"sec-head\">PRINSIP L21</h3>\n<p>Quality Control bukan mencari kesalahan.</p>\n<p>Quality Control memastikan bahwa pelanggan menerima hasil terbaik yang sesuai dengan Standar L21.</p>", "meta": {"Kode Dokumen": "L-407.04"}}], "SL21-409": [{"code": "L-409.01", "title": "CHECKLIST PENYERAHAN DAN PENGIRIMAN PRODUK L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap produk telah siap diserahkan atau dikirim kepada pelanggan sesuai Standar L21.</p>\n<h3 class=\"sec-head\">A. PEMERIKSAAN PRODUK</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Produk telah lulus Quality Control</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Produk telah dikemas sesuai standar</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Jumlah produk sesuai pesanan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Kondisi produk baik dan bersih</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. PEMERIKSAAN DATA PESANAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Nomor pesanan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Nama pelanggan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Nomor WhatsApp/telepon sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Alamat tujuan benar (jika dikirim)</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. PEMERIKSAAN PENYERAHAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Metode penyerahan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Bukti penyerahan disiapkan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Penerima telah diverifikasi</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Produk siap diserahkan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Lulus</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p class=\"checkbox-line\">☐ Ditunda</p>\n<p>Catatan:</p>\n<p>Nama Petugas :</p>\n<p>Tanggal :</p>\n<p>Tanda Tangan :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-409.01", "Lampiran dari": "SL21-409 Standar Penyerahan dan Pengiriman Produk", "Versi": "1.0"}}, {"code": "L-409.02", "title": "FORMULIR PENYERAHAN DAN PENGIRIMAN PRODUK", "html": "<h3 class=\"sec-head\">DATA PESANAN</h3>\n<p>Nomor Pesanan :</p>\n<p>Tanggal :</p>\n<p>Nama Pelanggan :</p>\n<p>Nomor WhatsApp :</p>\n<h3 class=\"sec-head\">METODE PENYERAHAN</h3>\n<p class=\"checkbox-line\">☐ Diambil langsung</p>\n<p class=\"checkbox-line\">☐ Diantar Anggota Tim</p>\n<p class=\"checkbox-line\">☐ Kurir Lokal</p>\n<p class=\"checkbox-line\">☐ Ekspedisi</p>\n<p class=\"checkbox-line\">☐ File Digital</p>\n<p class=\"checkbox-line\">☐ Lainnya :</p>\n<h3 class=\"sec-head\">DATA PENGIRIMAN</h3>\n<p>Alamat :</p>\n<p>Nama Penerima :</p>\n<p>Nomor Kontak :</p>\n<h3 class=\"sec-head\">STATUS</h3>\n<p>Tanggal Penyerahan :</p>\n<p>Jam :</p>\n<p>Petugas :</p>\n<h3 class=\"sec-head\">BUKTI PENYERAHAN</h3>\n<p class=\"checkbox-line\">☐ Tanda tangan penerima</p>\n<p class=\"checkbox-line\">☐ Foto penyerahan</p>\n<p class=\"checkbox-line\">☐ Bukti resi</p>\n<p class=\"checkbox-line\">☐ Konfirmasi WhatsApp</p>\n<p class=\"checkbox-line\">☐ Bukti lainnya</p>\n<p>Catatan:</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-409.02"}}, {"code": "L-409.03", "title": "PANDUAN PENANGANAN MASALAH PENYERAHAN DAN PENGIRIMAN", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Alamat tidak ditemukan</td><td>Data alamat tidak lengkap</td><td>Hubungi pelanggan untuk konfirmasi alamat</td></tr><tr><td>Penerima tidak berada di lokasi</td><td>Jadwal berubah</td><td>Atur ulang waktu penyerahan</td></tr><tr><td>Nomor telepon tidak aktif</td><td>Data kontak tidak diperbarui</td><td>Gunakan kontak alternatif atau hubungi pemesan</td></tr><tr><td>Produk rusak saat pengiriman</td><td>Pengemasan kurang memadai atau benturan</td><td>Dokumentasikan kerusakan dan lakukan evaluasi serta tindak lanjut</td></tr><tr><td>Produk salah kirim</td><td>Kesalahan identifikasi pesanan</td><td>Tarik kembali produk dan kirim ke pelanggan yang benar</td></tr><tr><td>Pengiriman terlambat</td><td>Kendala operasional atau lalu lintas</td><td>Beri informasi kepada pelanggan dan perbarui estimasi waktu</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">PRINSIP PENANGANAN</h3>\n<ul><li>Utamakan komunikasi yang cepat dan jelas kepada pelanggan.</li><li>Dokumentasikan setiap kendala.</li><li>Cari solusi terbaik dengan tetap menjaga kepuasan pelanggan.</li><li>Jadikan setiap kejadian sebagai bahan evaluasi untuk mencegah pengulangan.</li></ul>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-409.03"}}, {"code": "L-409.04", "title": "STANDAR WAKTU PENYERAHAN DAN PENGIRIMAN", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Jenis Penyerahan/Pengiriman</strong></th><th><strong>Target Waktu</strong>*</th></tr></thead><tbody><tr><td>Pengambilan di toko</td><td>≤ 5 menit setelah pelanggan datang dan identitas diverifikasi</td></tr><tr><td>Pengantaran oleh Anggota Tim (wilayah layanan)</td><td>Sesuai jadwal yang disepakati dengan pelanggan</td></tr><tr><td>Kurir lokal</td><td>Mengikuti jadwal kurir lokal</td></tr><tr><td>Ekspedisi</td><td>Mengikuti estimasi resmi penyedia jasa ekspedisi</td></tr><tr><td>Pengiriman file digital</td><td>≤ 10 menit setelah pekerjaan dinyatakan selesai dan pembayaran (jika berlaku) telah dikonfirmasi</td></tr></tbody></table></div>\n<p>*Target waktu berlaku pada kondisi operasional normal.</p>\n<h3 class=\"sec-head\">KETENTUAN</h3>\n<ul><li>Pelanggan harus diberi informasi apabila terjadi perubahan jadwal.</li><li>Setiap penyerahan atau pengiriman wajib memiliki bukti yang dapat ditelusuri.</li><li>Status pesanan diubah menjadi <strong>&quot;Selesai&quot;</strong> setelah produk diterima pelanggan atau terdapat bukti pengiriman yang sah.</li></ul>\n<h3 class=\"sec-head\">PRINSIP L21</h3>\n<p>Pesanan dinyatakan selesai bukan ketika produk selesai dibuat, tetapi ketika produk telah diterima oleh pelanggan dalam kondisi baik, sesuai pesanan, dan terdokumentasi dengan benar.</p>", "meta": {"Kode Dokumen": "L-409.04"}}], "SL21-501": [{"code": "L-501.01", "title": "CHECKLIST PEMBELIAN L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap pembelian telah melalui proses verifikasi sesuai Standar L21 sebelum dilakukan pemesanan.</p>\n<h3 class=\"sec-head\">A. VERIFIKASI KEBUTUHAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Barang benar-benar dibutuhkan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Stok telah diperiksa</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Jumlah yang diminta sesuai kebutuhan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Spesifikasi barang sudah jelas</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. VERIFIKASI PEMASOK</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Pemasok telah dipilih</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Harga telah dibandingkan (jika memungkinkan)</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Waktu pengiriman sesuai kebutuhan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Pemasok memiliki reputasi baik</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. VERIFIKASI ADMINISTRASI</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Anggaran tersedia</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Persetujuan telah diperoleh</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Dokumen pembelian lengkap</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Pembelian siap diproses</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Disetujui</p>\n<p class=\"checkbox-line\">☐ Ditunda</p>\n<p class=\"checkbox-line\">☐ Ditolak</p>\n<p>Catatan:</p>\n<p>Nama Pemeriksa : _______________________</p>\n<p>Tanggal : _______________________</p>\n<p>Tanda Tangan : _______________________</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-501.01", "Lampiran dari": "SL21-501 Standar Pembelian", "Versi": "1.0"}}, {"code": "L-501.02", "title": "FORMULIR PERMINTAAN DAN PEMBELIAN BARANG", "html": "<h3 class=\"sec-head\">DATA PERMINTAAN</h3>\n<p>Nomor Permintaan :</p>\n<p>Tanggal :</p>\n<p>Unit Pemohon :</p>\n<p>Nama Pemohon :</p>\n<h3 class=\"sec-head\">DAFTAR BARANG</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Nama Barang</strong></th><th><strong>Spesifikasi</strong></th><th><strong>Jumlah</strong></th><th><strong>Satuan</strong></th><th><strong>Estimasi Harga</strong></th></tr></thead><tbody><tr><td>1</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>2</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">ALASAN KEBUTUHAN</h3>\n<h3 class=\"sec-head\">DATA PEMASOK</h3>\n<p>Nama Pemasok :</p>\n<p>Nomor Kontak :</p>\n<p>Estimasi Pengiriman :</p>\n<h3 class=\"sec-head\">PERSETUJUAN</h3>\n<p>Pemohon :</p>\n<p>Penanggung Jawab :</p>\n<p>Tanggal :</p>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Diproses</p>\n<p class=\"checkbox-line\">☐ Dipesan</p>\n<p class=\"checkbox-line\">☐ Diterima Sebagian</p>\n<p class=\"checkbox-line\">☐ Selesai</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-501.02"}}, {"code": "L-501.03", "title": "PANDUAN PENANGANAN MASALAH PEMBELIAN", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Barang tidak tersedia</td><td>Stok pemasok habis</td><td>Cari pemasok alternatif atau tunggu informasi ketersediaan</td></tr><tr><td>Harga naik</td><td>Perubahan harga pasar</td><td>Bandingkan penawaran dan sesuaikan dengan anggaran</td></tr><tr><td>Barang tidak sesuai spesifikasi</td><td>Kesalahan pemesanan atau pemasok</td><td>Tolak atau ajukan retur sesuai prosedur</td></tr><tr><td>Pengiriman terlambat</td><td>Kendala pemasok atau logistik</td><td>Hubungi pemasok dan perbarui estimasi kedatangan</td></tr><tr><td>Barang datang tidak lengkap</td><td>Kesalahan pengiriman</td><td>Catat kekurangan dan minta pengiriman susulan</td></tr><tr><td>Dokumen tidak lengkap</td><td>Kelalaian administrasi</td><td>Lengkapi dokumen sebelum proses pembayaran</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">PRINSIP PENANGANAN</h3>\n<ul><li>Verifikasi fakta sebelum mengambil keputusan.</li><li>Dokumentasikan setiap permasalahan.</li><li>Komunikasikan dengan pemasok secara profesional.</li><li>Gunakan temuan sebagai bahan evaluasi pemasok.</li></ul>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-501.03"}}, {"code": "L-501.04", "title": "STANDAR WAKTU PROSES PEMBELIAN", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Jenis Pembelian</strong></th><th><strong>Target Waktu</strong>*</th></tr></thead><tbody><tr><td>Barang operasional rutin</td><td>Maksimal 1 hari kerja sejak permintaan disetujui</td></tr><tr><td>Barang dagangan</td><td>1–3 hari kerja</td></tr><tr><td>Bahan baku produksi</td><td>1–3 hari kerja</td></tr><tr><td>Pembelian mendesak</td><td>Diproses pada hari yang sama sesuai kondisi</td></tr><tr><td>Mesin atau aset</td><td>Sesuai hasil evaluasi dan persetujuan manajemen</td></tr><tr><td>Pemasok baru</td><td>Setelah proses evaluasi dan persetujuan selesai</td></tr></tbody></table></div>\n<p>*Target waktu dapat berubah sesuai ketersediaan barang dan kebijakan pemasok.</p>\n<h3 class=\"sec-head\">KETENTUAN</h3>\n<ul><li>Pembelian dilakukan setelah memperoleh persetujuan sesuai kewenangan.</li><li>Untuk pembelian bernilai besar, disarankan melakukan perbandingan minimal dua atau tiga penawaran bila memungkinkan.</li><li>Pembelian darurat tetap harus didokumentasikan setelah kondisi terkendali.</li></ul>\n<h3 class=\"sec-head\">PRINSIP L21</h3>\n<p>Pembelian yang baik adalah pembelian yang <strong>tepat barangnya, tepat jumlahnya, tepat waktunya, tepat harganya, tepat pemasoknya, dan tepat pencatatannya</strong>.</p>", "meta": {"Kode Dokumen": "L-501.04"}}], "SL21-502": [{"code": "L-502.01", "title": "CHECKLIST PENERIMAAN BARANG L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap barang yang diterima telah diperiksa, sesuai pesanan, dan layak diterima sebelum masuk ke persediaan Lorongsatu21.</p>\n<h3 class=\"sec-head\">A. PEMERIKSAAN DOKUMEN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Purchase Order (PO) tersedia</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Surat Jalan tersedia</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Faktur/Nota tersedia</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Dokumen sesuai dengan barang yang diterima</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. PEMERIKSAAN BARANG</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Nama barang sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Kode barang sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Spesifikasi sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Jumlah sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>5</td><td>Satuan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>6</td><td>Kondisi barang baik</td><td>☐</td><td>☐</td><td></td></tr><tr><td>7</td><td>Kemasan tidak rusak</td><td>☐</td><td>☐</td><td></td></tr><tr><td>8</td><td>Masa kedaluwarsa masih memenuhi ketentuan (jika berlaku)</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. PEMERIKSAAN PENCATATAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Barang telah dicatat</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Label/Kode ditempel (jika diperlukan)</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Barang siap dipindahkan ke lokasi penyimpanan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Diterima</p>\n<p class=\"checkbox-line\">☐ Diterima Sebagian</p>\n<p class=\"checkbox-line\">☐ Ditolak</p>\n<p>Catatan:</p>\n<p>Nama Petugas : _______________________</p>\n<p>Tanggal : _______________________</p>\n<p>Tanda Tangan : _______________________</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-502.01", "Lampiran dari": "SL21-502 Standar Penerimaan Barang", "Versi": "1.0"}}, {"code": "L-502.02", "title": "FORMULIR PENERIMAAN BARANG", "html": "<h3 class=\"sec-head\">DATA PENERIMAAN</h3>\n<p>Nomor Penerimaan :</p>\n<p>Tanggal :</p>\n<p>Nomor Purchase Order :</p>\n<p>Nama Pemasok :</p>\n<p>Nomor Surat Jalan :</p>\n<h3 class=\"sec-head\">DAFTAR BARANG</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Nama Barang</strong></th><th><strong>Kode</strong></th><th><strong>Jumlah Dipesan</strong></th><th><strong>Jumlah Diterima</strong></th><th><strong>Selisih</strong></th><th><strong>Kondisi</strong></th></tr></thead><tbody><tr><td>1</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>2</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KETERANGAN</h3>\n<p class=\"checkbox-line\">☐ Diterima</p>\n<p class=\"checkbox-line\">☐ Diterima Sebagian</p>\n<p class=\"checkbox-line\">☐ Ditolak</p>\n<p>Alasan:</p>\n<p>Petugas Penerima :</p>\n<p>Pemasok :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-502.02"}}, {"code": "L-502.03", "title": "PANDUAN PENANGANAN KETIDAKSESUAIAN PENERIMAAN BARANG", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Barang kurang</td><td>Kesalahan pengiriman</td><td>Catat selisih dan minta pengiriman susulan</td></tr><tr><td>Barang lebih</td><td>Kesalahan pemasok</td><td>Konfirmasi kepada pemasok sebelum dicatat</td></tr><tr><td>Barang rusak</td><td>Kerusakan saat pengiriman</td><td>Dokumentasikan dengan foto, pisahkan barang, dan ajukan klaim atau retur</td></tr><tr><td>Barang tidak sesuai spesifikasi</td><td>Kesalahan pemesanan atau pemasok</td><td>Tolak atau koordinasikan penggantian</td></tr><tr><td>Barang tertukar</td><td>Kesalahan pengambilan di gudang pemasok</td><td>Pisahkan barang dan informasikan kepada pemasok</td></tr><tr><td>Dokumen tidak sesuai</td><td>Kesalahan administrasi</td><td>Tahan proses penerimaan sampai dokumen diperbaiki</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">PRINSIP PENANGANAN</h3>\n<ul><li>Jangan mencatat barang yang belum diverifikasi.</li><li>Pisahkan barang yang bermasalah dari barang yang diterima.</li><li>Dokumentasikan setiap ketidaksesuaian.</li><li>Laporkan kepada Penanggung Jawab Cabang untuk tindak lanjut.</li></ul>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-502.03"}}, {"code": "L-502.04", "title": "STANDAR WAKTU PENERIMAAN BARANG", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Jenis Barang</strong></th><th><strong>Target Waktu</strong>*</th></tr></thead><tbody><tr><td>Barang operasional rutin</td><td>≤ 30 menit</td></tr><tr><td>Barang dagangan</td><td>≤ 60 menit</td></tr><tr><td>Bahan baku produksi</td><td>≤ 60 menit</td></tr><tr><td>Barang dalam jumlah besar</td><td>Sesuai volume dan kompleksitas</td></tr><tr><td>Mesin atau aset</td><td>Sesuai prosedur pemeriksaan teknis</td></tr></tbody></table></div>\n<p>*Target waktu dihitung sejak barang diterima hingga selesai diperiksa dan dicatat.</p>\n<h3 class=\"sec-head\">KETENTUAN</h3>\n<ul><li>Barang tidak boleh langsung masuk ke area penyimpanan sebelum selesai diperiksa.</li><li>Ketidaksesuaian harus dicatat pada hari yang sama.</li><li>Barang yang memerlukan klaim atau retur diberi label <strong>&quot;Karantina&quot;</strong> dan dipisahkan dari stok yang dapat digunakan.</li></ul>\n<h3 class=\"sec-head\">PRINSIP L21</h3>\n<p>Setiap barang yang masuk harus melalui tiga langkah:</p>\n<p><strong>Periksa → Catat → Simpan</strong></p>\n<p>Tidak ada barang yang boleh digunakan atau dijual sebelum ketiga langkah tersebut selesai dilaksanakan.</p>", "meta": {"Kode Dokumen": "L-502.04"}}], "SL21-503": [{"code": "L-503.01", "title": "CHECKLIST PENYIMPANAN BARANG L21", "html": "<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Checklist ini digunakan untuk memastikan setiap barang telah disimpan sesuai lokasi, aman, rapi, dan mudah ditemukan.</p>\n<h3 class=\"sec-head\">A. PEMERIKSAAN BARANG</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Barang telah lolos proses penerimaan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Barang dalam kondisi baik</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Jumlah sesuai data penerimaan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Barang siap disimpan</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">B. PEMERIKSAAN LOKASI</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Lokasi penyimpanan sesuai</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Kode lokasi sudah benar</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Label lokasi terlihat jelas</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Rak dalam kondisi baik</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">C. PEMERIKSAAN PENYIMPANAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>No</strong></th><th><strong>Pemeriksaan</strong></th><th><strong>Ya</strong></th><th><strong>Tidak</strong></th><th><strong>Catatan</strong></th></tr></thead><tbody><tr><td>1</td><td>Barang disusun rapi</td><td>☐</td><td>☐</td><td></td></tr><tr><td>2</td><td>Barang mudah diambil</td><td>☐</td><td>☐</td><td></td></tr><tr><td>3</td><td>Barang mudah dihitung</td><td>☐</td><td>☐</td><td></td></tr><tr><td>4</td><td>Barang terlindung dari kerusakan</td><td>☐</td><td>☐</td><td></td></tr><tr><td>5</td><td>Data lokasi telah diperbarui</td><td>☐</td><td>☐</td><td></td></tr></tbody></table></div>\n<h3 class=\"sec-head\">STATUS</h3>\n<p class=\"checkbox-line\">☐ Selesai</p>\n<p class=\"checkbox-line\">☐ Perlu Perbaikan</p>\n<p>Catatan:</p>\n<p>Petugas :</p>\n<p>Tanggal :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-503.01", "Lampiran dari": "SL21-503 Standar Penyimpanan Barang", "Versi": "1.0"}}, {"code": "L-503.02", "title": "FORMULIR PENEMPATAN BARANG", "html": "<h3 class=\"sec-head\">DATA BARANG</h3>\n<p>Tanggal :</p>\n<p>Nomor Penerimaan :</p>\n<p>Kode Barang :</p>\n<p>Nama Barang :</p>\n<p>Kategori :</p>\n<h3 class=\"sec-head\">PENEMPATAN</h3>\n<p>Kode Lokasi :</p>\n<p>Nama Lokasi :</p>\n<p>Jumlah :</p>\n<p>Satuan :</p>\n<h3 class=\"sec-head\">KONDISI</h3>\n<p class=\"checkbox-line\">☐ Baik</p>\n<p class=\"checkbox-line\">☐ Perlu Perhatian</p>\n<p class=\"checkbox-line\">☐ Rusak</p>\n<p>Catatan:</p>\n<p>Petugas :</p>\n<p>Penanggung Jawab :</p>\n<p>==================================================================</p>", "meta": {"Kode Dokumen": "L-503.02"}}, {"code": "L-503.03", "title": "PANDUAN PENANGANAN MASALAH PENYIMPANAN BARANG", "html": "<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Permasalahan</strong></th><th><strong>Penyebab Kemungkinan</strong></th><th><strong>Tindakan</strong></th></tr></thead><tbody><tr><td>Barang salah lokasi</td><td>Kesalahan penempatan</td><td>Pindahkan ke lokasi yang benar dan perbarui data</td></tr><tr><td>Label barang hilang</td><td>Label rusak atau terlepas</td><td>Cetak dan pasang label baru</td></tr><tr><td>Barang sulit ditemukan</td><td>Data lokasi tidak diperbarui</td><td>Verifikasi lokasi dan lakukan pembaruan</td></tr><tr><td>Rak penuh</td><td>Kapasitas penyimpanan tidak mencukupi</td><td>Atur ulang tata letak atau gunakan lokasi alternatif</td></tr><tr><td>Barang rusak saat disimpan</td><td>Cara penyimpanan tidak sesuai</td><td>Pisahkan barang rusak dan evaluasi metode penyimpanan</td></tr><tr><td>Area penyimpanan kotor</td><td>Jadwal kebersihan tidak dijalankan</td><td>Bersihkan area dan lakukan pemeriksaan rutin</  Pelanggan</td></tr><tr><td>SL21-302</td><td>Standar Penanganan Keluhan</td></tr><tr><td>SL21-303</td><td>Standar Melayani Pelanggan</td></tr><tr><td>SL21-304</td><td>Standar Komunikasi WhatsApp</td></tr><tr><td>SL21-305</td><td>Standar Layanan Google Business Profile</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK D</h3>\n<h3 class=\"sec-head\">OPERASIONAL</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Standar</strong></th></tr></thead><tbody><tr><td>SL21-401</td><td>Standar Fotokopi</td></tr><tr><td>SL21-402</td><td>Standar Print</td></tr><tr><td>SL21-403</td><td>Standar Percetakan</td></tr><tr><td>SL21-404</td><td>Standar Foto</td></tr><tr><td>SL21-405</td><td>Standar Desain</td></tr><tr><td>SL21-406</td><td>Standar Finishing</td></tr><tr><td>SL21-407</td><td>Standar Quality Control</td></tr><tr><td>SL21-408</td><td>Standar Pengemasan</td></tr><tr><td>SL21-409</td><td>Standar Pengiriman</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK E</h3>\n<h3 class=\"sec-head\">MANAJEMEN PENGADAAN DAN PERSEDIAAN.</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>SL21-501</th><th>Standar Pembelian</th></tr></thead><tbody><tr><td>SL21-502</td><td>Standar Penerimaan Barang</td></tr><tr><td>SL21-503</td><td>Standar Penyimpanan Barang</td></tr><tr><td>SL21-504</td><td>Standar Persediaan (Inventory)</td></tr><tr><td>SL21-505</td><td>Standar Stock Opname</td></tr><tr><td>SL21-506</td><td>Standar Pengeluaran Barang</td></tr><tr><td>SL21-507</td><td>Standar Retur Barang</td></tr><tr><td>SL21-508</td><td>Standar Pengelolaan Aset</td></tr><tr><td>SL21-509</td><td>Standar Pemeliharaan Peralatan</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK F</h3>\n<h3 class=\"sec-head\">KEUANGAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Standar</strong></th></tr></thead><tbody><tr><td>SL21-601</td><td>Standar Manajemen Kas</td></tr><tr><td>SL21-602</td><td>Standar Manajemen Rekening Bank</td></tr><tr><td>SL21-603</td><td>Standar Manajemen Piutang</td></tr><tr><td>SL21-604</td><td>Standar Laporan Keuangan</td></tr><tr><td>SL21-605</td><td>Standar Manajemen Anggaran</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK G</h3>\n<h3 class=\"sec-head\">PEMASARAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Standar</strong></th></tr></thead><tbody><tr><td>SL21-701</td><td>Standar Branding</td></tr><tr><td>SL21-702</td><td>Standar Konten Media Sosial</td></tr><tr><td>SL21-703</td><td>Standar Promosi</td></tr><tr><td>SL21-704</td><td>Standar Hubungan Pelanggan</td></tr><tr><td>SL21-705</td><td>Standar Kemitraan</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK H</h3>\n<p><strong>PENGETAHUAN <strong>**&amp;</strong>** TEKNOLOGI</strong></p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Standar</strong></th></tr></thead><tbody><tr><td>SL21-801</td><td>Standar Perpustakaan L21</td></tr><tr><td>SL21-802</td><td>Standar Pusat Pengetahuan L21</td></tr><tr><td>SL21-803</td><td>Standar Pusat Data L21</td></tr><tr><td>SL21-804</td><td>Standar AI L21</td></tr><tr><td>SL21-805</td><td>Standar Keamanan Data</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">KELOMPOK I</h3>\n<h3 class=\"sec-head\">PENGEMBANGAN PERUSAHAAN</h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th><strong>Kode</strong></th><th><strong>Nama Standar</strong></th></tr></thead><tbody><tr><td>SL21-901</td><td>Standar Pembukaan Cabang</td></tr><tr><td>SL21-902</td><td>Standar Audit Internal</td></tr><tr><td>SL21-903</td><td>Standar Continuous Improvement</td></tr><tr><td>SL21-904</td><td>Standar Manajemen Risiko</td></tr><tr><td>SL21-905</td><td>Standar Evaluasi Tahunan</td></tr></tbody></table></div>\n<h3 class=\"sec-head\">HIERARKI DOKUMEN</h3>\n<p>Seluruh dokumen Lorongsatu21 mengikuti urutan berikut:</p>\n<ul><li>Piagam Lorongsatu21</li><li>Anggaran Dasar Lorongsatu21</li><li>Kebijakan Perusahaan</li><li>Standar L21</li><li>SOP</li><li>Instruksi Kerja</li><li>Formulir</li><li>Daftar Periksa</li><li>Pusat Pengetahuan L21</li></ul>\n<p>Dokumen pada tingkat yang lebih rendah tidak boleh bertentangan dengan dokumen pada tingkat yang lebih tinggi.</p>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Standar L21 merupakan acuan utama dalam menjalankan, mengembangkan, mengevaluasi, dan menyempurnakan seluruh aktivitas Lorongsatu21.</p>\n<p>Setiap perubahan Standar L21 harus membuat perusahaan menjadi lebih sederhana, lebih mudah diajarkan, lebih mudah diukur, lebih mudah dikembangkan, dan lebih bermanfaat bagi pelanggan, Anggota Tim, mitra, masyarakat, serta perusahaan.</p>", "order": 7, "no_formal_header": false}]}, {"code": "SL21-001 (Master Standar)", "label": "SL21-001 — Master Standar Lorongsatu21", "versions": [{"title": "MASTER STANDAR LORONGSATU21", "meta": {"Kode Dokumen": "SL21-001", "Nama Dokumen": "Master Standar Lorongsatu21", "Status": "Dokumen Induk Standar"}, "html": "<div class=\"chapter-label\">BAB 1</div>\n<h3 class=\"sec-head\">TUJUAN</h3>\n<p>Master Standar Lorongsatu21 merupakan acuan utama dalam penyusunan seluruh Standar L21.</p>\n<p>Dokumen ini memastikan seluruh standar memiliki struktur, bahasa, format, dan kualitas yang konsisten.</p>\n<div class=\"chapter-label\">BAB 2</div>\n<h3 class=\"sec-head\">FILOSOFI</h3>\n<p>Standar dibuat bukan untuk menambah aturan.</p>\n<p>Standar dibuat untuk:</p>\n<ul><li>mempermudah pekerjaan;</li><li>menjaga kualitas;</li><li>mengurangi kesalahan;</li><li>mempercepat pembelajaran;</li><li>memudahkan pengembangan perusahaan.</li></ul>\n<div class=\"chapter-label\">BAB 3</div>\n<h3 class=\"sec-head\">HIERARKI DOKUMEN</h3>\n<p>L21OS memiliki struktur dokumen sebagai berikut:</p>\n<ul><li>Piagam Lorongsatu21</li><li>Anggaran Dasar</li><li>Kebijakan Perusahaan</li><li>Master Standar</li><li>Standar L21</li><li>Alur Kerja</li><li>SOP</li><li>Instruksi Kerja</li><li>Checklist</li><li>Formulir</li><li>Pusat Pengetahuan</li><li>Pusat Data</li></ul>\n<div class=\"chapter-label\">BAB 4</div>\n<h3 class=\"sec-head\">STRUKTUR STANDAR</h3>\n<p>Setiap Standar L21 wajib memiliki bagian berikut:</p>\n<ul><li>Tujuan</li><li>Ruang Lingkup</li><li>Definisi</li><li>Prinsip</li><li>Standar</li><li>Alur Kerja</li><li>Tanggung Jawab</li><li>Indikator</li><li>Dokumen Terkait</li><li>Data yang Dicatat</li><li>Audit</li><li>Perbaikan Berkelanjutan</li></ul>\n<div class=\"chapter-label\">BAB 5</div>\n<h3 class=\"sec-head\">STRUKTUR SOP</h3>\n<p>Setiap SOP wajib memiliki:</p>\n<ul><li>Tujuan</li><li>Persiapan</li><li>Langkah Kerja</li><li>Standar Kualitas</li><li>Keselamatan Kerja</li><li>Hal yang Harus Dihindari</li><li>Output</li><li>Dokumentasi</li></ul>\n<div class=\"chapter-label\">BAB 6</div>\n<h3 class=\"sec-head\">STRUKTUR INSTRUKSI KERJA</h3>\n<p>Digunakan apabila pekerjaan berkaitan dengan alat atau mesin tertentu.</p>\n<p>Contoh:</p>\n<ul><li>Mesin Fotokopi Canon</li><li>Printer Epson</li><li>Mesin Laminasi</li><li>Mesin Potong</li><li>Kamera</li><li>Komputer</li></ul>\n<p>Instruksi Kerja dapat berubah tanpa mengubah Standar maupun SOP.</p>\n<div class=\"chapter-label\">BAB 7</div>\n<h3 class=\"sec-head\">STRUKTUR CHECKLIST</h3>\n<p>Checklist digunakan untuk memastikan seluruh tahapan telah dilaksanakan.</p>\n<p>Checklist tidak digunakan sebagai SOP.</p>\n<p>Checklist hanya sebagai alat verifikasi.</p>\n<div class=\"chapter-label\">BAB 8</div>\n<h3 class=\"sec-head\">STRUKTUR FORMULIR</h3>\n<p>Formulir digunakan untuk mencatat data.</p>\n<p>Prinsip formulir:</p>\n<ul><li>sederhana;</li><li>mudah diisi;</li><li>mudah dibaca;</li><li>mudah direkap.</li></ul>\n<div class=\"chapter-label\">BAB 9</div>\n<h3 class=\"sec-head\">PUSAT PENGETAHUAN</h3>\n<p>Setiap Standar memiliki:</p>\n<ul><li>SOP</li><li>Video</li><li>Modul</li><li>FAQ</li><li>Studi Kasus</li><li>AI Prompt</li><li>Riwayat Revisi</li></ul>\n<p>Seluruhnya disimpan dalam Pusat Pengetahuan L21.</p>\n<div class=\"chapter-label\">BAB 10</div>\n<h3 class=\"sec-head\">PUSAT DATA</h3>\n<p>Data yang dikumpulkan harus mendukung:</p>\n<ul><li>pengambilan keputusan;</li><li>evaluasi;</li><li>audit;</li><li>pengembangan.</li></ul>\n<p>Data yang tidak digunakan untuk pengambilan keputusan sebaiknya tidak dikumpulkan.</p>\n<div class=\"chapter-label\">BAB 11</div>\n<h3 class=\"sec-head\">PRINSIP PENULISAN</h3>\n<p>Semua dokumen harus:</p>\n<ul><li>sederhana;</li><li>jelas;</li><li>singkat;</li><li>konsisten;</li><li>mudah dipahami;</li><li>mudah diajarkan.</li></ul>\n<div class=\"chapter-label\">BAB 12</div>\n<div class=\"gold-box\"><div class=\"gold-title\">GOLDEN RULE</div>\n<p>Setiap Standar L21 wajib menjawab empat pertanyaan:</p>\n<p>Apa yang harus dicapai?</p>\n<p>Bagaimana alurnya?</p>\n<p>Bagaimana memastikan kualitasnya?</p>\n<p>Bagaimana mengukurnya?</p>\n<p>Apabila empat pertanyaan tersebut belum terjawab, maka Standar belum dianggap lengkap.</p></div>\n<h3 class=\"sec-head\">PENUTUP</h3>\n<p>Master Standar Lorongsatu21 menjadi acuan seluruh penyusunan dokumen operasional perusahaan.</p>\n<p>Seluruh Standar L21 wajib mengikuti struktur dan prinsip yang ditetapkan dalam dokumen ini.</p>", "order": 10, "no_formal_header": false}]}], "orphans": [{"code": "SL21-302 (draft lama)", "title": "ALUR PELAYANAN DAN PROSES KERJA", "note": "Sempat memakai kode SL21-302, tapi topiknya berbeda dari standar resmi SL21-302 (Penanganan Keluhan). Isi utamanya — Siklus Pelayanan L21 tujuh langkah — sudah terserap ke dalam SL21-301 (versi Final) yang kini dipakai. Dokumen ini diarsipkan sebagai referensi, bukan standar aktif.", "versions": [{"title": "ALUR PELAYANAN DAN PROSES KERJA", "meta": {"Kode Dokumen": "SL21-302", "Versi": "1.0"}, "html": "<h3 class=\"sec-head\">1. TUJUAN</h3>\n<p>Menetapkan alur kerja standar yang digunakan pada seluruh layanan Lorongsatu21 agar proses pelayanan menjadi konsisten, efisien, mudah dipelajari, dan mudah diaudit.</p>\n<p>Standar ini berlaku untuk seluruh layanan seperti:</p>\n<ul><li>Fotokopi</li><li>Print</li><li>Percetakan</li><li>Foto</li><li>Desain</li><li>Undangan</li><li>Laminasi</li><li>Jilid</li><li>Stempel</li><li>Produk dan layanan lain yang dikembangkan di kemudian hari.</li></ul>\n<h3 class=\"sec-head\">2. PRINSIP</h3>\n<p>Setiap pekerjaan harus mengikuti alur yang sama sehingga pelanggan memperoleh pengalaman pelayanan yang konsisten.</p>\n<h3 class=\"sec-head\">3. SIKLUS PELAYANAN L21</h3>\n<h3 class=\"sec-head\">LANGKAH 1</h3>\n<p><strong>Sambut</strong></p>\n<p>Tujuan:</p>\n<p>Membuat pelanggan merasa diterima.</p>\n<p>Standar:</p>\n<ul><li>Menyapa dengan sopan.</li><li>Memberikan perhatian.</li><li>Menghentikan aktivitas lain bila memungkinkan.</li></ul>\n<h3 class=\"sec-head\">LANGKAH 2</h3>\n<p><strong>Pahami</strong></p>\n<p>Tujuan:</p>\n<p>Memastikan kebutuhan pelanggan dipahami dengan benar.</p>\n<p>Standar:</p>\n<ul><li>Mendengarkan.</li><li>Bertanya bila kurang jelas.</li><li>Mengonfirmasi pesanan.</li></ul>\n<h3 class=\"sec-head\">LANGKAH 3</h3>\n<p><strong>Sarankan</strong></p>\n<p>Tujuan:</p>\n<p>Memberikan solusi terbaik.</p>\n<p>Contoh:</p>\n<ul><li>jenis kertas;</li><li>ukuran;</li><li>laminasi;</li><li>finishing;</li><li>desain;</li><li>alternatif biaya.</li></ul>\n<h3 class=\"sec-head\">LANGKAH 4</h3>\n<p><strong>Kerjakan</strong></p>\n<p>Tujuan:</p>\n<p>Mengerjakan pesanan sesuai Standar L21 dan SOP teknis masing-masing layanan.</p>\n<h3 class=\"sec-head\">LANGKAH 5</h3>\n<p><strong>Periksa</strong></p>\n<p>Tujuan:</p>\n<p>Memastikan hasil sesuai pesanan.</p>\n<p>Pemeriksaan meliputi:</p>\n<ul><li>jumlah;</li><li>ukuran;</li><li>warna;</li><li>posisi;</li><li>kualitas;</li><li>finishing.</li></ul>\n<h3 class=\"sec-head\">LANGKAH 6</h3>\n<p><strong>Serahkan</strong></p>\n<p>Tujuan:</p>\n<p>Menyerahkan hasil dengan sopan dan profesional.</p>\n<p>Standar:</p>\n<ul><li>Menjelaskan hasil bila diperlukan.</li><li>Menyebutkan biaya.</li><li>Memastikan pelanggan menerima pesanan yang benar.</li></ul>\n<h3 class=\"sec-head\">LANGKAH 7</h3>\n<p><strong>Tindak Lanjut</strong></p>\n<p>Tujuan:</p>\n<p>Menjaga hubungan dengan pelanggan.</p>\n<p>Contoh:</p>\n<ul><li>menangani komplain;</li><li>menerima revisi sesuai ketentuan;</li><li>mencatat saran pelanggan;</li><li>mengucapkan terima kasih.</li></ul>\n<h3 class=\"sec-head\">4. TANGGUNG JAWAB</h3>\n<p><strong>Anggota Tim</strong></p>\n<p>Melaksanakan seluruh tahapan sesuai standar.</p>\n<p><strong>Penanggung Jawab Cabang</strong></p>\n<p>Mengawasi penerapan standar, membimbing Anggota Tim, dan menyelesaikan kendala yang memerlukan keputusan.</p>\n<h3 class=\"sec-head\">5. DOKUMEN TERKAIT</h3>\n<ul><li>SOP Fotokopi</li><li>SOP Print</li><li>SOP Desain</li><li>SOP Foto</li><li>SOP Percetakan</li><li>SOP Finishing</li></ul>\n<h3 class=\"sec-head\">6. PUSAT DATA L21</h3>\n<p>Data yang dicatat:</p>\n<ul><li>jenis layanan;</li><li>waktu mulai;</li><li>waktu selesai;</li><li>nama Anggota Tim;</li><li>status pekerjaan;</li><li>revisi (jika ada);</li><li>keluhan pelanggan.</li></ul>\n<h3 class=\"sec-head\">7. AUDIT</h3>\n<p>Audit dilakukan dengan memastikan:</p>\n<ul><li>seluruh tahapan dijalankan;</li><li>pesanan sesuai;</li><li>revisi dicatat;</li><li>pelanggan menerima pelayanan sesuai Standar L21.</li></ul>\n<h3 class=\"sec-head\">8. PERBAIKAN BERKELANJUTAN</h3>\n<p>Setiap masalah yang berulang menjadi bahan evaluasi untuk memperbaiki SOP teknis maupun Standar L21.</p>\n<h3 class=\"sec-head\">MOTTO</h3>\n<p><strong>Setiap Pesanan Dikerjakan dengan Standar. Setiap Pelanggan Dilayani dengan Karakter.</strong></p>", "order": 9, "no_formal_header": false}], "status": "retired"}, {"code": "SL21-301 (draf lama)", "title": "PELAYANAN PELANGGAN", "note": "Sempat memakai kode SL21-301 sebagai draf awal (v1.0), sebelum digantikan versi Final yang lebih lengkap (Siklus Pelayanan L21 tujuh langkah, standar penampilan, penanganan keluhan yang lebih rinci). Diarsipkan sebagai referensi, bukan <script>
const DATA = window.L21OS_DATA;
const $sidebar = document.getElementById('sidebar');
const $nav = document.getElementById('nav');
const $content = document.getElementById('content');
const $search = document.getElementById('search');
const $searchTop = document.getElementById('search-top');

let currentVersionIndex = 0;

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusDot(status){
  if(status==='ok') return '<span class="dot ok"></span>';
  if(status==='missing') return '<span class="dot missing"></span>';
  if(status==='duplicate') return '<span class="dot duplicate"></span>';
  if(status==='retired') return '<span class="dot retired"></span>';
  return '';
}

/* ---------------- Build flat index for search + lookup ---------------- */
const registry = {}; // id -> {type, ...}
function reg(id, obj){ registry[id] = obj; return id; }

DATA.foundational.forEach(f=>{
  reg('fnd:'+f.code, {type:'foundational', data:f});
});
DATA.meta.forEach(m=>{
  reg('meta:'+m.code, {type:'meta', data:m});
});
DATA.kelompok.forEach(g=>{
  reg('grp:'+g.key, {type:'kelompok-group', data:g});
  g.items.forEach(it=>{
    reg('kel:'+it.code, {type:'kelompok-item', data:it, group:g});
  });
});
DATA.orphans.forEach(o=>{
  reg('orp:'+o.code, {type:'orphan', data:o});
});
Object.keys(DATA.formulir).forEach(parent=>{
  DATA.formulir[parent].forEach(fm=>{
    reg('form:'+fm.code, {type:'formulir', data:fm, parent:parent});
  });
});

/* ---------------- Sidebar render ---------------- */
function navItemHtml(id, code, label, status){
  return `<div class="nav-item" data-id="${id}">
    ${status?statusDot(status):''}
    <span class="code">${esc(code)}</span>
    <span class="lbl">${esc(label)}</span>
  </div>`;
}

function buildSidebar(){
  let html = '';

  html += `<div class="nav-section" data-sec="fondasi">
    <div class="nav-section-head"><span>Fondasi &amp; Tata Kelola</span><span class="chev">▾</span></div>
    <div class="nav-list">`;
  DATA.foundational.forEach(f=>{
    const v = f.versions[0];
    html += navItemHtml('fnd:'+f.code, f.code, v? v.title.split(' — ')[0] : f.code, null);
  });
  DATA.meta.forEach(m=>{
    html += navItemHtml('meta:'+m.code, m.code.split(' ')[0], m.label.replace(/^SL21-\d+\s*—\s*/,''), null);
  });
  html += `</div></div>`;

  const kkNames = {};
  DATA.kelompok.forEach(g=>{
    html += `<div class="nav-section" data-sec="${g.key}">
      <div class="nav-section-head"><span>Kelompok ${g.key} — ${esc(g.name)}</span><span class="chev">▾</span></div>
      <div class="nav-list">`;
    g.items.forEach(it=>{
      const id = 'kel:'+it.code;
      html += navItemHtml(id, it.code, it.official_title, it.status);
      const forms = DATA.formulir[it.code];
      if(forms && forms.length){
        html += `<div class="nav-sub">`;
        forms.forEach(fm=>{
          html += navItemHtml('form:'+fm.code, fm.code, fm.title.replace(/^Lampiran [A-Z0-9-]+\s*—\s*/,''), null);
        });
        html += `</div>`;
      }
    });
    html += `</div></div>`;
  });

  if(DATA.orphans.length){
    html += `<div class="nav-section" data-sec="orphans">
      <div class="nav-section-head"><span>Dokumen di Luar Daftar Resmi</span><span class="chev">▾</span></div>
      <div class="nav-list">`;
    DATA.orphans.forEach(o=>{
      html += navItemHtml('orp:'+o.code, o.code, o.title, o.status || 'duplicate');
    });
    html += `</div></div>`;
  }

  $nav.innerHTML = html;

  $nav.querySelectorAll('.nav-section-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      h.parentElement.classList.toggle('collapsed');
    });
  });
  $nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      navigateTo(el.dataset.id);
      closeSidebarMobile();
    });
  });
}

function setActiveNav(id){
  $nav.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===id);
  });
  document.querySelectorAll('.toptab').forEach(el=>{
    el.classList.toggle('active', el.dataset.gotoPage===id);
  });
}

function renderCover(){
  const s = DATA.stats;
  let html = `<div class="app-cover">
    <div class="bc-frame">
      <div class="bc-emblem">L21<span class="bc-os">OS</span></div>
      <div class="bc-rule"></div>
      <div class="bc-kicker">Lorongsatu21 Operating System</div>
      <div class="bc-title">Referensi &amp; Arsip<br>Standar L21</div>
      <div class="bc-motto">BERKARAKTER · BELAJAR · BERTUMBUH · BERMANFAAT</div>
      <div class="bc-rule small"></div>
      <div class="bc-meta">${s.ok} dari ${s.total_official} Standar L21 Resmi</div>
      <button class="cover-cta" id="cover-cta-btn" type="button">Lihat Daftar Isi <span class="arrow">→</span></button>
    </div>
  </div>`;
  $content.innerHTML = html;
  const btn = document.getElementById('cover-cta-btn');
  if(btn) btn.addEventListener('click', ()=> navigateTo('home'));
}

/* ---------------- Renderers ---------------- */
function renderVersionTabs(versions, onSwitch){
  if(versions.length<2) return '';
  let html = '<div class="version-tabs">';
  versions.forEach((v,i)=>{
    const ver = (v.meta && v.meta['Versi']) ? v.meta['Versi'] : ('Versi '+(i+1));
    html += `<div class="version-tab ${i===0?'active':''}" data-idx="${i}">${esc(v.title)} · ${esc(ver)}</div>`;
  });
  html += '</div>';
  return html;
}

function renderDocBody(v){
  let metaRow = '';
  if(v.meta){
    Object.keys(v.meta).forEach(k=>{
      if(k==='Kode Dokumen') return;
      metaRow += `<span class="pill">${esc(k)}: ${esc(v.meta[k])}</span>`;
    });
  }
  return `<div class="doc-meta-row">${metaRow}</div><div class="doc-body">${v.html}</div>`;
}

function printBtnHtml(){
  return `<button class="print-btn" data-print="1" type="button"><span class="ic">🖨</span> Cetak / Simpan PDF</button>`;
}

function renderFoundational(f){
  const v = f.versions[0];
  if(!v){ $content.innerHTML = renderMissingState(f.code, f.code, ''); return; }
  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / Fondasi &amp; Tata Kelola</div>`;
  html += `<div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(f.code)}</div>
    <h1 class="doc-title">${esc(v.title)}</h1></div>${printBtnHtml()}</div>`;
  html += renderDocBody(v);
  $content.innerHTML = html;
}

function renderMeta(m){
  const v = m.versions[0];
  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / Fondasi &amp; Tata Kelola</div>`;
  html += `<div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(v.meta['Kode Dokumen']||m.code)}</div>
    <h1 class="doc-title">${esc(v.title)}</h1></div>${printBtnHtml()}</div>`;
  html += renderDocBody(v);
  $content.innerHTML = html;
}

function renderMissingState(code, title, crumbExtra){
  return `<div class="crumb"><a href="#" data-home="1">L21OS</a>${crumbExtra? ' / '+crumbExtra : ''}</div>
  <div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(code)}</div>
  <h1 class="doc-title">${esc(title)}</h1></div></div>
  <div class="doc-meta-row"><span class="pill status-missing">Belum Tersedia</span></div>
  <div class="missing-state">
    <h4>Standar ini belum ditulis</h4>
    <p>${esc(code)} — <strong>${esc(title)}</strong> terdaftar di Daftar Standar Resmi (SL21-000) sebagai standar resmi Lorongsatu21, tapi isinya belum ada di L21OS.</p>
  </div>`;
}

function statusPillSmall(status){
  if(status==='ok') return '<span class="pill status-ok" style="font-size:10.5px;padding:1px 8px;">Tersedia</span>';
  if(status==='missing') return '<span class="pill status-missing" style="font-size:10.5px;padding:1px 8px;">Belum Ada</span>';
  if(status==='duplicate') return '<span class="pill status-duplicate" style="font-size:10.5px;padding:1px 8px;">Duplikat</span>';
  return '';
}

function renderKelompokLanding(g){
  const ok = g.items.filter(i=>i.status==='ok').length;
  const missing = g.items.filter(i=>i.status==='missing').length;
  const dup = g.items.filter(i=>i.status==='duplicate').length;

  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / Kelompok ${g.key}</div>`;
  html += `<div class="hero" style="margin-bottom:6px;">
    <div class="eyebrow">Kelompok ${g.key}</div>
    <h1 style="font-size:30px;">${esc(g.name)}</h1>
    <p class="lede" style="margin-bottom:10px;">${g.items.length} Standar L21 terdaftar pada kelompok ini — ${ok} tersedia${missing?`, ${missing} belum ditulis`:''}${dup?`, ${dup} duplikat`:''}.</p>
  </div>`;

  html += `<div class="std-list">`;
  g.items.forEach(it=>{
    html += `<div class="std-row" data-nav-code="${esc(it.code)}">
      ${statusDot(it.status)}
      <span class="code">${esc(it.code)}</span>
      <span class="ttl">${esc(it.official_title)}</span>
      ${statusPillSmall(it.status)}
    </div>`;
  });
  html += `</div>`;

  $content.innerHTML = html;
  $content.querySelectorAll('.std-row').forEach(r=>{
    r.addEventListener('click', ()=> navigateTo('kel:'+r.dataset.navCode));
  });
}

const kelompokFlatList = [];
DATA.kelompok.forEach(g=>{
  g.items.forEach(it=>{ kelompokFlatList.push({code: it.code, official_title: it.official_title, group: g}); });
});

function renderKelompokItem(it, group){
  if(it.status==='missing'){
    $content.innerHTML = renderMissingState(it.code, it.official_title, `Kelompok ${group.key} — ${esc(group.name)}`);
    return;
  }
  const versions = it.versions;
  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / <a href="#" data-nav="grp:${group.key}">Kelompok ${group.key} — ${esc(group.name)}</a></div>`;
  html += `<div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(it.code)}</div>
    <h1 class="doc-title" id="doc-title-h">${esc(versions[0].title)}</h1></div>${printBtnHtml()}</div>`;

  let statusPill = '';
  if(it.status==='duplicate') statusPill = '<span class="pill status-duplicate">Kode Duplikat — 2 versi ditemukan</span>';
  if(it.status==='ok') statusPill = '<span class="pill status-ok">Tersedia</span>';
  html += `<div class="doc-meta-row">${statusPill}</div>`;

  if(it.note){
    const noteClass = it.status==='duplicate' ? 'dupe' : 'info';
    html += `<div class="note-box ${noteClass}">${esc(it.note)}</div>`;
  }

  const relatedForms = DATA.formulir[it.code];
  if(relatedForms && relatedForms.length){
    html += `<div class="form-links"><span class="fl-label">${relatedForms.length>1?'Formulir terkait':'Formulir terkait'}:</span>`;
    relatedForms.forEach(fm=>{
      html += `<button class="form-link-btn" data-nav-id="form:${esc(fm.code)}" type="button">📋 Lihat Form — ${esc(fm.title.replace(/^FORMULIR\s+/i,'').replace(/^KARTU\s+/i,'').replace(/^CHECKLIST\s+/i,''))}</button>`;
    });
    html += `</div>`;
  }

  html += renderVersionTabs(versions);
  html += `<div id="version-body">${renderDocBody(versions[0])}</div>`;

  const idx = kelompokFlatList.findIndex(x=>x.code===it.code);
  const nextEntry = (idx>=0 && idx<kelompokFlatList.length-1) ? kelompokFlatList[idx+1] : null;
  html += `<div class="doc-nav">
    <button class="docnav-btn back" data-nav-grp="${group.key}"><span class="arrow">←</span> Kembali ke Kelompok ${group.key}</button>
    ${nextEntry ? `<button class="docnav-btn next" data-nav-kel="${esc(nextEntry.code)}">${esc(nextEntry.code)} — ${esc(nextEntry.official_title)} <span class="arrow">→</span></button>` : ''}
  </div>`;

  $content.innerHTML = html;

  $content.querySelectorAll('.version-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      $content.querySelectorAll('.version-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const idx = parseInt(tab.dataset.idx,10);
      document.getElementById('version-body').innerHTML = renderDocBody(versions[idx]);
      document.getElementById('doc-title-h').textContent = versions[idx].title;
    });
  });
  $content.querySelectorAll('[data-nav-grp]').forEach(b=>{
    b.addEventListener('click', ()=> navigateTo('grp:'+b.dataset.navGrp));
  });
  $content.querySelectorAll('[data-nav-kel]').forEach(b=>{
    b.addEventListener('click', ()=> navigateTo('kel:'+b.dataset.navKel));
  });
  const crumbGrpLink = $content.querySelector('.crumb [data-nav]');
  if(crumbGrpLink) crumbGrpLink.addEventListener('click', (e)=>{ e.preventDefault(); navigateTo(crumbGrpLink.dataset.nav); });
}

function renderOrphan(o){
  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / Dokumen di Luar Daftar Resmi</div>`;
  const v = o.versions[0];
  html += `<div class="doc-header"><div class="doc-header-main"><div class="doc-code-badge">${esc(v.meta['Kode Dokumen']||o.code)}</div>
    <h1 class="doc-title">${esc(v.title)}</h1></div>${printBtnHtml()}</div>`;
  const label = o.status==='retired' ? 'Diarsipkan — sudah tergantikan' : 'Tidak sesuai Daftar Standar Resmi';
  const pillClass = o.status==='retired' ? 'status-retired' : 'status-duplicate';
  html += `<div class="doc-meta-row"><span class="pill ${pillClass}">${label}</span></div>`;
  html += `<div class="note-box ${o.status==='retired'?'':'dupe'}">${esc(o.note)}</div>`;
  html += renderDocBody(v);
  $content.innerHTML = html;
}

function renderFormulir(fm, parent){
  let html = `<div class="crumb"><a href="#" data-home="1">L21OS</a> / <span data-nav-id="kel:${esc(parent)}" style="cursor:pointer;text-decoration:underline;">${esc(parent)}</span> / Lampiran</div>`;
  html += `<div class="doc-header"><div class="doc-header-main"><div class="form-badge">📋 FORMULIR — Siap Dicetak &amp; Diisi</div><br><div class="doc-code-badge">${esc(fm.meta['Kode Dokumen']||fm.code)}</div>
    <h1 class="doc-title">${esc(fm.title)}</h1></div>${printBtnHtml()}</div>`;
  html += renderDocBody(fm);
  html += `<div class="doc-nav">
    <button class="docnav-btn back" data-nav-id="kel:${esc(parent)}"><span class="arrow">←</span> Kembali ke ${esc(parent)}</button>
  </div>`;
  $content.innerHTML = html;
}

function renderHome(){
  const s = DATA.stats;
  let html = `<div class="hero">
    <div class="eyebrow">Lorongsatu21 Operating System</div>
    <h1>Referensi L21OS</h1>
    <p class="lede">Semua Standar, SOP, dan formulir Lorongsatu21 dalam satu tempat — dengan status kelengkapan tiap dokumen dibanding Daftar Standar Resmi (SL21-000).</p>
    <button class="book-btn" id="print-book-btn" type="button"><span class="ic">📖</span> Cetak Semua sebagai Buku Arsip (PDF)</button>
  </div>`;

  html += `<div class="stat-grid">
    <div class="stat-card ok"><div class="num">${s.ok}</div><div class="lbl">Standar tersedia</div></div>
    <div class="stat-card missing"><div class="num">${s.missing}</div><div class="lbl">Belum ditulis</div></div>
    <div class="stat-card duplicate"><div class="num">${s.duplicate}</div><div class="lbl">Kode duplikat</div></div>
  </div>`;

  html += `<div class="section-title">Kelompok Standar</div><div class="kelompok-grid">`;
  DATA.kelompok.forEach(g=>{
    const ok = g.items.filter(i=>i.status==='ok').length;
    const missing = g.items.filter(i=>i.status==='missing').length;
    const dup = g.items.filter(i=>i.status==='duplicate').length;
    html += `<div class="kelompok-card" data-goto-sec="${g.key}">
      <div class="kk">KELOMPOK ${g.key}</div>
      <div class="kn">${esc(g.name)}</div>
      <div class="kstat">
        <span>${ok} tersedia</span>
        ${missing?`<span style="color:var(--missing)">${missing} belum ada</span>`:''}
        ${dup?`<span style="color:var(--dup)">${dup} duplikat</span>`:''}
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Daftar Isi Lengkap</div>`;

  html += `<div class="toc-full-kelompok"><div class="tk-head">
      <span class="tk-name">Fondasi &amp; Tata Kelola</span>
      <span class="tk-count">${DATA.foundational.length + DATA.meta.length} dokumen</span>
    </div><div class="std-list">`;
  DATA.foundational.forEach(f=>{
    const v = f.versions[0];
    if(!v) return;
    html += `<div class="std-row" data-nav-id="fnd:${esc(f.code)}"><span class="dot ok"></span><span class="code">${esc(f.code)}</span><span class="ttl">${esc(v.title.split(' — ')[0])}</span></div>`;
  });
  DATA.meta.forEach(m=>{
    const codeLabel = m.code.split(' ')[0];
    html += `<div class="std-row" data-nav-id="meta:${esc(m.code)}"><span class="dot ok"></span><span class="code">${esc(codeLabel)}</span><span class="ttl">${esc(m.label.replace(/^SL21-\d+\s*—\s*/,''))}</span></div>`;
  });
  html += `</div></div>`;

  DATA.kelompok.forEach(g=>{
    html += `<div class="toc-full-kelompok"><div class="tk-head" data-nav-id="grp:${g.key}">
        <span class="tk-kk">KELOMPOK ${g.key}</span><span class="tk-name">${esc(g.name)}</span>
        <span class="tk-count">${g.items.length} standar</span>
      </div><div class="std-list">`;
    g.items.forEach(it=>{
      html += `<div class="std-row" data-nav-id="kel:${esc(it.code)}">${statusDot(it.status)}<span class="code">${esc(it.code)}</span><span class="ttl">${esc(it.official_title)}</span></div>`;
    });
    html += `</div></div>`;
  });

  const gaps = [];
  const dups = [];
  DATA.kelompok.forEach(g=>{
    g.items.forEach(it=>{
      if(it.status==='missing') gaps.push({code:it.code, grp:`Kelompok ${g.key}`, ttl:it.official_title});
      if(it.status==='duplicate') dups.push({code:it.code, grp:`Kelompok ${g.key}`, ttl:it.official_title});
    });
  });

  if(gaps.length){
    html += `<div class="section-title">Standar yang Belum Ditulis</div><div class="gap-list">`;
    gaps.forEach(gp=>{
      html += `<div class="gap-row" data-nav-code="${gp.code}"><span class="code">${esc(gp.code)}</span><span class="grp">${esc(gp.grp)}</span><span class="ttl">${esc(gp.ttl)}</span></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="section-title">Kelengkapan Standar</div>
    <div class="note-box" style="border-left-color:var(--ok)">Seluruh 59 Standar L21 yang terdaftar di Daftar Standar Resmi (SL21-000) kini sudah tertulis.</div>`;
